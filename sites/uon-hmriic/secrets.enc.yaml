# -----------------------------------------------------------------------------
# ORTHANC REST API CREDENTIALS — only needed when orthanc.auth.enabled is true.
# -----------------------------------------------------------------------------
# The shipped site sets orthanc.auth.enabled: false, because the REST API is
# ClusterIP-only and nothing outside the cluster can reach it. That is the
# accident protecting it, not a control: anything running IN the cluster can
# call it, and that API can DELETE studies. Turn auth on and uncomment this.
#
# THREE keys, and all three are required:
#   users.json        what Orthanc itself checks (RegisteredUsersFile). The
#                     password is plaintext inside this JSON — which is exactly
#                     why this file is SOPS-encrypted before it is committed.
#   orthanc-user      what group-orthanc authenticates with when it lists and
#   orthanc-password  labels studies over the REST API. These MUST match the
#                     user and password inside users.json, or Orthanc answers
#                     401 and the pipeline stalls with data sitting in Orthanc.
#
# Generate a password with:  openssl rand -base64 24
#
apiVersion: v1
kind: Secret
metadata:
    name: orthanc-credentials
    namespace: xnat-ingest
type: Opaque
stringData:
    users.json: ENC[AES256_GCM,data:N5EAjqlXGyxLVYZ6eGYJMEBQtQf1kjffAjsb26jNH7o2sFj1EA9LGGxz9YWRUjnOyNu/tbyv,iv:aasUnMD/wVXvniQlRHfOfmzEGq2MLyPJWSGKwf7pDlc=,tag:rzZK3p513Qsrhc1SeIPE/w==,type:str]
