# Reviewed 2026-11-10 against this branch. This file retains its existing
# site settings; it is not evidence of a current live deployment. Historical
# measurements without a run date are not verified (2026-11-10).
# This retained configuration selects the deprecated Lua engine. Do not
# copy that choice for a new site; start from the current ingest example.
# =============================================================================
# EXAMPLE CLOUD SITE ; tier-2 management plane on a cloud provider
# =============================================================================
# sites/example-mgmt with the cloud differences applied and explained.
#
# WHAT "CLOUD" ACTUALLY CHANGES
#   * Names resolve through REAL DNS. The installer stops writing /etc/hosts on
#     the management node and on every edge, and certificates carry hostnames
#     only, with no IP SANs.
#   * The ingress can request a LoadBalancer, or use NodePort behind an
#     operator-provisioned Layer-4 balancer. The chart supports both cloud paths.
#
# WHAT IT DOES NOT CHANGE
#   * SNI + ssl-passthrough routing. One address serves every fleet hostname.
#   * The direction of travel: workers initiate the runtime connections; SSH bootstrap can require inbound access.
#   * The imaging path: edge -> S3 staging on this cluster -> the management
#     xnat-upload -> XNAT. The edge never talks to XNAT and holds no XNAT
#     credential.
#
# THE LOAD BALANCER MUST BE LAYER 4.
# The k0s API and konnectivity are mTLS end to end: the worker proves itself
# with a client certificate inside the TLS handshake, and terminating that TLS would lose the original client-authentication context. An L7 balancer exists in order to read HTTP, which
# it cannot do without terminating TLS, so AWS ALB, Azure Application Gateway
# and GCP HTTPS LB all break the join -- and break it asymmetrically: this side
# reports healthy and only the edge fails, as an x509 error in a journal on a
# machine in a hospital.
#
#   works:  AWS NLB / Azure Standard LB / GCP External TCP LB / Octavia (TCP)
#   breaks: anything that routes on HTTP paths or headers
# =============================================================================

# =============================================================================
# EXAMPLE MANAGEMENT SITE — non-secret configuration
# =============================================================================
# This is the config for THE MANAGEMENT NODE: the one machine that runs
# SeaweedFS, Loki, Prometheus, Alertmanager, Grafana, cert-manager, the
# k0smotron hosted control planes, the XNAT uploader and the S3 reclaimer.
#
# There is exactly ONE of these per deployment. Each EDGE gets its own
# directory alongside this one, from sites/example-edge/.
#
#   scripts/site-secrets.sh new <name> mgmt     # copies this directory
#   $EDITOR sites/<name>/values.yaml            # <- everything below
#   $EDITOR sites/<name>/secrets.enc.yaml       # still plaintext at this point
#   scripts/site-secrets.sh encrypt <name>      # do not commit before this
#   ./install.sh <name>
#
# HOW HELM SEES THIS FILE. You never edit charts/mgmt/values.yaml or
# charts/edge/values.yaml. Those hold the defaults and the reasoning behind
# them; this file holds the handful of facts that are true of YOUR site, and
# Helm layers it on top:
#
#   management chart:  -f sites/<name>/values.yaml
#   edge chart:        -f sites/<name>/values.yaml  -f sites/<edge>/values.yaml
#
# So this file reaches BOTH charts. That is deliberate: a fact that means the
# same thing on both sides — the internal domain, the data policy, the
# management node's IP — is written HERE, exactly once, and the edge derives
# its endpoints from it. Anything genuinely local to one edge goes in that
# edge's own file, which is passed last and therefore wins.
# =============================================================================

# Deployment label used by selected telemetry and routing templates.
# It is not automatically attached to every metric. Management Vector uses
# its configured management label; inspect emitted labels before querying.
clusterLabel: mgmt

# fresh     install.sh installs k0s, kubectl, helm and local-path here from
#           nothing. This is what you want on a new machine.
# existing  k0s is already running on this node; install.sh verifies instead of
#           building. Only for adopting a cluster that predates these charts.
# cloud, not the onprem default. This is what stops the installer writing
# /etc/hosts on this node and on every edge, and drops IP SANs from the
# certificates -- on cloud the names resolve for real.
topology: cloud

installMode: fresh

storage:
  # Base for k0s state and local-path PVCs, read by install.sh. Explicit
  # hostPath volumes, including SeaweedFS, keep their separately configured paths.
  #
  # ""       everything on the root filesystem (k0s default /var/lib/k0s,
  #          PVCs in /opt/local-path-provisioner). Right for a single-disk host.
  # /data    a mounted data volume. Use this whenever the root disk is small ;
  #          historical image-store growth exhausted a 30G root. Current capacity
  #          depends on images, workloads and retention; size it from measurements.
  #
  # Applied as native settings: `k0s install --data-dir` and the
  # local-path-provisioner nodePathMap. NOT bind mounts ; an earlier deployment
  # used fstab binds, and deleting /data left them dangling so the node failed
  # its next boot into an emergency shell. See docs/storage.md.
  #
  # INSTALL-TIME ONLY. k0s bakes the data-dir into its systemd unit and PV
  # objects record their host path, so changing this after install strands the
  # existing state where it is. Set it before the first install.
  dataRoot: ""

domain:
  # DNS suffix for generated service hostnames. With topology=onprem, the
  # installer supplies management host entries. With topology=cloud, provide
  # real DNS that resolves from every participating node; no hosts entries
  # are installed. Custom hostnames override the derived names.
  internal: aisedge.local
  # The address every edge node reaches this management node on.
  mgmtNodeIP: "10.0.0.1"

hostnames:
  # LEAVE THESE EMPTY ON CLOUD. Empty means "derive from domain.internal above"
  # (edge.seaweedfsHost / edge.lokiHost / edge.grafanaHost in
  # charts/edge/templates/_helpers.tpl), so the names follow the domain and can
  # never drift from it.
  #
  # Setting them explicitly still wins, and that is the trap: an operator
  # changes domain.internal -- which they MUST on cloud, .local is an on-prem
  # convention -- and leaves these behind. Nothing warns. The edge uploader then
  # dials the stale name for ever:
  #   dial tcp: lookup seaweedfs.aisedge.local: no such host
  # and retries. The installer now checks configured cloud DNS, but that does
  # not prove the name points at the intended endpoint. Historical first-cloud
  # incident; run date not verified (2026-11-10). Inspect current uploader and
  # reporter alerts as well as rendered names.
  seaweedfs: ""
  grafana: ""
  loki: ""
# The child-cluster API and konnectivity hostnames are NOT here, and the chart
# REFUSES to render if you add them. They used to live at this level, which gave
# every edge the same two names — so the second site's Ingress claimed a
# hostname the first already owned and the fleet could not grow past one site.
# They are per-edge now: pin them on the `edges` entry below, or omit them and
# take the generated <apiPrefix>-<name>.<domain>.

# -----------------------------------------------------------------------------
# Platform components
# -----------------------------------------------------------------------------
# install.sh installs cert-manager and the k0smotron operator as PREREQUISITES,
# before this chart, in that order. You do not do any of it by hand.
certManager:
  # FALSE, and required to be. The per-edge Cluster objects this chart creates
  # need k0smotron's conversion webhook; the operator serving that webhook needs
  # a cert-manager-issued certificate; so cert-manager cannot come from this
  # same release. Trying to satisfy the prerequisite in this release can fail on the first
  # Cluster object when the conversion webhook is unavailable ; which reads
  # as a network problem rather than the ordering problem it is.
  enabled: false
  # The cert-manager cluster-resource namespace, set by its startup flag.
  # The installer uses cert-manager. CA-backed ClusterIssuers look for their
  # Secrets there. Align certSync source.namespace with the actual Secret
  # location. The chart has checks, but they do not replace validation of an
  # existing installation, a custom namespace or an intermediate-CA setup.
  clusterResourceNamespace: cert-manager

ingressNginx:
  enabled: true

# The k0smotron OPERATOR is not a subchart — it is applied out of band and its
# CRDs must exist before these Cluster objects can be created. install.sh
# handles the ordering.
k0smotron:
  enabled: true

seaweedfs:
  storage:
    hostPath: /data/seaweedfs
  # One bucket per edge site. SeaweedFS matches actions as "<action>:<bucket>"
  # with no prefix scoping, so the bucket is the ONLY isolation boundary
  # available — a shared bucket would let any edge's credential read every
  # other edge's staged patient data.
  perSiteBuckets: true
  ingress:
    # mTLS ON THE UPLOAD PATH ; one client certificate per edge, verified by
    # the Ingress. It ADDS to the per-site S3 key pair (which is what scopes a
    # site to its own bucket); it does not replace it.
    #
    # BOTH DEFAULT OFF, AND THEY ARE FLIPPED AT DIFFERENT TIMES:
    #   1. issue: true, and uncomment the "<edge>-s3-client" certSync entry
    #      below ; together, or the render is refused. helm upgrade.
    #   2. kubectl -n xnat-ingest get secret s3-client-tls   on EVERY edge.
    #   3. upload.s3.requireClientCert: true in each EDGE site file.
    #   4. require: true here. helm upgrade.
    #
    # CAUTION: doing 4 before 2 has answered breaks every upload with an error
    # or TLS rejection. Historical observation, date not verified (2026-11-10): the handshake still succeeds, nginx answers
    # HTTP 400, and rclone reports it as an S3 XML parse failure ; so it reads
    # as a dead endpoint, not an auth problem. Use current Secret, certificate and endpoint checks for every site.
    # verify-live assists but has documented cloud/topology limitations.
    clientCerts:
      issue: false
      require: false

observability:
  alerting:
    emailTo: alerts@example.org
    emailFrom: ais-edge@example.org
    smtpHost: smtp.example.org
    smtpPort: 587
    # Use the SMTP authentication method allowed by your provider and account.
    # A Gmail App Password may require account-specific enablement; its current
    # availability is not verified (2026-11-10). Inspect Alertmanager delivery
    # errors as well as the destination mailbox. A rendered receiver alone
    # does not prove that authentication or mail delivery works.
    smtpUsername: ais-edge@example.org

# -----------------------------------------------------------------------------
# Edge sites
# -----------------------------------------------------------------------------
# One entry per edge. Each gets its own hosted control plane, S3 bucket, S3
# identity, uploader and reclaimer on this node.
#
# ADDING A SECOND EDGE: add an entry here, create sites/<edge>/ from
# sites/example-edge/, then re-run install.sh. Review per-edge Secrets, identities, capacity and routes too. The new
# edge can differ from the first in every edge-local respect (the
# de-identification recipe, the tags that give the XNAT labels, disk paths)
# because those live in its own file.
#
# Historical observation: about 231Mi per idle uploader. The run date is not
# verified (2026-11-10). A former estimate suggested 15 sites on 16Gi; it is
# not a current capacity limit. Measure active upload/deid peaks and all
# hosted control planes with the pinned image before sizing the fleet.
edges:
  - name: edge-dev
    # The node address is used by SSH joining and by the bundle configuration.
    # For bundle joining, verify the generated script and the actual interface
    # addresses; its default-interface address check can reject a valid address
    # on another interface. It is not a general multi-interface identity proof.
    nodeIP: "10.0.0.2"

    # HOW THE WORKER GETS JOINED. Only the one-time bootstrap differs; once
    # joined, both are identical ; the edge dials OUT (konnectivity, and the
    # kubelet to its hosted control plane) over those established connections. Bootstrap SSH is a separate
    # inbound path when the ssh method is selected.
    #
    # ssh     Default, and what you want when it works. This node pushes the
    #         join to the edge, so it needs an inbound path to it on port 22.
    # bundle  For a site this node CANNOT reach inbound ; a hospital behind a
    #         whitelisted-IP allowlist, a VPN, or GlobalProtect. install.sh
    #         writes <edge>-join.sh instead; you carry it to the edge by
    #         whatever route you have and run it there, and the installer waits
    #         for the node to appear. See docs/TOUR.md 4.1.
    #
    # NOT "offline": a bundle-joined edge still needs OUTBOUND reachability to
    # this node on 443, permanently. An air-gapped machine cannot be a worker.
    join: ssh

    # Only used by join: ssh. Leave them out entirely for join: bundle.
    sshUser: ubuntu
    sshKey: ~/.ssh/id_ed25519

    # How long this edge's join token stays valid. Optional; default 2h.
    # The token is a BEARER CREDENTIAL — anything holding it can join a node.
    # ssh consumes it in seconds, so the default costs nothing there. Raise it
    # only if a bundle has to travel further than that, and treat a long value
    # as the deliberate decision it is.
    # joinTokenTTL: 2h
    # Names of Secrets in sites/<this site>/secrets.enc.yaml. The charts never
    # contain credentials; they reference them by name only.
    s3SecretRef: edge-dev-s3
    uploadSecretRef: seaweedfs-upload
    # sni      ClusterIP behind the :443 ssl-passthrough Ingress. NO cluster-wide
    #          port allocation, so sites cannot collide and adding one needs no
    #          port assignment at all. Use this.
    # nodePort Reserves a port on every node, fleet-wide. Only for adopting a
    #          site already running that way.
    exposure: sni

# Where the CA bundle and each edge's Loki push credential are copied from, into
# every edge cluster, by the cert-sync CronJob.
certSync:
  secrets:
    - source:
        # Use the actual namespace containing the CA bundle Secret. Align it with
        # certManager.clusterResourceNamespace for a CA-backed ClusterIssuer.
        # A wrong source prevents that sync and can leave an absent or stale edge
        # bundle. Existing Secrets can mask the error until renewal. Confirm the
        # source, destination and cert-sync logs; render checks are not proof of
        # correct runtime Secret placement in every custom-namespace setup.
        namespace: cert-manager
        name: ais-edge-ca-secret
        keys:
          ca.crt: ca.crt
      destination:
        namespace: xnat-ingest
        name: ca-bundle
        type: Opaque
    - source:
        # This edge's Loki push CLIENT CERTIFICATE. cert-manager issues one per
        # entry in `edges` above, from the same CA as the ca-bundle, into this
        # namespace as `<edge>-loki-client` ; the name is fixed by the chart
        # and the chart refuses to render if this entry does not match it.
        # Adding a site therefore provisions its push identity automatically;
        # the templates issue the certificate. The cert-sync destination, edge
        # Secret name and access policy still need to agree.
        namespace: ais-mgmt
        name: "<edge>-loki-client"
        keys:
          tls.crt: tls.crt
          tls.key: tls.key
      destination:
        namespace: xnat-ingest
        # Must equal observability.loki.clientCertSecret in the edge values.
        # If the named Secret is absent, Vector cannot start with that required
        # mount. Inspect pod events; the precise waiting reason can vary.
        name: loki-push-client-tls
        type: kubernetes.io/tls
    - source:
        # THIS EDGE'S S3 KEY PAIR, WRITTEN ONCE AND DELIVERED FROM HERE.
        #
        # It used to be typed into two files with identical values: the
        # `<edge>-s3` Secret on this side, which SeaweedFS builds its identity
        # list from, and `s3-edge-credentials` in the edge's own secrets file,
        # which its uploader authenticates with. Nobody cares what the string
        # is, only that both copies match — so making a human the consistency
        # mechanism was the bug. A mismatch stalls the pipeline at upload with
        # an S3 403 and nothing says why.
        #
        # The name must stay `<edge>-s3` so it matches edges[].s3SecretRef;
        # cert-sync substitutes <edge> and nothing else, and the chart refuses
        # to render if the two disagree.
        namespace: ais-mgmt
        name: "<edge>-s3"
        keys:
          access-key: access-key
          secret-key: secret-key
      destination:
        namespace: xnat-ingest
        name: s3-edge-credentials
        type: Opaque
    # ---- mTLS on the S3 upload path: UNCOMMENT WITH THE FLAG, NOT BEFORE ----
    # This edge's S3 upload CLIENT CERTIFICATE. A SEPARATE identity from
    # `<edge>-loki-client` above and from the `<edge>-s3` key pair below it:
    # the two endpoints have separate CN allow-lists and trust-Secret names,
    # but the shipped anchors use the same fleet CA. Removing an upload CN
    # can preserve log access; replacing a shared CA has a broader effect.
    #
    # It is commented out because the certificate does not exist until
    # seaweedfs.ingress.clientCerts.issue is true. Uncommenting only this half
    # would make cert-sync log sync_failed for it every six hours ; and exit
    # non-zero, taking CertSyncStale with it ; while every other Secret in the
    # same run syncs fine. The chart refuses to render on either half alone, in
    # both directions, so the two cannot drift apart.
    #
    # Rollout: set clientCerts.issue: true AND uncomment this, upgrade, confirm
    # `kubectl -n xnat-ingest get secret s3-client-tls` on EVERY edge, set
    # upload.s3.requireClientCert in each edge site file, and only then set
    # clientCerts.require: true here.
    # - source:
    #     namespace: ais-mgmt
    #     name: "<edge>-s3-client"
    #     keys:
    #       tls.crt: tls.crt
    #       tls.key: tls.key
    #   destination:
    #     namespace: xnat-ingest
    #     # Must equal upload.s3.clientCertSecret in the EDGE site values.
    #     name: s3-client-tls
    #     type: kubernetes.io/tls

# OPTIONAL: needed when an edge in upload.mode s3 turns the package stage on.
# The management uploader then reads the zips, so it needs the same DICOM
# sample datatype as the edge (ingest.extraPipPackages in the edge site file).
# See docs/package-stage.md, "Turn it on".
# xnatUpload:
#   extraPipPackages:
#     - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2"
#     - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2#subdirectory=extras"

# =============================================================================
# Data policy ; WRITTEN ONCE, HERE, FOR THE WHOLE SITE
# =============================================================================
# This block reaches BOTH charts, because Helm passes this file to each of them.
# That is the point: the management node and every edge then agree on what may
# be deleted and when, but explicit edge overrides can make the policies differ. Review the
# rendered management and edge settings together.
#
# Do NOT copy this block into an edge's own file. An edge file is passed last
# and would override it silently for that edge only ; the management reclaimer
# would free staged objects while the edge kept everything, or the reverse. If
# one site genuinely needs a different policy, set it there deliberately and
# write down why.
#
# Data-policy starts disabled/dry-run in the chart defaults. Stage CLI unlink
# options and separate jobs are independent. Observe representative dry-run
# decisions and verify destination evidence before enabling that engine; a
# fixed week of observation alone does not establish safety.
# =============================================================================
dataPolicy:
  # These switches control the data-policy engine, not every deletion path.
  # Stage CLI unlink options and separate reclaim CronJobs have their own
  # conditions. Review all of them before assuming cleanup is disabled.
  enabled: false      # false | true   — false: nothing is ever reclaimed
  dryRun: true        # true | false   — true: decisions are logged, not acted on

  # ---------------------------------------------------------------------------
  # originals — the archive of record. Nothing downstream can recreate these.
  # ---------------------------------------------------------------------------
  originals:
    # Bytes supplied to the Orthanc callback before de-identification for
    # DicomProtocol arrivals. REST uploads and watched files do not receive
    # this backup. Check callback errors and actual files; enabling backup
    # does not guarantee a successful independent copy for every input.
    facilityBackup:
      retain: forever             # forever | 30d | 90d | 1y | 7y  (any duration)
      minFreeDiskPercent: 10      # 0 disables the free-space guard

    # Written only by the deprecated Lua engine (deid.engine: orthanc): studies
    # whose called AE title is not in its aetMap, HELD so an operator can map
    # the AET and re-send them. Under ingest, the default, nothing writes here.
    quarantine:
      retain: forever             # forever | <duration>
      alertAfter: 24h             # <duration> — how long before it nags

    # Files dropped into a watched directory (no Orthanc copy behind them).
    fileDrop:
      reclaim: never              # never   — and the chart REFUSES anything else
                                  #           while ingest.fileDrop is on: that
                                  #           directory can contain the only retained copy
      minAge: 30d                 # <duration>

  # ---------------------------------------------------------------------------
  # derived: intermediate data may be reconstructible if originals, recipes
  # and required identifiers remain available. Verify those prerequisites.
  #
  # Each configured reclaim path checks its condition and minimum age. Its
  # proof is specific to that path; a completed experiment alone is not enough.
  # Stage CLI unlink settings and other jobs can act independently of these
  # settings. Keep the current pipeline and reclaim conditions aligned.
  #
  # reclaim: never disables that engine action but consumes disk over time.
  # Monitor capacity; retaining data is not a substitute for backup checks.
  # ---------------------------------------------------------------------------
  derived:
    # Orthanc's own copy, after group-orthanc has pulled the study out.
    orthancStorage:
      reclaim: onGrouped          # never | onGrouped
      minAge: 7d                  # <duration>
      maximumStorageSizeMB: 0     # 0 = unlimited
      maximumPatientCount: 0      # 0 = unlimited

    # /data/grouped, once assign has built the session.
    grouped:
      reclaim: onAssigned         # never | onAssigned

    # /data/assigned, once the s3-uploader has shipped it.
    # CAUTION: onUploaded fails the edge render under deid.engine: ingest, the
    # default. Use auto, as sites/example-mgmt does: it resolves to
    # onDeidentified under ingest.
    assigned:
      reclaim: onUploaded         # never | onUploaded
      minAge: 0                   # <duration>

    # The management S3 staging prefix may hold files already retired at the edge.
    # onXnatConfirmed queries XNAT and compares expected files with the staged
    # manifest; known digests are compared where available. Check the current
    # proof implementation and logs. This is not the only path that can delete
    # a final available copy. Retention and source-backup coverage still matter.
    # An experiment can exist before all resources arrive; existence alone is
    # not delivery proof, nor does file proof certify metadata extraction.
    s3Staged:
      reclaim: onXnatConfirmed    # never | onXnatConfirmed
      minAge: 1d                  # <duration>, at most 36h: the chart refuses
                                  #   more (SessionStagedNotConfirmedInXNAT).
                                  #   CAUTION: keep it LONGER than the edge's
                                  #   stagedReclaimer.minAge (1d by default):
                                  #   "the two clocks" in charts/edge/values.yaml.
                                  #   The chart default is 36h.
      verifyAgainstXnat: true     # true | false — false removes the only proof
                                  #   of delivery; do not
      schedule: "17 * * * *"      # cron — how often the reclaimer runs
      maxRemovals: 50             # int — cap per run, bounds a bug that decided
                                  #   "delete everything"

  # ---------------------------------------------------------------------------
  # telemetry: logs and metrics can contain session identifiers and paths.
  # Restrict access and set retention; do not assume telemetry is PHI-free.
  # ---------------------------------------------------------------------------
  telemetry:
    # Loki/Prometheus retention is NOT set here ; see charts/mgmt/values.yaml.
    # Edit kube-prometheus-stack.prometheus.prometheusSpec.retention and
    # loki.loki.limits_config.retention_period instead. Setting them here is
    # rejected at render rather than silently ignored.
    # kubelet rotates by size x count, not by time. 10Mi x 5 is nominal retained capacity per container, not a strict quota;
    # rotation timing and the active file can exceed that amount.
    podLogFiles: {maxSize: 10Mi, maxFiles: 5}

# =============================================================================
# INGRESS -- the one block that MUST differ from on-prem
# =============================================================================
# This is a SUBCHART's values. Helm cannot template a subchart from the parent,
# so it cannot be defaulted for you by topology: it has to be written here, and
# charts/mgmt validates the explicit cloud ingress settings. Both a
# LoadBalancer Service and supported manual NodePort routing are possible.
#
# Left at the on-prem defaults the deployment looks entirely healthy and answers
# nothing -- the controller reports 1/1 Running, no LoadBalancer is requested,
# no external address exists, and every fleet hostname is unreachable.
ingress-nginx:
  controller:
    # false, not true: on cloud the entry point is the load balancer's address,
    # not this host's :443.
    hostNetwork: false
    # Use ClusterFirst for the standard cloud controller configuration.
    # ClusterFirstWithHostNet is intended for host-network pods and also
    # retains cluster DNS behavior; it does not inherently select host-only
    # DNS when hostNetwork is false. Verify the rendered pod DNS settings.
    dnsPolicy: ClusterFirst
    service:
      type: LoadBalancer
      # PLAN THE DNS ADDRESS BEFORE PREFLIGHT. Otherwise: domain.internal above has to
      # name the address, and on a nip.io name it EMBEDS it -- but the load
      # balancer is created by this install. Allocate first, build the name
      # from it:
      #
      #   openstack floating ip create <external-network>
      #
      # loadBalancerIP: "203.0.113.50"
      #
      # Not every provider honours loadBalancerIP (AWS assigns a hostname, not
      # an address). Where it is not honored, arrange usable DNS or a separately provisioned
      # load balancer first. The installer preflight needs resolving names before
      # the application release; do not assume a first full install can bypass it.
      # The OpenStack command above is illustrative; provider support is not
      # verified (2026-11-10).
      loadBalancerIP: ""
