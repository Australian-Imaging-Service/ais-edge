# =============================================================================
# TIER-1 SITE SECRETS — PLAINTEXT TEMPLATE
# =============================================================================
#   scripts/site-secrets.sh new <name> single   # copies this to secrets.enc.yaml
#   $EDITOR sites/<name>/secrets.enc.yaml       # fill in every REPLACE_
#   scripts/site-secrets.sh encrypt <name>      # do not commit before this
#
# After encrypting, `git diff` shows WHICH keys changed but not their values.
# Apply with `scripts/site-secrets.sh apply <name>`, which decrypts to a pipe
# and never writes plaintext to disk.
#
# TIER-1 HOLDS ITS OWN XNAT CREDENTIAL. This is the one real security
# difference from tier-2, and it is worth understanding before you deploy.
#
#   tier-2  edges hold NO XNAT credential. They write to an S3 staging bucket
#           with a bucket-scoped key, and a management-side uploader — on
#           different hardware, in a different building — is the only thing that
#           ever talks to XNAT. A compromised edge cannot reach XNAT at all.
#   tier-1  there is no management side. This node uploads to XNAT itself, so
#           the credential lives here, on the same machine that faces the
#           modalities.
#
# Consequence: give tier-1 an XNAT account scoped to exactly the projects in
# this site's aetMap, and nothing else. Do not reuse a fleet-wide account.
#
# THE NAMESPACE IS PART OF THE CONTRACT. Everything runs in one namespace on a
# single node, so all of these are in `xnat-ingest`. If you install the release
# into a different namespace, change them to match — a pod cannot read a Secret
# from another namespace, and it fails as CreateContainerConfigError with
# nothing saying why.
# =============================================================================
---
# The XNAT account this node uploads with. See the warning above about scoping.
apiVersion: v1
kind: Secret
metadata:
  name: xnat-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  server: https://xnat.example.org
  username: REPLACE_XNAT_USER
  password: REPLACE_XNAT_PASSWORD
---
# THE DE-IDENTIFICATION SALT. The HMAC salt Orthanc's Lua hook uses to turn a
# real patient identifier into ${SubjectHash} and ${SessionHash}.
#
# Generate ONCE, with:  openssl rand -hex 32
#
# EFFECTIVELY PERMANENT. Rotating it gives the same patient a different
# pseudonym, so previously-uploaded sessions and future ones no longer link to
# the same subject in XNAT — and nothing detects that, because both look valid.
# Back it up with the age key.
#
# Nothing validates the CONTENTS: the chart checks only that this Secret is
# named. A site installed with the placeholder below starts cleanly and derives
# every pseudonym from a string published in this repository. Check before you
# encrypt:
#     grep AIS_DEID_HMAC_SALT sites/<name>/secrets.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: orthanc-deid-salt
  namespace: xnat-ingest
type: Opaque
stringData:
  AIS_DEID_HMAC_SALT: REPLACE_64_HEX_CHARS
---
# Grafana login. Only read when observability.stack.enabled is true.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_GRAFANA_PASSWORD
---
# SMTP for Alertmanager. Only read when observability.stack.enabled is true AND
# observability.stack.alerting.emailTo is set.
#
# For Gmail this is an App Password, not the account password — a 2FA account
# rejects the account password with 535 BadCredentials, and the only symptom is
# alerts that never arrive.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: xnat-ingest
type: Opaque
stringData:
  username: REPLACE_SMTP_USERNAME
  password: REPLACE_SMTP_APP_PASSWORD
---
# -----------------------------------------------------------------------------
# ORTHANC REST API CREDENTIALS — only needed when orthanc.auth.enabled is true.
# -----------------------------------------------------------------------------
# The shipped site sets orthanc.auth.enabled: false, because the REST API is
# ClusterIP-only and nothing outside the cluster can reach it. That is the
# accident protecting it, not a control: anything running IN the cluster can
# call it, and that API can DELETE studies. Turn auth on and uncomment this.
#
# THREE keys, and all three are required:
#   users.json        what Orthanc itself checks (RegisteredUsersFile). The
#                     password is plaintext inside this JSON — which is exactly
#                     why this file is SOPS-encrypted before it is committed.
#   orthanc-user      what group-orthanc authenticates with when it lists and
#   orthanc-password  labels studies over the REST API. These MUST match the
#                     user and password inside users.json, or Orthanc answers
#                     401 and the pipeline stalls with data sitting in Orthanc.
#
# Generate a password with:  openssl rand -base64 24
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: orthanc-credentials
#   namespace: xnat-ingest
# type: Opaque
# stringData:
#   users.json: '{"RegisteredUsers":{"admin":"REPLACE_ORTHANC_PASSWORD"}}'
#   orthanc-user: admin
#   orthanc-password: REPLACE_ORTHANC_PASSWORD
