# Reviewed 2026-11-10 against this branch. This file retains its existing
# site settings; it is not evidence of a current live deployment. Historical
# measurements without a run date are not verified (2026-11-10).
# This retained configuration selects the deprecated Lua engine. Do not
# copy that choice for a new site; start from the current ingest example.
# The pipeline tool is accessionflow (called xnat-ingest before 0.18.0).
# =============================================================================
# EXAMPLE TIER-1 SITE; one machine, non-secret configuration
# =============================================================================
# Tier-1 is a single-node appliance. ONE Ubuntu box runs the whole pipeline:
#
#   modality --C-STORE--> Orthanc (receive) --> group-orthanc --> assign
#                     --> deidentify --> upload --> XNAT (HTTPS)
#
# There is no SeaweedFS, no S3 hop, no k0smotron child cluster, no konnectivity,
# no second worker to join, no nginx-ingress and no cert-manager. The selected
# recipe runs before XNAT upload. Retained headers, identifiers in labels,
# private tags and pixels can still be identifying; verify the output.
#
#   scripts/site-secrets.sh new <name> single    # copies this directory
#   $EDITOR sites/<name>/values.yaml             # <- everything below
#   $EDITOR sites/<name>/secrets.enc.yaml        # still PLAINTEXT at this point
#   scripts/site-secrets.sh encrypt <name>       # do not commit before this
#   ./install.sh <name>
#
# ONE FILE, ONE CHART. Tier-2 splits its config across a management site and one
# file per edge, because it has many machines. Tier-1 has one machine, so this
# is the whole configuration, and install.sh passes it to charts/edge alone:
#
#   helm upgrade --install <name> charts/edge -f sites/<name>/values.yaml
#
# You never edit charts/edge/values.yaml. That holds the defaults and the
# reasoning behind them; this file holds the facts that are true of YOUR site.
# =============================================================================

# Deployment label used by selected telemetry and routing templates.
# It is not automatically attached to every metric. Management Vector uses
# its configured management label; inspect emitted labels before querying.
clusterLabel: tier1-example

# Select the engine for this retained site configuration. The chart derives
# the stage, labels and reclaim condition from it. New sites use ingest:
# Orthanc receives DICOM and accessionflow performs de-identification.
# The orthanc/Lua engine is deprecated and retained only for existing sites.
deid:
  # Use ingest for new sites. Its recipe runs after assign and before upload.
  # Orthanc remains the receiver. Its enabled Lua backup callback copies the
  # original, then returns before AET routing or header modification.
  # Unknown calling AETs are not quarantined by ingest. Restrict senders at
  # the network boundary and select XNAT labels in ingest.assign below.
  #
  # deid.engine: orthanc is deprecated. Existing-site reference material is in
  # docs/components/deidentification.md, "Deprecated Orthanc Lua engine".
  # Keep ingest; there is no engine-switch checklist for a new site.
  #
  # Review the source labels as well as the recipe. PatientID can contain an
  # MRN; if selected as subject it becomes the XNAT label before the recipe runs.
  # Reclaim settings set to auto follow the current pipeline automatically.

  engine: ingest

  # THE REVIEW GATE. deid.policyReviewed must be true before the chart renders.
  # Read the selected recipe and source-label mapping first. This flag records
  # operator review; it does not test de-identification quality or guarantee
  # that identifiers in headers, pixels, paths and logs have been removed.
  policyReviewed: false

# All pipeline workloads live here. Tier-2 splits ingest (edge cluster) from
# upload (management cluster) because they are different machines; on one node
# there is nothing to split.
namespace: xnat-ingest

# onprem does not add tier-2 management host entries on this branch.
# The node uses normal DNS for XNAT and other configured external services,
# such as registries, package sources and SMTP. Network access is not
# limited to XNAT merely because no management plane is present.
topology: onprem

# fresh     install.sh installs k0s, kubectl, helm and local-path from nothing.
# existing  k0s is already running here; install.sh verifies instead of building.
installMode: fresh

# This machine's address. Used for the DICOM endpoint and the Grafana URL the
# installer prints; NOT for cluster networking, which is all local.
nodeIP: "10.0.0.1"

# -----------------------------------------------------------------------------
# Storage; where the bytes physically land
# -----------------------------------------------------------------------------
# Keep all PIPELINE directories on one filesystem so hardlinks work.
# The facility backup is a byte copy and can be on a separate disk.
storage:
  storageClass:
    create: true
    name: hostpath-pipeline
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 500Gi
  # FACILITY BACKUP. This path holds identifiable original bytes copied by
  # the DicomProtocol callback. It is not independently uploaded by that
  # callback. Other arrival paths bypass it, and a write can fail. Verify
  # backup coverage and independent storage before treating it as an archive.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 500Gi

# -----------------------------------------------------------------------------
# Orthanc; the DICOM receiver and the de-identification contract
# -----------------------------------------------------------------------------
orthanc:
  # The receiver AE title. The container DICOM port defaults to 4242.
  # Use the actual NodePort or host endpoint selected by the service values
  # when configuring a modality; it need not be the container port.
  aet: AISEDGE
  auth:
    enabled: false
  # Legacy values below are inactive under ingest. The backup script still
  # needs existingSaltSecret. Use ingest.deidentify.specs for the active policy.
  deid:
    existingSaltSecret: orthanc-deid-salt

    aetMap:
      AISEDGE:
        project: example_project

    profile:
      DeidMode: modify
      Force: true
      RemovePrivateTags: false
      Keep:
        - StudyInstanceUID
        - SeriesInstanceUID
        - SOPInstanceUID
        - FrameOfReferenceUID
      Replace:
        PatientIdentityRemoved: 'YES'
        DeidentificationMethod: AIS-Edge research-default v1; Retain UIDs Option
        PatientName: ANONYMOUS
        PatientID: ${ProjectCode}-${SubjectHash}
        PatientBirthDate: ${BirthYearOnly}0101
        AccessionNumber: ${SessionHash}
        StudyID: ${SessionHash}
        ClinicalTrialProtocolID: ${ProjectCode}
        ClinicalTrialSubjectID: ${SubjectHash}
        ClinicalTrialTimePointID: ${SessionHash}
        InstitutionName: AIS
        InstitutionAddress: ''
        ReferringPhysicianName: ''
        PerformingPhysicianName: ''
        OperatorsName: ''
        PatientBirthName: ''
        StationName: ''
        DeviceSerialNumber: ''
        OtherPatientIDs: ''
        RequestingPhysician: ''
        AdmittingDiagnosesDescription: ''
        PatientAddress: ''
        PatientTelephoneNumbers: ''
        PatientComments: ''
        StudyDescription: ''

# -----------------------------------------------------------------------------
# The pipeline
# -----------------------------------------------------------------------------
ingest:
  orthancGroup:
    enabled: true
    interval: 60
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
  deidentify:
    # THE RECIPE. The chart turns this map into a ConfigMap and mounts it at
    # RECIPE_DIR; the KEY is the path under RECIPE_DIR, so it must be the one
    # accessionflow looks for: __default__/<category>/<format>.
    #
    # THIS IS THE POLICY. Nothing downstream re-checks what was removed, so read
    # it before you install. deid.policyReviewed above is the gate that makes
    # you confirm it, whichever engine applies it. Copied from
    # charts/edge/files/deid-specs.example/.
    #
    # OPTION: dates. This recipe REMOVEs PatientBirthDate outright. If you need
    # age-at-scan preserved, pydicom-deid also supports JITTER, which shifts a
    # date by the supplied number of days. These are illustrative examples, not
    # a validated project date policy:
    #     JITTER PatientBirthDate 47
    #     JITTER StudyDate 47
    # CAUTION: the offset is the same for every patient, so jitter the study
    # dates by the same number or every computed age silently shifts.
    specs:
      __default__/medimage/dicom-series: |
        # Example de-identification recipe for medimage/dicom-series.
        #
        # This is a pydicom `deid` RECIPE, not JSON, and the path is the format name.
        # accessionflow's load_recipe_files walks <spec-dir>/<category>/<format>, so the DIRECTORY
        # is the category and the FILE is the format: medimage/dicom-series. It skips
        # anything at the top level that is not a directory, so a flat file named
        # `medimage@dicom-series.json` is never read and every session fails with
        # "No deidentification recipe files found".
        #
        # Copy this directory, rename __default__ to your project ID for a
        # project-specific policy, and edit to match your site's approved profile.
        # __default__ is the fallback for any project without its own directory.
        #
        # ONLY THE TAGS NAMED HERE ARE REMOVED. Anything not listed passes through
        # untouched, so this list IS the policy; review it as such.
        #

        FORMAT dicom

        %header

        # Direct identifiers.
        REMOVE PatientName
        REMOVE PatientBirthDate
        REMOVE PatientAddress
        REMOVE PatientTelephoneNumbers
        REMOVE OtherPatientIDs
        REMOVE OtherPatientNames

        # Care-team and institution.
        REMOVE ReferringPhysicianName
        REMOVE PerformingPhysicianName
        REMOVE OperatorsName
        REMOVE InstitutionName
        REMOVE InstitutionAddress

        # Local accession/order numbers, which are re-identifying within a site.
        REMOVE AccessionNumber

        # MARK THE RESULT. These metadata flags state that processing was applied;
        # they are not evidence that all identifiers were removed or that the
        # instance complies with an approved confidentiality profile. Review the
        # actual output, including private tags and pixels.
        #
        # ADD sets the desired field even when it is absent from the input.
        # Keep this assertion aligned with the complete approved recipe. The
        # legacy Lua profile uses a different syntax and is not the current policy.
        ADD PatientIdentityRemoved YES
        ADD DeidentificationMethod AIS-Edge xnat-ingest recipe

        # THE PATIENT IDENTIFIER. Removed, and the reason matters because an earlier
        # version of this file kept it on a premise that is false.
        #
        # It claimed assign had already rewritten PatientID to the routed subject.
        # assign does no such thing: it READS tag values to resolve the project,
        # subject and session ids and then copies or hardlinks the files unchanged. It
        # never opens a dataset for writing. Verified by grepping the package for any
        # write by the label stage; it resolves IDs without rewriting DICOMs.
        #
        # It also claimed upload needs the tag to place the session. It does not.
        # Placement is explicit: upload builds the XNAT path from the session object's
        # ids, which came from ingest.assign.tagMapping, not from this header. So
        # removing PatientID cannot detach the data from its subject.
        #
        # What DOES happen if it is left: upload finishes by calling
        # /data/experiments/<id>?pullDataFromHeaders=true, which asks XNAT to populate
        # its own metadata FROM THESE HEADERS. So a real medical record number left
        # here is not merely present in the pixel archive, it can be read into XNAT metadata, while PatientName, birth date and institution are all correctly
        # stripped and the result looks de-identified to a spot check.
        #
        # Historical synthetic measurement, run date not verified (2026-11-10): an instance de-identified by this recipe and
        # uploaded still carried PatientID verbatim, with PatientIdentityRemoved absent.
        REMOVE PatientID

        # THE SCANNER, not the patient, and still identifying. StationName names one
        # machine in one room; DeviceSerialNumber is globally unique to a device. With
        # InstitutionName already removed these are what put a study back in a building.
        #
        # Historical synthetic measurement, run date not verified (2026-11-10): a synthetic study carrying
        # StationName "CT-SCANNER-03" and DeviceSerialNumber "SN-CT-778812" was run
        # through this recipe and reached the de-identified output with BOTH verbatim,
        # because neither this recipe nor the Orthanc profile named them. Both are Basic
        # Application Level Confidentiality tags in DICOM PS3.15.
        REMOVE StationName
        REMOVE DeviceSerialNumber
        # THE REFERRAL, which the earlier pass missed by naming only two of the three
        # person-name fields. ReferringPhysicianName and PerformingPhysicianName were
        # removed; RequestingPhysician was not, and it carries the same name.
        # AdmittingDiagnosesDescription is free text stating why the patient was
        # admitted, so it is clinical information about that patient rather than about
        # the acquisition.
        #
        # Historical test on the now-deprecated Lua engine; run date not verified
        # (2026-11-10): a study whose
        # RequestingPhysician was "NGUYEN^THI^LAN" and whose
        # AdmittingDiagnosesDescription was "Suspected pulmonary embolism" reached the
        # staged output with both verbatim. OtherPatientIDs ("URN-99887766") survived
        # the Orthanc profile too, though this recipe already removed it, which is
        # exactly the kind of drift between the two engines worth closing. All three
        # are Basic Application Level Confidentiality tags in DICOM PS3.15.
        REMOVE RequestingPhysician
        REMOVE AdmittingDiagnosesDescription

        # PRIVATE TAGS ARE NOT BLANKET-REMOVED by this example. Vendor private
        # blocks can carry useful acquisition information and identifying text.
        # Historical synthetic test: local-scheduling-ref-8842 survived an older
        # example; its run date is not verified (2026-11-10).
        #
        # The current deid library supports recipe REMOVE ALL_PRIVATE. Decide which
        # private data may remain for the intended use and test the complete recipe.
        # Do not equate retained private blocks with a guarantee of anonymity.



        # QUASI-IDENTIFIERS, left in deliberately but LISTED so the choice is visible.
        # Age and sex are research-relevant and are not direct identifiers, but in a
        # small cohort they narrow it sharply. Decide per site; they are named here
        # rather than omitted so that deciding is not the same as forgetting.
        #   PatientSex
        #   PatientAge
  assign:
    # Select tags that the source actually populates. These are the derived
    # ingest defaults, stated explicitly for review. The chart rejects any
    # ClinicalTrial-prefixed tag under ingest. A missing required value goes
    # to assigned/__invalid__ before de-identification.
    #
    # CAUTION: whatever you name for `subject` becomes the XNAT subject label.
    # If PatientID carries a medical record number, that number becomes the label, in the clear,
    # because assign runs BEFORE deidentify. Point it at a pseudonym tag your
    # modality writes if you have one.
    tagMapping:
      project: StudyID
      subject: PatientID
      session: AccessionNumber
    interval: 60

# -----------------------------------------------------------------------------
# Upload; STRAIGHT TO XNAT
# -----------------------------------------------------------------------------
# direct  reads deidentified output (or packaged output) and sends it to XNAT.
#         This is what makes tier-1 a single node: no staging bucket, no
#         management-side reclaimer, no S3 credential to distribute.
# s3      tier-2 only. Requires SeaweedFS and a management plane.
# OPTIONAL: the package stage. One zip per DICOM series plus one sample DICOM,
# in place of the individual files. Off by default. Turn it on only when the
# XNAT project wants zips. See docs/package-stage.md: "What it needs" names
# the image and library versions, "Turn it on" the steps.
# package:
#   enabled: true
# The DICOM sample datatype, installed by pip in an init container at each new pod initialization of the package pod and of the upload pod. The node needs access
# to github.com, or to a mirror of the package.
# extraPipPackages:
#   - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2"
#   - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2#subdirectory=extras"

upload:
  mode: direct
  direct:
    existingSecret: xnat-credentials
    # Upload loop interval; the chart default is 120 seconds. The pinned
    # 0.20.0 loop waits for the remainder after work, so a long pass can exceed
    # the interval. A value of 60 does not guarantee a 60-second end-to-end delay.
    loop: 60
    # Quiet period used for eligibility. It does not prove study completeness
    # or prevent all late series or concurrent changes. Verify expected inputs.
    waitPeriod: 60
    alwaysInclude: all
    # Passes --raise-errors to the uploader. Failures propagate to the wrapper
    # for later retry; this is not a transactional guarantee that a partially
    # written resource can never be observed or uploaded.
    requireManifest: true
    # Keep TLS verification enabled and install the required trust for a
    # private CA. Disabling it accepts an unverified server certificate and
    # should not be the normal response to a private or self-signed endpoint.
    verifySsl: true

# -----------------------------------------------------------------------------
# Observability; OPTIONAL, and entirely local on tier-1
# -----------------------------------------------------------------------------
# Tier-2 ships logs off the edge to a management Loki over mTLS. There is no
# management plane here, so the whole stack runs on this node:
#   Loki       filesystem storage on a PVC (NOT S3; there is no object store)
#   Vector     tails pod logs and pushes to the in-cluster Loki over plain HTTP
#   Grafana    on a NodePort, since there is no ingress
#   Prometheus + Alertmanager as usual
#
# Turn the whole thing off and the pipeline is unaffected; it is observability,
# not plumbing.
observability:
  # Run Vector on this node and ship logs to Loki.
  enabled: true

  loki:
    # Keep these tier-2 mTLS Secret names empty for local tier-1 Loki.
    # There is no management cert-sync service on this branch. If required
    # Secret mounts are configured but absent, Vector cannot start.
    #
    # The local sink uses plain HTTP inside the cluster; it needs no client
    # certificate. Check the rendered vector-local.yaml and the actual Loki
    # endpoint instead of copying tier-2 TLS settings.
    clientCertSecret: ""
    caBundleSecret: ""

  stack:
    # -------------------------------------------------------------------------
    # Configure the mail recipient and relay before enabling normal operation.
    # The chart refuses an empty emailTo when observability.enabled and
    # observability.stack.enabled are both true. There is no separate bypass
    # flag. With observability disabled but the stack still on, the presence
    # guard is bypassed and an empty address routes to null. Check the rendered
    # receiver and the Alertmanager rule interfaces for the actual state.
    #
    # SMTP credentials are provided by the selected Secret and values. In the
    # shipped config smtpUsername comes from values and the password from a file.
    # The presence check does not test authentication or delivery. Send a
    # controlled test and confirm receipt; dashboards alone are not paging.
    alerting:
      # Set emailTo and relay credentials for mail delivery. With observability
      # and its local stack enabled, blank emailTo is refused. No separate
      # opt-out value exists. If Vector/observability is disabled while the
      # stack remains enabled, that presence guard is bypassed and an empty
      # address can select the null receiver. Inspect the rendered configuration.
      #
      # The SMTP Secret authenticates to the relay; the recipient, sender and relay
      # values choose where to send. Both must be correct. A non-empty address
      # passes only a presence check, so test an actual notification.
      emailTo: ""            # e.g. imaging-ops@example.org
      emailFrom: ""          # defaults to emailTo when left empty
      smtpHost: ""           # e.g. smtp.example.org
      smtpPort: 587
      smtpUsername: ""       # must match `username` in the alertmanager-smtp Secret
      requireTLS: true

    # Host the log/metric store HERE: Loki + Prometheus + Grafana + Alertmanager
    # on this same node. Tier-2 ships logs off the box to a management cluster;
    # tier-1 has nowhere to ship them, so it keeps them locally.
    #
    # THIS IS THE ONLY KEY. Everything about HOW the stack is configured :
    # retention, the Grafana NodePort, Loki's disk, alert routing; lives in the
    # `loki:` and `kube-prometheus-stack:` blocks in charts/edge/values.yaml.
    # Helm cannot template subchart values, so a friendly key here could not
    # reach them: it would be read, trusted and silently ignored. Override those
    # blocks from this file if you need to, e.g.
    #
    #   kube-prometheus-stack:
    #     grafana:
    #       service:
    #         nodePort: 31000
    #
    # Grafana's login comes from the grafana-admin-credentials Secret in
    # secrets.enc.yaml, which IS wired.
    enabled: true

# -----------------------------------------------------------------------------
# Data policy; what is kept, and for how long
# -----------------------------------------------------------------------------
# Data-policy defaults to disabled/dry-run. Other jobs and CLI unlink flags
# have their own behavior. Observe representative decisions and verify source
# and destination evidence before enabling any cleanup path.
#
# On tier-1 this matters MORE than on tier-2, not less: this node can hold the only
# copy of a facility backup, and there is no management-side reclaimer to fall
# back on. EdgeDiskLow is the only disk-exhaustion alert in the system.
dataPolicy:
  enabled: false
  dryRun: true
  originals:
    facilityBackup:
      retain: forever
      minFreeDiskPercent: 10
    quarantine:
      subPath: __unmapped_aet__
      retain: forever
      alertAfter: 24h
    fileDrop:
      reclaim: never
      minAge: 30d
  derived:
    orthancStorage:
      reclaim: onGrouped
      minAge: 7d
      maximumStorageSizeMB: 0
      maximumPatientCount: 0
    grouped:
      reclaim: onAssigned
    assigned:
      reclaim: auto
      minAge: 0

    # THE LAST TREE, and the one that used to have no knob here at all.
    # Whatever the uploader reads is what it re-reads every loop. `upload` never
    # deletes what it delivered, deliberately: you do not erase a study because an
    # HTTP call returned OK. Historical older releases repeatedly misclassified some complete
    # resources. Current 0.20.0 rechecks file evidence and skips a complete
    # session without re-sending it or repeating its success line. Retaining
    # the tree still consumes disk and can cause repeated scans, so the
    # proof-based staged reclaimer remains necessary for automatic retirement.
    #
    # Under ingest, /data/deidentified is the upload source. With packaging
    # enabled, /data/packaged is the upload source instead.
    # auto resolves assigned.reclaim to onDeidentified, and this key to
    # onUploaded (or onPackaged when packaging is on). Keep the conditions
    # aligned with each tree's actual consumer. The chart rejects mismatches.

    deidentified:
      reclaim: auto

    # DIRECT-UPLOAD RECLAIM. The staged-reclaimer CronJob implements the
    # terminal onUploaded path by checking the local files against XNAT and
    # removing eligible files itself. It does not merely manufacture a marker
    # for the data-policy reporter. Its enablement, age, limits and proof flags
    # must align with the terminal tree selected by the chart.
    stagedReclaimer:
      # Hourly by this schedule. The direct staged-reclaimer performs proof-based
      # terminal cleanup. The shipped store xnat command does not delete its input.
      # Review CLI unlink settings and other policies before assuming this is
      # the only possible deletion path for a customized installation.
      schedule: "17 * * * *"
      # Raise the minimum age when the workflow needs a longer recovery window.
      # Destination proof is required, but retention is also a safety and capacity
      # decision. Concurrent writers and incomplete source knowledge are not
      # eliminated merely by a successful proof at one instant.
      minAge: 1d
      # Before deletion, require XNAT proof for expected local files using the
      # current script checks. The staged tree can be the last retained usable
      # copy, so verify backup coverage too. With verifyAgainstXnat=false the
      # current job refuses to delete; that flag does not enable an unsafe bypass.
      verifyAgainstXnat: true
      # Ceiling per run. A bug that decides everything is reclaimable removes this
      # many and stops, leaving the rest to inspect.
      maxRemovals: 50
      # Killed if a run hangs on an unreachable XNAT, before the next is due.
      deadlineSeconds: 3000
      # ReclaimerNotSucceeding fires after this long with no successful run,
      # whatever the cause: failed, killed at the deadline, crashed, not started.
      # CAUTION: must exceed 2 x the schedule period + deadlineSeconds, or one bad
      # run fires it; the chart refuses less. Raise it when you slow the schedule.
      alertAfter: 3h
