# =============================================================================
# EXAMPLE TIER-1 SITE — one machine, non-secret configuration
# =============================================================================
# Tier-1 is a single-node appliance. ONE Ubuntu box runs the whole pipeline:
#
#   modality --C-STORE--> Orthanc (de-identify) --> group-orthanc --> assign
#                     --> upload --> XNAT (HTTPS)
#
# There is no SeaweedFS, no S3 hop, no k0smotron child cluster, no konnectivity,
# no second worker to join, no nginx-ingress and no cert-manager. Original
# DICOMs never leave the node; only de-identified data goes to XNAT.
#
#   scripts/site-secrets.sh new <name> single    # copies this directory
#   $EDITOR sites/<name>/values.yaml             # <- everything below
#   $EDITOR sites/<name>/secrets.enc.yaml        # still PLAINTEXT at this point
#   scripts/site-secrets.sh encrypt <name>       # do not commit before this
#   ./install.sh <name>
#
# ONE FILE, ONE CHART. Tier-2 splits its config across a management site and one
# file per edge, because it has many machines. Tier-1 has one machine, so this
# is the whole configuration, and install.sh passes it to charts/edge alone:
#
#   helm upgrade --install <name> charts/edge -f sites/<name>/values.yaml
#
# You never edit charts/edge/values.yaml. That holds the defaults and the
# reasoning behind them; this file holds the facts that are true of YOUR site.
# =============================================================================

# Short name for this deployment. Becomes a label on every log line and metric,
# and appears in alert routing.
clusterLabel: tier1-example

# The de-identification engine. One key; the chart derives the Lua hook,
# the xnat-ingest stage, the group label and the reclaim condition from it.
deid:
  # THE DE-IDENTIFICATION ENGINE. Two exist and exactly one runs.
  #
  #   ingest   (this, the default) xnat-ingest's own `deidentify` stage, between
  #            assign and upload. Recipes are pydicom-deid, written below in
  #            ingest.deidentify.specs, and they can do things the Orthanc
  #            profile cannot, JITTER on dates among them.
  #
  #   orthanc  a Lua hook inside Orthanc, stripping each instance as it arrives,
  #            driven by orthanc.deid.profile further down.
  #
  # ORTHANC IS STILL THE DICOM RECEIVER either way. This key only chooses which
  # component de-identifies; the modality still C-STOREs to Orthanc on 4242, and
  # the Lua script still writes the facility backup and quarantines unmapped AE
  # titles. Under `ingest` the hook simply stops modifying the instance.
  # SWITCHING TO deid.engine: orthanc IS THREE EDITS, NOT ONE. The chart refuses
  # each wrong combination rather than installing something that quietly does
  # nothing, so you will be told, one at a time. Doing them together is quicker:
  #
  #   1. deid.engine: orthanc
  #   2. DELETE the ingest.deidentify.specs block below. Recipes belong to the
  #      stage that no longer renders; left in place the chart refuses, because
  #      silently ignoring them is how a reviewed policy stops being applied.
  #   3. ingest.assign.tagMapping back to the ClinicalTrial* tags: the Lua hook
  #      writes those from the AET map, and they are the pseudonymised ids.
  #
  # The two dataPolicy.derived reclaim words follow automatically: they are set
  # to `auto` below and the chart resolves them for whichever engine is selected,
  # so they are not part of this list.
  #
  # And orthanc.deid.profile becomes the recipe that matters. It is already
  # filled in below, so it needs reading, not writing.
  engine: ingest

  # THE GATE. The chart refuses to render while this is false. Set it only once
  # you have read the recipe the engine above selects and agree it is this
  # site's policy. Not a formality: nothing downstream re-checks what was
  # removed.
  policyReviewed: false

# All pipeline workloads live here. Tier-2 splits ingest (edge cluster) from
# upload (management cluster) because they are different machines; on one node
# there is nothing to split.
namespace: xnat-ingest

# onprem  resolves nothing externally — tier-1 talks only to XNAT, by its real
#         DNS name, over the node's normal resolver. There are no management
#         hostnames to pin, so no /etc/hosts entries and no hostAliases.
topology: onprem

# fresh     install.sh installs k0s, kubectl, helm and local-path from nothing.
# existing  k0s is already running here; install.sh verifies instead of building.
installMode: fresh

# This machine's address. Used for the DICOM endpoint and the Grafana URL the
# installer prints — NOT for cluster networking, which is all local.
nodeIP: "10.0.0.1"

# -----------------------------------------------------------------------------
# Storage — where the bytes physically land
# -----------------------------------------------------------------------------
# All on ONE filesystem, deliberately: group-orthanc HARDLINKS instances out of
# Orthanc's storage into grouped/, and a hardlink cannot cross a mount point.
storage:
  storageClass:
    create: true
    name: hostpath-pipeline
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 500Gi
  # THE ARCHIVE OF RECORD. Originals with real patient identifiers, written
  # before de-identification, and the only copy that is never uploaded anywhere.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 500Gi

# -----------------------------------------------------------------------------
# Orthanc — the DICOM receiver and the de-identification contract
# -----------------------------------------------------------------------------
orthanc:
  # The AE title modalities C-STORE to, on this node's port 4242.
  aet: AISEDGE
  auth:
    enabled: false
  deid:
    existingSaltSecret: orthanc-deid-salt

    # WHICH CALLING AE TITLE MAPS TO WHICH XNAT PROJECT.
    # The most site-specific thing here. An AET that is NOT listed is
    # quarantined, not dropped, so it can be mapped and re-sent.
    aetMap:
      AISEDGE:
        project: example_project

    # The de-identification profile applied to every incoming study.
    # Start from charts/edge/files/deidentification-profile.example.json.
    profile:
      DeidMode: modify
      Force: true
      RemovePrivateTags: false
      # UIDs are RETAINED so a study stays internally consistent across series;
      # the identity fields are replaced below instead.
      Keep:
        - StudyInstanceUID
        - SeriesInstanceUID
        - SOPInstanceUID
        - FrameOfReferenceUID
      Replace:
        PatientIdentityRemoved: 'YES'
        DeidentificationMethod: AIS-Edge research-default v1; Retain UIDs Option
        PatientName: ANONYMOUS
        PatientID: ${ProjectCode}-${SubjectHash}
        PatientBirthDate: ${BirthYearOnly}0101
        AccessionNumber: ${SessionHash}
        StudyID: ${SessionHash}
        # THE ASSIGN STAGE READS THESE THREE. Removing any one of them stalls
        # every study at assign with "missing metadata fields", after deid has
        # already reported success.
        ClinicalTrialProtocolID: ${ProjectCode}
        ClinicalTrialSubjectID: ${SubjectHash}
        ClinicalTrialTimePointID: ${SessionHash}
        InstitutionName: AIS
        InstitutionAddress: ''
        ReferringPhysicianName: ''
        PerformingPhysicianName: ''
        OperatorsName: ''
        PatientBirthName: ''
        StationName: ''
        DeviceSerialNumber: ''
        OtherPatientIDs: ''
        RequestingPhysician: ''
        AdmittingDiagnosesDescription: ''
        PatientAddress: ''
        PatientTelephoneNumbers: ''
        PatientComments: ''
        StudyDescription: ''

# -----------------------------------------------------------------------------
# The pipeline
# -----------------------------------------------------------------------------
ingest:
  orthancGroup:
    enabled: true
    interval: 60
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
  deidentify:
    # THE RECIPE. The chart turns this map into a ConfigMap and mounts it at
    # SPEC_DIR; the KEY is the path under SPEC_DIR, so it must be the one
    # xnat-ingest looks for: __default__/<category>/<format>.
    #
    # THIS IS THE POLICY. Nothing downstream re-checks what was removed, so read
    # it before you install. deid.policyReviewed above is the gate that makes
    # you confirm it, whichever engine applies it. Copied from
    # charts/edge/files/deid-specs.example/.
    #
    # OPTION: dates. This recipe REMOVEs PatientBirthDate outright. If you need
    # age-at-scan preserved, pydicom-deid also supports JITTER, which shifts a
    # date by a fixed number of days:
    #     JITTER PatientBirthDate 47
    #     JITTER StudyDate 47
    # CAUTION: the offset is the same for every patient, so jitter the study
    # dates by the same number or every computed age silently shifts.
    specs:
      __default__/medimage/dicom-series: |
        # Example de-identification recipe for medimage/dicom-series.
        #
        # This is a pydicom `deid` RECIPE, not JSON, and the path is the format name.
        # xnat-ingest's load_specs walks <spec-dir>/<category>/<format>, so the DIRECTORY
        # is the category and the FILE is the format: medimage/dicom-series. It skips
        # anything at the top level that is not a directory, so a flat file named
        # `medimage@dicom-series.json` is never read and every session fails with
        # "No deidentification specs found".
        #
        # Copy this directory, rename __default__ to your project ID for a
        # project-specific policy, and edit to match your site's approved profile.
        # __default__ is the fallback for any project without its own directory.
        #
        # ONLY THE TAGS NAMED HERE ARE REMOVED. Anything not listed passes through
        # untouched, so this list IS the policy — review it as such.
        #
        # Compare with files/deidentification-profile.example.json, which is the
        # equivalent for the Orthanc Lua engine and has a different syntax.

        FORMAT dicom

        %header

        # Direct identifiers.
        REMOVE PatientName
        REMOVE PatientBirthDate
        REMOVE PatientAddress
        REMOVE PatientTelephoneNumbers
        REMOVE OtherPatientIDs
        REMOVE OtherPatientNames

        # Care-team and institution.
        REMOVE ReferringPhysicianName
        REMOVE PerformingPhysicianName
        REMOVE OperatorsName
        REMOVE InstitutionName
        REMOVE InstitutionAddress

        # Local accession/order numbers, which are re-identifying within a site.
        REMOVE AccessionNumber

        # MARK THE RESULT AS DE-IDENTIFIED. Without these two tags an instance that has
        # been through this stage is indistinguishable, by its own metadata, from one
        # that was never processed, and some downstream tooling keys on them. The
        # Orthanc engine already sets PatientIdentityRemoved in its profile; this is the
        # same assertion for this engine, so the two are not asymmetric.
        #
        # ADD, not REPLACE: the source instance does not carry these, and REPLACE only
        # rewrites a tag that is already present.
        ADD PatientIdentityRemoved YES
        ADD DeidentificationMethod AIS-Edge xnat-ingest recipe

        # THE PATIENT IDENTIFIER. Removed, and the reason matters because an earlier
        # version of this file kept it on a premise that is false.
        #
        # It claimed assign had already rewritten PatientID to the routed subject.
        # assign does no such thing: it READS tag values to resolve the project,
        # subject and session ids and then copies or hardlinks the files unchanged. It
        # never opens a dataset for writing. Verified by grepping the package for any
        # write to PatientID; there is none.
        #
        # It also claimed upload needs the tag to place the session. It does not.
        # Placement is explicit: upload builds the XNAT path from the session object's
        # ids, which came from ingest.assign.tagMapping, not from this header. So
        # removing PatientID cannot detach the data from its subject.
        #
        # What DOES happen if it is left: upload finishes by calling
        # /data/experiments/<id>?pullDataFromHeaders=true, which asks XNAT to populate
        # its own metadata FROM THESE HEADERS. So a real medical record number left
        # here is not merely present in the pixel archive, it is pulled into XNAT's
        # fields, while PatientName, birth date and institution are all correctly
        # stripped and the result looks de-identified to a spot check.
        #
        # Measured before this change: an instance de-identified by this recipe and
        # uploaded still carried PatientID verbatim, with PatientIdentityRemoved absent.
        REMOVE PatientID

        # THE SCANNER, not the patient, and still identifying. StationName names one
        # machine in one room; DeviceSerialNumber is globally unique to a device. With
        # InstitutionName already removed these are what put a study back in a building.
        #
        # MEASURED, and the reason they are here: a synthetic study carrying
        # StationName "CT-SCANNER-03" and DeviceSerialNumber "SN-CT-778812" was run
        # through this recipe and reached the de-identified output with BOTH verbatim,
        # because neither this recipe nor the Orthanc profile named them. Both are Basic
        # Application Level Confidentiality tags in DICOM PS3.15.
        REMOVE StationName
        REMOVE DeviceSerialNumber
        # THE REFERRAL, which the earlier pass missed by naming only two of the three
        # person-name fields. ReferringPhysicianName and PerformingPhysicianName were
        # removed; RequestingPhysician was not, and it carries the same name.
        # AdmittingDiagnosesDescription is free text stating why the patient was
        # admitted, so it is clinical information about that patient rather than about
        # the acquisition.
        #
        # MEASURED on a live tier-1 install with the Orthanc engine: a study whose
        # RequestingPhysician was "NGUYEN^THI^LAN" and whose
        # AdmittingDiagnosesDescription was "Suspected pulmonary embolism" reached the
        # staged output with both verbatim. OtherPatientIDs ("URN-99887766") survived
        # the Orthanc profile too, though this recipe already removed it, which is
        # exactly the kind of drift between the two engines worth closing. All three
        # are Basic Application Level Confidentiality tags in DICOM PS3.15.
        REMOVE RequestingPhysician
        REMOVE AdmittingDiagnosesDescription

        # PRIVATE TAGS PASS THROUGH, and that is a decision, not an oversight. The
        # Orthanc engine states it explicitly as "RemovePrivateTags": false; this recipe
        # said nothing, which made the same choice invisible on this side. Vendors put
        # reconstruction parameters research needs in private blocks, and they also put
        # scheduling references and operator notes there. MEASURED: a private block
        # carrying "local-scheduling-ref-8842" survives this recipe intact.
        #
        # If your site cannot accept that, remove them per-block by tag number; there is
        # no blanket switch here. Decide, do not inherit this by default.



        # QUASI-IDENTIFIERS, left in deliberately but LISTED so the choice is visible.
        # Age and sex are research-relevant and are not direct identifiers, but in a
        # small cohort they narrow it sharply. Decide per site; they are named here
        # rather than omitted so that deciding is not the same as forgetting.
        #   PatientSex
        #   PatientAge
  assign:
    # THE LUA HOOK IS OFF under deid.engine: ingest, so nothing writes the
    # ClinicalTrial* tags the chart would otherwise read. These must be tags your
    # modalities actually populate, and the chart refuses to render if they are
    # left pointing at ClinicalTrial*.
    #
    # CAUTION: whatever you name for `subject` becomes the XNAT subject label.
    # PatientID means the medical record number becomes that label, in the clear,
    # because assign runs BEFORE deidentify. Point it at a pseudonym tag your
    # modality writes if you have one.
    tagMapping:
      project: StudyID
      subject: PatientID
      session: AccessionNumber
    interval: 60

# -----------------------------------------------------------------------------
# Upload — STRAIGHT TO XNAT
# -----------------------------------------------------------------------------
# direct  reads the assigned sessions off local disk and PUTs them to XNAT.
#         This is what makes tier-1 a single node: no staging bucket, no
#         management-side reclaimer, no S3 credential to distribute.
# s3      tier-2 only. Requires SeaweedFS and a management plane.
upload:
  mode: direct
  direct:
    existingSecret: xnat-credentials
    # Poll interval. The chart default is 120; 60 matches every other stage
    # in the pipeline, so a session is not left waiting on this one.
    loop: 60
    # Quiet period before a session is considered complete.
    waitPeriod: 60
    alwaysInclude: all
    requireManifest: false
    # true unless your XNAT presents a private or self-signed certificate.
    verifySsl: true

# -----------------------------------------------------------------------------
# Observability — OPTIONAL, and entirely local on tier-1
# -----------------------------------------------------------------------------
# Tier-2 ships logs off the edge to a management Loki over mTLS. There is no
# management plane here, so the whole stack runs on this node:
#   Loki       filesystem storage on a PVC (NOT S3 — there is no object store)
#   Vector     tails pod logs and pushes to the in-cluster Loki over plain HTTP
#   Grafana    on a NodePort, since there is no ingress
#   Prometheus + Alertmanager as usual
#
# Turn the whole thing off and the pipeline is unaffected — it is observability,
# not plumbing.
observability:
  # Run Vector on this node and ship logs to Loki.
  enabled: true

  loki:
    # MUST BE EMPTY ON TIER-1. The chart defaults these to the tier-2 names
    # (loki-push-client-tls / ca-bundle), which cert-sync delivers from a
    # management cluster. There is no management cluster here, so nothing ever
    # creates them — and the chart mounts them non-optionally, so Vector would
    # sit in CreateContainerConfigError for good.
    #
    # Empty also selects files/vector-local.yaml, the config without the sink's
    # tls: block, because tier-1's Loki is in this same cluster over plain http.
    clientCertSecret: ""
    caBundleSecret: ""

  stack:
    # -------------------------------------------------------------------------
    # Where alerts are MAILED. Empty is allowed and is the shipped default: the
    # stack installs, the dashboards work, and nothing is sent. Every alert this
    # chart raises is then visible only in Grafana, which nobody is watching at
    # 3am — so on a real deployment, fill these in.
    #
    # The credentials live in secrets.enc.yaml as the alertmanager-smtp Secret
    # (username + password). Without the three keys below there is nowhere to
    # send to, so that Secret sits unused — which is the state a fresh
    # sites/ scaffold starts in.
    #
    # smtpUsername is here rather than in the Secret because Alertmanager has
    # no smtp_auth_username_file; only the PASSWORD is read from a file.
    alerting:
      # SET emailTo OR NO ALERT IS EVER DELIVERED, including the ones that tell
      # you studies have stopped reaching XNAT. Left empty, Alertmanager renders
      # with receiver "null": every rule still evaluates, every alert still
      # fires, and all of them go nowhere. Nothing errors and nothing warns.
      #
      # THIS IS EASY TO MISS because the secrets file makes you fill in
      # REPLACE_SMTP_USERNAME and REPLACE_SMTP_APP_PASSWORD, so it feels as
      # though email is configured. Those are the credentials for TALKING to the
      # relay; the four keys here are WHO gets the mail and WHICH relay. Both
      # halves are required and they live in different files.
      emailTo: ""            # e.g. imaging-ops@example.org
      emailFrom: ""          # defaults to emailTo when left empty
      smtpHost: ""           # e.g. smtp.example.org
      smtpPort: 587
      smtpUsername: ""       # must match `username` in the alertmanager-smtp Secret
      requireTLS: true

    # Host the log/metric store HERE: Loki + Prometheus + Grafana + Alertmanager
    # on this same node. Tier-2 ships logs off the box to a management cluster;
    # tier-1 has nowhere to ship them, so it keeps them locally.
    #
    # THIS IS THE ONLY KEY. Everything about HOW the stack is configured —
    # retention, the Grafana NodePort, Loki's disk, alert routing — lives in the
    # `loki:` and `kube-prometheus-stack:` blocks in charts/edge/values.yaml.
    # Helm cannot template subchart values, so a friendly key here could not
    # reach them: it would be read, trusted and silently ignored. Override those
    # blocks from this file if you need to, e.g.
    #
    #   kube-prometheus-stack:
    #     grafana:
    #       service:
    #         nodePort: 31000
    #
    # Grafana's login comes from the grafana-admin-credentials Secret in
    # secrets.enc.yaml, which IS wired.
    enabled: true

# -----------------------------------------------------------------------------
# Data policy — what is kept, and for how long
# -----------------------------------------------------------------------------
# Nothing expires on a fresh install. Run with dryRun for a week and read the
# decisions it logs before enabling it.
#
# On tier-1 this matters MORE than on tier-2, not less: this node holds the only
# copy of the facility backup, and there is no management-side reclaimer to fall
# back on. EdgeDiskLow is the only disk-exhaustion alert in the system.
dataPolicy:
  enabled: false
  dryRun: true
  originals:
    facilityBackup:
      retain: forever
      minFreeDiskPercent: 10
    quarantine:
      subPath: __unmapped_aet__
      retain: forever
      alertAfter: 24h
    fileDrop:
      reclaim: never
      minAge: 30d
  derived:
    orthancStorage:
      reclaim: onGrouped
      minAge: 7d
      maximumStorageSizeMB: 0
      maximumPatientCount: 0
    grouped:
      reclaim: onAssigned
    assigned:
      reclaim: auto
      minAge: 0

    # THE LAST TREE, and the one that used to have no knob here at all.
    # Whatever the uploader reads is what it re-reads every loop. `upload` never
    # deletes what it delivered, deliberately: you do not erase a study because an
    # HTTP call returned OK. So if nothing retires this tree, the same session is
    # re-sent every loop for ever and XNAT answers "already exists with different
    # checksums" each time. That is not hypothetical: it is what this tier did
    # until the terminal-stage reclaimer was ported to this branch.
    #
    # WHICH tree this is depends on the engine: /data/assigned under
    # deid.engine=orthanc, /data/deidentified under ingest. The chart derives it.
    #
    # THE RIGHT VALUE DEPENDS ON THE ENGINE, and the chart refuses the wrong one
    # rather than letting it read as a policy that is quietly never applied:
    #
    #   deid.engine: orthanc  (the default here)
    #     the terminal tree is /data/assigned, so THIS key must stay `never` and
    #     `assigned.reclaim: onUploaded` above is the one that does the work.
    #
    #   deid.engine: ingest
    #     the uploader reads /data/deidentified instead, so set THIS to onUploaded
    #     and set `assigned.reclaim: onDeidentified` above.
    deidentified:
      reclaim: auto

    # WHAT SATISFIES onUploaded ON THIS TIER. There is no bucket and no s3-uploader
    # here, so the marker the data-policy engine looks for is written by nothing
    # else: this CronJob writes it, after asking XNAT whether the session really
    # landed. Without it `onUploaded` can never come true and the tree above is
    # kept whatever you set.
    stagedReclaimer:
      # Hourly. The uploader deletes on its own success within seconds; this is the
      # slower, sure path for whatever that missed.
      schedule: "17 * * * *"
      # OPTION: raise on a slow link. A session still uploading is protected by the
      # XNAT check regardless, so this is about noise, not safety.
      minAge: 1d
      # Ask XNAT whether it holds the session, complete, before deleting the only
      # remaining copy. Off means trusting local state alone.
      # CAUTION: `false` removes the last independent check before deletion.
      verifyAgainstXnat: true
      # Ceiling per run. A bug that decides everything is reclaimable removes this
      # many and stops, leaving the rest to inspect.
      maxRemovals: 50
      # Killed if a run hangs on an unreachable XNAT, before the next is due.
      deadlineSeconds: 3000