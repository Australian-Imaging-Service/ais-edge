# =============================================================================
# EXAMPLE TIER-1 SITE — one machine, non-secret configuration
# =============================================================================
# Tier-1 is a single-node appliance. ONE Ubuntu box runs the whole pipeline:
#
#   modality --C-STORE--> Orthanc (de-identify) --> group-orthanc --> assign
#                     --> upload --> XNAT (HTTPS)
#
# There is no SeaweedFS, no S3 hop, no k0smotron child cluster, no konnectivity,
# no second worker to join, no nginx-ingress and no cert-manager. Original
# DICOMs never leave the node; only de-identified data goes to XNAT.
#
#   scripts/site-secrets.sh new <name> single    # copies this directory
#   $EDITOR sites/<name>/values.yaml             # <- everything below
#   $EDITOR sites/<name>/secrets.enc.yaml        # still PLAINTEXT at this point
#   scripts/site-secrets.sh encrypt <name>       # do not commit before this
#   ./install.sh <name>
#
# ONE FILE, ONE CHART. Tier-2 splits its config across a management site and one
# file per edge, because it has many machines. Tier-1 has one machine, so this
# is the whole configuration, and install.sh passes it to charts/edge alone:
#
#   helm upgrade --install <name> charts/edge -f sites/<name>/values.yaml
#
# You never edit charts/edge/values.yaml. That holds the defaults and the
# reasoning behind them; this file holds the facts that are true of YOUR site.
# =============================================================================

# Short name for this deployment. Becomes a label on every log line and metric,
# and appears in alert routing.
clusterLabel: tier1-example

# All pipeline workloads live here. Tier-2 splits ingest (edge cluster) from
# upload (management cluster) because they are different machines; on one node
# there is nothing to split.
namespace: xnat-ingest

# onprem  resolves nothing externally — tier-1 talks only to XNAT, by its real
#         DNS name, over the node's normal resolver. There are no management
#         hostnames to pin, so no /etc/hosts entries and no hostAliases.
topology: onprem

# fresh     install.sh installs k0s, kubectl, helm and local-path from nothing.
# existing  k0s is already running here; install.sh verifies instead of building.
installMode: fresh

# This machine's address. Used for the DICOM endpoint and the Grafana URL the
# installer prints — NOT for cluster networking, which is all local.
nodeIP: "10.0.0.1"

# -----------------------------------------------------------------------------
# Storage — where the bytes physically land
# -----------------------------------------------------------------------------
# All on ONE filesystem, deliberately: group-orthanc HARDLINKS instances out of
# Orthanc's storage into grouped/, and a hardlink cannot cross a mount point.
storage:
  storageClass:
    create: true
    name: hostpath-pipeline
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 500Gi
  # THE ARCHIVE OF RECORD. Originals with real patient identifiers, written
  # before de-identification, and the only copy that is never uploaded anywhere.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 500Gi

# -----------------------------------------------------------------------------
# Orthanc — the DICOM receiver and the de-identification contract
# -----------------------------------------------------------------------------
orthanc:
  # The AE title modalities C-STORE to, on this node's port 4242.
  aet: AISEDGE
  auth:
    enabled: false
  deid:
    enabled: true
    # THE GATE. The chart refuses to render while this is false and deid is on.
    # Set it only once you have read the profile and the AET map below and agree
    # they are this site's policy. It is not a formality: nothing downstream
    # re-checks what was removed.
    policyReviewed: false
    existingSaltSecret: orthanc-deid-salt

    # WHICH CALLING AE TITLE MAPS TO WHICH XNAT PROJECT.
    # The most site-specific thing here. An AET that is NOT listed is
    # quarantined, not dropped, so it can be mapped and re-sent.
    aetMap:
      AISEDGE:
        project: example_project

    # The de-identification profile applied to every incoming study.
    # Start from charts/edge/files/deidentification-profile.example.json.
    profile:
      DeidMode: modify
      Force: true
      RemovePrivateTags: false
      # UIDs are RETAINED so a study stays internally consistent across series;
      # the identity fields are replaced below instead.
      Keep:
        - StudyInstanceUID
        - SeriesInstanceUID
        - SOPInstanceUID
        - FrameOfReferenceUID
      Replace:
        PatientIdentityRemoved: 'YES'
        DeidentificationMethod: AIS-Edge research-default v1; Retain UIDs Option
        PatientName: ANONYMOUS
        PatientID: ${ProjectCode}-${SubjectHash}
        PatientBirthDate: ${BirthYearOnly}0101
        AccessionNumber: ${SessionHash}
        StudyID: ${SessionHash}
        # THE ASSIGN STAGE READS THESE THREE. Removing any one of them stalls
        # every study at assign with "missing metadata fields", after deid has
        # already reported success.
        ClinicalTrialProtocolID: ${ProjectCode}
        ClinicalTrialSubjectID: ${SubjectHash}
        ClinicalTrialTimePointID: ${SessionHash}
        InstitutionName: AIS
        InstitutionAddress: ''
        ReferringPhysicianName: ''
        PerformingPhysicianName: ''
        OperatorsName: ''
        PatientBirthName: ''
        PatientAddress: ''
        PatientTelephoneNumbers: ''
        PatientComments: ''
        StudyDescription: ''

# -----------------------------------------------------------------------------
# The pipeline
# -----------------------------------------------------------------------------
ingest:
  orthancGroup:
    enabled: true
    interval: 60
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
  assign:
    interval: 60

# -----------------------------------------------------------------------------
# Upload — STRAIGHT TO XNAT
# -----------------------------------------------------------------------------
# direct  reads the assigned sessions off local disk and PUTs them to XNAT.
#         This is what makes tier-1 a single node: no staging bucket, no
#         management-side reclaimer, no S3 credential to distribute.
# s3      tier-2 only. Requires SeaweedFS and a management plane.
upload:
  mode: direct
  direct:
    existingSecret: xnat-credentials
    # Poll interval. Tier-1's old default was 60; the chart's is 300.
    loop: 60
    # Quiet period before a session is considered complete.
    waitPeriod: 60
    alwaysInclude: all
    requireManifest: false
    # true unless your XNAT presents a private or self-signed certificate.
    verifySsl: true

# -----------------------------------------------------------------------------
# Observability — OPTIONAL, and entirely local on tier-1
# -----------------------------------------------------------------------------
# Tier-2 ships logs off the edge to a management Loki over mTLS. There is no
# management plane here, so the whole stack runs on this node:
#   Loki       filesystem storage on a PVC (NOT S3 — there is no object store)
#   Vector     tails pod logs and pushes to the in-cluster Loki over plain HTTP
#   Grafana    on a NodePort, since there is no ingress
#   Prometheus + Alertmanager as usual
#
# Turn the whole thing off and the pipeline is unaffected — it is observability,
# not plumbing.
observability:
  enabled: true
  stack:
    enabled: true
    # Log and metric retention. Disk-bound: this node holds everything.
    retentionDays: 30
    grafana:
      # http://<nodeIP>:<nodePort>. Must be in the 30000-32767 NodePort range;
      # the chart refuses to render otherwise, because an out-of-range value
      # fails at apply time after the rest of the release has installed.
      nodePort: 30030
      existingSecret: grafana-admin-credentials
    alerting:
      # Leave emailTo empty to install the stack without mail routing.
      emailTo: ""
      emailFrom: ais-edge-alerts@example.org
      smtpHost: ""
      smtpPort: 587
      # For Gmail this must be an App Password. A 2FA account rejects the
      # account password with 535 BadCredentials, and the only symptom is
      # alerts that never arrive.
      smtpUsername: ""
      existingSecret: alertmanager-smtp

# -----------------------------------------------------------------------------
# Data policy — what is kept, and for how long
# -----------------------------------------------------------------------------
# Nothing expires on a fresh install. Run with dryRun for a week and read the
# decisions it logs before enabling it.
#
# On tier-1 this matters MORE than on tier-2, not less: this node holds the only
# copy of the facility backup, and there is no management-side reclaimer to fall
# back on. EdgeDiskLow is the only disk-exhaustion alert in the system.
dataPolicy:
  enabled: false
  dryRun: true
  originals:
    facilityBackup:
      retain: forever
      minFreeDiskPercent: 10
    quarantine:
      subPath: __unmapped_aet__
      retain: forever
      alertAfter: 24h
    fileDrop:
      reclaim: never
      minAge: 30d
  derived:
    orthancStorage:
      reclaim: onGrouped
      minAge: 7d
      maximumStorageSizeMB: 0
      maximumPatientCount: 0
    grouped:
      reclaim: onAssigned
    assigned:
      reclaim: onUploaded
      minAge: 0
