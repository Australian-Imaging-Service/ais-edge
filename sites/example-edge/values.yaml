# Reviewed 2026-11-10 against this branch. This file retains its existing
# site settings; it is not evidence of a current live deployment. Historical
# measurements without a run date are not verified (2026-11-10).
# This retained configuration selects the deprecated Lua engine. Do not
# copy that choice for a new site; start from the current ingest example.
# The pipeline tool is accessionflow (called xnat-ingest before 0.18.0).
# =============================================================================
# EXAMPLE EDGE SITE — what is LOCAL to one edge
# =============================================================================
# This is the config for ONE edge node: the machine inside a facility that runs
# Orthanc, the grouper and assigner, the de-identification stage, the S3
# uploader, Vector and (optionally) Samba.
#
# There is one of these PER EDGE. Copy it once per site:
#
#   scripts/site-secrets.sh new <edge-name> edge   # copies this directory
#   $EDITOR sites/<edge-name>/values.yaml          # <- everything below
#   $EDITOR sites/<edge-name>/secrets.enc.yaml     # still plaintext
#   scripts/site-secrets.sh encrypt <edge-name>
#
# ...and add a matching entry to `edges:` in the MANAGEMENT site file, then
# re-run install.sh.
#
# HOW HELM SEES THIS FILE. install.sh gives the edge chart TWO values files:
#
#   helm upgrade --install edge charts/edge -n xnat-ingest \
#       -f sites/<management-site>/values.yaml \    <- shared facts, first
#       -f sites/<edge-name>/values.yaml            <- this file, last (wins)
#
# Because the management file comes first, everything shared is already set by
# the time this file is read: the internal domain, the published hostnames, the
# management node's IP, the bucket prefix, the data policy. The S3 endpoint, the
# staging bucket, the Loki endpoint and the hostAliases are DERIVED from those
# and are deliberately absent below.
#
# Every one of those used to be typed here a second time, and every mismatch in
# that group failed silently — the pod started, pointed at a hostname or bucket
# that did not exist, and retried forever. Do not add them back.
#
# You never edit charts/edge/values.yaml. That file holds the defaults and the
# reasoning for them; this file holds only what is true of THIS site.
# =============================================================================

# This edge's own short name. Becomes the `cluster` label on its logs and
# selected metrics, and is the commonName of the client certificate it authenticates to
# the Loki push endpoint with ; so it must match the `edges[].name` entry in
# the management values file, which is what that certificate is issued from and
# what the push Ingress pins the CN to.
clusterLabel: example-edge

# The de-identification engine. ingest is the default and the only engine for
# a new site: the accessionflow deidentify stage applies the recipe under
# ingest.deidentify.specs below. The chart derives the stage, the group label
# and the reclaim condition from this one key. orthanc, the Lua engine, is
# deprecated (docs/components/deidentification.md).
deid:
  engine: ingest

  # THE REVIEW GATE. deid.policyReviewed must be true before the chart renders.
  # Read the selected recipe and source-label mapping first. This flag records
  # operator review; it does not test de-identification quality or guarantee
  # that identifiers in headers, pixels, paths and logs have been removed.
  policyReviewed: false

namespace: xnat-ingest

# onprem uses management host entries for generated names.
# cloud uses real DNS and the configured management ingress or manual
# load-balancer route. Both still use the edge hostPath pipeline volume.
topology: onprem

storage:
  storageClass:
    create: true
    name: hostpath-pipeline
  # Working space for the pipeline: received, grouped, assigned, de-identified,
  # and the re-identification maps. Keep it one filesystem: the stages hardlink.
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 500Gi
  # THE ARCHIVE OF RECORD. The DicomProtocol callback writes original
  # bytes before de-identification; REST/file-drop inputs bypass it and a
  # callback write can fail. Check actual coverage. dataPolicy.originals.facilityBackup in
  # the management file governs how long they stay. It can be on its own disk:
  # the Orthanc hook writes a byte copy, not a hardlink.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 500Gi

orthanc:
  # The AE title THIS Orthanc answers to. Modalities are configured to send here.
  aet: AISEDGE
  auth:
    # true requires the orthanc-credentials Secret for HTTP access.
    # This is HTTP authentication, not DICOM sender authentication.
    # Restrict the DICOM and HTTP listeners at the network boundary.
    enabled: false
  deid:
    # The receiver Lua startup currently loads existingSaltSecret, including
    # under the ingest engine. The ingest path returns before legacy hashing
    # and profile modification, but the startup dependency still exists.
    # Keep the Secret required by the rendered pod available.
    existingSaltSecret: orthanc-deid-salt

    # NOT USED UNDER deid.engine: ingest. aetMap and profile are read only by
    # the deprecated Lua engine (deid.engine: orthanc). Under ingest the Lua
    # script returns before it reads them, so there is no AE-title routing and
    # no quarantine. The XNAT project, subject and session come from
    # ingest.assign below. Do not edit these for a new site.
    aetMap:
      AISEDGE:
        project: example_project

    # Deprecated engine only, as above.
    profile:
      DeidMode: modify
      Force: true
      RemovePrivateTags: false
      # UIDs are RETAINED so a study stays internally consistent across series;
      # the identity fields are replaced below instead.
      Keep:
        - StudyInstanceUID
        - SeriesInstanceUID
        - SOPInstanceUID
        - FrameOfReferenceUID
      Replace:
        PatientIdentityRemoved: 'YES'
        DeidentificationMethod: AIS-Edge research-default v1; Retain UIDs Option
        PatientName: ANONYMOUS
        # Deprecated engine only. ${SubjectHash} and ${SessionHash} are salted
        # djb2 hashes (not HMACs) keyed by the salt in orthanc-deid-salt.
        PatientID: ${ProjectCode}-${SubjectHash}
        PatientBirthDate: ${BirthYearOnly}0101
        AccessionNumber: ${SessionHash}
        StudyID: ${SessionHash}
        ClinicalTrialProtocolID: ${ProjectCode}
        ClinicalTrialSubjectID: ${SubjectHash}
        ClinicalTrialTimePointID: ${SessionHash}
        InstitutionName: AIS
        InstitutionAddress: ''
        ReferringPhysicianName: ''
        PerformingPhysicianName: ''
        OperatorsName: ''
        PatientBirthName: ''
        StationName: ''
        DeviceSerialNumber: ''
        OtherPatientIDs: ''
        RequestingPhysician: ''
        AdmittingDiagnosesDescription: ''
        PatientAddress: ''
        PatientTelephoneNumbers: ''
        PatientComments: ''
        StudyDescription: ''

ingest:
  # Pulls eligible studies after the configured quiet period and maintains
  # processed labels/receipts. New late instances can cause a revisit.
  # Under ingest, no study waits for the legacy ready label. A quiet period
  # is an eligibility check, not a guarantee that acquisition has finished.
  orthancGroup:
    enabled: true
    interval: 60
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
  # THE DE-IDENTIFICATION STAGE. It runs between assign and upload, and the
  # uploader reads only its output.
  deidentify:
    # THE POLICY. Only the tags it names change: every other tag goes to XNAT
    # unchanged. Nothing downstream re-checks what was removed, so read it
    # before you install. Copied from charts/edge/files/deid-specs.example/.
    # Edit this complete recipe to your approved policy. A short recipe at this
    # key replaces all of it. A recipe at "<PROJECT_ID>/medimage/dicom-series"
    # replaces this default for that project.
    specs:
      __default__/medimage/dicom-series: |
        # Example de-identification recipe for medimage/dicom-series.
        #
        # This is a pydicom `deid` RECIPE, not JSON, and the path is the format name.
        # accessionflow's load_recipe_files walks <spec-dir>/<category>/<format>, so the DIRECTORY
        # is the category and the FILE is the format: medimage/dicom-series. It skips
        # anything at the top level that is not a directory, so a flat file named
        # `medimage@dicom-series.json` is never read and every session fails with
        # "No deidentification recipe files found".
        #
        # Copy this directory, rename __default__ to your project ID for a
        # project-specific policy, and edit to match your site's approved profile.
        # __default__ is the fallback for any project without its own directory.
        #
        # ONLY THE TAGS NAMED HERE ARE REMOVED. Anything not listed passes through
        # untouched, so this list IS the policy ; review it as such.
        #
        # Compare with files/deidentification-profile.example.json, which is retained for the deprecated Orthanc Lua engine. Its syntax
        # and policy differ; it is not a current recipe recommendation.

        FORMAT dicom

        %header

        # Direct identifiers.
        REMOVE PatientName
        REMOVE PatientBirthDate
        REMOVE PatientAddress
        REMOVE PatientTelephoneNumbers
        REMOVE OtherPatientIDs
        REMOVE OtherPatientNames

        # Care-team and institution.
        REMOVE ReferringPhysicianName
        REMOVE PerformingPhysicianName
        REMOVE OperatorsName
        REMOVE InstitutionName
        REMOVE InstitutionAddress

        # Local accession/order numbers, which are re-identifying within a site.
        REMOVE AccessionNumber

        # MARK THE RESULT. These metadata flags state that processing was applied;
        # they are not evidence that all identifiers were removed or that the
        # instance complies with an approved confidentiality profile. Review the
        # actual output, including private tags and pixels.
        #
        # ADD sets the desired field even when it is absent from the input.
        # Keep this assertion aligned with the complete approved recipe. The
        # legacy Lua profile uses a different syntax and is not the current policy.
        ADD PatientIdentityRemoved YES
        ADD DeidentificationMethod AIS-Edge xnat-ingest recipe

        # THE PATIENT IDENTIFIER. Removed, and the reason matters because an earlier
        # version of this file kept it on a premise that is false.
        #
        # It claimed assign had already rewritten PatientID to the routed subject.
        # assign does no such thing: it READS tag values to resolve the project,
        # subject and session ids and then copies or hardlinks the files unchanged. It
        # never opens a dataset for writing. Verified by grepping the package for any
        # write by the label stage; it resolves IDs without rewriting DICOMs.
        #
        # It also claimed upload needs the tag to place the session. It does not.
        # Placement is explicit: upload builds the XNAT path from the session object's
        # ids, which came from ingest.assign.tagMapping, not from this header. So
        # removing PatientID cannot detach the data from its subject.
        #
        # What DOES happen if it is left: upload finishes by calling
        # /data/experiments/<id>?pullDataFromHeaders=true, which asks XNAT to populate
        # its own metadata FROM THESE HEADERS. So a real medical record number left
        # here is not merely present in the pixel archive, it can be read into XNAT metadata, while PatientName, birth date and institution are all correctly
        # stripped and the result looks de-identified to a spot check.
        #
        # Historical synthetic measurement, run date not verified (2026-11-10): an instance de-identified by this recipe and
        # uploaded still carried PatientID verbatim, with PatientIdentityRemoved absent.
        REMOVE PatientID

        # THE SCANNER, not the patient, and still identifying. StationName names one
        # machine in one room; DeviceSerialNumber is globally unique to a device. With
        # InstitutionName already removed these are what put a study back in a building.
        #
        # Historical synthetic measurement, run date not verified (2026-11-10): a synthetic study carrying
        # StationName "CT-SCANNER-03" and DeviceSerialNumber "SN-CT-778812" was run
        # through this recipe and reached the de-identified output with BOTH verbatim,
        # because neither this recipe nor the Orthanc profile named them. Both are Basic
        # Application Level Confidentiality tags in DICOM PS3.15.
        REMOVE StationName
        REMOVE DeviceSerialNumber
        # THE REFERRAL, which the earlier pass missed by naming only two of the three
        # person-name fields. ReferringPhysicianName and PerformingPhysicianName were
        # removed; RequestingPhysician was not, and it carries the same name.
        # AdmittingDiagnosesDescription is free text stating why the patient was
        # admitted, so it is clinical information about that patient rather than about
        # the acquisition.
        #
        # Historical test on the now-deprecated Lua engine; run date not verified
        # (2026-11-10): a study whose
        # RequestingPhysician was "NGUYEN^THI^LAN" and whose
        # AdmittingDiagnosesDescription was "Suspected pulmonary embolism" reached the
        # staged output with both verbatim. OtherPatientIDs ("URN-99887766") survived
        # the Orthanc profile too, though this recipe already removed it, which is
        # exactly the kind of drift between the two engines worth closing. All three
        # are Basic Application Level Confidentiality tags in DICOM PS3.15.
        REMOVE RequestingPhysician
        REMOVE AdmittingDiagnosesDescription

        # PRIVATE TAGS ARE NOT BLANKET-REMOVED by this example. Vendor private
        # blocks can carry useful acquisition information and identifying text.
        # Historical synthetic test: local-scheduling-ref-8842 survived an older
        # example; its run date is not verified (2026-11-10).
        #
        # The current deid library supports recipe REMOVE ALL_PRIVATE. Decide which
        # private data may remain for the intended use and test the complete recipe.
        # Do not equate retained private blocks with a guarantee of anonymity.



        # QUASI-IDENTIFIERS, left in deliberately but LISTED so the choice is visible.
        # Age and sex are research-relevant and are not direct identifiers, but in a
        # small cohort they narrow it sharply. Decide per site; they are named here
        # rather than omitted so that deciding is not the same as forgetting.
        #   PatientSex
        #   PatientAge
    # PRODUCTION: encrypt the re-identification maps in /data/reid. Name a
    # Secret with the key XINGEST_REID_ENCRYPT_KEY (secrets.example.yaml has
    # a template). Without it the maps are plain JSON.
    # The chart maps that retained Secret key to ACFLOW_REID_ENCRYPT_KEY in
    # the container. Do not rename the Secret key without changing secretKeyRef.
    # reidEncryptKeySecret: reid-key
  assign:
    # THE XNAT LABELS. Each value names the DICOM tag whose VALUE becomes that
    # label: assign reads them before deidentify runs, so no recipe can change
    # them (normalization and reserved-label handling also apply). These
    # are tags your modalities populate: nothing else writes them under
    # deid.engine: ingest. PatientID often holds a hospital medical record
    # number. If it does, subject: PatientID puts that number into XNAT in the
    # clear, so name a pseudonym tag instead. An approved research identifier
    # in PatientID is fine. A study with an empty tag can fail assignment into
    # assigned/__invalid__, still identifiable; inspect the actual diagnostic.
    # constantProjectId: example_project   # OPTION: file every session here
    tagMapping:
      project: StudyID
      subject: PatientID
      session: AccessionNumber
    interval: 60

  # OPTIONAL: the package stage. One zip per DICOM series plus one sample DICOM,
  # in place of the individual files. Off by default. Turn it on only when the
  # XNAT project wants zips. See docs/package-stage.md: "What it needs" names
  # the image and library versions, "Turn it on" the steps.
  # package:
  #   enabled: true
  # The DICOM sample datatype, installed by pip in an init container at each new pod initialization of the package pod and of the upload pod. The node needs access
  # to github.com, or to a mirror of the package.
  # extraPipPackages:
  #   - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2"
  #   - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2#subdirectory=extras"

upload:
  # s3      this edge pushes to the central staging bucket and the MANAGEMENT
  #         uploader moves it into XNAT. The edge holds no XNAT credential and
  #         never contacts XNAT. One XNAT account for the whole fleet.
  # direct  this edge talks to XNAT itself (single-site tier-1 only). Needs the Secret selected by upload.direct.existingSecret here.
  mode: s3
  s3:
    # endpoint and bucket are DERIVED from the management file's domain,
    # hostnames and bucketPrefix. Do not set them here.
    existingSecret: s3-edge-credentials
    # The chart requires a CA bundle for this configured HTTPS S3 endpoint.
    # rclone uses RCLONE_CA_CERT for the custom trust file; an unset variable
    # does not inherently disable TLS verification. cert-sync populates the
    # Secret in this topology. A public-CA deployment must also satisfy the
    # chart validation; do not assume leaving the bundle empty is accepted.
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt

    # mTLS ON THE UPLOAD PATH ; OFF, AND STEP 3 OF A FOUR-STEP ROLLOUT.
    # caBundleSecret above is who we TRUST; this is who we ARE. They are
    # independent: on cloud the server certificate can come from a public CA
    # with appropriate trust; this chart still validates its CA-bundle setting while this one still comes from the fleet CA.
    #
    # Do NOT set this until, on the MANAGEMENT side:
    #   1. seaweedfs.ingress.clientCerts.issue: true, plus the matching
    #      certSync.secrets entry (both are commented out in the management
    #      site file, together, for this reason)
    #   2. kubectl -n xnat-ingest get secret s3-client-tls   answers HERE
    # then set requireClientCert: true here, and only afterwards flip
    # seaweedfs.ingress.clientCerts.require on the management side.
    #
    # CAUTION, both directions: turning this on before the Secret lands leaves
    # the uploader in CreateContainerConfigError (loud, local); flipping the
    # management `require` before this is on can reject uploads; a historical test returned HTTP 400
    # that rclone reports as an S3 XML parse failure ; naming neither
    # certificates nor auth, and reaching the logs as endpoint_failed.
    # requireClientCert: true
    # clientCertSecret: s3-client-tls
    interval: 60

observability:
  enabled: true
  loki:
    # Both Secrets are written by the management side's cert-sync CronJob; you
    # do not create them here.
    #
    # clientCertSecret is this site's mTLS identity for the Loki push endpoint
    # — a cert-manager certificate whose CN is this edge's name. It must match
    # the certSync destination name in the MANAGEMENT site values.
    clientCertSecret: loki-push-client-tls
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt

# dataPolicy is DELIBERATELY ABSENT ; it is set ONCE in the management site
# file, which is passed to this release first, so the whole fleet's retention
# rules are inherited. Later overrides can change the edge behavior, so
# compare the rendered policy on both sides.
#
# Setting it here would silently override the shared policy FOR THIS EDGE ONLY.
# Because the management chart never reads this file, the two would then be
# independent knobs wearing one name: enable the policy centrally and the
# management reclaimer starts freeing staged S3 objects while this edge keeps
# everything.
#
# If one site genuinely needs a different policy from the rest of the fleet,
# set dataPolicy here deliberately and write down why.
