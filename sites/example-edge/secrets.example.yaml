# =============================================================================
# EDGE SITE SECRETS — PLAINTEXT TEMPLATE
# =============================================================================
# These are applied to ONE EDGE cluster, in namespace xnat-ingest. The
# management cluster has its own, much longer, set in
# sites/example-mgmt/secrets.example.yaml — keep them apart. `site-secrets.sh
# apply` sends this whole file to whatever cluster KUBECONFIG points at, so a
# merged file would try to create management Secrets on the edge.
#
#   scripts/site-secrets.sh new <edge-name> edge   # copies this
#   $EDITOR sites/<edge-name>/secrets.enc.yaml     # fill in every REPLACE_
#   scripts/site-secrets.sh encrypt <edge-name>    # do not commit before this
#
# SHORT BY DESIGN. A normal edge needs one Secret from you, the salt below,
# because in upload.mode=s3 the edge holds NO XNAT credential and never
# contacts XNAT. A production site also adds the reid key (CONDITIONAL, below).
# Three more arrive on their own: ca-bundle, loki-push-client-tls (this site's
# mTLS identity for the Loki push endpoint) and s3-edge-credentials (see the
# note after the salt) are written into this namespace by
# the management side's cert-sync CronJob. Do not create those here — cert-sync
# would overwrite them, and a hand-written client certificate is one the
# management CA never signed, so the push would be rejected at the handshake.
# =============================================================================
---
# The salt for the Orthanc Lua script. The Orthanc pod needs this Secret
# whenever the facility backup is on. The script stops at load without it.
#
# Under deid.engine: ingest (the default) nothing uses the value. The script
# only writes the facility backup and makes no pseudonym, so a new value
# changes no XNAT label. Fill it in anyway: `encrypt` warns about the
# placeholder. Only the deprecated deid.engine: orthanc makes pseudonyms from
# it (docs/components/deidentification.md, "Pseudonym strength").
#
#   Generate once:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: orthanc-deid-salt
  namespace: xnat-ingest
type: Opaque
stringData:
  AIS_DEID_HMAC_SALT: REPLACE_64_HEX_CHARS
# -----------------------------------------------------------------------------
# s3-edge-credentials IS NOT HERE, AND MUST NOT BE ADDED.
#
# This edge's S3 identity is written ONCE, on the management side, as the
# `<edge>-s3` Secret named by that edge's `edges[].s3SecretRef`. cert-sync
# copies it in as `s3-edge-credentials`, the same way it delivers ca-bundle and
# the Loki client certificate.
#
# It used to live in both places with identical values, and that was the bug:
# nobody cares what the key pair IS, only that the two copies match, so making
# a human the consistency mechanism guaranteed they would eventually drift. The
# symptom is an S3 403 at upload with nothing saying which side is wrong.
#
# Writing it here anyway does not "also work" — cert-sync overwrites it on its
# next run, so the edge would authenticate correctly until the credential
# silently changed underneath it, which is worse than failing immediately.
# -----------------------------------------------------------------------------

# =============================================================================
# CONDITIONAL — uncomment only if you turn the matching feature on
# =============================================================================
# Leaving these commented out is the normal case. An unused Secret is harmless
# but it is one more credential to rotate and explain, so create it only when
# the feature that reads it is enabled.
# -----------------------------------------------------------------------------
# ingest.deidentify.reidEncryptKeySecret: reid-key   (set it at a production site)
#
# Encrypts the re-identification maps that the deidentify stage writes to
# /data/reid. Without it the maps are plain JSON, on the same disk as the data.
# The value must be a Fernet key. Generate one with:
#   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Keep a copy of the key off this edge. A map needs the key that wrote it.
#
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: reid-key
#   namespace: xnat-ingest
# type: Opaque
# stringData:
#   XINGEST_REID_ENCRYPT_KEY: REPLACE_FERNET_KEY
# -----------------------------------------------------------------------------
# orthanc.auth.enabled: true
#
# Orthanc's REST API. Also consumed by group-orthanc, which authenticates to
# pull labelled studies. users.json is the file Orthanc reads; the two flat keys
# are for the pipeline pods. THE PASSWORD MUST BE IDENTICAL IN ALL THREE.
#
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: orthanc-credentials
#   namespace: xnat-ingest
# type: Opaque
# stringData:
#   users.json: '{"RegisteredUsers":{"admin":"REPLACE_ORTHANC_PASSWORD"}}'
#   orthanc-user: admin
#   orthanc-password: REPLACE_ORTHANC_PASSWORD
# -----------------------------------------------------------------------------
# upload.mode: direct   (single-site tier-1 only)
#
# In the default s3 mode this edge never talks to XNAT and this Secret is not
# needed. Creating it anyway does not enable direct mode — `upload.mode` does.
#
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: xnat-credentials
#   namespace: xnat-ingest
# type: Opaque
# stringData:
#   server: https://xnat.example.org
#   username: REPLACE_XNAT_USER
#   password: REPLACE_XNAT_PASSWORD
# -----------------------------------------------------------------------------
# samba.enabled: true
#
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: samba-credentials
#   namespace: xnat-ingest
# type: Opaque
# stringData:
#   username: ais-edge
#   password: REPLACE_SAMBA_PASSWORD
# =============================================================================
