# =============================================================================
# Per-site secrets — PLAINTEXT TEMPLATE
# =============================================================================
# Copy to secrets.enc.yaml, fill in the real values, then encrypt:
#
#     cp sites/example-site/secrets.example.yaml sites/<site>/secrets.enc.yaml
#     $EDITOR sites/<site>/secrets.enc.yaml
#     scripts/site-secrets.sh encrypt <site>
#
# After encrypting, `git diff` shows which keys changed but not their values.
# The plaintext file must never be committed — .gitignore blocks
# secrets.yaml / secrets.plain.yaml, and this .example. file contains only
# placeholders.
#
# THE CHARTS NEVER CONTAIN CREDENTIALS. They reference every one of these by
# Secret name (the xxxSecretRef / existingSecret keys in values.yaml), which
# is what lets SOPS sit on top without a single template change. Keep it that
# way: if you ever find yourself putting a password in a values file, the
# design has gone wrong.
#
# Apply with:
#     scripts/site-secrets.sh apply <site>
# which decrypts to a pipe and never writes plaintext to disk.
# =============================================================================
---
# --- EDGE CLUSTER SECRETS (namespace xnat-ingest on the edge) ----------------

# Orthanc REST API. Also consumed by group-orthanc, which authenticates to
# pull labelled studies.
# users.json is the file Orthanc reads; the two flat keys are for the
# pipeline pods. Keep the password identical in all three.
apiVersion: v1
kind: Secret
metadata:
  name: orthanc-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  users.json: '{"RegisteredUsers":{"admin":"REPLACE_ORTHANC_PASSWORD"}}'
  orthanc-user: admin
  orthanc-password: REPLACE_ORTHANC_PASSWORD
---
# Salt for the subject/session pseudonym hashes in the de-identification hook.
#
# DO NOT ROTATE CASUALLY. The same patient hashed with a different salt
# produces a different pseudonym, so existing XNAT subjects stop matching new
# arrivals and the same person appears as two subjects. Preserve this value
# across reinstalls and site rebuilds.
#   Generate once:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: orthanc-deid-salt
  namespace: xnat-ingest
type: Opaque
stringData:
  AIS_DEID_HMAC_SALT: REPLACE_64_HEX_CHARS
---
# This edge's S3 identity. Scoped by SeaweedFS to read/list/write on the
# ingest bucket only — it cannot read XNAT and cannot see another site's data.
# Must match the identity generated for this edge on the management side.
apiVersion: v1
kind: Secret
metadata:
  name: s3-edge-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  access-key: REPLACE_EDGE_S3_ACCESS_KEY
  secret-key: REPLACE_EDGE_S3_SECRET_KEY
---
# Only for upload.mode=direct (tier-1). In s3 mode the edge never talks to
# XNAT and this Secret is not needed.
apiVersion: v1
kind: Secret
metadata:
  name: xnat-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  server: https://xnat.example.org
  username: REPLACE_XNAT_USER
  password: REPLACE_XNAT_PASSWORD
---
# Only when samba.enabled=true.
apiVersion: v1
kind: Secret
metadata:
  name: samba-credentials
  namespace: xnat-ingest
type: Opaque
stringData:
  username: ais-edge
  password: REPLACE_SAMBA_PASSWORD
---
# --- MANAGEMENT CLUSTER SECRETS ---------------------------------------------

# SeaweedFS admin identity. Used by the bucket-creation hook.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-admin
  namespace: seaweedfs
type: Opaque
stringData:
  access-key: REPLACE_S3_ADMIN_ACCESS_KEY
  secret-key: REPLACE_S3_ADMIN_SECRET_KEY
---
# Identity the management-side uploader uses to READ staged sessions.
# Deliberately separate from the admin identity above: the uploader needs
# read+delete on the staging prefix, not administrative rights over the store.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-upload
  namespace: xnat-upload
type: Opaque
stringData:
  access-key: REPLACE_UPLOAD_S3_ACCESS_KEY
  secret-key: REPLACE_UPLOAD_S3_SECRET_KEY
---
# The XNAT account the management uploader writes with. One credential for the
# whole fleet — this is the main operational advantage of upload.mode=s3 over
# giving every edge its own XNAT account.
apiVersion: v1
kind: Secret
metadata:
  name: xnat-credentials
  namespace: xnat-upload
type: Opaque
stringData:
  server: https://xnat.example.org
  username: REPLACE_XNAT_USER
  password: REPLACE_XNAT_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_GRAFANA_PASSWORD
---
# Loki's own S3 identity for chunk storage. Separate bucket from ingest, and a
# separate identity, so a Loki compromise cannot reach staged patient data.
apiVersion: v1
kind: Secret
metadata:
  name: loki-s3-credentials
  namespace: observability
type: Opaque
stringData:
  access-key: REPLACE_LOKI_S3_ACCESS_KEY
  secret-key: REPLACE_LOKI_S3_SECRET_KEY
---
# SMTP for Alertmanager. For Gmail this is an App Password, not the account
# password — 2FA accounts reject the account password with 535 BadCredentials.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: observability
type: Opaque
stringData:
  username: REPLACE_SMTP_USERNAME
  password: REPLACE_SMTP_APP_PASSWORD
---
# Bearer token each edge's Vector presents when pushing logs. One per edge, so
# a leaked token can be revoked for that site alone.
#   Generate:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: edge-dev-loki-token
  namespace: observability
type: Opaque
stringData:
  token: REPLACE_LOKI_PUSH_TOKEN
---
# The same edge S3 identity as above, but on the management side, so the
# SeaweedFS identities document can be assembled without the keys ever
# appearing in a values file or a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: edge-dev-s3
  namespace: seaweedfs
type: Opaque
stringData:
  access-key: REPLACE_EDGE_S3_ACCESS_KEY
  secret-key: REPLACE_EDGE_S3_SECRET_KEY
