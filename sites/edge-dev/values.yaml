# Reviewed 2026-11-10 against this branch. This file retains its existing
# site settings; it is not evidence of a current live deployment. Historical
# measurements without a run date are not verified (2026-11-10).
# This retained configuration selects the deprecated Lua engine. Do not
# copy that choice for a new site; start from the current ingest example.
# The pipeline tool is accessionflow (called xnat-ingest before 0.18.0).
# =============================================================================
# EXAMPLE EDGE SITE — what is LOCAL to one edge
# =============================================================================
# This is the config for ONE edge node: the machine inside a facility that runs
# Orthanc, the de-identification hook, the grouper and assigner, the S3
# uploader, Vector and (optionally) Samba.
#
# There is one of these PER EDGE. Copy it once per site:
#
#   scripts/site-secrets.sh new <edge-name> edge   # copies this directory
#   $EDITOR sites/<edge-name>/values.yaml          # <- everything below
#   $EDITOR sites/<edge-name>/secrets.enc.yaml     # still plaintext
#   scripts/site-secrets.sh encrypt <edge-name>
#
# ...and add a matching entry to `edges:` in the MANAGEMENT site file, then
# re-run install.sh.
#
# HOW HELM SEES THIS FILE. install.sh gives the edge chart TWO values files:
#
#   helm upgrade --install edge charts/edge -n xnat-ingest \
#       -f sites/<management-site>/values.yaml \    <- shared facts, first
#       -f sites/<edge-name>/values.yaml            <- this file, last (wins)
#
# Because the management file comes first, everything shared is already set by
# the time this file is read: the internal domain, the published hostnames, the
# management node's IP, the bucket prefix, the data policy. The S3 endpoint, the
# staging bucket, the Loki endpoint and the hostAliases are DERIVED from those
# and are deliberately absent below.
#
# Every one of those used to be typed here a second time, and every mismatch in
# that group failed silently — the pod started, pointed at a hostname or bucket
# that did not exist, and retried forever. Do not add them back.
#
# You never edit charts/edge/values.yaml. That file holds the defaults and the
# reasoning for them; this file holds only what is true of THIS site.
# =============================================================================

# This edge's own short name. Becomes the `cluster` label on its logs and
# selected metrics, and is the commonName of the client certificate it authenticates to
# the Loki push endpoint with ; so it must match the `edges[].name` entry in
# the management values file, which is what that certificate is issued from and
# what the push Ingress pins the CN to.
clusterLabel: edge-dev

# Select the engine for this retained site configuration. The chart derives
# the stage, labels and reclaim condition from it. New sites use ingest:
# Orthanc receives DICOM and accessionflow performs de-identification.
# The orthanc/Lua engine is deprecated and retained only for existing sites.
deid:
  engine: orthanc

  # THE REVIEW GATE. deid.policyReviewed must be true before the chart renders.
  # Read the selected recipe and source-label mapping first. This flag records
  # operator review; it does not test de-identification quality or guarantee
  # that identifiers in headers, pixels, paths and logs have been removed.
  policyReviewed: true

namespace: xnat-ingest

# onprem uses management host entries for generated names.
# cloud uses real DNS and the configured management ingress or manual
# load-balancer route. Both still use the edge hostPath pipeline volume.
topology: onprem

storage:
  storageClass:
    create: true
    name: hostpath-pipeline
  # Working space for the pipeline: received, grouped, assigned.
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 500Gi
  # FACILITY BACKUP. The DicomProtocol callback writes an original byte copy
  # before the selected de-identification path. Other origins bypass it and
  # callback writes can fail. Verify the actual backup, not just this flag.
  # dataPolicy.originals.facilityBackup governs its retention policy.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 500Gi

orthanc:
  # The AE title THIS Orthanc answers to. Modalities are configured to send here.
  aet: AISEDGE
  auth:
    # On, as in the chart default: the REST API can delete studies.
    # The Secret orthanc-credentials is in secrets.enc.yaml.
    # This is HTTP authentication, not DICOM sender authentication.
    # Restrict the DICOM and HTTP listeners at the network boundary.
    enabled: true
    existingSecret: orthanc-credentials
  deid:
    existingSaltSecret: orthanc-deid-salt

    # DEPRECATED LUA ROUTING ONLY: the map is looked up by called AE title
    # (the key name CallingAET in older prose was misleading). An unmapped
    # instance may be quarantined by that legacy callback; verify the file
    # before a controlled recovery. New ingest sites use ingest.assign tags
    # and recipes, not this map. The map does not authenticate a scanner.
    aetMap:
      AISEDGE:
        project: test_project
      STORESCU:
        project: test_project
      DCMTK_001:
        project: test_project
      AISTEST:
        project: test_project
      UNKNOWN:
        project: test_project

    # Legacy Lua profile only. It applies only with deid.engine=orthanc,
    # which is deprecated. New sites review ingest.deidentify.specs instead.
    profile:
      DeidMode: modify
      Force: true
      RemovePrivateTags: false
      # UIDs are RETAINED so a study stays internally consistent across series;
      # the identity fields are replaced below instead.
      Keep:
        - StudyInstanceUID
        - SeriesInstanceUID
        - SOPInstanceUID
        - FrameOfReferenceUID
      Replace:
        PatientIdentityRemoved: 'YES'
        DeidentificationMethod: AIS-Edge research-default v1; Retain UIDs Option
        PatientName: ANONYMOUS
        # Legacy SubjectHash and SessionHash are salted djb2 hashes, not HMACs.
        # They do not provide cryptographic collision resistance. Changing the
        # legacy salt changes pseudonyms and can split identities across uploads.
        # Preserve the existing salt for a retained legacy installation and use
        # the current ingest recipe/label policy for a new site.
        PatientID: ${ProjectCode}-${SubjectHash}
        PatientBirthDate: ${BirthYearOnly}0101
        AccessionNumber: ${SessionHash}
        StudyID: ${SessionHash}
        ClinicalTrialProtocolID: ${ProjectCode}
        ClinicalTrialSubjectID: ${SubjectHash}
        ClinicalTrialTimePointID: ${SessionHash}
        InstitutionName: AIS
        InstitutionAddress: ''
        ReferringPhysicianName: ''
        PerformingPhysicianName: ''
        OperatorsName: ''
        PatientBirthName: ''
        StationName: ''
        DeviceSerialNumber: ''
        OtherPatientIDs: ''
        RequestingPhysician: ''
        AdmittingDiagnosesDescription: ''
        PatientAddress: ''
        PatientTelephoneNumbers: ''
        PatientComments: ''
        StudyDescription: ''

ingest:
  # The grouper selects eligible quiet studies. The chart uses a ready label
  # only for the deprecated Lua path. Ingest does not require that label.
  # Processed-label and receipt behavior depends on the pinned collator;
  # late instances can make a study eligible again. It is not exactly once.
  orthancGroup:
    enabled: true
    interval: 60
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
  # Builds an XNAT session out of a grouped study.
  assign:
    interval: 60

upload:
  # s3      this edge pushes to the central staging bucket and the MANAGEMENT
  #         uploader moves it into XNAT. The edge holds no XNAT credential and
  #         never contacts XNAT. One XNAT account for the whole fleet.
  # direct  this edge talks to XNAT itself (single-site tier-1 only). Needs the Secret selected by upload.direct.existingSecret here.
  mode: s3
  s3:
    # endpoint and bucket are DERIVED from the management file's domain,
    # hostnames and bucketPrefix. Do not set them here.
    existingSecret: s3-edge-credentials
    # The chart requires a CA bundle for this configured HTTPS S3 endpoint.
    # rclone uses RCLONE_CA_CERT for the custom trust file; an unset variable
    # does not inherently disable TLS verification. cert-sync populates the
    # Secret in this topology. A public-CA deployment must also satisfy the
    # chart validation; do not assume leaving the bundle empty is accepted.
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt

    # mTLS ON THE UPLOAD PATH ; OFF, AND STEP 3 OF A FOUR-STEP ROLLOUT.
    # caBundleSecret above is who we TRUST; this is who we ARE. They are
    # independent: on cloud the server certificate can come from a public CA
    # with appropriate trust; this chart still validates its CA-bundle setting while this one still comes from the fleet CA.
    #
    # Do NOT set this until, on the MANAGEMENT side:
    #   1. seaweedfs.ingress.clientCerts.issue: true, plus the matching
    #      certSync.secrets entry (both are commented out in the management
    #      site file, together, for this reason)
    #   2. kubectl -n xnat-ingest get secret s3-client-tls   answers HERE
    # then set requireClientCert: true here, and only afterwards flip
    # seaweedfs.ingress.clientCerts.require on the management side.
    #
    # CAUTION, both directions: turning this on before the Secret lands leaves
    # the uploader in CreateContainerConfigError (loud, local); flipping the
    # management `require` before this is on can reject uploads; a historical test returned HTTP 400
    # that rclone reports as an S3 XML parse failure ; naming neither
    # certificates nor auth, and reaching the logs as endpoint_failed.
    # requireClientCert: true
    # clientCertSecret: s3-client-tls
    interval: 60

observability:
  enabled: true
  loki:
    # Both Secrets are written by the management side's cert-sync CronJob; you
    # do not create them here.
    #
    # clientCertSecret is this site's mTLS identity for the Loki push endpoint
    # — a cert-manager certificate whose CN is this edge's name. It must match
    # the certSync destination name in the MANAGEMENT site values.
    clientCertSecret: loki-push-client-tls
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt

# dataPolicy is DELIBERATELY ABSENT ; it is set ONCE in the management site
# file, which is passed to this release first, so the whole fleet's retention
# rules are inherited. Later overrides can change the edge behavior, so
# compare the rendered policy on both sides.
#
# Setting it here would silently override the shared policy FOR THIS EDGE ONLY.
# Because the management chart never reads this file, the two would then be
# independent knobs wearing one name: enable the policy centrally and the
# management reclaimer starts freeing staged S3 objects while this edge keeps
# everything.
#
# If one site genuinely needs a different policy from the rest of the fleet,
# set dataPolicy here deliberately and write down why.
