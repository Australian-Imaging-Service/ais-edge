# =============================================================================
# edge-dev — what is LOCAL to this edge
# =============================================================================
# The management site file (sites/stream-2-ab-dev/values.yaml) is passed to
# this release too, and supplies everything shared: the domain, the published
# hostnames, the management node IP, the bucket prefix. So the S3 endpoint,
# the staging bucket, the Loki endpoint and the hostAliases are DERIVED and
# are deliberately absent below — each one used to be typed here a second time,
# and every mismatch in that group failed silently.
#
#   helm upgrade --install edge charts/edge -n xnat-ingest \
#       -f sites/stream-2-ab-dev/values.yaml \
#       -f sites/edge-dev/values.yaml
#
# What remains is genuinely this site's own: which AE titles map to which XNAT
# project, the de-identification profile, and where data lives on this node.
# =============================================================================
clusterLabel: edge-dev
namespace: xnat-ingest
topology: onprem
storage:
  storageClass:
    create: true
    name: hostpath-pipeline
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 500Gi
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 500Gi
orthanc:
  aet: AISEDGE
  auth:
    enabled: false
  deid:
    enabled: true
    policyReviewed: true
    existingSaltSecret: orthanc-deid-salt
    aetMap:
      AISEDGE:
        project: test_project
      STORESCU:
        project: test_project
      DCMTK_001:
        project: test_project
      AISTEST:
        project: test_project
      UNKNOWN:
        project: test_project
    profile:
      DeidMode: modify
      Force: true
      RemovePrivateTags: false
      Keep:
      - StudyInstanceUID
      - SeriesInstanceUID
      - SOPInstanceUID
      - FrameOfReferenceUID
      Replace:
        PatientIdentityRemoved: 'YES'
        DeidentificationMethod: AIS-Edge research-default v1; Retain UIDs Option
        PatientName: ANONYMOUS
        PatientID: ${ProjectCode}-${SubjectHash}
        PatientBirthDate: ${BirthYearOnly}0101
        AccessionNumber: ${SessionHash}
        StudyID: ${SessionHash}
        ClinicalTrialProtocolID: ${ProjectCode}
        ClinicalTrialSubjectID: ${SubjectHash}
        ClinicalTrialTimePointID: ${SessionHash}
        InstitutionName: AIS
        InstitutionAddress: ''
        ReferringPhysicianName: ''
        PerformingPhysicianName: ''
        OperatorsName: ''
        PatientBirthName: ''
        PatientAddress: ''
        PatientTelephoneNumbers: ''
        PatientComments: ''
        StudyDescription: ''
ingest:
  orthancGroup:
    enabled: true
    interval: 60
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
  assign:
    interval: 60
upload:
  mode: s3
  s3:
    existingSecret: s3-edge-credentials
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt
    interval: 60
observability:
  enabled: true
  loki:
    # Both Secrets are written into this namespace by the management side's
    # cert-sync CronJob; neither is created here. clientCertSecret is this
    # site's mTLS identity for the Loki push endpoint and must match the
    # certSync destination in sites/stream-2-ab-dev/values.yaml.
    clientCertSecret: loki-push-client-tls
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt
# dataPolicy is DELIBERATELY ABSENT. It is set once, in the management site file
# (sites/stream-2-ab-dev/values.yaml), which install.sh passes to this release
# BEFORE this file — so the whole policy is inherited and the retention rules
# cannot say one thing on the management node and another here.
#
# It used to be repeated below as `enabled: false / dryRun: true`, duplicating
# the site file exactly. That was not a second setting doing useful work: the
# management chart only ever reads the site file, while this chart reads both
# with this file winning, so the same name silently meant two independent
# knobs. Turning the policy on in the site file alone would have started the
# management reclaimer freeing staged S3 objects while this edge kept
# everything — a half-enabled policy, with nothing to indicate it.
#
# Removing it changes no rendered output (verified: the release renders
# byte-identical with and without it).
#
# A site that genuinely needs a DIFFERENT policy from the rest of the fleet can
# still set dataPolicy here; because this file is passed last it overrides the
# shared value. Do that only when the difference is intended, and say why.
