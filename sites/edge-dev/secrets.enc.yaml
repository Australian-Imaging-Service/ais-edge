# =============================================================================
# edge-dev — secrets that are THIS EDGE'S OWN
# =============================================================================
# loki-push-credentials and ca-bundle are deliberately NOT here: cert-sync
# copies both from the management cluster, so they track CA rotation and the
# fleet's push credential instead of going stale in an encrypted file.
#
# Creating loki-push-credentials here as well was worse than redundant — this
# file wrote the key `token` while charts/edge mounts `password`, so the pod
# would have failed on a key that looked present. One owner per Secret.
# =============================================================================
