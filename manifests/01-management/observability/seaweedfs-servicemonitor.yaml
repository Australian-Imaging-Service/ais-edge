# ServiceMonitor for SeaweedFS's /metrics endpoint.
#
# Lives in observability/ (applied by 02d-install-observability.sh) rather
# than alongside the SeaweedFS workload itself because the ServiceMonitor
# CRD is installed by kube-prometheus-stack, which runs in step 02d AFTER
# SeaweedFS (step 03). Apply order:
#
#   step 03: SeaweedFS Deployment + Service + Service for metrics on :9324
#   step 02d: kube-prometheus-stack (installs ServiceMonitor CRD) + THIS file
#
# Without this object, Prometheus would never scrape SeaweedFS even though
# the metrics Service exists and the chart's release label is in place.
#
# Note on binding: `weed server -metricsPort=9324` listens only on the pod
# IP, not 127.0.0.1. `kubectl port-forward` fails because it tries to dial
# inside the pod's loopback, but Prometheus scrapes via the Service IP
# (cluster routing → pod IP) so scraping works fine.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seaweedfs-metrics
  namespace: seaweedfs
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [seaweedfs]
  selector:
    matchLabels:
      app: seaweedfs
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
