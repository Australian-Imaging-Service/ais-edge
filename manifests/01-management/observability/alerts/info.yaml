# =============================================================================
# Info alerts  —  routine informational events. Slack-only by default;
# do not page or email.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ais-edge-info
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ais-edge-info
      interval: 5m
      rules:
        - alert: CARotationDue
          # Hard-coded threshold: ais-edge-ca is 10y; warn at year 9.
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds{name="ais-edge-ca"}
              - time()) / 86400 < 365
          for: 1h
          labels: { severity: info }
          annotations:
            summary: "Root CA ais-edge-ca expires within 1 year"
            description: "Plan a rotation cycle. Use scripts/rotate-ca.sh --phase=1 to issue a successor and distribute the bundle."

        - alert: CertificateRenewed
          expr: |
            changes(certmanager_certificate_renewal_timestamp_seconds[1h]) > 0
          labels: { severity: info }
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} was renewed"
            description: "cert-manager auto-renewed the certificate. No action required."

        # REMOVED — NewEdgeJoined, `changes(kube_node_info[10m]) > 0`.
        #
        # kube_node_info is a kube-state-metrics JOIN metric whose value is the
        # constant 1; a node joining creates a new SERIES at 1 rather than
        # moving a value, so changes() over it is identically 0. Measured on
        # the live management Prometheus, it never produced a single sample.
        # It is also unreachable in principle here: this Prometheus scrapes the
        # management cluster only, so kube_node_info has one series and it is
        # the management node.
        #
        # It was not replaced. An edge cannot join unattended — a child cluster
        # exists only because someone added an `edges:` entry and ran
        # ./install.sh — so the alert told an operator about their own action.
        #
        # This file is the legacy imperative copy applied by
        # scripts/02d-install-observability.sh. The reasoning in full, and the
        # CI guard that stops the shape coming back, are in
        # charts/mgmt/files/prometheus-rules/info.yaml — keep the two in step.
