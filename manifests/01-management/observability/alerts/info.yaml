# =============================================================================
# Info alerts  —  routine informational events. Slack-only by default;
# do not page or email.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ais-edge-info
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ais-edge-info
      interval: 5m
      rules:
        - alert: NodeCountChanged
          expr: |
            changes(kube_node_info[10m]) > 0
          labels: { severity: info }
          annotations:
            summary: "Node inventory changed on the tier-1 host"
            description: "kube_node_info changed. On a single-node appliance this is unexpected — investigate if unplanned."
