# =============================================================================
# Warning alerts (Prometheus / kube-state-metrics) — notify, don't page.
#
# Pipeline-event warning alerts (SessionUploadStalled, XNATUploadRetryStorm,
# XNATBacklogGrowing, DICOMValidationFailureSpike) live in
# loki-ruler-rules.yaml — those are derived from JSON events in Loki, not
# from any Prometheus metric.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ais-edge-warning
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ais-edge-warning
      interval: 30s
      rules:
        - alert: IngestPodCrashLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"xnat-ingest|xnat-upload"}[1h]) > 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Ingest pod {{ $labels.pod }} crashlooping"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} has restarted >3 times in the last hour. New DICOMs may not be received, staged, or uploaded."
