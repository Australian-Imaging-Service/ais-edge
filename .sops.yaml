# =============================================================================
# SOPS creation rules
# =============================================================================
# Which age recipients can decrypt which files. `sops -e` consults this
# automatically, so nobody has to remember a key id at encrypt time.
#
# WHY age RATHER THAN A CLOUD KMS
#   * Edge sites are on-prem and occasionally air-gapped. A KMS makes install
#     depend on reaching a cloud endpoint at exactly the moment you are
#     standing in a hospital basement.
#   * There is no IAM to provision per site.
#   * A key is one 60-character string that fits in a password manager.
# Move to KMS only if you later need per-operator revocation with an audit
# trail — that is the one thing age genuinely cannot do.
#
# KEY LAYOUT
#   team key   every operator of YOUR deployment can decrypt every site. Keep
#              it in your team password manager.
#   site key   held by that site's admin, so a site can decrypt and install
#              its own secrets without holding the keys to the whole fleet.
# When both are listed as recipients, either can decrypt independently.
# AS SHIPPED, both rules below hold a PLACEHOLDER, not a key. The first
# add-recipient puts your key in its place. Each later add-recipient adds a key
# to BOTH rules, so a key that it adds can decrypt every site. A per-site key
# needs its own path_regex rule, written by hand.
#
# ENCRYPTED VS NOT
#   Only the VALUES are encrypted; keys stay readable (encrypted_regex below).
#   That means `git diff` still shows WHICH secret changed, and a review can
#   see structure without seeing content.
#
# SETUP
#   scripts/site-secrets.sh init-key            create your age key
#   scripts/site-secrets.sh add-recipient <pub> add a key to this file, then
#   sops updatekeys sites/<site>/secrets.enc.yaml  re-encrypt each existing file
#   scripts/site-secrets.sh encrypt <site>      encrypt a NEW (plaintext) file
#   scripts/site-secrets.sh apply <site>        decrypt straight into the cluster
#
# The recipient below is a placeholder. `encrypt` refuses while it is there,
# and sops refuses it as a recipient. A file is readable only by the keys that
# were recipients when it was encrypted or last re-keyed. A new key here does
# not re-encrypt anything: run sops updatekeys on each file. `encrypt` does not
# do it either: it stops on a file that is already encrypted.
# CAUTION: do not commit a real key to this file in the shared repository.
# Each site that is set up from the repository is then encrypted to that key
# too, and the holder of that key can read the secrets of each such site.
# Keep your key in your own copy of this file. CI refuses a real key here.
# =============================================================================

creation_rules:
  # Per-site secrets: readable by every key listed here (as shipped: none).
  # The regex captures the site name so a new site needs no new rule.
  - path_regex: sites/[^/]+/secrets\.enc\.ya?ml$
    encrypted_regex: '^(data|stringData)$'
    age: >-
      REPLACE_WITH_TEAM_AGE_PUBLIC_KEY

  # Anything else that ends up encrypted: the same keys.
  - path_regex: .*\.enc\.ya?ml$
    encrypted_regex: '^(data|stringData)$'
    age: >-
      REPLACE_WITH_TEAM_AGE_PUBLIC_KEY
