# The pipeline tool is accessionflow (called xnat-ingest before 0.18.0).

# Review 2026-11-10: values and consumers checked locally. Historical measured
# incidents below explain retained safeguards; undated measurements are not
# verified (2026-11-10) as current fleet behavior. Image pins are reproducibility
# choices, not claims that every current security advisory has been addressed.
# =============================================================================
# AIS Edge — edge-site chart
# =============================================================================
# One chart, one edge site. On this branch (tier-1) it runs on a plain
# single-node k0s box and uploads straight to XNAT (upload.mode=direct). The
# tier-2 variant, which stages through S3 to a management cluster, is on the
# main branch.
#
# HOW TO READ THIS FILE
#   1. dataPolicy    — what is kept and for how long. Read this first.
#   2. storage       — where the bytes physically land.
#   3. orthanc       - DICOM receiver and optional facility backup.
#   4. ingest        - group -> assign -> deidentify, optional package/file drop.
#   5. upload        — how sessions reach XNAT (via S3, or directly).
#   6. samba         — optional SMB drop-box.
#   7. observability — optional log shipping to the management cluster.
#
# CREDENTIALS ARE NOT IN THIS FILE, BY DESIGN.
# Every credential is referenced by Secret name only. Nothing here is secret,
# so this file is safe to commit per-site. Secrets are created separately
# (SOPS-encrypted under sites/<site>/secrets.enc.yaml) and referenced by the
# existingSecret keys below. Never add a password, key or salt to this file.
# =============================================================================

namespace: xnat-ingest

# Resource names are prefixed with the Helm release name. Override only if you
# need two independent installs to coexist in one cluster.
nameOverride: ""
fullnameOverride: ""

# onprem | cloud
# Replaces the old {{#ONPREM_ONLY}} awk-stripping in scripts/00-common.sh.
# onprem pins management hostnames via hostAliases; cloud resolves them via
# real DNS and skips the aliases entirely.
topology: onprem

# =============================================================================
# DE-IDENTIFICATION ENGINE — ONE SWITCH, and everything else follows from it
# =============================================================================
# GUIDING: set this and nothing else about de-identification wiring.
#
#   orthanc   the Orthanc Lua hook strips each instance as it ARRIVES, and also
#             writes the ClinicalTrial* routing tags from the AE-title map and
#             applies the label group-orthanc filters on. Everything downstream
#             follows that profile; this is not a guarantee that pixels,
#             private tags or routing labels are anonymous. No crosswalk is kept.
#
#   ingest    the accessionflow `deidentify` stage runs between assign and upload.
#             Writes a per-session re-identification map for supported changed
#             fields. This is not a full backup or a guarantee of byte-for-byte
#             reversal of every transformation; retain source data as required. Costs: identifiable data passes through Orthanc,
#             group and assign before it is cleaned, there is no AE-title
#             routing, and ingest.assign.tagMapping must name tags this site's
#             modalities actually populate.
#
#   none      neither. Only for sites whose modalities de-identify upstream.
#             Requires deid.policyReviewed=true to acknowledge it.
#
# WHY THIS IS ONE KEY. It used to be two booleans plus a label plus a tag
# mapping plus a reclaim word, all of which had to agree. They did not have to
# agree at RENDER time, only at RUN time, so a half-switched site came up clean
# and then failed silently. Measured on a live edge: 531 instances filed under
# assigned/__invalid__ with PHI intact and the stage reporting "Found 0
# sessions" for ever, because one of the five was still on its old value.
deid:
  # Use ingest for new sites. Orthanc receives and stores original DICOM.
  # With facility backup enabled, its Lua callback copies the original and
  # returns before AET routing. There is no unknown-AET quarantine in this mode.
  # accessionflow label xnat selects labels before the deidentify recipe runs.
  # Review both the source labels and the recipe before enabling upload.
  #
  # deid.engine: orthanc is deprecated. Its reference is in
  # docs/components/deidentification.md, "Deprecated Orthanc Lua engine".
  # Keep this default; do not change engines to work around missing source tags.

  engine: ingest             # ingest | orthanc | none

  # The chart refuses to render until a person reviews the selected policy.
  # Under ingest, review ingest.assign.tagMapping and ingest.deidentify.specs.
  # A recipe cannot change labels already taken from source tags by assign.
  # Review retained private fields, dates, sex/age and reid-map protection too.
  # The gate also applies to an explicit no-deid configuration.

  policyReviewed: false

# =============================================================================
# THE MANAGEMENT SITE FILE SUPPLIES THESE — you do not normally set them here
# =============================================================================
# GUIDING: pass both values files to the edge release —
#   helm upgrade --install edge charts/edge \
#       -f sites/<mgmt>/values.yaml -f sites/<edge>/values.yaml
# S3 endpoint, staging bucket, Loki endpoint and hostAliases derive from the
# mgmt file (see _helpers.tpl). CAUTION: setting any of these here still
# wins, but now must be kept in step with mgmt by hand — every mismatch here
# fails silently (uploader retries forever; mgmt sees an absence it is not
# watching for).
domain:
  internal: ""
  mgmtNodeIP: ""
hostnames:
  seaweedfs: ""
  grafana: ""
  loki: ""
# Site identity on Vector log streams; not automatically attached to all metrics. It is
# what Grafana's `cluster` variable filters on, so it must be unique per site.
clusterLabel: ""


# =============================================================================
# 1. dataPolicy — THE one place that decides what is kept, where, how long
# =============================================================================
# originals: irreplaceable, removed here means gone for good — defaults to
# forever. Review the site retention policy before changing it; low disk is not
# a proof that data is disposable. Derived output is reconstructible only while
# its source and transformation inputs remain available and verified.
#
# CAUTION: every derived rule is (condition AND minAge), both required. A
# pure age rule would delete a session that never reached XNAT because a
# credential was wrong; a pure condition rule frees nothing the moment the
# confirmation signal breaks. Worst case with both: disk fills and you get an
# alert. These controls reduce risk; they do not establish end-to-end archival
# completeness or protect against every storage, source-cleanup or operator error.
#
# Same block passed to charts/mgmt — one copy in sites/<site>/values.yaml,
# each chart acts only on the stores it owns.
dataPolicy:

  # Master switch for policy-driven reclaim, not all source cleanup. Upstream
  # label/deidentify/package options can unlink their input after success even
  # while this is false. Review those handoffs and original-copy coverage too.
  # Arm retention only after dryRun decisions match the site policy and evidence.
  enabled: false

  # Log every reclaim decision and then do nothing. Leave true until the log
  # matches what you expect.
  dryRun: true

  # The engine that ENFORCES everything below. Without it the rules are only
  # declarations — which is how most of this block came to be unimplemented.
  #
  # It runs as its own DaemonSet attached to the VOLUMES, never as a sidecar on
  # Orthanc: retention is a storage concern, and hanging it off the
  # de-identifier means swapping that component silently ends edge disk
  # monitoring. It reports by default and can reclaim permitted stages when
  # enabled, dryRun and originals.allowExpiry allow the relevant operation.
  #
  # reporter.enabled: false removes this reporter/enforcer pod, so its policy
  # actions stop too; independent staged reclaimers are configured separately.
  # Log-derived alerts cannot evaluate fresh disk facts from
  # data nobody is measuring, so turning this off makes minFreeDiskPercent and
  # quarantine.alertAfter inert.
  reporter:
    enabled: true
    interval: 300              # seconds between passes
    # Blast-radius cap per stage per pass, and how long a tree must be quiet
    # before it is considered complete. Both mirror the S3 reclaimer's design.
    maxRemovals: 50
    settleMinutes: 5

    # WHEN TO CALL A SESSION STUCK.
    #
    # A session whose reclaim condition never comes true is kept, correctly and
    # for ever, and every pass logs the same reclaim_kept line. That drip is
    # indistinguishable from normal operation, so a permanently stuck session
    # looks exactly like a healthy one that was uploaded a minute ago.
    #
    # Past this age the engine raises stage_stuck instead, which an alert keys
    # on. NOTHING IS MOVED OR DELETED: the data stays exactly where it is, and
    # this only changes which event is emitted. Set 0 to disable.
    #
    # WHY IT ONLY REPORTS. Quarantining a stuck session means moving the input
    # AND removing the partial output as ONE action. Doing only the first leaves
    # an orphaned partial output with nothing left to repair it from, and the
    # upload stage would then collect it. This engine can do the first half, so
    # it does neither. (Its /data mount is also read-only unless retention is
    # armed, which would make a move work in one mode and silently not in the
    # other, but the two-operations argument holds regardless of the mount.)
    #
    # WHAT IT CANNOT SEE. The age measured is the newest mtime in the tree, so
    # this detects a stage that has gone QUIET without progressing. A session
    # being rewritten on every cycle never accumulates age and is invisible to
    # it. That case is confined to the deidentified stage running an accessionflow
    # without the metadata write-if-changed fix, where the output's
    # __METADATA__.json was rewritten every pass; with that fix the tree goes
    # quiet and this sees it.
    stuckAfter: 24h

    # WHEN A STAGE ITSELF HAS BEEN SITTING TOO LONG.
    #
    # stuckAfter above is per SESSION and fires only on one whose reclaim
    # condition keeps failing. A stage whose reclaim is `never` returns before
    # that check is reached, so nothing there can ever be reported by it -- and
    # `never` can be selected for the deidentified tree, which is the one that
    # grows when de-identification moves into the pipeline.
    #
    # This is the coarser question the engine can always answer from
    # stage_report: has the oldest entry in this stage been here longer than it
    # should be. It needs no per-session state and no reclaim condition.
    # Set 0 to disable.
    stageAgeAlertAfter: 7d
    image:
      # Needs df, find, stat, date, awk AND curl. busybox has the first five but
      # no curl, and its wget cannot issue the DELETE the orthanc-rest backend
      # requires. curlimages/curl is alpine-based, so it still provides the
      # busybox coreutils the filesystem backend uses.
      repository: curlimages/curl
      tag: "8.11.1"
      pullPolicy: IfNotPresent
    # 10001 matches Orthanc's, which owns the pipeline tree. The mounts are
    # read-only by default; armed retention changes the relevant mounts to
    # writable. Matching UID/GID is needed for both reads and permitted cleanup.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
    resources:
      # 5m = cgroup cpu.weight 1: yields to Burstable pods, NOT to BestEffort ones.
      requests: {cpu: 5m, memory: 16Mi}
      # NO CPU LIMIT, on purpose. A sweep is a sub-second burst of pipelines
      # (find | stat | sort | md5sum) that briefly wants more than one core.
      # Any CFS quota throttles most of the few periods it runs in (61% at
      # cpu: 1, 0.0014 cores average, stream-2-ab-dev 2026-09-30), and
      # CPUThrottlingHigh flapped on it. No quota: no throttling, no series.
      # CPU is bounded by the script running one pipeline at a time, and by
      # the interval floor (edge.validate, templates/_helpers.tpl).
      # CAUTION: re-adding limits.cpu brings the CPUThrottlingHigh mails back,
      # and scripts/ci/runtime-templates.sh fails on it. A site that must cap
      # CPU (namespace policy) needs the reporter excluded from that rule
      # again, as #26 did: make it a decision, not an accident.
      # CAUTION: parallelism in data-policy.sh (&, xargs -P) is uncapped.
      limits: {memory: 64Mi}

  # ---------------------------------------------------------------------
  # ORIGINALS
  # ---------------------------------------------------------------------
  originals:

    # THE THIRD SWITCH. Originals may be the only retained source copy, so expiring
    # them needs its own deliberate act on top of enabled + dryRun. While this
    # is false the engine skips every `kind: original` stage AND the chart
    # mounts that backup read-only in the reporter. This protects that mount,
    # not every pod or host process and not upstream stage source cleanup.
    #
    # Turn it on only against a records-retention obligation, never to free
    # disk — minFreeDiskPercent exists to tell you about disk.
    allowExpiry: false

    # Identifiable DICOM exactly as it arrived off the wire. The Orthanc Lua
    # DicomProtocol-only callback writes this before de-identification. Under
    # ingest, a failed backup does not stop later grouping, and REST/file drops
    # do not enter this callback archive. Verify archival coverage explicitly.
    facilityBackup:
      enabled: true
      # WHERE THIS STAGE LIVES, as seen inside the pods. Every location below
      # already matches this chart's own volume mounts, so a fresh install
      # needs no edit — change one only if you move a mount or swap the
      # component that writes it.
      #
      # These exist so the policy engine needs no knowledge of Orthanc or
      # accessionflow: it walks declared paths. Replace the de-identifier (or
      # the ingest path) and the retention rules keep working — point the
      # location at the new store instead of rewriting a reclaimer.
      location: /facility-backup
      # forever | 30d | 90d | 7y
      #
      # WHAT A DURATION ACTUALLY DELETES — read this before setting one.
      #
      # The unit is the TOP-LEVEL ENTRY under location, which here is one
      # PATIENT (the tree is <PatientID>/<StudyUID>/<SeriesUID>/<SOPUID>.dcm), and the age
      # used is the NEWEST file anywhere beneath it. So `retain: 30d` means:
      #
      #   A patient directory whose most recent file is older than 30 days is
      #   deleted ENTIRELY.
      #
      # Both halves of that matter:
      #   * a patient with ANY recent activity is fully protected, even if some
      #     of their studies are years old — the newest file wins, deliberately;
      #   * when a patient DOES expire, everything under them goes, including
      #     studies far older than the window. It is not per-study expiry.
      #
      # Needs dataPolicy.originals.allowExpiry as well; until that is true the
      # facility-backup volume is mounted read-only and nothing can be removed.
      retain: forever
      # Warn only. This never triggers a deletion — running low on disk is an
      # operational problem, not a licence to discard originals.
      minFreeDiskPercent: 10

    # A retained legacy quarantine can contain original data. Ingest does not
    # create unknown-AET entries. Keep existing contents until an operator has
    # resolved them; see the single deprecated-engine reference for old sites.
    # This subtree is reported separately and defaults to indefinite retention.

    quarantine:
      # RELATIVE to facilityBackup.location, deliberately — the quarantine is
      # a subtree of the archive, so one absolute path would let the two drift
      # and the alert would then name a directory nothing writes to.
      subPath: __unmapped_aet__
      retain: forever
      alertAfter: 24h

    # Operator file drops. Only exists when ingest.fileDrop.enabled is true.
    # This path has no automatic Orthanc copy or facility backup. External
    # source retention and later pipeline copies must be verified separately.
    fileDrop:
      # Root of ingest.fileDrop.inputGlob. Only read when that path is enabled.
      location: /data/incoming
      # never       keep every drop (the default).
      # onIngested  reserved. Nothing implements it yet: the engine keeps the
      #             drops and logs expiry_kept. With the policy on, the chart
      #             refuses any word but never while the file drop is enabled.
      reclaim: never             # never | onIngested
      # Reserved with onIngested. Under `never` the engine does not read it: a
      # drop is never expired by this age alone.
      minAge: 30d

  # ---------------------------------------------------------------------
  # DERIVED
  # ---------------------------------------------------------------------
  derived:

    # Receiver copy held until group-orthanc has exported it. Under ingest
    # this is original, identifiable DICOM. onGrouped keys off the processed label that group-orthanc already
    # applies, so this needs no new signal.
    # CAUTION: needs an accessionflow that writes the export snapshot label
    # (upstream #211, merged 2026-10-28, in no upstream release up to v0.17.1).
    # The default upstream image, accessionflow 0.20.0, writes it
    # (sources/orthanc/staging.py:156-167). With an older
    # image this backend keeps every study and logs export_state_unknown.
    orthancStorage:
      # = Orthanc's StorageDirectory. Used for REPORTING disk usage; reclaim
      # goes through the backend below, because Orthanc names files by UUID and
      # a directory walk cannot map them back to sessions.
      location: /data/orthanc-storage
      # HOW this stage is reclaimed. filesystem walks the location; orthanc-rest
      # asks Orthanc for studies carrying ingest.orthancGroup.processedLabel and
      # deletes them through its API. Replacing the de-identifier means changing
      # this word (or pointing location at the new store), not rewriting the
      # engine.
      # orthanc-rest deletes a study only when its export is proven: the
      # processed label is present, LastUpdate is unchanged since the first
      # read, and the one snapshot label group-orthanc wrote
      # (<processedLabel>-<LastUpdate>-<digest>) names that LastUpdate and the
      # digest of the instance list read now. Then exactly that list is
      # deleted. Anything else is kept and logged as reclaim_kept with reason
      # export_state_unknown: a series that arrived late, a study staged by an
      # accessionflow that writes no snapshot label, an unreadable reply.
      backend: orthanc-rest      # filesystem | orthanc-rest
      reclaim: onGrouped         # never | onGrouped
      minAge: 7d
      # Orthanc's own recycler, independent of the rules above. 0 disables
      # it. Leave it off to avoid an independent receiver-storage recycler;
      # stage --unlink-source cleanup is still separate from dataPolicy.
      maximumStorageSizeMB: 0
      maximumPatientCount: 0

    # Hardlinks into Orthanc storage; reclaiming one leaves the bytes intact
    # while any other link survives.
    # The chart wrapper runs one label-xnat pass per cycle, under the writer
    # lock; it does not invoke a nested --loop. Retained input can be revisited
    # on subsequent passes. onAssigned enables CLI source cleanup after success;
    # do not infer deduplication solely from a retained directory or marker.
    grouped:
      location: /data/grouped
      # No minAge is accepted here: onAssigned enables the label stage's
      # --unlink-source all after a successful save. Already-invalid skips
      # bypass that cleanup, and crashes can leave grouped input behind.
      # The policy engine does not currently recover normal grouped orphans:
      # condition_met in charts/edge/files/data-policy.sh checks the unchanged
      # grouped basename (_.<uid>) against assigned/ and upload markers named
      # <project>.<subject>.<session>. Those names do not match in this chart.
      # A retained grouped copy may contain late data; do not remove it merely
      # because an assigned session or marker has the same study UID. Inspect
      # the files and use docs/recovering-invalid-sessions.md for invalid input.
      # Other hardlinks or originals may already be gone, so retention here
      # is not proof of an independent backup. The reporter still counts these
      # entries; StageBacklogAgeing uses dataPolicy.reporter.stageAgeAlertAfter.
      # Inspect retained orphans before removal. minAge is rejected at render.
      reclaim: onAssigned        # never | onAssigned (label-stage source cleanup)

    # Output of assign; input to deidentify under the default ingest engine.
    assigned:
      location: /data/assigned
      # never | onUploaded | onDeidentified
      #
      # onUploaded    the staged-reclaimer proves the terminal tree against
      #               XNAT before deletion; an upload log/marker is insufficient. Correct when the
      #               uploader READS this tree, i.e. de-identification is done in
      #               Orthanc.
      # onDeidentified  the deidentify STAGE removes each session itself, as soon
      #               as it has written a complete de-identified copy. Only
      #               meaningful with deid.engine set to ingest.
      #
      # WHY onUploaded IS NOT ENOUGH UNDER ais-deid. The uploader then reads
      # /data/deidentified, so its markers describe THAT tree. Nothing ever
      # satisfies onUploaded for /data/assigned and the assigned copy of every
      # session accumulates. onDeidentified is the handoff condition for that
      # case: this tree's consumer is the deidentify stage, so the stage is what
      # retires it.
      reclaim: auto
      # As above: a recovery window after upload, not a delay before it.
      # Ignored under onDeidentified — the stage deletes at handoff, so there is
      # no window to measure. The chart refuses the combination rather than
      # letting a configured window be silently discarded.
      # CAUTION: under direct upload the stagedReclaimer CronJob below applies
      # it (the longer of this and its own minAge); data-policy hands it over.
      minAge: 0


    # With --unlink-source all, label and deidentify in 0.18.0+ retire every
    # path in the input snapshot after success, including unprocessed files.
    # Do not place files in staging session folders by hand. The separate
    # facility backup follows the site retention policy; these stages do not
    # verify it before they unlink input.
    #
    # Where the accessionflow deidentify stage writes, and what `upload` reads when
    # deid.engine is ingest. Rendered only under that engine.
    #
    # WHY: without a row this tree is invisible to the engine, so it is absent
    # from stage_report and therefore from EdgeDiskLow, the only disk-exhaustion
    # alert on this tier. It is the tree that grows once de-identification is on,
    # so it was exactly the one the disk alert could not see.
    #
    # With dataPolicy disabled, that engine reports without deleting. This
    # stagedReclaimer block configures a separate proof-based cleanup job.
    # The deidentified stage's auto condition resolves to onUploaded, or to
    # onPackaged when packaging is enabled; no uploader marker is required.
    stagedReclaimer:
      # Hourly. This job performs the configured direct-upload terminal reclaim.
      # The shipped store command does not unlink its input. Other customized
      # cleanup paths still need separate review; this is not a global fence.
      schedule: "17 * * * *"
      # Minimum retention is a recovery and capacity decision. XNAT proof is
      # required, but a successful check does not remove every concurrent-write
      # or source-completeness risk. Check actual session and reclaim timing.
      # GUIDING: the CronJob waits for the LONGER of this and the minAge of the
      # tree it reclaims (assigned or deidentified, by deid engine). Set the
      # recovery window there; it is logged as the deciding key when it wins.
      # The age counts from when the newest file reached the tree (its ctime),
      # not from the file's own mtime, which a hard link keeps from Orthanc.
      minAge: 1d
      # Ask XNAT for each local file (a HEAD: present, same size) before deleting
      # the only remaining copy.
      # CAUTION: `false` makes the CronJob remove NOTHING. It deletes only what
      # XNAT proves, file by file.
      verifyAgainstXnat: true
      # Ceiling per run. A bug that decides everything is reclaimable removes
      # this many and stops, leaving the rest to inspect.
      maxRemovals: 50
      # Killed if a run hangs on an unreachable XNAT, before the next is due.
      deadlineSeconds: 3000
      # ReclaimerNotSucceeding fires after this long with no successful run,
      # whatever the cause: failed, killed at the deadline, crashed, not started.
      # Default: one failed run never fires it. Two failed runs, then a third not
      # succeeding within 15m, do: about 3h15m after the last success.
      # CAUTION: must exceed 2 x the schedule period + deadlineSeconds, or one bad
      # run fires it. Raise it when you slow the schedule.
      # The chart refuses less (reading the period from the usual schedule
      # forms; others are checked against deadlineSeconds only), and forever/never.
      alertAfter: 3h
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
    deidentified:
      # No `location` key on purpose. The path is DERIVED from
      # edge.uploadSourceDir, the same helper upload.yaml uses for its argument,
      # so the stage and the uploader cannot end up pointed at different trees.
      # Restating it here would also declare a path that does not exist in a
      # render with de-identification off.
      # never | onUploaded | onPackaged
      #
      # auto resolves to onPackaged when ingest.package renders: the package
      # stage then reads this tree and removes each session itself once it has
      # written the packaged copy, so the uploader's markers describe
      # /data/packaged, not this tree. Otherwise onUploaded.
      reclaim: auto
      # The recovery window after upload. Under direct upload the stagedReclaimer
      # CronJob applies it (the longer of this and its own minAge). Not used
      # when reclaim resolves to onPackaged: the package stage retires the tree.
      minAge: 0
    # Where the package stage writes, and what `upload` reads when
    # ingest.package renders. Rendered as a stage only then.
    packaged:
      # No `location` key, for the same reason as `deidentified` above: the
      # path is derived from edge.uploadSourceDir.
      reclaim: auto             # never | onUploaded  (auto = onUploaded)
      # The recovery window after upload, as for `deidentified` above. Under
      # direct upload the stagedReclaimer CronJob applies it.
      minAge: 0
    # Central S3 staging prefix. Owned by charts/mgmt (it lives in SeaweedFS,
    # not on this node) but configured here so a site has ONE data policy.
    #
    # NOTE: onXnatConfirmed is not something accessionflow does for us; it has
    # no S3 retention at all, which is why staged sessions accumulate and are
    # re-listed every loop. charts/mgmt implements the reclaimer.
    s3Staged:
      reclaim: onXnatConfirmed   # never | onXnatConfirmed
      minAge: 1d
      # Re-query XNAT for the session before removing the staged copy rather
      # than trusting the uploader's exit code. Slower, and correct.
      verifyAgainstXnat: true

  # ---------------------------------------------------------------------
  # TELEMETRY - session labels and messages can contain identifying data.
  # Set retention and access according to the site logging policy and disk needs.
  # ---------------------------------------------------------------------
  telemetry:
    # LOKI AND PROMETHEUS RETENTION ARE NOT SET HERE. They live in their own
    # subchart values, because Helm cannot template a subchart's values from
    # this file and install.sh deliberately uses no --set. Declaring them here
    # too produced two keys that read exactly like policy and did nothing —
    # an operator could edit them, see a clean install, and keep the old
    # retention indefinitely with nothing to say so.
    #
    # TO CHANGE RETENTION, EDIT THESE INSTEAD (in sites/<site>/values.yaml):
    #
    #   Prometheus:                       Loki:
    #     kube-prometheus-stack:            loki:
    #       prometheus:                       loki:
    #         prometheusSpec:                   limits_config:
    #           retention: 15d                    retention_period: 30d
    #
    # Setting loki/prometheus under telemetry is rejected at render, so the
    # mistake cannot be silent again.
    #
    # podLogFiles is implemented as kubelet size/count rotation at worker join.
    # It is not a time-based retention promise, and changing values alone does
    # not reconfigure an existing worker. Inspect its effective kubelet config.
    # ON-NODE POD LOG ROTATION, enforced by the kubelet on each edge worker.
    #
    # NOT a duration, and that is the kubelet's constraint rather than a choice.
    # It rotates container logs by SIZE and COUNT (containerLogMaxSize /
    # containerLogMaxFiles) and has no time-based retention at all — there is no
    # "delete logs older than N days" setting to wire a duration to.
    #
    # This key used to read `retain: 14d`, which nothing implemented and nothing
    # could: it promised a time window the kubelet cannot express. Stating the
    # bound the kubelet actually enforces is the honest version — total on-disk
    # nominal rotated-log budget is maxSize x maxFiles, so 10Mi x 5 = 50Mi.
    # Rotation is asynchronous; this is not a strict instantaneous disk quota.
    #
    # Applied by scripts/06-join-edge-worker.sh via --kubelet-extra-args when the
    # worker is installed. CAUTION: it is a JOIN-TIME setting, so changing it
    # affects workers joined afterwards; an existing node needs its k0s worker
    # service reinstalled to pick it up.
    #
    # THAT NO-OP IS CHECKED, not merely documented. `make verify-live` compares
    # this against each node's running kubelet config and FAILS on a mismatch.
    podLogFiles: {maxSize: 10Mi, maxFiles: 5}


# =============================================================================
# 2. storage
# =============================================================================
storage:
  storageClass:
    # false on k0smotron child clusters and anywhere a provisioner already
    # exists. StorageClass is cluster-scoped, so two releases both creating
    # it in one cluster will collide.
    create: true
    name: hostpath-pipeline

  # The working volume: orthanc-storage/, grouped/, assigned/, incoming/,
  # LOGS/, tmp/. All stages MUST share one filesystem or hardlink_or_copy
  # silently degrades to a full copy (cross-device link -> EXDEV).
  pipeline:
    hostPath: /data/xnat-ingest
    capacity: 1500Gi

  # The archive of record, deliberately a SEPARATE volume from the pipeline
  # one, with separate retention. Separate hostPath directories can still share
  # one filesystem and fill together; independent failure capacity requires
  # distinct backing storage, verified by the site operator.
  facilityBackup:
    enabled: true
    hostPath: /data/facility-backup
    capacity: 2000Gi

  # Both volumes are created with Retain + helm.sh/resource-policy: keep, so
  # `helm uninstall` cannot remove received DICOM. Removing the data is a
  # separate, deliberate operation.
  reclaimPolicy: Retain


# =============================================================================
# 3. orthanc — DICOM receiver + de-identification
# =============================================================================
orthanc:
  image:
    repository: jodogne/orthanc-plugins
    tag: "1.12.11"
    pullPolicy: IfNotPresent

  aet: AISEDGE
  dicomPort: 4242
  httpPort: 8042

  # Seconds of silence before OnStableStudy fires. If the Lua script is
  # loaded, this callback can apply the ready label and clear a processed
  # label under ingest too. The chart clears the ingest group's ready-label
  # filter, so that pipeline does not wait for this label. A ready label
  # alone does not prove that the ingest recipe has run.
  stableAge: 30

  # hostPort  — bind 4242 on the node IP. Standard DICOM port; modalities are
  #             painful to repoint, so this is the default. Pins the pod to
  #             one node, which is fine for a single-node edge.
  # nodePort  — expose via NodePort instead.
  # both      — both, for a migration window.
  expose:
    dicom: hostPort
    nodePorts:
      dicom: 30042
      http: 30842
    # Intended REST exposure. The current shared Service becomes NodePort if
    # DICOM uses nodePort/both, exposing its HTTP port too. Check the rendered
    # Service rather than relying on this value alone; keep authentication on.
    http: ClusterIP

  auth:
    # Orthanc's REST API can delete studies. Our old config ran with
    # AuthenticationEnabled: false and was protected only by the accident of
    # being ClusterIP-only.
    enabled: true
    #
    # THREE keys, not two. The Secret is consumed by three different things:
    #
    #   users.json        mounted INTO the Orthanc configuration directory, at
    #                     /etc/orthanc/users.json. It is not a credentials file
    #                     in a format of our own: it is an Orthanc CONFIG
    #                     FRAGMENT, and must be exactly
    #                       {"RegisteredUsers":{"admin":"<password>"}}
    #                     Orthanc scans /etc/orthanc and merges every .json it
    #                     finds, which is how these users reach it. Its own
    #                     startup log names both files:
    #                       Reading the configuration from: /etc/orthanc/orthanc.json
    #                       Reading the configuration from: /etc/orthanc/users.json
    #                     The password is PLAINTEXT inside that JSON, which is
    #                     why this Secret belongs in secrets.enc.yaml and is
    #                     SOPS-encrypted at rest.
    #   orthanc-user      read by group-orthanc, which lists and labels studies,
    #   orthanc-password  and by the data-policy engine, which reclaims the
    #                     Orthanc store over the same REST API whenever
    #                     dataPolicy.derived.orthancStorage.backend is
    #                     orthanc-rest. Both take them from HERE, so the two
    #                     cannot present different credentials to one Orthanc.
    #                     If they do not match the user in users.json, Orthanc
    #                     answers 401: group-orthanc crash-loops, and the store
    #                     reclaim finds nothing to do.
    #
    # THERE IS NO "RegisteredUsersFile" OPTION IN ORTHANC, and an earlier version
    # of this comment said there was. The config carried that key, Orthanc
    # ignored it silently, registered NO users, and with AuthenticationEnabled
    # true refused EVERY request including correct credentials. It was never a
    # mounting problem and no path would have fixed it. MEASURED on
    # jodogne/orthanc-plugins:1.12.11, two containers identical but for the
    # mechanism:
    #     RegisteredUsersFile:          authenticated=401 anonymous=401
    #     users.json in the config dir: authenticated=200 anonymous=401
    # If you are reading this because you saw a 401, check that users.json is
    # mounted inside /etc/orthanc and that its password equals orthanc-password.
    existingSecret: orthanc-credentials

  # Rewriting pixel data at receive time happens BEFORE the Lua hook runs, so
  # the facility backup would hold the transcoded copy rather than the wire
  # original. Leave empty whenever deid + facilityBackup are on.
  ingestTranscoding: ""
  dicomScuTimeout: 60

  plugins:
    - /usr/local/share/orthanc/plugins/libOrthancExplorer2.so
    - /usr/local/share/orthanc/plugins/libStoneWebViewer.so
    - /usr/local/share/orthanc/plugins/libOrthancDicomWeb.so
    - /usr/local/share/orthanc/plugins/libOrthancGdcm.so

  # ---------------------------------------------------------------------
  # Legacy engine settings remain for compatibility. Under ingest only the
  # named salt Secret is needed when the facility-backup script is loaded.
  # Its value does not affect ingest output. Set the placeholder once with
  # openssl rand -hex 32; install and verify checks reject the placeholder.
  # See docs/components/deidentification.md for the deprecated engine details.
  # ---------------------------------------------------------------------
  deid:
    existingSaltSecret: orthanc-deid-salt   # key: AIS_DEID_HMAC_SALT
    # Inactive for routing under ingest; select XNAT labels in ingest.assign.
    aetMap: {}
    # Inactive for header changes under ingest; use ingest.deidentify.specs.
    profile: {}

  podSecurityContext:
    fsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  securityContext:
    capabilities:
      drop: [ALL]
    allowPrivilegeEscalation: false
  resources:
    requests: {memory: 512Mi, cpu: 200m}
    limits:   {memory: 2Gi,   cpu: "1"}
  probes:
    liveness:  {initialDelaySeconds: 30, periodSeconds: 10}
    readiness: {initialDelaySeconds: 15, periodSeconds: 5}


# =============================================================================
# 4. ingest — group -> assign
# =============================================================================
ingest:
  image:
    # accessionflow, the tool called xnat-ingest before 0.18.0. This upstream
    # release replaces the fork build 0.16.2.post1. Validate each required fix;
    # its version number alone does not prove behavioral equivalence.
    # CAUTION: 0.18.0 renamed group-orthanc to collate-orthanc, group to
    # collate, assign to label xnat, and XINGEST_* variables to ACFLOW_*.
    # Version 0.19.0 renamed upload to store. Version 0.20.0 made collate a
    # group: collate orthanc and collate folder, with no aliases for the old
    # names (upstream MIGRATING.md). The templates follow this version:
    # move the tag only together with them.
    repository: ghcr.io/australian-imaging-service/accessionflow
    tag: "0.20.0"
    pullPolicy: IfNotPresent

  # One JSON object per log line. The alert rules and dashboards parse these
  # fields directly; turning this off breaks monitoring, not just formatting.
  logFormat: json

  # Extra Python packages, as pip requirement specs, for the pods that load
  # packaged sessions: package, and the direct-mode upload. Use it for
  # fileformats types the image does not ship, such as package's dicom-sample
  # output and DicomSeries archive converters, which live in
  # fileformats-vendor-australianimagingservice (+ -extras). Pin a vendor
  # revision that provides both DicomSeries converters. Upload needs the type
  # as well because packaged manifests name it, and loading a session resolves
  # every manifest's type.
  #
  # An init container pip-installs them (--no-deps, so they must need only what
  # the image already has) into an emptyDir on PYTHONPATH. fileformats is a
  # namespace package, so they merge with the image's copy.
  #
  # CAUTION: the install runs on EVERY pod start, so the edge must reach the
  # index or git host each time; if it can't, the pod stays in Init. Pin git
  # refs to a commit, not a branch, or a restart can pick up different code.
  #
  #   extraPipPackages:
  #     - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2"
  #     - "git+https://github.com/Australian-Imaging-Service/fileformats-vendor-australianimagingservice.git@v0.1.2#subdirectory=extras"
  extraPipPackages: []
  # Per-stage Kubernetes CPU/memory requests and limits. MEASURED DEFAULTS
  # (2026-11-10, accessionflow 0.19.0, 4 vCPU edge, one study of 12,098
  # instances): docs/components/accessionflow.md, Ingest stage CPU and memory.
  # A site key replaces only that key (Helm merges maps). null removes one key;
  # `resources: null` removes them all.
  # NO CPU LIMIT, on purpose: a CPU limit throttles the stage. The request is
  # its share of the CPU when the node is busy.

  # Pull labelled studies out of Orthanc and group them into sessions.
  orthancGroup:
    # Memory grows with the instances of a study: the files are hard-linked
    # from Orthanc's storage, not read. Measured: 201 MiB for 12,098.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
    enabled: true
    interval: 60
    # The configured ready label for the Lua stable-study callback. Under
    # ingest the chart clears the effective group filter even though the
    # loaded script can still apply this label. It is not a de-identification
    # receipt. See docs/components/deidentification.md, "The label coupling".
    toProcessLabel: xnat-ingest-ready
    processedLabel: xnat-ingest-processed
    waitPeriod: 60
    copyMode: hardlink_or_copy

  # Second ingest path: a watched directory instead of a DICOM modality.
  # OFF by default — see dataPolicy.originals.fileDrop for why this path
  # deserves more care than the Orthanc one.
  fileDrop:
    # Memory grows with ALL the files of one pass: it reads every header first.
    # Measured: 340 MiB for 12,098 files.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
    enabled: false
    interval: 300
    # Files in subfolders are read too: group runs with --recursive.
    inputGlob: "/data/incoming/**/*"
    waitPeriod: 60
    datatypes: "medimage/dicom-series"
    copyMode: hardlink_or_copy

  # Select project, subject and session from supported source tags.
  # AET routing is not used under ingest. constantProjectId can supply one
  # destination project for every session at a single-project site.
  assign:
    # Memory grows with the instances of the largest session, not with the
    # backlog. Measured: 310 MiB for 12,098.
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
    interval: 60
    copyMode: hardlink_or_copy
    # OPTION: file every session under this one XNAT project, whatever the
    # project tag says (assign --constant-project-id; the tagMapping project tag
    # is then ignored). For an edge that only ever feeds one project. Empty:
    # the project comes from tagMapping.project.
    constantProjectId: ""
    # Empty fields are derived from the engine. Ingest defaults:
    #   project: StudyID, subject: PatientID, session: AccessionNumber.
    # The example site states these values explicitly. Choose other supported
    # tags only after checking what each modality actually sends.
    # The chart rejects any ClinicalTrial-prefixed tag under ingest.
    #
    # assign reads these values BEFORE deidentify. A raw MRN selected through
    # PatientID becomes the XNAT subject label in clear text. Removing the tag
    # in the later recipe cannot change that label. Select approved research
    # identifiers at the source. A project constant changes only the project.
    # Missing or empty required labels go to assigned/__invalid__; that input
    # still contains patient information and is not processed automatically.
    # Use the guarded recovery procedure in docs/components/accessionflow.md.
    #
    # A mapping change can change destination placement without any recipe
    # change. Check the resulting labels and output headers on synthetic input
    # before receiving patient data. Keep existing originals while resolving
    # a source-label error. Legacy mappings are described in the deprecated
    # reference rather than as a setup procedure for new sites.

    tagMapping: {}

  # DEFAULT DE-IDENTIFICATION: accessionflow, between assign and upload.
  # Recipes are in specs below or an external ConfigMap with specFiles.
  # Under ingest, Orthanc receives original data and writes the enabled backup.
  # It does not route by AET, quarantine unknown AETs or modify the headers.
  #
  # assign has already selected the XNAT labels. A recipe changes DICOM fields,
  # not those labels. Review mapping values separately from the recipe output.
  # The shipped recipe removes named tags and adds result markers. It hashes
  # nothing. Private tags, PatientSex and PatientAge remain by example policy.
  #
  # The chart always requests a reid map under /data/reid. Without a key Secret
  # it is plaintext JSON. Configure reidEncryptKeySecret for production input
  # and keep its recovery key separately from the maps. This does not encrypt
  # old plaintext maps automatically.
  #
  # The CLI also supports recipe transform/salt sidecars. This chart has no
  # dedicated secret-backed wiring for them. AIS_DEID_HMAC_SALT is only the
  # backup script's startup prerequisite under ingest; it is not this salt.

  deidentify:
    # NO DEFAULT MEMORY LIMIT, on purpose. deid 0.4.13 (in accessionflow 0.19.0 and 0.20.0)
    # keeps every file it parses in memory until the pass ends (pydicom/deid#301):
    # about 200 MiB + the bytes of the sessions in one pass. Measured: 1.6 GiB
    # for one 0.9 GB study. A fixed limit stops a larger session on every pass.
    # OPTION: limits: {memory: <size>} if the node runs other work (see the docs).
    resources:
      requests: {cpu: 100m, memory: 512Mi}
    interval: 60
    copyMode: hardlink_or_copy
    # THE RECIPES. Write the complete site policy here. The chart builds the
    # ConfigMap and mounts it at the required project/format paths, so a
    # fresh install needs no kubectl and no pre-existing namespace.
    #
    # Key is the path under RECIPE_DIR, value is the recipe:
    #
    #   specs:
    #     "__default__/medimage/dicom-series": |
    #       FORMAT dicom
    #
    #       %header
    #
    #       REMOVE PatientName
    #       REMOVE PatientBirthDate
    #
    # A ConfigMap key cannot contain '/' or '@' and a ConfigMap mounts flat, so
    # the chart sanitises each path into a legal key and maps it back with
    # items[].path on the volume. That is entirely internal: write the real
    # paths here and ignore the restriction.
    specs: {}

    # ALTERNATIVE, for a ConfigMap you manage yourself (sealed-secrets, an
    # external pipeline, recipes too large to sit in the site file). Set both,
    # and specs above must be empty. specFiles maps <ConfigMap key> -> <path
    # under RECIPE_DIR>, doing by hand what specs does automatically.
    specConfigMap: ""

    # KUBERNETES CANNOT STORE THESE FILENAMES DIRECTLY. A ConfigMap key is
    # restricted to [-._a-zA-Z0-9], so the '/' in a recipe path is illegal,
    # and a ConfigMap mounts flat, so the per-project directory would be lost
    # too. Both are fixed by mapping each key to the path it must appear at,
    # which is why this cannot be built with `kubectl create configmap
    # --from-file` alone.
    #
    #   specFiles:
    #     default-dicom-series: "__default__/medimage/dicom-series"
    #     myproject-dicom-series: "MYPROJECT/medimage/dicom-series"
    specFiles: {}

    # Optional. A URL-safe base64 32-byte key (cryptography's
    # Fernet.generate_key()). Set, mappings are written encrypted as
    # <session>.json.enc and are unreadable without it. Unset, they are plain
    # JSON on the same volume as the data they de-identify.
    # Production ingest sites must set this reference. Empty means plaintext
    # reidentification maps; existing plaintext is not migrated automatically.
    reidEncryptKeySecret: ""       # key: XINGEST_REID_ENCRYPT_KEY

  # Repackage each de-identified session for XNAT. Runs `accessionflow package`
  # between deidentify and upload: reads /data/deidentified, writes
  # /data/packaged, and the uploader follows it to /data/packaged.
  #
  # Each SOURCE resource is replaced by every outputResources entry, and each
  # conversion receives the original series. The vendor extras convert that
  # series into a DICOM directory ZIP and a representative image. The defaults
  # produce the XNAT layout: the whole series as an uncompressed zip under
  # DICOM-zip, plus one DICOM sample that XNAT can read headers from. `auto`
  # names the sample's resource from its SOP class (DICOM, secondary, ...).
  #
  # ONLY RENDERS UNDER deid.engine=ingest. The input is the deidentify stage's
  # output, which exists only under that engine. Under any other engine this
  # block is ignored and the uploader reads /data/assigned as before.
  #
  # A session without a sourceDatatype scan resource passes through unchanged
  # in 0.20.0 (api/package_api.py:144). This support came from xnat-ingest PR #217.
  # An empty input directory is normal while waiting for new work.
  package:
    enabled: false
    # Runs on ingest.image.tag like every stage. The 0.20.0 image has the
    # required library versions (the same as 0.19.0). Install the AIS vendor extra package for
    # the default conversions. See What it needs in docs/package-stage.md.
    interval: 60
    copyMode: hardlink_or_copy
    sourceDatatype: medimage/dicom-series
    # label: resource name in XNAT. For the DICOM sample use `auto`: it takes the
    #        label XNAT expects from the SOP class of the series (DICOM for
    #        images, secondary for secondary captures, ...). A fixed label is
    #        refused for a series of another class, and the session fails.
    # spec:  target datatype, with converter options after ':'.
    outputResources:
      - label: DICOM-zip
        # reproducible=true: fixed entry timestamps and sorted entries, so the
        # zip of unchanged files has the same bytes every time, and a study
        # staged again for a late series uploads nothing twice. Needs a
        # fileformats-extras 0.22.3 or later. An older one stops at start with
        # ValueError: Invalid option 'reproducible'.
        spec: "medimage/dicom-series+zip:compression=ZIP_STORED,reproducible=true"
      - label: auto
        spec: medimage/vnd.australianimagingservice.dicom-sample

  # Attach Siemens side files (twix / rda / puls) to an assigned session.
  # Historical placeholder only: enabled is rejected by current validation.
  # No functional attach stage is supplied until matching CLI arguments exist.
  associate:
    # NOT SUPPORTED YET: the chart refuses enabled: true. accessionflow attach
    # needs the raw-file location (GLOB) and a session match (ID_PATTERN) that
    # this chart does not provide yet.
    enabled: false
    datatypes: "medimage/vnd.siemens.syngo-mr.xa.twix;medimage/vnd.siemens.syngo-mr.xa.rda;medimage/vnd.siemens.syngo-mr.xa.puls"
    copyMode: hardlink_or_copy


# =============================================================================
# 5. upload — how sessions reach XNAT
# =============================================================================
# direct edge -> XNAT. No management plane, no S3, no CA plumbing. On this
#        branch (tier-1) it is the only mode: the chart refuses any other.
#        Staging through S3 to a management cluster is the tier-2 chart on the
#        main branch.
# -----------------------------------------------------------------------------
upload:
  mode: direct

  direct:
    replicas: 1
    existingSecret: xnat-credentials    # keys: server, username, password
    # Poll interval for store xnat. Each pass subtracts the time spent working
    # before it sleeps. It is one part of delivery latency: waitPeriod also
    # delays sessions whose source was modified recently. A skipped session
    # waits for a later pass. Long uploads and retries can extend the delay;
    # loop + waitPeriod is not a strict worst-case bound. Both shipped site
    # files use 60 for this interval.
    loop: 120
    waitPeriod: 60
    # CAUTION: this also feeds an alert. The SessionUploadStalled rule detects a
    # started-but-never-finished upload by matching the uploader's log line
    #   "Including <alwaysInclude> scans/files in upload from '<session>'"
    # and stores/xnat/api/store_api.py emits it `if always_include`. Setting this
    # to "" is a
    # legitimate choice, but it removes that signal and the stall alert then never
    # fires. Nothing else notices: no render error, no runtime error, just an alert
    # that has quietly stopped watching the delivery path.
    alwaysInclude: "all"
    verifySsl: true
    # true: upload a resource only when its manifest is present and every file
    # in it matches. A half-written resource waits for the next pass.
    # false: upload the files that are there. Use only for sessions staged
    # without manifests.
    requireManifest: true
    tempDir: /data/tmp
    resources:
      requests: {memory: 256Mi, cpu: 100m}
      # CAUTION: accessionflow 0.20.0 (as 0.19.0) calls xnat 0.8.1 upload_dir. Its
      # tar_file/tgz_file methods use a 256 MiB SpooledTemporaryFile. Up to
      # 10 workers can hold archives at once, as in the older 0.16.2 warning.
      # Do not assume the fork archive fix (xnat-ingest PR #200) is present.
      # Keep this limit until memory and temporary disk use are measured.
      limits:   {memory: 4Gi,   cpu: "1"}


# =============================================================================
# 6. samba — optional SMB drop-box
# =============================================================================
samba:
  enabled: false
  image:
    repository: dockurr/samba
    # 4.23.10, not 4.23.5: closes two unauthenticated RCEs that reach a
    # standalone smbd (CVE-2026-4480 printing, CVE-2026-4408 DCE/RPC SAMR)
    # plus CVE-2026-1933/2340/58224. Latent while enabled:false above, but
    # the site that flips it on binds 445 on a hospital network — the worst
    # place to meet an unauthenticated smbd RCE.
    tag: "4.23.10"
    pullPolicy: IfNotPresent
  shareName: edge
  # Only this subdirectory is exported. Sharing the volume root would put
  # orthanc-storage/ (DICOM), grouped/, assigned/ and LOGS/ on the share.
  subPath: incoming
  existingSecret: samba-credentials     # keys: username, password
  # Binds 445 on the node, so it conflicts with any smbd already running
  # there. Check before enabling.
  hostPort: 445
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits:   {memory: 512Mi, cpu: 500m}


# =============================================================================
# 7. observability — ship logs to the management cluster
# =============================================================================
# Off for standalone sites. On for tier-2, where the mgmt cluster runs Loki,
# Grafana and Alertmanager.
observability:
  # Run Vector on this node. On tier-2 it pushes to the MANAGEMENT cluster's
  # Loki over mTLS; on tier-1 it pushes to the Loki running beside it. Whether
  # there is a local Loki at all is `stack.enabled` below — the two switches are
  # orthogonal on purpose, and overloading `enabled` to mean both would make
  # "ship logs somewhere" and "host a log store" impossible to configure apart.
  enabled: false

  # ---------------------------------------------------------------------------
  # stack — the WHOLE observability stack, on this node. TIER-1.
  # ---------------------------------------------------------------------------
  # ONE KEY, AND IT IS ONLY A SWITCH. It gates the kube-prometheus-stack and loki
  # dependencies in Chart.yaml, and nothing else. A Helm dependency whose
  # condition path does not resolve is treated as ENABLED, so this key existing
  # and being false is what keeps a tier-2 edge rendering exactly as before.
  #
  # THE STACK IS TUNED IN THE SUBCHART BLOCKS AT THE BOTTOM OF THIS FILE
  # (`loki:` and `kube-prometheus-stack:`), NOT HERE.
  #
  # There were friendly parent keys here (stack.retentionDays,
  # stack.grafana.nodePort, stack.lokiStorage.size) and every one of them was
  # DEAD. stack.alerting.* is the exception: emailTo, smtpHost and
  # existingSecret are live, read by templates/observability.yaml, and emailTo
  # is required. Helm cannot template subchart values, so no template in
  # this chart can read a parent key and push it down into a subchart; the
  # subchart reads its own block or nothing. Measured before removing them:
  # `--set observability.stack.grafana.nodePort=31234` left the Service on 30030.
  #
  # This is the same conclusion tier-2 reached with dataPolicy.telemetry.loki /
  # .prometheus retention, which were deleted for exactly this reason. A key that
  # looks like configuration and changes nothing is worse than no key: it is
  # read, trusted, and silently ignored.
  #
  # So, to change these, edit the block named:
  #   retention (logs)     loki.loki.limits_config.retention_period
  #   retention (metrics)  kube-prometheus-stack.prometheus.prometheusSpec.retention
  #   Grafana port         kube-prometheus-stack.grafana.service.nodePort
  #   Grafana password     Secret grafana-admin-credentials (already wired)
  #   Loki disk            loki.singleBinary.persistence.size
  #   alert routing        the alertmanager config (see templates/observability.yaml)
  stack:
    enabled: false

    # CONSUMED by templates/observability.yaml, which substitutes them into
    # files/alertmanager-config.yaml as __SENTINEL__ tokens. Unlike the parent
    # keys that were removed from here, these are real: the template reads them
    # directly, so they are not blocked by Helm's inability to template subchart
    # values.
    alerting:
      # Required by the presence guard when BOTH observability.enabled and
      # stack.enabled are true. Stack-only rendering bypasses that guard; an
      # empty mail destination must not be interpreted as working alert delivery.
      emailTo: ""
      emailFrom: ""
      smtpHost: ""
      smtpPort: 587
      smtpUsername: ""
      requireTLS: true
      # The password is NEVER templated in. The operator mounts this Secret at
      # /etc/alertmanager/secrets/<name>/ and the config reads the file, so the
      # credential never lands in a rendered manifest or in git.
      existingSecret: alertmanager-smtp

  vector:
    image:
      repository: timberio/vector
      tag: "0.49.0-distroless-libc"
      pullPolicy: IfNotPresent
    resources:
      requests: {memory: 128Mi, cpu: 100m}
      limits:   {memory: 512Mi, cpu: 500m}
  loki:
    endpoint: ""                        # https://loki.<domain>
    # This edge's CLIENT CERTIFICATE for the management Loki push endpoint —
    # kubernetes.io/tls (tls.crt/tls.key), written here by the management
    # cert-sync CronJob. Not created here; rotates without touching the site.
    # CAUTION: must match the certSync destination in the MANAGEMENT site
    # values, or Vector sits in CreateContainerConfigError (loud on the edge,
    # invisible from mgmt). Replaces a Basic-auth path that never actually
    # authenticated anything — docs/hardening-decisions.md §1.
    clientCertSecret: loki-push-client-tls
    caBundleSecret: ca-bundle
    caBundleKey: ca.crt


# =============================================================================
# 8. platform
# =============================================================================
serviceAccounts:
  create: true
  # Nothing in this chart talks to the Kubernetes API except Vector, which
  # gets its own ServiceAccount and RBAC.
  automountToken: false

# onprem only: pin management hostnames to the mgmt node IP inside pods,
# because edge nodes generally cannot resolve them via site DNS.
hostAliases:
  enabled: true
  mgmtNodeIP: ""
  hostnames: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# =============================================================================
# SUBCHART VALUES — only rendered when observability.stack.enabled is true
# =============================================================================
# These are the tier-1 local stack. They are inert on tier-2, because Chart.yaml
# gates both dependencies on observability.stack.enabled and Helm does not
# render a subchart whose condition is false.
#
# THE ONE REAL DIVERGENCE FROM charts/mgmt IS LOKI'S STORAGE. The management
# Loki keeps chunks in SeaweedFS over S3; there is no object store on a single
# node, so tier-1 uses the filesystem on a PVC. Everything else — SingleBinary,
# the ruler, retention — is the same shape.
loki:
  # WHERE THE RULES SIDECAR WRITES. Loki's local rule store treats each
  # subdirectory of storage.local.directory as a TENANT ID, and with
  # auth_enabled: false the only tenant is literally "fake". At the chart's
  # default (/rules) the sidecar drops ais-edge-rules.yaml at the top level,
  # Loki finds no tenant directory, starts cleanly and evaluates NOTHING —
  # indistinguishable from a healthy site where nothing is wrong.
  sidecar:
    rules:
      folder: /rules/fake

  # PINNED. files/vector-local.yaml names this Service literally (Helm never
  # templates a .Files.Get file), so it cannot follow .Release.Name. Without the
  # override the Service is <release>-loki, and a release named anything else
  # would leave Vector retrying an address that never resolves — with logs
  # silently never arriving, which looks exactly like a quiet site.
  fullnameOverride: ais-loki
  # The pinned Loki subchart inherits automatic PVC deletion on StatefulSet
  # deletion and scale-down (Delete/Delete). This differs from main's explicit
  # Retain/Retain override. Back up logs before uninstall or storage migration;
  # the pipeline PVC keep annotations do not cover every subchart resource.
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false                   # single node, no tenants, no ingress
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem        # s3 on tier-2
          schema: v13
          index: {prefix: loki_index_, period: 24h}
    storage:
      type: filesystem                    # NO bucketNames, NO credentials
    limits_config:
      retention_period: 30d               # authoritative; no parent retentionDays key
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_global_streams_per_user: 10000
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    commonConfig:
      replication_factor: 1
    # Evaluates the LogQL pipeline alerts and pushes to the local Alertmanager.
    rulerConfig:
      storage:
        type: local
        # /rules, NOT /etc/loki/rules. MEASURED on a real install: the Loki
        # chart mounts its rules sidecar volume at /rules, and /etc/loki holds
        # only the read-only config and runtime-config mounts. Loki mkdir's the
        # ruler directory at startup, so /etc/loki/rules produced
        #   mkdir /etc/loki/rules: read-only file system
        #   error initialising module: ruler-storage
        # and Loki CRASHLOOPED — no log storage, and because every pipeline
        # alert on this tier is Loki-sourced, no alerts at all. No render check
        # exercised startup, but a targeted rendered-manifest check can compare
        # writable mounts and security context. Runtime validation remains useful.
        local: {directory: /rules}
      rule_path: /var/loki/rules-runtime
      # MUST MATCH the Alertmanager Service the kube-prometheus-stack subchart
      # actually creates, which follows ITS fullnameOverride below — so this is
      # `ais-kps-alertmanager`, not `<release>-kube-prometheus-stack-...`.
      # Got this wrong once: the ruler pushed to a name that does not resolve,
      # and every LogQL pipeline alert silently never fired while Loki, the
      # rules and the dashboards all looked healthy.
      # ci/runtime-templates.sh asserts this against the rendered Service.
      alertmanager_url: http://ais-kps-alertmanager.{{ .Release.Namespace }}.svc.cluster.local:9093   # [tpl]
      enable_alertmanager_v2: true
      enable_api: true
      ring: {kvstore: {store: inmemory}}
  singleBinary:
    replicas: 1
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits:   {cpu: 2,    memory: 2Gi}
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
  # Off: one node, one replica, nothing to cache or distribute.
  chunksCache: {enabled: false}
  resultsCache: {enabled: false}
  lokiCanary: {enabled: false}
  test: {enabled: false}
  gateway: {enabled: false}
  backend: {replicas: 0}
  read: {replicas: 0}
  write: {replicas: 0}

kube-prometheus-stack:
  fullnameOverride: ais-kps
  # Upstream alert rules: all on, except those this chart replaces.
  defaultRules:
    disabled:
      # CPUThrottlingHigh is not listed: upstream's copy runs unmodified. The
      # data-policy reporter has no CPU limit, so the rule has nothing to read
      # for it (see dataPolicy.reporter.resources).
      # Replaced by ais-edge-jobs in files/prometheus-rules/warning.yaml: the
      # same rule, minus the staged-reclaimer's own Jobs, whose failures
      # ReclaimerRunUnavailable and ReclaimerNotSucceeding report.
      # CAUTION: remove this and upstream's copy alerts on the reclaimer's
      # failed Jobs again; scripts/ci/promtool.sh fails on two copies.
      KubeJobFailed: true
  # No ingress on tier-1 — Grafana is reached on a NodePort instead.
  grafana:
    enabled: true
    # READ THE OPERATOR'S SECRET, not a chart-generated one. Without this block
    # the subchart mints its own <release>-grafana Secret and points
    # GF_SECURITY_ADMIN_USER/PASSWORD at it — so grafana-admin-credentials,
    # which sites/example-single/secrets.example.yaml tells the operator to
    # fill in, is read by nothing and the password they set is silently
    # ignored. Verified by rendering: 0 occurrences before this was added.
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    # initChownData runs as root and fails under a restricted PSS namespace;
    # the local-path PVC is already writable by the Grafana UID.
    initChownData: {enabled: false}
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path
    service:
      type: NodePort
      nodePort: 30030
  prometheus:
    prometheusSpec:
      retention: 30d
      # Select all rules across namespaces with the resulting empty selectors.
      # The custom PrometheusRules intentionally carry no release label; false
      # prevents the subchart from requiring its own release label implicitly.
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 20Gi}}
  alertmanager:
    alertmanagerSpec:
      # CAUTION: must exceed the longest repeat_interval in
      # files/alertmanager-config.yaml (720h). The subchart default is 120h:
      # Alertmanager then prunes the notification log first, and an alert that
      # still fires can mail again after 5 days instead of 30. Alertmanager
      # warns at startup ("repeat_interval is greater than the data retention
      # period"). The promtool CI stage checks it. Same value as tier-2.
      retention: 744h

      # BOTH OF THESE ARE LOAD-BEARING, and templates/observability.yaml fails
      # the render without them.
      #
      # configSecret  without it the operator mounts the SUBCHART's default
      #               alertmanager.yaml and every alert this chart raises goes
      #               to a null receiver — healthy stack, nothing delivered.
      # secrets       mounts the SMTP Secret at
      #               /etc/alertmanager/secrets/<name>/, which is where the
      #               config reads the password from. Without the mount every
      #               notification fails authentication.
      configSecret: alertmanager-aisedge-config
      secrets:
        - alertmanager-smtp
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources: {requests: {storage: 5Gi}}
  # Scrape endpoints not configured for this installation; controllers exist
  # even where their expected upstream monitor endpoint is unavailable. Left on, they produce
  # permanently-firing "target down" noise that trains operators to ignore
  # Alertmanager.
  kubeControllerManager: {enabled: false}
  kubeScheduler: {enabled: false}
  kubeProxy: {enabled: false}
  kubeEtcd: {enabled: false}
  nodeExporter: {enabled: false}
