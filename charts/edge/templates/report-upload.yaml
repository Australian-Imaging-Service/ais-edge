{{- if .Values.upload.reports.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-report-upload
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: report-upload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: report-upload
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: report-upload
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      containers:
        - name: report-upload
          image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["xnat-ingest", "upload"]
          args:
            - {{ .Values.upload.reports.source | quote }}
            - "$(XINGEST_HOST)"
            - "--always-include"
            - "all"
            - "--loop"
            - {{ .Values.upload.reports.loop | quote }}
            - "--wait-period"
            - {{ .Values.upload.reports.waitPeriod | quote }}
            - "--dont-require-manifest"
            {{- if not .Values.upload.reports.verifySsl }}
            - "--dont-verify-ssl"
            {{- end }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
            - name: XINGEST_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.reports.existingSecret }}
                  key: server
            - name: XINGEST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.reports.existingSecret }}
                  key: username
            - name: XINGEST_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.reports.existingSecret }}
                  key: password
            - name: XINGEST_TEMPDIR
              value: {{ .Values.upload.reports.tempDir | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.reports.s3ExistingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.reports.s3ExistingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.reports.s3ExistingSecret }}
                  key: AWS_DEFAULT_REGION
          {{- with .Values.upload.reports.proxyConfigMap }}
          envFrom:
            - configMapRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.upload.reports.resources | nindent 12 }}
          volumeMounts:
            - name: temp
              mountPath: {{ .Values.upload.reports.tempDir | quote }}
      volumes:
        - name: temp
          emptyDir: {}
{{- end }}
