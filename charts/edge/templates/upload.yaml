{{- /*
Upload, straight to XNAT. This branch has one mode (direct); the chart refuses
any other in edge.validate.
*/ -}}
{{- if eq .Values.upload.mode "direct" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge.fullname" . }}-upload
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
    app: xnat-ingest
    component: upload
spec:
  replicas: {{ .Values.upload.direct.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnat-ingest
      component: upload
  template:
    metadata:
      labels:
        {{- include "edge.labels" . | nindent 8 }}
        app: xnat-ingest
        component: upload
    spec:
      {{- include "edge.hostAliases" . | nindent 6 }}
      {{- include "edge.schedulingRules" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.automountToken }}
      # Upload can start before its producer creates the input directory.
      # Its configured temporary parent must also exist before the first loop.
      initContainers:
        - name: init-upload-dirs
          image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command:
            - "mkdir"
            - "-p"
            - "--"
            - {{ include "edge.uploadSourceDir" . | quote }}
            {{- if .Values.upload.direct.tempDir }}
            - {{ .Values.upload.direct.tempDir | quote }}
            {{- end }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
        {{- include "edge.extraPip.initContainer" (dict "root" $ "image" (printf "%s:%s" .Values.ingest.image.repository .Values.ingest.image.tag)) | nindent 8 }}
      containers:
        - name: upload
          image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          # xnat-ingest loops internally via --loop; no bash wrapper needed.
          command: ["xnat-ingest", "upload"]
          args:
            - {{ include "edge.uploadSourceDir" . | quote }}
            - "$(XINGEST_HOST)"
            - "--always-include"
            - {{ .Values.upload.direct.alwaysInclude | quote }}
            - "--loop"
            - {{ .Values.upload.direct.loop | quote }}
            - "--wait-period"
            - {{ .Values.upload.direct.waitPeriod | quote }}
            # Pass the choice both ways. With neither flag, xnat-ingest's CLI
            # does not require a manifest (its option default is unset).
            {{- if .Values.upload.direct.requireManifest }}
            - "--require-manifest"
            {{- else }}
            - "--dont-require-manifest"
            {{- end }}
            {{- if not .Values.upload.direct.verifySsl }}
            - "--dont-verify-ssl"
            {{- end }}
          env:
            {{- include "edge.logEnv" . | nindent 12 }}
            - name: XINGEST_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.direct.existingSecret }}
                  key: server
            - name: XINGEST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.direct.existingSecret }}
                  key: username
            - name: XINGEST_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.upload.direct.existingSecret }}
                  key: password
            - name: XINGEST_TEMPDIR
              value: {{ .Values.upload.direct.tempDir | quote }}
            {{- include "edge.extraPip.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.upload.direct.resources | nindent 12 }}
          volumeMounts:
            {{- include "edge.pipelineVolumeMount" . | nindent 12 }}
            {{- include "edge.extraPip.volumeMount" . | nindent 12 }}
      volumes:
        {{- include "edge.pipelineVolume" . | nindent 8 }}
        {{- include "edge.extraPip.volume" . | nindent 8 }}
{{- end }}
