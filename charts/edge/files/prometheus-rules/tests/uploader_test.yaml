# Uploader restart events and sustained RSS growth, including negative controls.
rule_files:
- ../uploader.yaml
evaluation_interval: 30s
tests:
- name: Recovered OOM fires once per container and clears despite retained reason
  interval: 1m
  input_series:
  - series: kube_pod_owner{job="kube-state-metrics",namespace="xnat-upload",pod="mgmt-upload-edge-a-abc123-xyz12",owner_kind="ReplicaSet",owner_is_controller="true",owner_name="mgmt-upload-edge-a-abc123"}
    values: 1+0x600
  - series: kube_replicaset_owner{job="kube-state-metrics",namespace="xnat-upload",replicaset="mgmt-upload-edge-a-abc123",owner_kind="Deployment",owner_is_controller="true",owner_name="mgmt-upload-edge-a"}
    values: 1+0x600
  - series: kube_pod_owner{job="kube-state-metrics",namespace="xnat-upload",pod="mgmt-upload-edge-b-def456-uvw34",owner_kind="ReplicaSet",owner_is_controller="true",owner_name="mgmt-upload-edge-b-abc123"}
    values: 1+0x600
  - series: kube_replicaset_owner{job="kube-state-metrics",namespace="xnat-upload",replicaset="mgmt-upload-edge-b-abc123",owner_kind="Deployment",owner_is_controller="true",owner_name="mgmt-upload-edge-b"}
    values: 1+0x600
  - series: kube_pod_container_status_restarts_total{namespace="xnat-upload",pod="mgmt-upload-edge-a-abc123-xyz12",container="upload",instance="ksm-a",job="kube-state-metrics"}
    values: 0+0x4 1+0x30
  - series: kube_pod_container_status_restarts_total{namespace="xnat-upload",pod="mgmt-upload-edge-a-abc123-xyz12",container="upload",instance="ksm-b",job="kube-state-metrics"}
    values: 0+0x4 1+0x30
  - series: kube_pod_container_status_last_terminated_reason{namespace="xnat-upload",pod="mgmt-upload-edge-a-abc123-xyz12",container="upload",reason="OOMKilled",job="kube-state-metrics"}
    values: 1+0x35
  - series: kube_pod_container_status_ready{namespace="xnat-upload",pod="mgmt-upload-edge-a-abc123-xyz12",container="upload",job="kube-state-metrics"}
    values: 1+0x35
  alert_rule_test:
  - eval_time: 4m
    alertname: XNATUploaderRestarted
    exp_alerts: []
  - eval_time: 6m
    alertname: XNATUploaderRestarted
    exp_alerts:
    - exp_labels:
        namespace: xnat-upload
        pod: mgmt-upload-edge-a-abc123-xyz12
        container: upload
        severity: warning
        uploader_release: ais-mgmt/mgmt
        reason: OOMKilled
      exp_annotations:
        summary: XNAT uploader mgmt-upload-edge-a-abc123-xyz12 restarted
        description: "Kubernetes observed an uploader restart within the last 15 minutes.\nLast reported termination\
          \ reason: OOMKilled.\nOOMKilled means the container exceeded its memory limit or the node ran out of memory.\n\
          Check the previous container logs and its termination details:\n  kubectl -n xnat-upload logs mgmt-upload-edge-a-abc123-xyz12\
          \ -c upload --previous\n  kubectl -n xnat-upload describe pod mgmt-upload-edge-a-abc123-xyz12\nThis is\
          \ a restart event, even if the uploader is ready again. A rollout\ncreates a new pod and does not increase\
          \ this counter.\n"
  - eval_time: 21m
    alertname: XNATUploaderRestarted
    exp_alerts: []
- name: Non-OOM restart names its cause and does not conflate a second uploader
