# =============================================================================
# Info alerts  —  routine informational events. Slack-only by default;
# do not page or email.
# =============================================================================

# NOTE: this file is a BARE `groups:` fragment, not a whole
# PrometheusRule. charts/edge/templates/observability.yaml supplies the
# apiVersion/kind/metadata and the namespace, so the namespace is NOT
# hardcoded here — the old copy pinned `namespace: observability`, which
# does not exist on the consolidated single node.

groups:
- name: ais-edge-info
  interval: 5m
  rules:
  - alert: NodeCountChanged
    expr: 'changes(kube_node_info[10m]) > 0

      '
    labels:
      severity: info
    annotations:
      summary: Node inventory changed on the tier-1 host
      description: "kube_node_info changed. On a single-node appliance this is unexpected \u2014 investigate\
        \ if unplanned."
