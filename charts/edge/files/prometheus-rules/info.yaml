# Documentation review 2026-11-10: historical measurements below describe
# their recorded runs. Undated run evidence is not verified (2026-11-10).
# Current conditions are defined by the expressions and their input availability.
# =============================================================================
# Info alerts: routine informational events, sent by the configured email
# receiver on tier-1. This branch does not splice optional Slack receivers.
# With observability disabled but the stack on, the email presence guard
# is bypassed; a blank address can select null. Inspect the actual receiver.
# CAUTION: every re-fire after a resolve is a new mail; keep these event-shaped.
# =============================================================================
# NOTE: this file is a BARE `groups:` fragment, not a whole
# PrometheusRule. charts/edge/templates/observability.yaml supplies the
# apiVersion/kind/metadata and the namespace, so the namespace is NOT
# hardcoded here — the old copy pinned `namespace: observability`, which
# does not exist on the consolidated single node.

groups:
- name: ais-edge-info
  interval: 5m
  rules:
  - alert: NodeCountChanged
    expr: changes(count(kube_node_info)[10m:1m]) > 0
    labels:
      severity: info
    annotations:
      summary: Node inventory changed on the tier-1 host
      description: |
        The sampled count of kube_node_info series changed within ten minutes.
        Tier-1 normally has one node, but a scrape gap, stale-series removal or
        inventory change can affect the count. Check node objects and target health;
        this is not proof of an unexpected physical node joining the appliance.

