# =============================================================================
# Critical alerts (Prometheus / kube-state-metrics) — pages on-call.
#
# Pipeline-event critical alerts (XNATUploadFailingForAllSessions, etc.) live
# in loki-ruler-rules.yaml, evaluated by Loki's ruler over the JSON event
# stream. The alerts in this file all derive from K8s/cert-manager metrics
# scraped directly by mgmt Prometheus.
# =============================================================================

# NOTE: this file is a BARE `groups:` fragment, not a whole
# PrometheusRule. charts/edge/templates/observability.yaml supplies the
# apiVersion/kind/metadata and the namespace, so the namespace is NOT
# hardcoded here — the old copy pinned `namespace: observability`, which
# does not exist on the consolidated single node.

groups:
- name: ais-edge-critical
  interval: 30s
  rules:
  - alert: KubernetesAPIServerDown
    expr: up{job="apiserver"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Kubernetes API server unreachable on the tier-1 host
      description: kube-apiserver scrape has failed for 5+ minutes. The management cluster control plane
        is down or partitioned.
  - alert: NodeNotReady
    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Node {{ $labels.node }} NotReady for 5+ minutes
      description: kubelet on the worker has stopped responding. New DICOMs will accumulate locally; already-staged
        sessions cannot upload.
