# The pipeline tool is accessionflow (called xnat-ingest before 0.18.0).

# Documentation review: 2026-11-10. Undated measurements below are historical;
# their run dates and current reproducibility are not verified (2026-11-10).
# Dated incident counts are records of those runs, not live fleet health.
# Current annotations describe bounded log evidence and safe diagnostic steps.
# Expressions, pending periods, labels and group structure are unchanged.
# TIER-1 NOTE (why this file is not charts/mgmt's copy)
# ---------------------------------------------------------------------------
# This is the SINGLE-NODE ruleset. It was taken from the pre-consolidation
# tier-1 branch, not from the tier-2 management chart, because tier-2's rules
# key on components that DO NOT EXIST here: `s3-uploader` (there is no S3 hop)
# and `s3-reclaimer` in namespace `xnat-upload` (there is no staging bucket and
# no management-side reclaimer). Copying those wholesale gives a file that
# loads cleanly and matches no stream — silence that is indistinguishable from
# a healthy site.
#
# Two changes were needed on top of the old tier-1 file:
#   * namespace="xnat-upload" -> "xnat-ingest". The consolidated chart is ONE
#     release in ONE namespace; the old tier-1 split upload into its own.
#   * EdgeDiskLow and QuarantinedDataUnresolved appended. The data-policy
#     engine post-dates the old tier-1, and on a single node EdgeDiskLow is the
#     ONLY disk-exhaustion alert in the system — node-exporter is disabled and
#     there is no PVC-full rule.
#
# Every selector here is checked against the labels the chart actually renders
# (app=orthanc, component=dicom-receiver|group|assign|upload|data-policy, all in
# namespace xnat-ingest) and against the stream labels Vector promotes
# (cluster, namespace, pod, container, node, app, component, level).
# ---------------------------------------------------------------------------
# =============================================================================
# Loki ruler rules — log-derived alerts.
# =============================================================================
# These alerts evaluate LogQL queries on a schedule inside Loki and emit to
# the kube-prometheus-stack Alertmanager (configured in this chart's values.yaml and observability template;
# rulerConfig.alertmanager_url). They cover the pipeline events emitted by the
# Orthanc, accessionflow collate orthanc/label xnat, and accessionflow store xnat pods.
#
# TIER-1 (single node): the pipeline is
#   Orthanc (receiver) -> group-orthanc -> assign -> deidentify -> upload -> XNAT.
# The tool commands (0.20.0) are accessionflow collate orthanc, label xnat, deidentify
# and store xnat. Orthanc does not run the ingest recipe.
# There is NO S3 hop and NO s3-uploader stage anymore, so rules that used to
# key on the deleted s3-uploader component's events (upload_started /
# upload_completed to SeaweedFS, mc-alias failures) have been retargeted onto
# the real terminal upload stage (namespace="xnat-ingest", component="upload")
# or removed where the signal was purely s3-uploader-internal. The SAME
# alerting capability — stalled sessions, upload failures, XNAT upload success,
# and storage backlog — is preserved against the components that still exist.
#
# Historical rationale retained below; its current disposition follows.
# The source-of-truth for these alerts is the structured JSON event itself.
# Loki receives every log line from the single Vector DaemonSet, so running
# the rules in Loki is the natural path.
# Current review (2026-11-10):
# Vector sends collected logs on a best-effort basis. Memory buffers and source
# collection can lose lines. These log rules detect retained matching evidence, not the
# absence of all faults.
#
# Rule file format is identical to Prometheus rule files. Loki's ruler
# writes firing alerts to Alertmanager v2 with the labels and annotations
# below, so the existing email/Slack receivers keep working unchanged.
#
# Companion: files/prometheus-rules/{critical,warning,info}.yaml
# hold the K8s-metric-based alerts (node NotReady, pod restarts) that live in
# Prometheus.
# =============================================================================
# NOTE: BARE `groups:` DOCUMENT, not a ConfigMap.
# charts/edge/templates/observability.yaml wraps this in the ConfigMap that
# Loki's ruler sidecar watches (label loki_rule). The pre-consolidation copy
# was a complete ConfigMap manifest, and wrapping THAT produced a ConfigMap
# nested inside a ConfigMap: the sidecar would have written a file containing
# Kubernetes YAML where rule groups belong, and Loki would have loaded NO
# rules at all while everything looked healthy.
#
# XNATUploadRetryStorm: ANNOTATION ONLY. Expressions, durations and labels
# match tier-2 modulo namespace. The text names the single-node direct uploader
# here and the management uploader on tier-2. The parity check ignores only
# these annotations and still checks every other field for this alert.

# SessionStagedNotConfirmedInXNAT, ReclaimerRunUnavailable, XNATUploadSuccess,
# XNATRepairAttempted and XNATAuthFailure: ANNOTATION ONLY for this review.
# Runbook commands use the tier-1 namespace and component selectors.
# Shared expression and duration comparisons remain applicable.

# StageBacklogAgeing: ANNOTATION ONLY. The setting path differs by chart:
# tier-1 uses dataPolicy.reporter.stageAgeAlertAfter; main management uses
# dataPolicy.stageAgeAlertAfter. Its expression and pending time stay shared.
#
# TIER-1 SCOPING: XNATUploadSuccess and XNATAuthFailure select
# component="upload", where tier-2 selects the whole xnat-upload namespace.
# That is not gratuitous drift — it is forced by the single-namespace collapse.
#
# Historical rationale retained below; its current disposition follows.
# On tier-2, namespace xnat-upload contains ONLY the uploader. On tier-1 the
# one namespace also holds Loki, Grafana, Prometheus and Alertmanager, so a
# bare {namespace="xnat-ingest"} selector matches THEIR logs too. Measured on
# the live install:
# Current review (2026-11-10):
# The management namespace also contains reclaimer workloads. The historical self-
# matching incident explains why tier-1 selects the upload component explicitly. A
# namespace-only selector on management has a broader scope and should not be described
# as intrinsically uploader-only.
#
#   * Loki logs each ruler query at INFO, and that query text contains both
#     "Successfully uploaded all files in" and the regexp pattern. The rule
#     therefore matched the ruler evaluating the rule, and fired a second
#     XNATUploadSuccess whose session label was the literal
#         (?P<session>[^
#     A self-sustaining alert about its own evaluation.
#   * XNATAuthFailure would match a 401/403 logged by ANY pod in the namespace,
#     not just the uploader.

groups:
- name: ais-edge-pipeline-critical
  interval: 1m
  rules:
  # Watches component="upload", NOT "s3-uploader". The s3-uploader is only
  # rendered when upload.mode=s3, and install.sh forces upload.mode=direct on
  # tier-1, so the old selector matched a component that never runs here and
  # this alert could not fire at all. Verified: no s3-uploader Deployment
  # exists on a tier-1 cluster.
  #
  # Historical rationale retained below; its current disposition follows.
  # Failure counting is the same shape as XNATUploadRetryStorm: the traceback
  # header, one per failure, or an ERROR-level line. Success is the PER-SESSION
  # line; "Upload completed successfully" is per LOOP and is emitted even when
  # every session was skipped, so it would mask a total outage.
  # An idle edge logs neither, so it stays quiet.
  # Current review (2026-11-10):
  # The expression counts traceback headers and ERROR-level log lines. It is not one-to-
  # one with failed sessions or requests. The per-session success signal is more
  # specific than a successful idle loop, but missing logs can affect either side.
  - alert: XNATUploadFailingForAllSessions
    annotations:
      description: |
        The configured failure signals remain present while the success signal is
        absent from the 15-minute lookback, with a further 15-minute pending period.
        This is not a count of every attempted session and does not prove that all
        sessions failed. Check network access, credentials and the destination:
          kubectl -n xnat-ingest logs -l component=upload --since=1h
        Missing or delayed logs can affect this comparison. For management uploads,
        the cluster label identifies the emitting cluster, not necessarily the edge
        whose files are being uploaded. Select the affected pod from its labels.
      summary: "Upload failures without an observed success on {{ $labels.cluster }}"
    expr: "(sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"} | json\n  | message =~ \"Traceback \\\\(most recent call last\\\\).*\" or level = \"ERROR\"\n  [15m])) > 2)\nunless on (cluster)\n(sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  |~ \"Successfully uploaded all files in\" [15m])) > 0)\n"
    for: 15m
    labels:
      severity: critical
      source: loki-ruler
- name: ais-edge-pipeline-warning
  interval: 1m
  rules:
  # Historical rationale retained below; its current disposition follows.
  # Counts one line PER FAILURE, not per line of output. The original form
  # matched /error|failed|exception|traceback/ against every line, and one
  # Python traceback is ~96 lines, so a single event cleared a threshold of
  # 5 many times over.
  # Current review (2026-11-10):
  # The expression counts matching log lines. One failure can emit both a traceback
  # header and an ERROR line, and retries can repeat them. Matching headers reduces
  # multiline amplification; it does not create an exact failure counter.
  #
  # Keying on level="ERROR" alone is NOT enough, measured: over 24h this
  # edge logged 11 tracebacks carrying real failures (DNS resolution and
  # read timeouts to XNAT) and NOT ONE line at level="ERROR". accessionflow
  # lets those reach stderr uncaught, and Vector labels unlabelled output
  # "unknown", so an ERROR-only rule is silent through a real outage.
  #
  # Historical rationale retained below; its current disposition follows.
  # So: match the traceback HEADER, which appears exactly once per failure,
  # OR any ERROR-level line. Measured over the same 24h: 4 ten-minute
  # windows contained failures, 3 to 4 each, hence a threshold of 2.
  # NOT EVERY ERROR IS A RETRY. A session that uploaded successfully stays in the
  # terminal tree until the staged reclaimer retires it, which is minAge later, and
  # `upload --loop` re-reads that tree every cycle. XNAT answers the re-offer with
  # Current review (2026-11-10):
  # The traceback header is a more selective signal than every traceback line. It still
  # counts log occurrences, and ERROR lines or retried failures can contribute
  # additional matches. The threshold is a log-rate policy, not a count of unique
  # failures.
  #
  #   'DICOM' resource in '<session>' already exists on XNAT with different
  #   checksums. Please delete on XNAT to overwrite
  #
  # which accessionflow logs at ERROR. So a HEALTHY site produced >2 ERRORs every ten
  # minutes for as long as minAge, and this alert fired continuously after every
  # successful delivery. Measured on a live install: 15 identical lines, all for a
  # session that had just been delivered correctly.
  #
  # That is worse than noise. A rule that fires constantly on a working site is a
  # rule nobody reads, and it would have hidden a real retry storm underneath it.
  # The line is excluded rather than the threshold raised: a genuine storm looks
  # different (tracebacks, auth failures, connection errors) and those still count.
  #
  # Historical rationale retained below; its current disposition follows.
  # THE EXCLUSION IS KEPT, BUT NOT FOR THAT REASON ANY MORE. From 0.15.6 on (pinned 0.19.0)
  # the re-offer is answered from a file-set comparison rather than a label one,
  # so a session that really was delivered is skipped silently and the emitter
  # quoted above is gone. What the exclusion now buys is separation of concerns:
  # this phrase means one specific, actionable thing, and
  # XNATResourceIncompleteAndStuck below counts it per session with a threshold
  # and a runbook. Counting it here as well would page twice for one fault, and
  # under a rule whose description sends the operator to look for the wrong
  # thing. Removing the exclusion would be safe on this pin and wrong on any
  # older one, so it stays.
  # Current review (2026-11-10):
  # The phrase-only differing-checksums emitter still exists in 0.19.0. Complete-session
  # checks prevent the historical false mismatch for an already complete resource, but
  # real conflicts still emit the phrase. Its exclusion separates this dedicated per-
  # session rule from the generic retry alert.
  - alert: XNATUploadRetryStorm
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"} | json\n  | message =~ \"Traceback \\\\(most recent call last\\\\).*\" or level = \"ERROR\"\n  !~ \"already exists on XNAT with different checksums\"\n  [10m])) > 2\n"
    for: 10m
    labels:
      severity: warning
      source: loki-ruler
    annotations:
      summary: '>2 single-node XNAT upload errors in 10 minutes on {{ $labels.cluster }}'
      description: The tier-1 uploader runs on this node and uploads directly to XNAT. It is repeatedly failing. Inspect `kubectl logs -n xnat-ingest -l component=upload` for the cause; different-checksums conflicts have their own per-session alert.
  # THE UPLOADER THIS TIER ACTUALLY RENDERS. This rule used to select
  # component="s3-uploader" and match event="upload_started" / "upload_completed".
  # Neither exists on this branch:
  #   * upload.mode is always direct here, so no s3-uploader is ever rendered.
  #     Measured on a live install: 0 pods carry that label; the uploader carries
  #     component="upload".
  #   * those event= fields come from our own files/s3-uploader.sh. The direct
  #     uploader is the accessionflow binary, which emits `message` strings and no
  #     upload_started/upload_completed event pair. The old live sample had
  #     no event fields. Current 0.20.0 does emit other structured events.
  # So the ONE alert covering a stalled delivery could never fire, on the branch
  # whose only delivery path is the one it was written to watch.
  #
  # The completion string below is the same one XNATUploadSuccess matches, which
  # is known to work: it is what raises the upload-complete notifications.
  #
  # IT KEYS ON PROSE, NOT ON A STRUCTURED EVENT, so record what it depends on.
  # The "started" side matches stores/xnat/api/store_api.py:396-399 in
  # accessionflow 0.20.0 (the same lines as 0.19.0). The conditional remains:
  #
  #     if always_include:
  #         logger.info(f"Including {always_include} scans/files in upload from '{session.name}' to ...")
  #
  # Two ways that stops being true, neither of which fails loudly:
  #   * upstream rewords the line. Nothing breaks; the alert just stops firing.
  #   * A SITE SETS upload.direct.alwaysInclude TO "". That log line is guarded by
  #     `if always_include`, so emptying the key removes the started signal, the
  #     left side of the `unless` is always empty, and this alert silently never
  #     fires again. See the note on alwaysInclude in charts/edge/values.yaml.
  #
  # The unconditional alternative, store_api.py:575 "Uploaded '<resource>' in '<session>'",
  # was considered and rejected: it fires only after a resource has moved, so a
  # session that stalls at auth, project lookup or connection would emit nothing
  # and the earliest failures - the ones most worth paging on - would go unseen.
  #
  # THE INTENDED ENDPOINT IS STRUCTURE, NOT PROSE. accessionflow already emits
  # structured events with event, session and count keys, including
  # deid_failed, session_metadata_missing and xnat_repair_completed. There is simply no upload_started / upload_completed among
  # them yet. Adding those two upstream is a small change and would let this rule
  # key on `| json | event="upload_started"` instead of on a sentence, which is
  # both stabler and immune to the alwaysInclude coupling above. Until then the
  # prose match is the only thing available, so it is written down rather than
  # left as an accident.
  - alert: XNATResourceIncompleteAndStuck
    # Historical rationale retained below; its current disposition follows.
    # A resource EXISTS on XNAT and DISAGREES with the staged copy in a way that
    # uploading cannot fix: XNAT holds files staging does not, or holds a file
    # whose content differs. An upload only ever adds, so neither is repairable.
    # Only an operator deleting the resource on XNAT unblocks it.
    # Current review (2026-11-10):
    # A conflicting resource needs an authority decision after file-list and checksum
    # comparison. Deleting the resource is not the only possible resolution and can
    # destroy destination-only files. The annotation now requires preserving both sides
    # and consulting the data owner.
    # The automatic add-only upload cannot resolve every conflict. Operator review can
    # choose a corrected source, routing correction, or another recovery after
    # preserving both sides. Automatic repair of missing files remains supported.
    #
    # Historical rationale retained below; its current disposition follows.
    # THIS IS NARROWER THAN IT WAS, AND THE PIN IS WHY. Up to xnat-ingest 0.15.0
    # the uploader also skipped a merely SHORT resource: get_xnat_resource
    # returned None whenever the resource existed, so the caller logged "already
    # uploaded" and the session reported success while incomplete. From 0.15.3
    # (PR #170) a short resource is repaired by uploading the shortfall and logs
    # a warning, so it no longer reaches this rule. What is left is the
    # genuinely unrepairable case, which is what the summary claims.
    # KEEP THIS RULE AND ingest.image.tag IN STEP.
    # Current review (2026-11-10):
    # The rule detects repeated conflicting-file reports, not a proof that repair is
    # impossible. The current annotation calls for evidence and an authority decision.
    # The pinned store can repair a resource that is merely missing source files.
    #
    # THE COVERAGE HOLE RECORDED HERE IS NOW CLOSED, and the matcher that caused
    # it has been dropped. Kept as a note because the shape can come back the
    # next time someone tightens this rule.
    #
    # This rule used to require "Missing paths" as well as the phrase, so only
    # the missing-or-extra branch matched. 0.15.0 had a SECOND emitter of the
    # phrase -- "...different checksums. Please delete on XNAT to overwrite" --
    # carrying no such line, so a differing-only ERROR reached NO rule at all:
    # XNATUploadRetryStorm EXCLUDES the phrase on the assumption that this rule
    # covers it, and XNATUploadFailingForAllSessions is suppressed whenever
    # uploads are otherwise succeeding. Measured on the test cluster: 1214
    # occurrences of the phrase in 7 days, 0 of "Missing paths", so this alert
    # had never fired.
    #
    # The matcher could not just be deleted, because on 0.15.0 the phrase was
    # ALSO emitted continuously for a HEALTHY resource: XNAT reports an empty
    # digest until a catalog refresh populates it, and 0.15.0 compared the two
    # checksum dicts whole, so it called a complete resource mismatched. That is
    # what the 1214 were. Matching the phrase alone would have fired this alert
    # on all of them, and the annotation tells the operator to delete the
    # resource on XNAT, which on those is an instruction to delete good data.
    #
    # 0.15.3 fixes both ends at source. A file whose digest is empty is compared
    # by NAME only (compare_resource_with_xnat, and stores/xnat/api/check_store_api.py
    # guards the same way), so catalogue lag no longer reads as a mismatch; and
    # CORRECTION: an earlier version of this note said the "please delete on
    # XNAT to overwrite" emitter was GONE in 0.15.6 and that the matcher had
    # become a no-op. BOTH WERE WRONG. It is still at stores/xnat/remotes.py:891-893 (0.20.0)
    # and carries no "Missing paths" line; the grep that produced the claim
    # missed it because the phrase is split across two adjacent string literals.
    # Dropping the matcher is therefore NOT cosmetic -- it genuinely widens the
    # rule, which is what closes the hole. It also DOUBLES the rate for a
    # differing-only resource, because both emitters sit under the same
    # `if not comparison.complete:` and only the second is guarded by
    # `if comparison.differing`, so such a resource emits two matching lines per
    # pass and crosses the threshold in about half the time. That errs toward
    # alerting sooner on a real fault, so it is left as is.
    #
    # Historical rationale retained below; its current disposition follows.
    # So dropping it changes no match on this pin, and it closes the hole
    # against the next image that reintroduces a phrase-only emitter. It lands
    # in the same commit as the pin because the ordering is unsafe in both
    # directions: this matcher without the pin pages on good data, and the pin
    # without this note leaves prose that is no longer true.
    # Current review (2026-11-10):
    # This old conclusion was incorrect: the phrase-only emitter remains in the pinned
    # source, so removing the Missing paths requirement broadens matching. The
    # correction immediately above describes that behavior. Keep the conflict rule and
    # generic retry exclusion aligned.
    #
    # TIER-1 APPLIES TOO, and this is not a copy of the tier-2 rule. The upload
    # code path is SHARED: `accessionflow store xnat` resolves resources identically
    # whether the input is a local tree or s3://. What differs is only the
    # selector -- namespace is xnat-ingest here (one release, one namespace),
    # not xnat-upload, and the workload is edge-upload rather than
    # mgmt-upload-<edge>. Copying the tier-2 selector would load cleanly and
    # match no stream.
    #
    # Historical rationale retained below; its current disposition follows.
    # Tier-1 cannot hit the cause that produced it on tier-2 (there is no bucket
    # to read mid-write) but ANY interrupted upload reaches the same state: a
    # pod evicted mid-transfer, a dropped connection, an XNAT restart.
    # Current review (2026-11-10):
    # The pinned 0.19.0 store attempts missing-file repair on later passes. Interrupted
    # transfer alone does not establish the conflict matched by this rule. Persistent
    # extra or differing files need a separate reconciliation.
    #
    # WHY NOT FIRST-OBSERVATION. The same message appeared while XNAT was still
    # cataloguing an accepted upload: the checksum comparison runs BEFORE the
    # catalog refresh, and that refresh only fires when the file count is
    # exactly zero.
    #
    # TWO DIFFERENT LAG BEHAVIOURS HAVE BEEN MEASURED AND BOTH WERE REAL.
    # Where the refresh does fire, the window is bounded and lag emits ~10-15
    # occurrences once. Where it did not, because the count was never zero, the
    # digests stayed empty and the SAME message repeated every pass
    # indefinitely: 1214 occurrences in 22 hours on the test cluster, for a
    # resource that was completely healthy. No threshold separates that second
    # case from a genuinely stuck resource, because they are the same rate; the
    # matcher separated them.
    #
    # FROM 0.15.6 ON (PINNED 0.20.0) NEITHER SHOULD REACH THIS RULE. The name-only
    # comparison removes the second case at source, and the first now presents
    # as MISSING files, which the uploader repairs rather than reporting here.
    # The floor below is kept sized against the bounded burst anyway: it costs
    # nothing, and it is the one number here that does not depend on the pin
    # being what we think it is.
    #
    # THE THRESHOLD IS DERIVED FROM THE POLL INTERVAL, NOT FIXED, because one
    # error is emitted per stuck resource per upload poll. A hardcoded 30
    # silently assumed a 60s poll: at the 120s chart default a session with ONE
    # stuck resource produces about 23 errors an hour and could never reach it.
    #
    # Historical rationale retained below; its current disposition follows.
    # A CYCLE IS loop PLUS THE WORK, not loop, because the uploader sleeps the
    # whole interval rather than the remainder. At the measured elapsed of ~35s
    # the substituted threshold is
    #     max(20, 1800 / (loop + 35))
    # the count expected over HALF the 60m window, which makes the real rate
    # exactly twice the threshold by construction. It is 20 at both shipped
    # configurations, crossing in about 32 minutes at loop=60 and 52 at
    # loop=120, plus the 15m `for:`.
    # Current review (2026-11-10):
    # In pinned 0.19.0, the loop sleeps for the remainder of the configured interval
    # after work. The retained max(20, 1800 / (loop + 35)) threshold uses an older
    # conservative timing model. Its 35-second observation and derived crossing times
    # are historical, not a current timing guarantee. Expression changes are outside
    # this documentation sweep.
    #
    # Historical rationale retained below; its current disposition follows.
    # DERIVING FROM loop ALONE WOULD BREAK THE FAST END. The threshold would
    # grow as 1/loop while the real rate grows as 1/(loop+35), so any loop below
    # 37 would put the threshold above the achievable rate and the alert could
    # never fire. scripts/ci/render.sh uses this same model, so the two files
    # measure the same quantity.
    # Current review (2026-11-10):
    # This argument uses the older full-sleep timing model. Current 0.19.0 sleeps for
    # the interval remainder. The chart and CI retain the conservative formula; their
    # agreement verifies implementation consistency, not the accuracy of the old
    # measured cycle model.
    #
    # Historical rationale retained below; its current disposition follows.
    # THE FLOOR SETS AN UPPER LIMIT ON loop. Below the floor of 20 a single
    # stuck resource cannot reach the threshold, which happens at loop=145.
    # Integer division makes the enforced bound 137, erring on the safe side.
    # Current review (2026-11-10):
    # The chart still enforces its configured bound for this retained threshold model.
    # Actual alert latency depends on current pass duration, conflict-line count,
    # scheduling and available logs. The historical model is not a proof that a
    # particular interval guarantees detection.
    #
    # WHY [60m]. Measured gaps between occurrences: median 95s, but one of 39
    # MINUTES while the uploader was busy with a large session. A short window
    # goes false across that gap, resets the `for:` timer, and the alert never
    # fires.
    annotations:
      description: |
        The uploader repeatedly reports a resource whose file set or checksums
        conflict with the staged copy. XNAT may contain files absent from staging,
        or a same-named file may have different content. A resource that is only
        short is handled separately: accessionflow 0.19.0 attempts to upload the
        missing files and logs a repair attempt.

        1. Identify the exact project, experiment, scan and resource in the logs:
             kubectl -n xnat-ingest logs -l component=upload --since=1h | grep -F -- "{{ $labels.session }}"
           Inspect the nearby different-checksums error and later upload verdict.
        2. Compare both file listings and checksums. Keep the staged files and any
           additional destination files. Establish which version is authoritative
           with the data owner before changing or deleting an XNAT resource.
        3. Check the reclaimer's decision and the configured retention policy.
           Reclaim requires its own proof, but this alert alone cannot establish
           that all source data is intact or that another cleanup path did not run.
        4. The pinned 0.19.0 store clears cached XNAT listings on later passes.
           A restart is not required solely to refresh that cache. Do not delete a
           destination resource or restart a deployment just to clear this alert.

        Historical context: older 0.15.0-era uploads could keep stale listings for
        an entire process lifetime. A historical test recovered 383 files after a
        restart; another recorded recovery followed deletion at 07:17 and upload
        at 07:18:26 without a restart. The run dates and release attribution of
        those old measurements are not verified (2026-11-10). They do not establish
        that deletion is safe for a current conflict. Current cache behavior is
        verified directly in the pinned store_api.py implementation.
      summary: "Repeated XNAT file conflicts for {{ $labels.session }}"
    # Line breaks match the tier-2 rule character for character. The cross-tier
    # check in scripts/ci/promtool.sh compares the rendered rule as a string, so
    # a purely cosmetic difference in where `| json` sits reads as drift and
    # would have to be exempted, which would blunt the check for the one field
    # that genuinely does differ.
    expr: "sum by (cluster, session) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  | json | message =~ \".*already exists on XNAT with different checksums.*\"\n  | regexp `resource in .(?P<resource>[^:]+:[^:]+:[^:]+):`\n  | label_format session=\"{{.resource}}\" [60m])) > __UPLOAD_STUCK_ERRORS__\n"
    for: 15m
    labels:
      category: xnat-delivery
      severity: warning
      source: loki-ruler
  - alert: SessionUploadStalled
    annotations:
      description: |
        A start is present without the matching completion in the rule's 15-minute
        lookback. The condition must then persist for 5 minutes. It does not measure
        15 minutes of elapsed transfer time and can fire sooner than that.
        A large session, slow network, destination error, or missing completion log
        can cause this. Inspect the actual transfer stage and session timestamps.
          kubectl -n xnat-ingest logs -l component=upload --since=1h
        Use the kubeconfig for the cluster that emitted this event. A cleared alert
        only means its expression is no longer true; verify the destination files.
      summary: "Start without observed completion for {{ $labels.session }} on {{ $labels.cluster }}"
    expr: "(sum by (cluster, session) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  |~ \"Including .* scans/files in upload from '\"\n  | regexp \"in upload from '(?P<session>[^']+)'\"\n  [15m])) > 0)\nunless on (cluster, session)\n(sum by (cluster, session) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  |~ \"Successfully uploaded all files in\"\n  | regexp \"Successfully uploaded all files in '(?P<session>[^']+)'\"\n  [15m])) > 0)\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
  - alert: XNATBacklogGrowing
    expr: "(sum(count_over_time(\n  {namespace=\"xnat-ingest\", component=\"assign\"}\n  | json | session != \"\" [30m]))\n -\n sum(count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n\
      \  |~ \"Successfully uploaded all files in\" [30m]))\n) > 3\n"
    for: 30m
    labels:
      severity: warning
      source: loki-ruler
    annotations:
      summary: XNAT upload backlog is growing
      description: |
        The rule compares the configured staging and upload log rates. It is an
        activity estimate, not a measured queue length or count of unique sessions.
        The direct uploader may be slow or failing; missing log signals can also
        skew the comparison. Inspect the local staging tree and upload pod:
          kubectl -n xnat-ingest logs -l component=upload --since=1h
        Verify destination files and current source retention before taking action.
  - alert: InvalidSessionAssigned
    # GUIDING: one assign failure needs review, even below the spike threshold.
    expr: |
      sum by (cluster) (count_over_time(
        {namespace="xnat-ingest", app="xnat-ingest", component="assign", level="ERROR"}
        | json | __error__=""
        | json stage_message="message" | __error__=""
        | stage_message =~ "(?s)^Could not resolve the labels of .*"
        [10m])) > 0
    for: 1m
    labels:
      severity: warning
      source: loki-ruler
      category: edge-pipeline
    annotations:
      summary: "Assign reported missing routing IDs on {{ $labels.cluster }}"
      description: |
        Assign reported missing project, subject, or session IDs. Check the assign
        logs and assigned/__invalid__ under storage.pipeline.hostPath. Keep these
        files for recovery; do not delete them to clear the alert. They can be the
        only retained copy even when facility backup is enabled, because its DICOM
        callback can fail or the source can arrive by another path.
        Use the affected edge's kubeconfig:
          kubectl -n xnat-ingest logs -l app=xnat-ingest,component=assign --since=15m
        Follow the recovery procedure in docs/components/accessionflow.md and check
        routing IDs before replay. The alert clears when the log leaves its
        10-minute window. That does not prove that the session has recovered.
  - alert: DICOMValidationFailureSpike
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"assign\"}\n  |~ \"(?i)invalid|validation.*fail\" [1h])) > 10\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
    annotations:
      summary: "More than 10 matching validation log lines on {{ $labels.cluster }}"
      description: |
        The retained expression counts lines matching invalid or validation.*fail
        in its one-hour window. It does not count distinct sessions and does not
        prove that every matching line denotes a newly invalid DICOM session.
        Inspect the assign logs and the assigned/__invalid__ tree. Verify missing
        routing fields and scanner input before changing configuration. The pinned
        missing-ID error matches this filter through __invalid__ in its saved path;
        the separate already-saved-as-invalid warning also matches. Use
        InvalidSessionAssigned for the specific 0.19.0 missing-ID error prefix.
  - alert: SessionStagedNotConfirmedInXNAT
    # SHARED WITH charts/mgmt: expr, for and labels are the tier-2 rule verbatim
    # (the namespace regex already covers xnat-ingest). Only the steps differ,
    # because they name this tier's objects; promtool.sh lists that difference.
    # Fed by the staged-reclaimer CronJob, whose pods must carry
    # component=s3-reclaimer (templates/staged-reclaimer.yaml).
    expr: |
      (sum by (cluster, session) (count_over_time(
        {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
        | json | event=~"reclaim_.*" | session != "" [24h] offset 48h)) > 0)
      unless on (cluster, session)
      (sum by (cluster, session) (count_over_time(
        {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
        | json | event="reclaim_confirmed" [72h])) > 0)
    for: 30m
    labels:
      severity: critical
      source: loki-ruler
      category: delivery-absence
    annotations:
      summary: "No recent reclaim confirmation for {{ $labels.session }}"
      description: |
        The rule found a staged/reclaim observation in its 48-to-72-hour age window
        without a matching confirmation in its 72-hour comparison window. This is
        a bounded log comparison, not proof that the session was never confirmed.
        It depends on reclaimer activity, retained logs and matching session labels.

        1. Find the source directory or bucket from the selected pod configuration.
           Do not derive a bucket or deployment name from the cluster label alone.
        2. Inspect the uploader and the exact session:
             kubectl -n xnat-ingest logs -l component=upload --since=1h | grep -F -- "{{ $labels.session }}"
        3. Check XNAT itself for the expected resources and all their files.
        4. Inspect reclaim_kept, reclaim_confirmed and reclaim_unavailable events.
           incomplete_in_xnat means the proof failed; unavailable means the job
           could not establish proof. Review ReclaimerRunUnavailable as applicable.

        Historical context: old label-only all_uploaded checks could skip an empty
        resource. The pinned 0.19.0 store compares file sets/checksums and refreshes
        listings. Its success or skip line still does not certify header extraction
        or all downstream XNAT processing. Keep source evidence until verified.
  - alert: ReclaimerRunUnavailable
    # SHARED WITH charts/mgmt, as SessionStagedNotConfirmedInXNAT above.
    # Replaces KubeJobFailed for the reclaimer on this tier: that one fired on a
    # single self-healing DNS blip (2026-09-27) and stayed for days, because the
    # failed Job is kept. This needs the run to keep failing for 75m.
    expr: |
      (sum by (cluster, reason) (count_over_time(
        {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
        | json | event="reclaim_unavailable" | session = "" [3h])) > 0)
      unless on (cluster)
      (sum by (cluster) (count_over_time(
        {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
        | json | event="reclaim_finished" [70m])) > 0)
    for: 75m
    labels:
      severity: warning
      source: loki-ruler
      category: delivery-absence
    annotations:
      summary: "Reclaimer proof unavailable on {{ $labels.cluster }}: {{ $labels.reason }}"
      description: |
        The reclaimer logged a run-level unavailable event without a recent finish
        that suppresses it. The condition must persist for 75 minutes. One transient
        failure followed by a timely successful run normally clears before firing.
        This reports unavailable proof, not a guarantee that every session was
        examined or that no other process deleted data.

        1. Read the reason and surrounding run events. A failed Job pod may have
           been removed; use retained Loki logs if kubectl logs are unavailable.
             kubectl -n xnat-ingest logs -l component=s3-reclaimer --tail=100
        2. Check the dependency named by the reason: XNAT access and credentials,
           the filer/bucket where applicable, required tools, or invalid policy.
           Select the configured cluster and namespace before running the command.
        3. Inspect staged sessions and their age. Unavailable fan-out is best effort
           and capped. SessionStagedNotConfirmedInXNAT does not cover every session
           when enumeration, reporting or the reclaimer itself stops.

        The alert has no deletion action. A silent crash or a job that never starts
        cannot emit this signal. Check CronJob status and the relevant Prometheus
        job-health alerts as well as the log-based rule.
- name: ais-edge-pipeline-info
  interval: 30s
  rules:
  - alert: XNATUploadSuccess
    annotations:
      description: |
        The uploader on {{ $labels.cluster }} reported a successful file verdict
        for session {{ $labels.session }}. Inspect the affected pod:
          kubectl -n xnat-ingest logs -l component=upload --since=1h | grep -F -- "{{{ $labels.session }}}"
        This does not certify header extraction, metadata population, downstream
        processing or durability of an independent backup. Check those separately.
        The rule suppresses recent repair attempts for its configured window.
      summary: "XNAT file upload reported complete: {{ $labels.session }}"
    # A REPAIR IS NOT AN UPLOAD. accessionflow logs the same success line after
    # re-sending files XNAT had lost, so `unless` drops any session with a
    # "Repaired" line in the last 20m; XNATRepairAttempted reports those.
    # 20m = this rule's 10m window + up to 10m between the two lines of one
    # pass (the verdict and metadata calls; 5-8s measured on 2026-09-28).
    # Edge: a new pass for the same session inside those 20m is not mailed.
    expr: |
      (
        sum by (cluster, session) (
          count_over_time(
            {namespace="xnat-ingest", component="upload"}
            |~ "Successfully uploaded all files in"
            | regexp "Successfully uploaded all files in '(?P<session>[^']+)'"
            [10m]
          )
        ) > 0
      )
      unless on (cluster, session)
      sum by (cluster, session) (
        count_over_time(
          {namespace="xnat-ingest", component="upload"}
          |~ "Repaired [0-9]+ incomplete resource"
          | regexp `incomplete resource\(s\) on XNAT in '(?P<session>[^']+)'`
          [20m]
        )
      )
    for: 0s
    labels:
      category: pipeline-success
      severity: info
      source: loki-ruler
  - alert: XNATRepairAttempted
    # XNAT HELD THE SESSION WITH FILES MISSING, AND THE UPLOADER TRIED TO
    # RE-SEND THEM. accessionflow logs "Repaired" only when a resource already
    # existed on XNAT with files missing (stores/xnat/api/store_api.py, repaired_on_xnat); a
    # first upload never does. Seen 2026-09-23 and 2026-09-28: XNAT restarted,
    # listed 0 of N files for sessions it held, and every edge re-sent them.
    # AN ATTEMPT: stores/xnat/api/store_api.py:603-611 in 0.20.0 logs
    # this line before the verdict, even when the re-send failed.
    # A separate Completed repair line and xnat_repair_completed event
    # follow only a successful verdict (lines 672-680). This rule still
    # matches the attempt. Inspect later errors and destination evidence.
    # $value is the number of scan resources (max, not sum: a retried repair
    # must not count twice).
    # CAUTION: matches accessionflow 0.20.0 repair wording; a reword silences it.
    expr: |
      max by (cluster, session) (
        max_over_time(
          {namespace="xnat-ingest", component="upload"}
          |~ "Repaired [0-9]+ incomplete resource"
          | regexp `Repaired (?P<resources>[0-9]+) incomplete resource\(s\) on XNAT in '(?P<session>[^']+)'`
          | unwrap resources
          | __error__=""
          [10m]
        )
      ) > 0
    for: 0s
    labels:
      category: xnat-integrity
      severity: warning
      source: loki-ruler
    annotations:
      summary: XNAT was missing files for {{ $labels.session }}; the uploader tried to re-send them
      description: |
        The uploader found missing files in an existing XNAT resource and attempted
        a re-send. The reported resource count uses the rule's maximum, not a sum of
        unique repairs. This notification does not establish that the repair worked.
          kubectl -n xnat-ingest logs -l component=upload --since=1h | grep -F -- "{{ $labels.session }}"

        In accessionflow 0.19.0, the Repaired line precedes the final verdict. Look
        for Completed repair or xnat_repair_completed and inspect later errors and
        the actual destination listing. File completion does not certify metadata
        header extraction. XNATUploadSuccess excludes a session with recent repair
        evidence for 20 minutes, including a new pass within that interval.

        Missing files can reflect a changed source, archive/catalog inconsistency,
        or data removed at the destination. Do not infer the cause from this line.
        Check XNAT storage and event history. Automatic re-send requires available
        staged files; after their retirement, restore from a verified retained
        source through an approved recovery process. The absence of this alert is
        not evidence that older, no-longer-staged sessions are complete.
  - alert: XNATAuthFailure
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  != \"it/s\"\n  |~ \"(?i)(unauthorized|forbidden|status[^0-9]{0,10}40[13]\\\\b|HTTP[^0-9]{0,10}40[13]\\\
      \\b|\\\\b40[13][^0-9]{0,3}(unauthorized|forbidden))\" [15m])) > 3\n"
    for: 0s
    labels:
      category: xnat-auth
      severity: warning
      source: loki-ruler
    annotations:
      description: |
        More than three matching authentication-rejection log lines occurred in
        15 minutes. The filter targets HTTP 401/403 context. It does not count
        unique failed requests or prove that routine expiry is impossible; multiple
        workers, retries or repeated lines can contribute.

        1. Inspect the affected uploader and adjacent network/server errors:
             kubectl -n xnat-ingest logs -l component=upload --since=1h
           This rule does not detect HTTP 5xx or prove XNAT is otherwise healthy.
        2. Check account status, role and the configured credentials Secret without
           printing the password. For the tier-1 direct path, the Secret is selected
           by upload.direct.existingSecret; management has its own configured Secret.
        3. accessionflow 0.19.0 refreshes connections/listings on later loop passes.
           Credentials supplied through environment variables still require a pod
           replacement after a verified Secret change. Identify the deployment from
           pod labels before an authorized rollout; do not guess it from cluster.
        4. Check source retention and reclaim decisions. Failed proof should prevent
           that reclaim path, but this alert cannot certify that no data was lost.

        Historical cookie-expiry incidents self-healed on older loop behavior. The
        old approximately 62-second measurement is not a current recovery deadline.
        Use current timestamps and a successful authenticated operation to confirm
        recovery, rather than a quiet alert window.
      summary: XNAT kept rejecting authenticated calls from the uploader on {{ $labels.cluster }}
  - alert: OrthancDeidLuaError
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", app=\"orthanc\"}\n  |~ \"(?i)lua.*error|traceback|stack\\\\s+traceback\" [10m])) > 0\n"
    for: 1m
    labels:
      severity: warning
      source: loki-ruler
      category: deid
    annotations:
      summary: "Orthanc receiver Lua callback error on {{ $labels.cluster }}"
      description: |
        An Orthanc Lua error appeared in the last ten minutes. Inspect the full
        receiver traceback and callback context, including routing configuration,
        salt loading and facility-backup writes. With the current ingest engine,
        Orthanc receives DICOM; accessionflow performs de-identification.
        Only the deprecated Lua engine uses the legacy de-identification profile.
        A callback error can prevent a backup or forwarding step. Check actual
        files and receiver status before assuming a study was preserved.
  - alert: IngestStageError
    # Historical rationale retained below; its current disposition follows.
    # Vector promotes JSON log severity to the level stream label, then
    # removes that field from the body. Match that label, not the word
    # ERROR in a filename or message. Plain tracebacks are JSON-wrapped by
    # Vector with level=unknown, so inspect their decoded message too.
    # The assign missing-ID diagnostic belongs to DICOMValidationFailureSpike.
    # Its per-pass summary adds no cause; each other concrete error still fires.
    # Current review (2026-11-10):
    # The 0.19.0 assign missing-ID diagnostic is covered by InvalidSessionAssigned.
    # DICOMValidationFailureSpike retains an older broad text match and is not a
    # complete detector for that diagnostic. Other concrete stage errors remain
    # relevant.
    expr: |
      sum by (cluster, component) (count_over_time(
        {namespace="xnat-ingest", app="xnat-ingest", component=~"group|group-fs|assign|package"}
        | json | __error__=""
        | json stage_message="message" | __error__=""
        | level=~"(?i)ERROR|CRITICAL" or stage_message=~"(?s)^Traceback \\(most recent call last\\):.*"
        | stage_message !~ "(?s)^(Could not resolve the labels of .*|Label completed with [0-9]+ errors)$"
        [10m])) > 0
    # One event remains in the window long enough to meet this hold.
    for: 1m
    labels:
      severity: warning
      source: loki-ruler
      category: edge-pipeline
    annotations:
      summary: "accessionflow {{ $labels.component }} logged an error on {{ $labels.cluster }}"
      description: |
        The {{ $labels.component }} stage logged ERROR, CRITICAL, or a Python
        traceback within the last 10 minutes. Inspect the stage logs on this
        edge and check which sessions did not complete:
          kubectl -n xnat-ingest logs -l app=xnat-ingest,component={{ $labels.component }} --since=15m
        This reports a logged error. The alert clears when its evidence leaves
        the time window; that does not prove recovery or data loss. A process
        killed without a log, an image pull failure, or missing telemetry can
        remain silent here. Check pod status and previous container logs too.

  - alert: DeidentifyStageError
    # Historical rationale retained below; its current disposition follows.
    # Counterpart to OrthancDeidLuaError for the accessionflow engine. Whichever
    # engine a site runs, a failure to de-identify has to be visible; without
    # this, switching to ingest.deidentify silences OrthancDeidLuaError and puts
    # nothing in its place, leaving the one thing you cannot afford to miss
    # unwatched.
    # Current review (2026-11-10):
    # This is the current accessionflow de-identification error signal. Orthanc/Lua de-
    # identification is deprecated; its retained error rule covers existing legacy
    # deployments and receiver callbacks. New deployments use the ingest engine.
    #
    # Historical rationale retained below; its current disposition follows.
    # Structured ERROR/CRITICAL is a stream label after Vector processing;
    # it need not leave the word "error:" in the body. Keep the existing
    # text fallback because the stage also logs tracebacks as plain text.
    # tqdm writes progress bars to the same stream
    # ("Processing staged sessions ... 100%|####|"), so the pattern is anchored
    # on error words and never on a bare percentage.
    # Current review (2026-11-10):
    # Progress bars are disabled by TQDM_DISABLE=1 in the current stage environment, set
    # since 2026-10-28. Historically they shared the stream. Keep the anchored error-
    # word match as defense if the setting is removed; a bare percentage is not an error
    # signal.
    expr: |
      sum by (cluster) (count_over_time(
        {namespace="xnat-ingest", component="deidentify", level=~"(?i)ERROR|CRITICAL"}
        [10m])) > 0
      or
      sum by (cluster) (count_over_time(
        {namespace="xnat-ingest", component="deidentify"}
        |~ "(?i)traceback|error:|exception|no deidentification recipe file" [10m])) > 0
    for: 1m
    labels:
      severity: warning
      source: loki-ruler
      category: deid
    annotations:
      summary: accessionflow deidentify errored on {{ $labels.cluster }}
      description: |
        The accessionflow deidentify stage logged an error in the last ten minutes.
        Check the pod logs and the selected inline ingest.deidentify.specs or the
        external ingest.deidentify.specConfigMap. Confirm the recipe covers the
        received format and that required files and credentials are available.
        The time window can expire before the cause is fixed. This alert establishes
        neither data loss nor recovery and cannot detect a process killed without
        a log. Check pod status and previous-container output as well.
  # OrthancStorageGrowing WAS REMOVED (2026-11-10). It counted "new stored instance",
  # a line Orthanc writes only with --verbose (and worded "New instance stored"), so
  # it could never fire. main removed it earlier (docs/TOUR.md there). Disk space is
  # EdgeDiskLow; data stuck in Orthanc is StageBacklogAgeing (derived.orthancStorage).
- name: ais-edge-data-policy
  interval: 5m
  rules:
  - alert: EdgeDiskLow
    expr: "sum by (cluster, stage) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"data-policy\"}\n  | json | event=\"stage_report\"\n  | free_pct < __DP_MIN_FREE_DISK_PCT__ [15m])) > 0\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
      category: edge-storage
    annotations:
      summary: Edge {{ $labels.cluster }} is low on disk at {{ $labels.stage }}
      description: |
        The reporter measured free space below the configured threshold at
        {{ $labels.stage }} on {{ $labels.cluster }}. The threshold comes from
        dataPolicy.originals.facilityBackup.minFreeDiskPercent.

        This alert itself deletes nothing. Retention jobs and stage unlink options
        operate independently. Low disk space can prevent new writes, including
        backup writes; this message cannot certify that every accepted file is safe.
          kubectl -n xnat-ingest logs -l app=data-policy --tail=50
        Use the affected edge's kubeconfig. Check the actual hostPath filesystem,
        free bytes and inodes. Different directory names can share the same disk.
        Grow capacity or apply a verified retention decision. Review dry-run output
        and destination proof before enabling cleanup. Do not remove original or
        invalid-session files merely to dismiss the alert.
  - alert: StageBacklogAgeing
    # dataPolicy.reporter.stageAgeAlertAfter MADE REAL.
    #
    # PipelineSessionStuck is per session and fires only on one whose reclaim
    # condition keeps failing. A stage whose reclaim is `never` returns before
    # that check runs, so it can never raise stage_stuck -- and `never` is the
    # default for the deidentified tree. This is the question that needs no
    # reclaim condition at all: has the oldest thing here been here too long.
    # NOT for policy "forever" (originals kept by design, e.g. the facility
    # backup): old entries there are the point, so it could never clear. On
    # cai-lfs3 it fired daily from 2026-09-19 on 49-day-old originals.
    expr: |
      sum by (cluster, stage) (count_over_time(
        {namespace="xnat-ingest", component="data-policy"}
        | json | event="stage_report" | policy != "forever"
        | oldest_age_s > __DP_STAGE_AGE_ALERT_AFTER_S__ [15m])) > 0
    for: 15m
    labels:
      severity: warning
      source: loki-ruler
      category: edge-storage
    annotations:
      summary: '{{ $labels.stage }} on {{ $labels.cluster }} has entries older than the configured limit'
      description: |
        The reporter's oldest entry exceeds dataPolicy.reporter.stageAgeAlertAfter.
        This is a sampled age signal; it does not establish the reason a stage is
        retaining files or measure its current processing rate. Stages with a
        forever policy are excluded by the expression.

        The alert itself deletes nothing. A stopped downstream stage, a deliberately
        retained tree, or a reclaim condition that has not passed can produce it.
        Data-policy dry run suppresses that engine's deletions. CLI unlink options
        and separate reclaim jobs can still remove eligible files independently.
          kubectl -n xnat-ingest logs -l app=data-policy --tail=100 | grep -F stage_report
        Use the affected edge's kubeconfig. Compare stage_report with stage logs,
        pod status, policy settings and available disk space. Check EdgeDiskLow;
        old entries alone do not establish a deadline or justify deleting data.
  # >>> DataPolicyReporterSilent: templates/observability.yaml drops this block
  # when dataPolicy.reporter.enabled is false. Keep both marker lines.
  - alert: DataPolicyReporterSilent
    # WATCHES THE WATCHER. EdgeDiskLow, StageBacklogAgeing and
    # QuarantinedDataUnresolved read only stage_report lines. When those stop,
    # all three go quiet, which looks exactly like a healthy site.
    # absent_over_time is true when nothing matched, including a reporter that
    # never started, so no series has to exist first.
    # __CLUSTER_LABEL__: this site's clusterLabel, so the alert carries it.
    # __DP_REPORT_SILENCE_S__: max(30m, 3 x dataPolicy.reporter.interval).
    # Both substituted by templates/observability.yaml.
    expr: |
      absent_over_time(
        {namespace="xnat-ingest", component="data-policy", cluster="__CLUSTER_LABEL__"}
        | json | event="stage_report"
        [__DP_REPORT_SILENCE_S__s])
    for: 0s
    labels:
      severity: warning
      source: loki-ruler
      category: edge-storage
    annotations:
      summary: data-policy on {{ $labels.cluster }} has stopped reporting
      description: |
        No stage_report was observed for {{ $labels.cluster }} within the configured
        __DP_REPORT_SILENCE_MIN__-minute threshold. Missing reports undermine disk,
        stage-age and quarantine alerts that depend on them. Existing evidence can
        still persist briefly in another rule's lookback window.

        Check whether the reporter is running and whether Vector can deliver to Loki:
          kubectl -n xnat-ingest get pods -l app=data-policy
          kubectl -n xnat-ingest logs -l app=data-policy --tail=50
        Use the affected edge's kubeconfig. This alert itself neither deletes nor
        blocks data. It cannot detect its own unavailable Loki ruler or notification
        path. Verify reporter recovery by observing fresh stage_report events.
  # <<< DataPolicyReporterSilent
  - alert: PipelineSessionStuck
    expr: "sum by (cluster, stage) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"data-policy\"}\n  | json | event=\"stage_stuck\" [15m])) > 0\n"
    for: 10m
    labels:
      severity: warning
      source: loki-ruler
      category: edge-pipeline
    annotations:
      summary: A session on {{ $labels.cluster }} is stuck at {{ $labels.stage }}
      description: |
        A reported session has failed its configured reclaim condition longer than
        dataPolicy.reporter.stuckAfter. The engine retained the copy at that check.
        This does not prove that every copy is intact, that no other cleanup path
        ran, or that the condition cannot recover without an operator.

        Inspect stage_stuck and reclaim_kept events for the session, reclaim word,
        age and reason. Check the downstream stage and the proof it should produce.
        A stopped stage, missing proof, or a policy that cannot apply to this
        configuration needs investigation before any cleanup decision.
          kubectl -n xnat-ingest logs -l app=data-policy --tail=100 | grep -F stage_stuck
        Use the affected edge's kubeconfig and compare destination files directly.
        The alert clears as its log evidence ages out; verify recovery separately.
  # THE REJECTION ITSELF, as opposed to the quarantine directory ageing.
  #
  # This rule was missing on this branch entirely, while everything around it
  # assumed it existed: QuarantinedDataUnresolved's own description below tells
  # the operator the AE title "is in the DICOMRejectedUnmappedAET mail", and
  # files/deidentify-and-forward.lua:188 carries
  #
  #     -- Keep the "REJECT: no project mapped for CalledAET <AET>" wording:
  #     -- the DICOMRejectedUnmappedAET alert rule matches on it.
  #
  # So the Lua was preserving a log string for a consumer that did not exist,
  # and the surviving alert pointed at a mail nobody could have received.
  #
  # THE GAP WAS A DETECTION GAP, not bookkeeping. QuarantinedDataUnresolved
  # fires on the quarantine directory's OLDEST ENTRY via data-policy's
  # stage_report, which is hours later and keyed on directory age. An unmapped
  # AE title arriving now produced a REJECT line nothing watched, and then
  # silence until the directory aged past alertAfter. The scanner meanwhile
  # believes it delivered: the studies are neither in XNAT nor reported.
  #
  # Selector matches main's, and both labels it needs are forwarded by
  # files/vector-local.yaml: app comes from the pod's `app: orthanc` label.
  - alert: DICOMRejectedUnmappedAET
    expr: |
      sum by (cluster, aet) (
        count_over_time(
          {namespace="xnat-ingest", app="orthanc"}
          |~ "REJECT: no project mapped for CalledAET"
          | regexp "CalledAET (?P<aet>[A-Za-z0-9._-]+)"
          [5m]
        )
      ) > 0
    for: 0s
    labels:
      severity: warning
      source: loki-ruler
      category: dicom-routing
    annotations:
      summary: "Legacy Lua routing rejected AE title '{{ $labels.aet }}' on {{ $labels.cluster }}"
      description: |
        This signal belongs to the deprecated Orthanc/Lua de-identification path.
        It reports rejected instances, not a verified count of complete studies.
        The old callback can accept the DICOM transport and then reject its routing.
        Check callback errors and the quarantine directory before assuming a copy
        was saved. A rejection log alone does not prove quarantine or XNAT state.

        Preserve available source files and identify the originating scanner and
        calling/called AE titles from the logs. Use the documented legacy recovery
        procedure only for an existing legacy deployment. New deployments perform
        de-identification in accessionflow (xnat-ingest), with Orthanc as receiver.
        Do not change an AE map or re-send data until the intended project routing
        and the destination contents have been checked.
  - alert: QuarantinedDataUnresolved
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"data-policy\"}\n  | json | event=\"stage_report\"\n  | stage=\"originals.quarantine\"\n  | oldest_age_s > __DP_QUARANTINE_ALERT_AFTER_S__\
      \ [15m])) > 0\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
      category: dicom-routing
    annotations:
      summary: Quarantined studies on {{ $labels.cluster }} older than the configured limit
      description: |
        The reporter found entries in quarantine older than
         dataPolicy.originals.quarantine.alertAfter. This is retained legacy
        routing evidence. It does not establish whether the files reached XNAT
        through a later attempt or whether another source copy exists.

        Check the original rejection, the actual retained files and the destination
        before recovery or deletion. The old DICOMRejectedUnmappedAET alert can
        identify an offending AE title if those logs remain available. Existing
        legacy deployments must verify project routing before a controlled re-send.
        New deployments use accessionflow for de-identification, not the deprecated
        Orthanc/Lua engine. An operator must reconcile retained quarantine with any
        successful later delivery; clearing an alert does not itself perform that
        reconciliation or establish that all instances of a study are present.
