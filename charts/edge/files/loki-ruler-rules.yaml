# TIER-1 NOTE (why this file is not charts/mgmt's copy)
# ---------------------------------------------------------------------------
# This is the SINGLE-NODE ruleset. It was taken from the pre-consolidation
# tier-1 branch, not from the tier-2 management chart, because tier-2's rules
# key on components that DO NOT EXIST here: `s3-uploader` (there is no S3 hop)
# and `s3-reclaimer` in namespace `xnat-upload` (there is no staging bucket and
# no management-side reclaimer). Copying those wholesale gives a file that
# loads cleanly and matches no stream — silence that is indistinguishable from
# a healthy site.
#
# Two changes were needed on top of the old tier-1 file:
#   * namespace="xnat-upload" -> "xnat-ingest". The consolidated chart is ONE
#     release in ONE namespace; the old tier-1 split upload into its own.
#   * EdgeDiskLow and QuarantinedDataUnresolved appended. The data-policy
#     engine post-dates the old tier-1, and on a single node EdgeDiskLow is the
#     ONLY disk-exhaustion alert in the system — node-exporter is disabled and
#     there is no PVC-full rule.
#
# Every selector here is checked against the labels the chart actually renders
# (app=orthanc, component=dicom-receiver|group|assign|upload|data-policy, all in
# namespace xnat-ingest) and against the stream labels Vector promotes
# (cluster, namespace, pod, container, node, app, component, level).
# ---------------------------------------------------------------------------
# =============================================================================
# Loki ruler rules — log-derived alerts.
# =============================================================================
# These alerts evaluate LogQL queries on a schedule inside Loki and emit to
# the kube-prometheus-stack Alertmanager (configured in loki-values.yaml.tpl
# rulerConfig.alertmanager_url). They cover the pipeline events emitted by the
# Orthanc, xnat-ingest group-orthanc/assign, and xnat-ingest upload pods.
#
# TIER-1 (single node): the pipeline is
#   Orthanc (deid) -> xnat-ingest group-orthanc -> assign -> upload -> XNAT (HTTPS).
# There is NO S3 hop and NO s3-uploader stage anymore, so rules that used to
# key on the deleted s3-uploader component's events (upload_started /
# upload_completed to SeaweedFS, mc-alias failures) have been retargeted onto
# the real terminal upload stage (namespace="xnat-ingest", component="upload")
# or removed where the signal was purely s3-uploader-internal. The SAME
# alerting capability — stalled sessions, upload failures, XNAT upload success,
# and storage backlog — is preserved against the components that still exist.
#
# The source-of-truth for these alerts is the structured JSON event itself.
# Loki receives every log line from the single Vector DaemonSet, so running
# the rules in Loki is the natural path.
#
# Rule file format is identical to Prometheus rule files. Loki's ruler
# writes firing alerts to Alertmanager v2 with the labels and annotations
# below, so the existing email/Slack receivers keep working unchanged.
#
# Companion: alerts/critical.yaml + alerts/warning.yaml + alerts/info.yaml
# hold the K8s-metric-based alerts (node NotReady, pod restarts) that live in
# Prometheus.
# =============================================================================
# NOTE: BARE `groups:` DOCUMENT, not a ConfigMap.
# charts/edge/templates/observability.yaml wraps this in the ConfigMap that
# Loki's ruler sidecar watches (label loki_rule). The pre-consolidation copy
# was a complete ConfigMap manifest, and wrapping THAT produced a ConfigMap
# nested inside a ConfigMap: the sidecar would have written a file containing
# Kubernetes YAML where rule groups belong, and Loki would have loaded NO
# rules at all while everything looked healthy.
#
# TIER-1 SCOPING: XNATUploadSuccess and XNATAuthFailure select
# component="upload", where tier-2 selects the whole xnat-upload namespace.
# That is not gratuitous drift — it is forced by the single-namespace collapse.
#
# On tier-2, namespace xnat-upload contains ONLY the uploader. On tier-1 the
# one namespace also holds Loki, Grafana, Prometheus and Alertmanager, so a
# bare {namespace="xnat-ingest"} selector matches THEIR logs too. Measured on
# the live install:
#
#   * Loki logs each ruler query at INFO, and that query text contains both
#     "Successfully uploaded all files in" and the regexp pattern. The rule
#     therefore matched the ruler evaluating the rule, and fired a second
#     XNATUploadSuccess whose session label was the literal
#         (?P<session>[^
#     A self-sustaining alert about its own evaluation.
#   * XNATAuthFailure would match a 401/403 logged by ANY pod in the namespace,
#     not just the uploader.

groups:
- name: ais-edge-pipeline-critical
  interval: 1m
  rules:
  - alert: XNATUploadFailingForAllSessions
    annotations:
      description: No completed uploads while failures keep coming. Likely network / SeaweedFS / credential break. Check `kubectl --kubeconfig kubeconfig-{{ $labels.cluster }} logs -n xnat-ingest -l component=s3-uploader`.
      summary: All upload attempts have failed for 15+ minutes on {{ $labels.cluster }}
    expr: "(sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"s3-uploader\"}\n  | json | event=\"upload_failed\" [15m])) > 0)\nunless on (cluster)\n(sum by (cluster) (count_over_time(\n\
      \  {namespace=\"xnat-ingest\", component=\"s3-uploader\"}\n  | json | event=\"upload_completed\" [15m])) > 0)\n"
    for: 15m
    labels:
      severity: critical
      source: loki-ruler
- name: ais-edge-pipeline-warning
  interval: 1m
  rules:
  - alert: XNATUploadRetryStorm
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  |~ \"(?i)error|failed|exception|traceback\" [10m])) > 5\n"
    for: 2m
    labels:
      severity: warning
      source: loki-ruler
    annotations:
      summary: '>5 XNAT upload errors in 10 minutes on {{ $labels.cluster }}'
      description: xnat-ingest-upload is retrying. Likely transient network or XNAT credentials. Inspect `kubectl logs -n xnat-ingest -l component=upload` for the actual error.
  - alert: SessionUploadStalled
    annotations:
      description: mc mirror started but did not complete within the expected window. Could be a slow network, large session, or stuck retry.
      summary: Session {{ $labels.session }} on {{ $labels.cluster }} has been uploading for 15+ minutes
    expr: "(sum by (cluster, session) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"s3-uploader\"}\n  | json | event=\"upload_started\" [15m])) > 0)\nunless on (cluster, session)\n(sum by\
      \ (cluster, session) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"s3-uploader\"}\n  | json | event=\"upload_completed\" [15m])) > 0)\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
  - alert: XNATBacklogGrowing
    expr: "(sum(count_over_time(\n  {namespace=\"xnat-ingest\", component=\"assign\"}\n  | json | session != \"\" [30m]))\n -\n sum(count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n\
      \  |~ \"Successfully uploaded all files in\" [30m]))\n) > 3\n"
    for: 30m
    labels:
      severity: warning
      source: loki-ruler
    annotations:
      summary: XNAT upload backlog is growing
      description: "Sessions are being staged faster than they're being pushed to XNAT. xnat-ingest-upload may be slow or partially failing \u2014 check `kubectl logs -n xnat-ingest -l component=upload`."
  - alert: DICOMValidationFailureSpike
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"assign\"}\n  |~ \"(?i)invalid|validation.*fail\" [1h])) > 10\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
    annotations:
      summary: '>10 invalid DICOM sessions on {{ $labels.cluster }} in last hour'
      description: "Sessions are landing in __invalid__/. Likely a scanner exporting DICOMs without AccessionNumber \u2014 check scanner config."
- name: ais-edge-pipeline-info
  interval: 30s
  rules:
  - alert: XNATUploadSuccess
    annotations:
      description: "Session {{ $labels.session }} landed in XNAT (pushed by\nxnat-ingest-upload on cluster {{ $labels.cluster }}).\nVerify in the pod logs:\n  kubectl -n xnat-ingest logs deploy/xnat-ingest-upload\
        \ --tail=30\n"
      summary: "XNAT upload completed \u2014 {{ $labels.session }}"
    expr: "sum by (cluster, session) (\n  count_over_time(\n    {namespace=\"xnat-ingest\", component=\"upload\"}\n    |~ \"Successfully uploaded all files in\"\n    | regexp \"Successfully uploaded all\
      \ files in '(?P<session>[^']+)'\"\n    [10m]\n  )\n) > 0\n"
    for: 0s
    labels:
      category: pipeline-success
      severity: info
      source: loki-ruler
  - alert: XNATAuthFailure
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"upload\"}\n  != \"it/s\"\n  |~ \"(?i)(unauthorized|forbidden|status[^0-9]{0,10}40[13]\\\\b|HTTP[^0-9]{0,10}40[13]\\\
      \\b|\\\\b40[13][^0-9]{0,3}(unauthorized|forbidden))\" [15m])) > 3\n"
    for: 0s
    labels:
      category: xnat-auth
      severity: warning
      source: loki-ruler
    annotations:
      description: "More than 3 authentication rejections (401/403) from XNAT in 15\nminutes \u2014 so this is NOT the routine session-cookie expiry, which\nthe uploader recovers from by itself within one\
        \ ~62s loop and which\ncan never reach this threshold.\n\nCheck, in order:\n  1. Is XNAT up at all? A 5xx outage produces a 401 afterwards\n     because the pre-outage session id is no longer known.\
        \ This rule\n     cannot see 5xx, so rule it out first:\n       kubectl -n xnat-ingest logs deploy/mgmt-upload-{{ $labels.cluster }} --tail=100 | grep -E \"50[0-9]|Connection\"\n  2. Did the credential\
        \ change under the running pod? The uploader\n     reads xnat-credentials once at startup and holds one connection:\n       kubectl -n xnat-ingest rollout restart deploy/mgmt-upload-{{ $labels.cluster\
        \ }}\n     If a restart fixes it, the Secret was rotated without one.\n  3. Is the account locked or the role revoked? Verify the\n     username/password in the xnat-credentials Secret against XNAT\n\
        \     directly before assuming the Secret is wrong.\n\nNothing is lost while this fires: sessions stay in S3 staging and\nthe reclaimer refuses to remove anything it cannot confirm.\n"
      summary: XNAT kept rejecting authenticated calls from the uploader on {{ $labels.cluster }}
  - alert: OrthancDeidLuaError
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", app=\"orthanc\"}\n  |~ \"(?i)lua.*error|traceback|stack\\\\s+traceback\" [10m])) > 0\n"
    for: 1m
    labels:
      severity: warning
      source: loki-ruler
      category: deid
    annotations:
      summary: Orthanc deid Lua hook errored on {{ $labels.cluster }}
      description: 'The deidentify-and-forward.lua hook produced a Lua error in

        the last 10 minutes. Inspect the Orthanc pod logs and check

        the deidentification-profile.json for syntax issues.

        '
  - alert: OrthancStorageGrowing
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", app=\"orthanc\"}\n  |~ \"(?i)new stored instance\" [1h])) > 1000\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
      category: orthanc-backlog
    annotations:
      summary: Orthanc received >1k instances on {{ $labels.cluster }} in the last hour
      description: 'Either a real ingest spike (legitimate, may need to scale

        edge storage) or group-orthanc isn''t draining Orthanc. Check the

        group-orthanc pod''s REST-pull loop and Orthanc''s storage PVC size.

        '
- name: ais-edge-data-policy
  interval: 5m
  rules:
  - alert: EdgeDiskLow
    expr: "sum by (cluster, stage) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"data-policy\"}\n  | json | event=\"stage_report\"\n  | free_pct < __DP_MIN_FREE_DISK_PCT__ [15m])) > 0\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
      category: edge-storage
    annotations:
      summary: Edge {{ $labels.cluster }} is low on disk at {{ $labels.stage }}
      description: "The data-policy engine reports less free space than\ndataPolicy.originals.facilityBackup.minFreeDiskPercent allows on\n{{ $labels.cluster }}, for stage {{ $labels.stage }}.\n\nNOTHING\
        \ IS DELETED BECAUSE OF THIS. Originals are retained by\npolicy; a full disk stops new studies being accepted, it does not\ndiscard anything already held.\n\n  kubectl --kubeconfig kubeconfig-{{\
        \ $labels.cluster }} \\\n    -n xnat-ingest logs -l app=data-policy --tail=20\n\nFree space by growing the volume, or by enabling reclaim for the\nderived stages once you are satisfied with the\
        \ dry-run decisions.\n"
  - alert: QuarantinedDataUnresolved
    expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-ingest\", component=\"data-policy\"}\n  | json | event=\"stage_report\"\n  | stage=\"originals.quarantine\"\n  | oldest_age_s > __DP_QUARANTINE_ALERT_AFTER_S__\
      \ [15m])) > 0\n"
    for: 5m
    labels:
      severity: warning
      source: loki-ruler
      category: dicom-routing
    annotations:
      summary: Quarantined studies on {{ $labels.cluster }} older than the configured limit
      description: 'Studies rejected for an unmapped AE title have been sitting in

        quarantine on {{ $labels.cluster }} for longer than

        dataPolicy.originals.quarantine.alertAfter.


        They are NOT lost and NOT in XNAT. Nothing will move them without

        an operator: add the AE title to orthanc.deid.aetMap in

        sites/{{ $labels.cluster }}/values.yaml, upgrade the edge release,

        then re-send from the quarantine directory. The offending AE title

        is in the DICOMRejectedUnmappedAET mail for the original rejection.

        '
