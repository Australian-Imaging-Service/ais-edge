# =============================================================================
# Vector — edge log shipper configuration
# =============================================================================
# Loaded with .Files.Get and mounted verbatim. It is deliberately NOT a Helm
# template, because it contains two different kinds of substitution that Helm
# must not touch:
#
#   {{ kubernetes.pod_name }}   Vector event-time templates, evaluated per log
#                               line. Helm would try to resolve these at chart
#                               render time and render them EMPTY — producing
#                               a Loki stream with no pod/component labels and
#                               silently breaking every alert rule and
#                               dashboard panel that selects on them.
#
#   ${LOKI_ENDPOINT}            Environment interpolation, performed by Vector
#                               when it loads this file. This is how per-site
#                               values get in without templating: the chart
#                               passes them as env vars on the DaemonSet.
#
# So: anything site-specific is an env var, anything per-event is a Vector
# template, and Helm passes the whole file through untouched.
# =============================================================================
data_dir: /vector-data-dir
api:
  enabled: false

sources:
  kubelet_logs:
    type: kubernetes_logs
    auto_partial_merge: true

transforms:
  add_cluster_label:
    type: remap
    inputs: [kubelet_logs]
    source: |
      .cluster = "${CLUSTER_LABEL}"

  # The ingest pods emit one JSON object per line. Merging the parsed keys
  # into the event makes `event`, `component` and `session` first-class
  # fields, which is what lets the Loki ruler use `| json | event="..."`
  # rather than regexing raw text.
  parse_json_messages:
    type: remap
    inputs: [add_cluster_label]
    source: |
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge!(., parsed)
      }
      # A Loki label template that references a missing field does not render
      # empty — Vector DROPS the whole event and counts a `template_failed`.
      # `level` below is only present on lines the pods emit as JSON, so every
      # plain-stdout line (tqdm progress bars, tracebacks, anything a library
      # prints directly) was being discarded before it reached Loki. Observed
      # on cai-lfs3: 31 template_failed in a 200-line window, with the internal
      # log itself rate-limited — so the loss was reported only in a warning
      # that was itself being suppressed.
      #
      # Defaulting the field keeps those lines, labelled honestly as unknown.
      # Do not drop the label instead: every alert rule and dashboard panel
      # selects on it.
      if !exists(.level) {
        .level = "unknown"
      }
      # Same failure, different fields. `app` and `component` come from the
      # POD'S OWN LABELS, which only this chart's workloads carry — so every
      # log line from coredns, kube-proxy, kube-router, metrics-server and
      # konnectivity-agent was being dropped for want of a label they were
      # never going to have. That is the entire system-pod log stream, and its
      # absence looks identical to those pods simply being quiet.
      if !exists(.kubernetes.pod_labels.app) {
        .kubernetes.pod_labels.app = "unknown"
      }
      if !exists(.kubernetes.pod_labels.component) {
        .kubernetes.pod_labels.component = "unknown"
      }

sinks:
  loki:
    type: loki
    inputs: [parse_json_messages]
    endpoint: ${LOKI_ENDPOINT}
    # mTLS. There is deliberately NO `auth:` block: this site proves who it is
    # with a client certificate, not with a shared string.
    #
    # Both files are written into this namespace by the management cluster's
    # cert-sync CronJob and mounted by charts/edge/templates/vector.yaml. The
    # certificate's CN is this edge's name, and the push Ingress pins the CN to
    # the sites listed in the management values, so a certificate signed by the
    # fleet CA for some other purpose cannot push.
    #
    # WHAT WAS HERE BEFORE, because it cost months of blind operation: an
    # `auth:` block, first bearer and then basic, against an ingress-nginx
    # auth-map. nginx will not read a bare password out of an auth-map, so the
    # ends had already drifted to different bytes and every push 401'd. The
    # alerts that would have reported it are built from these very logs, so the
    # failure was completely silent.
    tls:
      ca_file: /etc/ssl/ais-edge-ca/ca.crt
      crt_file: /etc/ssl/loki-client/tls.crt
      key_file: /etc/ssl/loki-client/tls.key
    # Slim the body: kubernetes_logs metadata is already promoted to stream
    # labels below, so repeating it inside the payload only inflates storage
    # and clutters the Grafana live tail.
    encoding:
      codec: json
      except_fields:
        - kubernetes
        - file
        - source_type
        - stream
        - tags
    labels:
      # LOAD-BEARING. Every alert rule and dashboard panel selects on these
      # label names. `component` in particular is how the s3-uploader, group,
      # assign and orthanc log streams are told apart.
      cluster: "{{ cluster }}"
      namespace: "{{ kubernetes.pod_namespace }}"
      pod: "{{ kubernetes.pod_name }}"
      container: "{{ kubernetes.container_name }}"
      # Lets queries scope to an individual worker within a cluster. Costs one
      # stream-set per worker; negligible at our scale.
      node: "{{ kubernetes.pod_node_name }}"
      app: "{{ kubernetes.pod_labels.app }}"
      component: "{{ kubernetes.pod_labels.component }}"
      level: "{{ level }}"
    remove_label_fields: true
    out_of_order_action: accept
    compression: gzip
    batch:
      max_bytes: 1048576
      timeout_secs: 1
