# =============================================================================
# AIS Edge — management cluster chart
# =============================================================================
# The central half of a tier-2 deployment. Runs on the k0s management node and
# provides, for a fleet of edge sites:
#
#   * SeaweedFS      the S3 staging bucket every edge uploads into
#   * xnatUpload     pushes staged sessions from S3 into XNAT
#   * observability  Prometheus / Loki / Grafana / Alertmanager / Vector
#   * certManager    the internal CA and the issuers that sign our TLS certs
#   * ingressNginx   :443 with SNI routing and ssl-passthrough
#   * edges[]        one k0smotron hosted control plane per edge site
#
# A tier-1 / standalone site does NOT need this chart at all — install
# charts/edge with upload.mode=direct instead.
#
# CREDENTIALS ARE NOT IN THIS FILE, BY DESIGN.
# Everything secret is referenced by Secret name. This file is safe to commit
# per-site; the Secrets are created separately, SOPS-encrypted.
# =============================================================================

# Free-text name for this management plane. Appears as the `cluster` label on
# its own logs and metrics, so it must not collide with any edge clusterLabel.
clusterLabel: mgmt

nameOverride: ""
fullnameOverride: ""

# onprem | cloud
topology: onprem

domain:
  # Base domain the management services are published under. With no real DNS,
  # a wildcard-resolver domain such as nip.io works:
  #   dev-cai.203-101-224-211.nip.io
  internal: ""
  # Public IP of the management node. Used for the LoadBalancer address and,
  # on edges, for the hostAliases that pin these hostnames.
  mgmtNodeIP: ""

# Hostnames published on :443. All resolve to mgmtNodeIP; nginx routes by SNI.
hostnames:
  seaweedfs: ""        # seaweedfs.<domain.internal>
  grafana: ""          # grafana.<domain.internal>
  loki: ""             # loki.<domain.internal>
  k0sApi: ""           # k0s.<domain.internal>          — child cluster API
  konnectivity: ""     # konnectivity.<domain.internal> — reverse tunnel
ingressPort: 443


# =============================================================================
# dataPolicy
# =============================================================================
# THE SAME BLOCK AS charts/edge. Keep one copy in sites/<site>/values.yaml and
# pass it to both releases, so a site has exactly one answer to "what is kept
# and for how long". This chart acts only on the stores it owns:
#   derived.s3Staged   the staging prefix in SeaweedFS
#   telemetry          Loki and Prometheus retention
# The rest is present so the file validates identically against both charts.
# -----------------------------------------------------------------------------
dataPolicy:
  enabled: false
  dryRun: true

  originals:
    facilityBackup: {enabled: true, retain: forever, minFreeDiskPercent: 10}
    quarantine:     {subPath: __unmapped_aet__, retain: forever, alertAfter: 24h}
    fileDrop:       {reclaim: never, minAge: 30d}

  derived:
    orthancStorage: {reclaim: onGrouped, minAge: 7d, maximumStorageSizeMB: 0, maximumPatientCount: 0}
    grouped:        {reclaim: onAssigned, minAge: 0}
    assigned:       {reclaim: onUploaded, minAge: 0}

    # Owned by THIS chart.
    #
    # `xnat-ingest upload` has no S3 retention of its own: it rebuilds its
    # work list from a live listing of the staging prefix every loop, so a
    # session that has been uploaded stays there and is re-listed, re-uploaded
    # and re-alerted forever. The reclaimer below is what closes that gap.
    #
    # onXnatConfirmed re-queries XNAT for the session before removing
    # anything, rather than trusting the uploader's exit code — an exit code
    # tells you the upload call returned, not that the data is in XNAT.
    s3Staged:
      reclaim: onXnatConfirmed   # never | onXnatConfirmed
      minAge: 1d
      verifyAgainstXnat: true
      # How often the reclaimer runs.
      schedule: "17 * * * *"
      # Cap on how many sessions one run may remove. A bug that decided
      # "delete everything" is bounded to this many per run, leaving the rest
      # for someone to notice first. At the hourly schedule this still drains
      # ~1200 sessions/day.
      maxRemovals: 50
      # amazon/aws-cli carries everything the reclaimer needs: `aws` for the
      # authoritative S3 listing and `curl` for both the XNAT confirmation and
      # the filer delete. Pinned like every other image — an unpinned tag would
      # be worst of all on the one job that deletes patient data.
      image:
        repository: amazon/aws-cli
        tag: "2.31.19"
        pullPolicy: IfNotPresent

  telemetry:
    podLogFiles: {retain: 14d}
    loki:        {retain: 30d}
    prometheus:  {retain: 15d}


# =============================================================================
# edges — one entry per edge site
# =============================================================================
# A TYPED LIST, replacing the pipe-separated EDGE_NODES strings the shell
# installer parsed. Four scripts each parsed those strings with their own
# field layout and two of them disagreed about the field count, which silently
# produced broken S3 identities. A list of objects cannot drift like that.
#
# Each entry produces:
#   * a k0smotron hosted control plane (Cluster CR)
#   * a scoped SeaweedFS S3 identity — write+list on the staging bucket only
#   * a Loki push token
#
# Secrets are referenced, never inlined:
#   s3SecretRef   Secret with keys access-key / secret-key
#   lokiTokenRef  Secret with key token
#
# edges:
#   - name: edge-dev
#     nodeIP: 203.101.230.171
#     s3SecretRef: edge-dev-s3
#     lokiTokenRef: edge-dev-loki-token
edges: []

# k0smotron hosted control planes.
k0smotron:
  enabled: true
  # Must match the k0s version on the edge WORKERS. The installer used to
  # curl | sh the latest k0s independently on the management node and on each
  # worker, so the two could drift apart silently.
  k0sVersion: "v1.35.2+k0s.0"
  # The hosted control plane's datastore. emptyDir means a control-plane pod
  # restart discards the child cluster's state, so this is a PVC.
  persistence:
    type: pvc
    size: 10Gi
    storageClassName: ""
  # Cluster CRs carry helm.sh/resource-policy: keep, so removing a site from
  # `edges` above does NOT tear down its control plane. Teardown is a
  # deliberate `kubectl delete`, not a side effect of a fleet-wide upgrade.
  resourcePolicyKeep: true


# =============================================================================
# seaweedfs — the S3 staging store
# =============================================================================
seaweedfs:
  enabled: true
  image:
    repository: chrislusf/seaweedfs
    tag: "3.99"
    pullPolicy: IfNotPresent

  storage:
    hostPath: /data/seaweedfs
    capacity: 500Gi
    volumeSizeLimitMB: 1024

  buckets:
    ingest: ingest-bucket
    logs: logs-bucket

  # Admin identity, used by the bucket-creation hook and by charts/mgmt's own
  # uploader. Per-edge identities are generated from `edges` above and are
  # scoped to the ingest bucket only, so losing one edge key exposes neither
  # XNAT nor any other site's data.
  adminSecretRef: seaweedfs-admin

  # The generated s3.json goes into a SECRET, not a ConfigMap. The imperative
  # installer wrote every site's S3 keys into a ConfigMap in plaintext.
  identitiesSecretName: seaweedfs-identities

  ingress:
    enabled: true
    # mc multipart / large session uploads.
    proxyBodySize: 50g
    tlsSecretName: seaweedfs-tls

  resources:
    requests: {memory: 512Mi, cpu: 200m}
    limits:   {memory: 4Gi,   cpu: "2"}


# =============================================================================
# xnatUpload — staged S3 -> XNAT
# =============================================================================
xnatUpload:
  enabled: true
  namespace: xnat-upload
  image:
    repository: ghcr.io/australian-imaging-service/xnat-ingest
    tag: "0.12.3"
    pullPolicy: IfNotPresent

  xnatSecretRef: xnat-credentials     # keys: server, username, password
  s3SecretRef: seaweedfs-upload       # keys: access-key, secret-key

  bucket: ingest-bucket
  prefix: staged
  region: us-east-1

  loop: 60
  alwaysInclude: "all"
  requireManifest: false
  verifySsl: false

  # Recreate, not RollingUpdate: two uploaders running --loop against the same
  # staging prefix would process the same sessions concurrently.
  strategy: Recreate

  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits:   {memory: 2Gi,   cpu: "2"}


# =============================================================================
# certManager + issuers
# =============================================================================
certManager:
  # The subchart. Set false if cert-manager is already installed cluster-wide.
  enabled: true
  installCRDs: true

  # ais-edge-ca      self-signed internal CA. The default, and what every
  #                  in-cluster client trusts via the ca-bundle Secret.
  # letsencrypt-*    public certificates. Requires a real, publicly resolvable
  #                  domain AND a DNS-01 solver — nip.io cannot satisfy
  #                  HTTP-01 or DNS-01, which is why the internal CA is the
  #                  default rather than a fallback.
  issuer: ais-edge-ca

  ca:
    secretName: ais-edge-ca-secret
    commonName: ais-edge-ca
    durationHours: 87600      # 10y
  acme:
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory
    # Provider-specific solver block, passed through verbatim.
    dns01Solver: {}


# =============================================================================
# ingressNginx
# =============================================================================
ingressNginx:
  enabled: true
  # Required: the k0smotron child-cluster API and konnectivity tunnel are TLS
  # end-to-end and must NOT be terminated at the ingress.
  sslPassthrough: true
  loadBalancerIP: ""
  proxyBodySize: 50g


# =============================================================================
# observability
# =============================================================================
observability:
  enabled: true

  # LANDMINE. Prometheus discovers PrometheusRule and ServiceMonitor objects
  # by label. The imperative installer hardcoded `release: kube-prometheus-stack`
  # in five files because that was the release name it used. As a SUBCHART the
  # release name is this chart's, so the label must follow it — otherwise
  # Prometheus silently stops loading our rules and the Grafana Ingress 503s,
  # with no error anywhere. Templated from .Release.Name by default; override
  # only if kube-prometheus-stack is installed as a separate release.
  prometheusReleaseLabel: ""

  # StorageClass for the four observability PVCs. On a k0s management node
  # this is the built-in local-path provisioner.
  storageClassName: local-path

  grafana:
    adminSecretRef: grafana-admin-credentials   # keys: admin-user, admin-password
    ingress: {enabled: true, tlsSecretName: grafana-tls, proxyBodySize: 16m}
    dashboardFolder: "AIS Edge"
    persistenceSize: 5Gi

  prometheus:
    persistenceSize: 20Gi

  vector:
    image:
      repository: timberio/vector
      tag: "0.57.0-distroless-libc"
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits:   {cpu: 1,    memory: 512Mi}

  loki:
    # s3         chunks in SeaweedFS. Needs seaweedfs.enabled.
    # filesystem single PVC. What tier-1 uses, where there is no SeaweedFS.
    storage: s3
    s3SecretRef: loki-s3-credentials
    persistenceSize: 20Gi
    ingress: {enabled: true, tlsSecretName: loki-tls}
    # Vector on every edge pushes here with a bearer token. Loki itself runs
    # auth_enabled: false, so the token is only meaningful if the Ingress
    # actually checks it — see auth below.
    push:
      requireAuth: true
      # Secret holding the htpasswd/token map the Ingress validates against.
      authSecretRef: loki-push-auth

  alerting:
    smtpSecretRef: alertmanager-smtp    # keys: username, password
    emailFrom: ""
    emailTo: ""
    smtpHost: ""
    smtpPort: 587
    smtpRequireTLS: true
    # Alertmanager has smtp_auth_password_FILE but no smtp_auth_username_file,
    # so unlike the password this cannot come from the mounted Secret and has
    # to be a plain value. It is not sensitive on its own. Leaving it empty
    # means no SMTP auth, and a relay that requires auth will reject every
    # message — which surfaces only as alerts that never arrive.
    smtpUsername: ""
    slackWebhookSecretRef: ""           # optional
    persistenceSize: 2Gi


# =============================================================================
# cloud (parked)
# =============================================================================
# Kept as a values key so the templates stay ready, but not wired up: the
# LoadBalancer path in the shell installer was broken anyway, and pre-creating
# an Octavia LB is Terraform work rather than Helm work.
cloud:
  enabled: false
  provider: openstack
  cloudConfigSecretRef: ""

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}


# =============================================================================
# SUBCHART VALUES
# =============================================================================
# Everything below configures a PINNED upstream chart from Chart.yaml.
#
# THE CONSTRAINT THAT SHAPES ALL OF IT: Helm does NOT template values.yaml.
# A subchart value cannot say `{{ .Release.Name }}-something` and expect it to
# resolve — UNLESS that particular subchart runs `tpl` over that field itself.
# Fields marked [tpl] rely on subchart-side tpl and do resolve; everything
# else is a literal that has to be kept in step with a parent value by hand.
# templates/observability.yaml renders a consistency check for every coupling
# it can see, because each of these mismatches is otherwise completely silent.
# -----------------------------------------------------------------------------

kube-prometheus-stack:
  # Our own alerts ship from files/prometheus-rules/, version-controlled
  # alongside the code that emits the events they alert on.
  defaultRules:
    create: false

  prometheus:
    prometheusSpec:
      retention: 15d                    # MUST MATCH dataPolicy.telemetry.prometheus.retain
      retentionSize: ""
      scrapeInterval: 30s
      evaluationInterval: 30s
      # DELETED ON PURPOSE — do not re-add:
      #   ruleSelector: {matchLabels: {release: kube-prometheus-stack}}
      # That literal was correct only because the shell installer's release
      # happened to be named kube-prometheus-stack. As a subchart the release
      # is ours. Leaving the selectors empty keeps *SelectorNilUsesHelmValues
      # at its default of true, which makes the chart template
      # `release: <parent release>` into the selectors automatically — so
      # they track mgmt.prometheusReleaseLabel with no literal to forget.
      ruleNamespaceSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      storageSpec:
        volumeClaimTemplate:
          metadata:
            annotations:
              helm.sh/resource-policy: keep
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources: {requests: {storage: 20Gi}}
      resources:
        requests: {cpu: 250m, memory: 1Gi}
        limits:   {cpu: 2,    memory: 4Gi}

  alertmanager:
    enabled: true
    alertmanagerSpec:
      configSecret: alertmanager-aisedge-config
      # Mounted at /etc/alertmanager/secrets/<name>/<key>. This is how the
      # SMTP password reaches Alertmanager WITHOUT being templated into a
      # manifest — the config uses smtp_auth_password_file.
      secrets:
        - alertmanager-smtp
      storage:
        volumeClaimTemplate:
          metadata:
            annotations:
              # Holds the notification log. Wiping it re-sends every alert
              # that is still firing.
              helm.sh/resource-policy: keep
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources: {requests: {storage: 2Gi}}
      resources:
        requests: {cpu: 50m,  memory: 128Mi}
        limits:   {cpu: 500m, memory: 512Mi}

  grafana:
    enabled: true
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    defaultDashboardsEnabled: true
    service: {type: ClusterIP}          # published only through nginx-ingress
    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes: ["ReadWriteOnce"]
      size: 5Gi
      annotations:
        helm.sh/resource-policy: keep
    # The PVC is RWO, so a rolling update deadlocks: the new pod cannot mount
    # the volume while the old one holds it, and the old one will not
    # terminate until the new one is Ready.
    deploymentStrategy:
      type: Recreate
    # Once Grafana has run, subdirectories like pdf/ are mode 700 owned by
    # 472:472. The init container runs with drop:ALL + add:[CHOWN]; without
    # DAC_OVERRIDE it cannot traverse them and `chown -R` fails. Ownership is
    # already correct, and fsGroup handles a fresh PVC.
    initChownData:
      enabled: false
    deleteDatasources:
      # Grafana's provisioner addresses datasources by UID. A previous install
      # may have left a `Loki` row with a generated UID in grafana.db on the
      # PVC, and re-provisioning the same name with an explicit UID then fails
      # with "data source not found". No-op on a fresh database.
      - name: Loki
        orgId: 1
    additionalDataSources:
      # [tpl] kube-prometheus-stack renders additionalDataSources through tpl,
      # so this resolves — and it must, because the Service name contains the
      # release name.
      - name: Loki
        uid: loki                       # dashboards reference {"type":"loki","uid":"loki"}
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100
        isDefault: false
        jsonData: {maxLines: 5000}
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_dashboard_folder
        provider: {foldersFromFilesStructure: true}
      datasources: {enabled: true}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: 1,    memory: 1Gi}

  # Host metrics off, matching the edges. The kubelet's cAdvisor still
  # provides pod-level metrics.
  prometheus-node-exporter: {enabled: false}
  nodeExporter: {enabled: false}

  # Required by the SeaweedFSDown / EdgePodCrashLoop rules.
  kubeStateMetrics: {enabled: true}
  kube-state-metrics:
    resources:
      requests: {cpu: 50m,  memory: 128Mi}
      limits:   {cpu: 200m, memory: 256Mi}

  # k0s either embeds these or does not expose them the way the upstream
  # chart assumes.
  kubeApiServer:         {enabled: true}
  kubeControllerManager: {enabled: false}
  kubeScheduler:         {enabled: false}
  kubeProxy:             {enabled: false}
  kubeEtcd:              {enabled: false}   # k0smotron etcd is per child cluster
  kubelet:               {enabled: true}
  coreDns:               {enabled: true}


loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false                 # gated at the Ingress instead
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index: {prefix: loki_index_, period: 24h}
    storage:
      type: s3
      bucketNames:                      # MUST MATCH seaweedfs.buckets.logs
        chunks: logs-bucket
        ruler:  logs-bucket
        admin:  logs-bucket
      s3:
        # [tpl] the loki chart renders its config through tpl. Plain http on
        # purpose — it never leaves the node.
        endpoint: http://{{ .Release.Name }}-seaweedfs.{{ .Release.Namespace }}.svc.cluster.local:8333
        region: us-east-1               # ignored by SeaweedFS, required by the SDK
        s3ForcePathStyle: true
        insecure: true
        # NO CREDENTIALS HERE. ${...} is expanded by Loki itself at startup
        # (-config.expand-env below), not by Helm, so the key never appears in
        # a rendered manifest or in git.
        accessKeyId: ${LOKI_S3_ACCESS_KEY}
        secretAccessKey: ${LOKI_S3_SECRET_KEY}
    limits_config:
      retention_period: 30d             # MUST MATCH dataPolicy.telemetry.loki.retain
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_global_streams_per_user: 10000
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: s3
    commonConfig:
      replication_factor: 1
    # The ruler evaluates the LogQL alert rules and pushes firing alerts to
    # Alertmanager. It lives here rather than in Prometheus because mgmt
    # Prometheus cannot scrape edge pods across the one-way konnectivity
    # tunnel, and because the source of truth for these alerts is the JSON log
    # event, not a derived metric.
    rulerConfig:
      storage:
        type: local
        local: {directory: /etc/loki/rules}
      rule_path: /var/loki/rules-runtime
      # [tpl]
      alertmanager_url: http://{{ .Release.Name }}-kube-prometheus-stack-alertmanager.{{ .Release.Namespace }}.svc.cluster.local:9093
      enable_alertmanager_v2: true
      enable_api: true
      ring: {kvstore: {store: inmemory}}
  singleBinary:
    replicas: 1
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits:   {cpu: 2,    memory: 2Gi}
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
      annotations:
        helm.sh/resource-policy: keep
    # Turns the S3 key into env vars without putting it in values.
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: LOKI_S3_ACCESS_KEY
        valueFrom: {secretKeyRef: {name: loki-s3-credentials, key: access-key}}
      - name: LOKI_S3_SECRET_KEY
        valueFrom: {secretKeyRef: {name: loki-s3-credentials, key: secret-key}}
    # `fake` is Loki's tenant ID when auth_enabled is false; the ruler reads
    # every YAML file in that directory as a rule group.
    extraVolumes:
      - name: rules
        configMap: {name: loki-ruler-rules}
    extraVolumeMounts:
      - {name: rules, mountPath: /etc/loki/rules/fake, readOnly: true}
  read:    {replicas: 0}
  write:   {replicas: 0}
  backend: {replicas: 0}
  minio:        {enabled: false}        # chunks live in SeaweedFS
  chunksCache:  {enabled: false}
  resultsCache: {enabled: false}
  gateway:      {enabled: false}        # exposed through nginx-ingress directly
  service:      {type: ClusterIP}
  monitoring:
    serviceMonitor:
      enabled: true
      # NOT tpl'd by the loki chart, so this is a literal release name. Only
      # Loki's own self-metrics depend on it; no alert rule does, so a
      # mismatch fails quietly rather than dangerously.
      labels: {release: mgmt}
    selfMonitoring: {enabled: false}
    lokiCanary:     {enabled: false}
  test: {enabled: false}


vector:
  role: Agent                           # DaemonSet, one per node
  hostNetwork: false
  dnsPolicy: ClusterFirst
  podSecurityContext:
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
  tolerations:
    - operator: Exists
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: 1,    memory: 512Mi}
  dataDir: /vector-data-dir
  extraVolumes:
    - name: pod-logs
      hostPath: {path: /var/log/pods}
    - name: containerd-logs
      hostPath: {path: /var/log/containers}
  extraVolumeMounts:
    - {name: pod-logs,        mountPath: /var/log/pods,       readOnly: true}
    - {name: containerd-logs, mountPath: /var/log/containers, readOnly: true}
  customConfig:
    data_dir: /vector-data-dir
    api: {enabled: false}
    sources:
      kubelet_logs:
        type: kubernetes_logs
        auto_partial_merge: true
    transforms:
      add_cluster_label:
        type: remap
        inputs: [kubelet_logs]
        source: |
          .cluster = "mgmt"
      parse_json_messages:
        type: remap
        inputs: [add_cluster_label]
        source: |
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge!(., parsed)
          }
    sinks:
      loki:
        type: loki
        inputs: [parse_json_messages]
        # Same-cluster push: plain http, no bearer token, unlike the edges
        # which arrive over the Ingress.
        endpoint: http://mgmt-loki.observability.svc.cluster.local:3100
        # Vector >=0.49 rejects a label template with no literal prefix
        # ("template confinement") without this. Symptom: sink build error
        # "template references event fields but has no literal string prefix".
        dangerously_allow_unconfined_template_resolution: true
        encoding:
          codec: json
          except_fields: [kubernetes, file, source_type, stream, tags]
        # ---------------------------------------------------------------
        # THE BACKTICK ESCAPING BELOW IS REQUIRED. DO NOT "SIMPLIFY" IT.
        #
        # The Vector chart runs `tpl` over customConfig, so this file's
        # contents ARE evaluated as a Helm template. Written bare, `{{ cluster }}`
        # would be resolved against the CHART context, find no `cluster`, and
        # render EMPTY — every mgmt log line would lose its stream labels and
        # every ruler rule selecting on them would stop matching, with no
        # error anywhere.
        #
        # Confirmed against the live cluster: the source carries the escaping
        # and the rendered ConfigMap contains `cluster: '{{ cluster }}'`.
        # Verify after any change to this block:
        #   kubectl -n observability get cm mgmt-vector -o yaml | grep 'cluster:'
        # must show {{ cluster }}, not an empty string.
        #
        # (charts/edge takes the other route for the same problem — its Vector
        # config is a plain file loaded with .Files.Get, which Helm never
        # templates, so it needs no escaping at all.)
        # ---------------------------------------------------------------
        labels:
          cluster:   "{{`{{ cluster }}`}}"
          namespace: "{{`{{ kubernetes.pod_namespace }}`}}"
          pod:       "{{`{{ kubernetes.pod_name }}`}}"
          container: "{{`{{ kubernetes.container_name }}`}}"
          node:      "{{`{{ kubernetes.pod_node_name }}`}}"
          app:       "{{`{{ kubernetes.pod_labels.app }}`}}"
          component: "{{`{{ kubernetes.pod_labels.component }}`}}"
          level:     "{{`{{ level }}`}}"
        remove_label_fields: true
        out_of_order_action: accept
        compression: gzip
        batch:
          max_bytes: 1048576
          timeout_secs: 1
  # mgmt Vector only pushes out; it exposes nothing in-cluster.
