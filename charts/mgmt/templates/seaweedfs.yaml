{{- /* Render-time guards now run from templates/validate.yaml, which is
       unconditional. Do not re-add an include here. */ -}}
{{- if .Values.seaweedfs.enabled }}
{{- /*
SeaweedFS — the S3 staging store every edge site uploads into.

All-in-one: `weed server` runs master + volume + filer + S3 gateway in one
process, one pod, one hostPath volume. That is the right shape for a
single-node management plane; scaling out means splitting into StatefulSets,
not adding replicas here.

THE S3 IDENTITY DOCUMENT IS THE INTERESTING PART OF THIS FILE.

scripts/03-deploy-seaweedfs.sh built s3.json on the installer's laptop by
interpolating every site's access key and secret key out of edge-nodes.env,
then `kubectl create configmap s3-config --from-file=s3.json`. Two problems:

  1. A ConfigMap. Every edge's S3 secret key, in plaintext, readable by
     anything with configmap read in the namespace, and rendered in full by
     `kubectl get cm -o yaml`.
  2. It parsed edge-nodes.env with its own 7-field `IFS='|' read` while the
     rest of the scripts used a 6-field one, so accessKey got bound to the
     secret and secretKey came out EMPTY for every edge identity. SeaweedFS
     starts perfectly happily with an empty secretKey — the edge just gets
     403 on every PUT, forever, with nothing wrong on the management side.

A Helm template cannot read a Secret's contents, so this chart cannot render
s3.json at all — which is the point. The identities document is assembled
INSIDE the pod by the build-s3-identities init container below, from the
per-identity Secrets projected in by name. Nothing secret is ever templated,
nothing secret is ever written to a second object at rest, and s3.json itself
lives only in a tmpfs emptyDir for the lifetime of the pod.

Consequences worth knowing:
  * Adding or removing an entry in `edges` changes the projected volume and
    the init script, so Helm rolls the pod by itself. The S3_CONFIG_HASH
    annotation the shell installer needed is gone.
  * ROTATING a key inside an existing Secret does NOT change the pod spec and
    does NOT roll the pod, and `weed server -s3.config` reads the file once at
    startup. After a rotation:
      kubectl rollout restart deploy/{{ include "mgmt.fullname" . }}-seaweedfs -n {{ .Release.Namespace }}
  * A missing or empty credential is a hard init-container failure (CrashLoop
    with a named identity in the log) rather than a silent 403 later.
*/ -}}
{{- $fullName := printf "%s-seaweedfs" (include "mgmt.fullname" .) -}}
{{- $ingestBucket := .Values.seaweedfs.buckets.ingest -}}
{{- $logsBucket := .Values.seaweedfs.buckets.logs -}}
{{- /* The uploader and Loki are separate identities, not the admin identity:
       neither has any business holding Admin on the whole store. Both render
       only when the component that uses them is actually enabled, because a
       projected Secret source that does not exist blocks the pod from
       starting. */ -}}
{{- $uploaderIdentity := and .Values.xnatUpload.enabled .Values.xnatUpload.s3SecretRef -}}
{{- $lokiIdentity := and .Values.observability.enabled (eq .Values.observability.loki.storage "s3") .Values.observability.loki.s3SecretRef -}}
apiVersion: v1
kind: PersistentVolume
metadata:
  # PVs are cluster-scoped, so the name carries the release name. It also has
  # to keep the substring "seaweedfs": the disk-usage alert selects PVCs with
  # persistentvolumeclaim=~".*seaweedfs.*".
  name: {{ $fullName }}
  annotations:
    # This is the staging copy of real patient data on its way to XNAT. A
    # `helm uninstall` must not take it with the release — deleting it is a
    # separate, deliberate act.
    helm.sh/resource-policy: keep
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
spec:
  accessModes: [ReadWriteOnce]
  capacity:
    storage: {{ .Values.seaweedfs.storage.capacity }}
  hostPath:
    path: {{ .Values.seaweedfs.storage.hostPath }}
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  # Explicitly empty, not omitted. An omitted storageClassName lets the
  # cluster's DEFAULT StorageClass claim the PVC and dynamically provision a
  # different, empty volume — SeaweedFS would come up healthy on blank storage
  # and every previously staged session would appear to have vanished.
  storageClassName: ""
  volumeMode: Filesystem
  claimRef:
    name: {{ $fullName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: {{ $fullName }}
  resources:
    requests:
      storage: {{ .Values.seaweedfs.storage.capacity }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
    component: seaweedfs
spec:
  replicas: 1
  strategy:
    # Recreate, never RollingUpdate. One hostPath volume holding the master,
    # volume and filer state cannot be opened by two `weed server` processes;
    # a rolling update would start the new pod on the same directory while the
    # old one still has it.
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
      component: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "mgmt.labels" . | nindent 8 }}
        # LOAD-BEARING. The SeaweedFS-down alert's runbook is
        # `kubectl logs -l app=seaweedfs`, and the metrics ServiceMonitor
        # selects the Service that fronts these pods on app: seaweedfs.
        app: seaweedfs
        component: seaweedfs
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "mgmt.schedulingRules" . | nindent 6 }}
      initContainers:
        # Assembles s3.json from the Secrets projected at
        # /etc/seaweedfs-identity-sources. See the header of this file for why
        # this is not a rendered ConfigMap or a rendered Secret.
        #
        # Same image as the server on purpose: no second image to pin, no
        # second thing to keep in step with values.seaweedfs.image.
        - name: build-s3-identities
          image: "{{ .Values.seaweedfs.image.repository }}:{{ .Values.seaweedfs.image.tag }}"
          imagePullPolicy: {{ .Values.seaweedfs.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              SRC=/etc/seaweedfs-identity-sources
              OUT=/etc/seaweedfs/s3.json

              # Read one credential file and JSON-escape it.
              #
              # The empty check is the direct fix for the field-count bug: an
              # identity with an empty secretKey is valid JSON and SeaweedFS
              # loads it without complaint, so the failure surfaces days later
              # as one site getting 403s. Fail here, loudly, with a name.
              read_cred() {
                if [ ! -s "$1" ]; then
                  echo "FATAL: $1 is missing or empty — refusing to write an s3.json with a blank credential" >&2
                  return 1
                fi
                # tr: Secrets created from a file carry a trailing newline that
                # would end up inside the JSON string and silently invalidate
                # the key.
                tr -d '\r\n' < "$1" | sed -e 's/[\\"]/\\&/g'
              }

              sep=""
              # Two identities may NOT share an accessKey. SeaweedFS treats
              # that as fatal and dies with a Go stack trace:
              #
              #   F auth_credentials.go:154 fail to load config file
              #     /etc/seaweedfs/s3.json: duplicate accessKey[X],
              #     already configured in user[admin]
              #
              # which is a CrashLoopBackOff whose cause is buried 20 lines into
              # a panic. It is an easy configuration to arrive at: point two
              # xxxSecretRef values at the same Secret, or copy the admin key
              # into the uploader's Secret because that is what the previous
              # deployment used. Both were hit installing this on
              # stream-2-ab-dev.
              #
              # The chart cannot catch it at render time — it never sees the
              # secret VALUES, only their names — so it is caught here, where
              # the values first exist, and reported as the configuration error
              # it is.
              _seen_keys=""
              emit() {
                _ak=$(read_cred "$2/access-key") || exit 1
                _sk=$(read_cred "$2/secret-key") || exit 1

                case " $_seen_keys " in
                  *" $_ak "*)
                    echo "FATAL: identity '$1' uses an accessKey that another identity already uses." >&2
                    echo "       SeaweedFS rejects duplicate accessKeys and will not start." >&2
                    echo "       Each identity needs its OWN key: check that seaweedfs.adminSecretRef," >&2
                    echo "       xnatUpload.s3SecretRef, each edges[].s3SecretRef / .uploadSecretRef and" >&2
                    echo "       observability.loki.s3SecretRef all point at DIFFERENT Secrets with" >&2
                    echo "       different access keys. (Secret for '$1': $2)" >&2
                    exit 1 ;;
                esac
                _seen_keys="$_seen_keys $_ak"

                printf '%s{"name":"%s","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":%s}' \
                  "$sep" "$1" "$_ak" "$_sk" "$3"
                sep=","
                echo "  identity: $1  actions: $3" >&2
              }

              # s3.json is credentials in cleartext. It is written to a tmpfs
              # emptyDir, mode 0600, and never touches the node's disk.
              umask 077
              {
                printf '{"identities":['
                emit 'admin' "$SRC/admin" '["Admin","Read","Write","List","Tagging"]'
                {{- $ctx := . }}
                {{- range $edge := .Values.edges }}
                {{- $eb := include "mgmt.edgeBucket" (list $ctx $edge) }}
                # Scoped to THIS SITE'S OWN BUCKET.
                #
                # SeaweedFS enforces actions as "<action>:<bucket>", so
                # `Write:<bucket>/*` is bucket-wide and there is no prefix-level
                # scoping — measured: an edge key lists its own bucket and gets
                # AccessDenied on another. While every site shared one bucket,
                # this line granted each edge read and delete over every other
                # site's staged imaging. One bucket per site is what makes the
                # enforcement boundary and the trust boundary the same thing.
                emit {{ $edge.name | squote }} "$SRC/edge/{{ $edge.name }}" '["Read:{{ $eb }}","List:{{ $eb }}","Write:{{ $eb }}/*","Tagging:{{ $eb }}"]'
                {{- end }}
                {{- if $uploaderIdentity }}
                # The S3->XNAT uploader. Write is what lets it REMOVE a staged
                # session once XNAT has confirmed it (SeaweedFS folds object
                # DELETE into the Write action); see dataPolicy.derived.s3Staged.
                {{- $uctx := . }}
                {{- range $edge := .Values.edges }}
                {{- $ub := include "mgmt.edgeBucket" (list $uctx $edge) }}
                emit {{ printf "upload-%s" $edge.name | squote }} "$SRC/upload/{{ $edge.name }}" '["Read:{{ $ub }}","List:{{ $ub }}","Write:{{ $ub }}/*","Tagging:{{ $ub }}"]'
                {{- end }}
                {{- end }}
                {{- if $lokiIdentity }}
                # Loki chunk storage. Deliberately cannot see the ingest
                # bucket: the log store has no business holding a key that
                # reads imaging data.
                emit 'loki-writer' "$SRC/loki" '["Read:{{ $logsBucket }}","List:{{ $logsBucket }}","Write:{{ $logsBucket }}/*","Tagging:{{ $logsBucket }}"]'
                {{- end }}
                printf ']}'
              } > "$OUT"
              echo "wrote $OUT ($(wc -c < "$OUT") bytes)" >&2
          volumeMounts:
            - name: identity-sources
              mountPath: /etc/seaweedfs-identity-sources
              readOnly: true
            - name: s3-config
              mountPath: /etc/seaweedfs
      containers:
        - name: seaweedfs
          image: "{{ .Values.seaweedfs.image.repository }}:{{ .Values.seaweedfs.image.tag }}"
          imagePullPolicy: {{ .Values.seaweedfs.image.pullPolicy }}
          command: ["weed"]
          args:
            - "server"
            - "-dir=/data"
            - "-master.volumeSizeLimitMB={{ .Values.seaweedfs.storage.volumeSizeLimitMB }}"
            # No cap on volume count: the store grows with the disk instead of
            # refusing writes at an arbitrary number.
            - "-volume.max=0"
            # -filer is not optional. The S3 gateway is a front end to the
            # filer; without it S3 accepts connections and fails every request.
            - "-filer"
            - "-s3"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-s3.port=8333"
            # MUST BE PASSED, and it is the reason this flag arrived with the
            # 3.99 -> 4.34 bump rather than on its own.
            #
            # 4.x added an Iceberg REST Catalog to the S3 gateway and DEFAULTED
            # IT ON: weed/command/server.go declares
            #   -s3.port.iceberg (default 8181, "0 to disable")
            # and weed/command/s3.go starts it whenever that port is > 0. 3.99
            # had no such server at all. Upgrading for the S3 CVEs would
            # therefore have silently opened a second, undeclared HTTP API on
            # the pod — and that API is precisely what two of the advisories we
            # are patching are about: CVE-2026-54917 is titled "path traversal
            # in the S3 AND ICEBERG REST gateways", and CVE-2026-55873 is an
            # authorization gap in the S3Tables/Iceberg REST management API.
            # Nothing here speaks Iceberg, so the whole surface goes away.
            #
            # Second reason: if 8181 cannot be bound, s3.go calls glog.Fatalf,
            # so a port clash on this node kills the entire staging store
            # rather than one subsystem.
            #
            # NOTE: this flag does not exist before 4.x. Pinning
            # seaweedfs.image.tag back to a 3.x tag while leaving this here
            # gives "flag provided but not defined" and a CrashLoop — loud, but
            # roll the tag and this flag together.
            - "-s3.port.iceberg=0"
            # `weed server` exposes ONE Prometheus endpoint aggregating
            # master + volume + filer + s3, and -metricsPort is still how you
            # ask for it on 4.34 (verified in weed/command/server.go). The
            # per-subsystem metricsPort flags the docs describe belong to the
            # standalone `weed master` / `weed volume` commands, not to this
            # one.
            - "-metricsPort=9324"
            # SeaweedFS already logs every S3 request to stdout with
            # bucket/key/status/bytes, which Vector indexes into Loki. That is
            # the per-object audit trail; no extra flag needed for it.
          ports:
            - { containerPort: 8333, name: s3 }
            - { containerPort: 9333, name: master }
            - { containerPort: 8080, name: volume }
            - { containerPort: 8888, name: filer }
            - { containerPort: 9324, name: metrics }
          readinessProbe:
            # Master /cluster/status returns 200 + JSON once the cluster is up.
            httpGet:
              path: /cluster/status
              port: 9333
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            # TCP, not HTTP: an unauthenticated GET / on the S3 port returns
            # 403, which an httpGet probe would read as a failure and restart
            # a perfectly healthy gateway in a loop.
            tcpSocket:
              port: 8333
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}
        # tmpfs. The assembled s3.json is every site's S3 secret key in
        # cleartext and must not be written to the node's filesystem.
        - name: s3-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # ONE projected volume rather than one volume per identity, so adding
        # a site adds two lines here instead of a volume plus a mount.
        #
        # Sources are non-optional on purpose: if an edge is listed in `edges`
        # but its Secret has not been created, the pod stays Pending with the
        # missing Secret named in its events. The alternative — starting
        # without that identity — is the silent 403 failure again.
        - name: identity-sources
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ .Values.seaweedfs.adminSecretRef }}
                  items:
                    - key: access-key
                      path: admin/access-key
                    - key: secret-key
                      path: admin/secret-key
              {{- range .Values.edges }}
              - secret:
                  name: {{ .s3SecretRef }}
                  items:
                    - key: access-key
                      path: edge/{{ .name }}/access-key
                    - key: secret-key
                      path: edge/{{ .name }}/secret-key
              {{- end }}
              {{- if $uploaderIdentity }}
              {{- $pctx := . }}
              {{- range $edge := .Values.edges }}
              - secret:
                  name: {{ $edge.uploadSecretRef | default $pctx.Values.xnatUpload.s3SecretRef }}
                  items:
                    - key: access-key
                      path: upload/{{ $edge.name }}/access-key
                    - key: secret-key
                      path: upload/{{ $edge.name }}/secret-key
              {{- end }}
              {{- end }}
              {{- if $lokiIdentity }}
              - secret:
                  name: {{ .Values.observability.loki.s3SecretRef }}
                  items:
                    - key: access-key
                      path: loki/access-key
                    - key: secret-key
                      path: loki/secret-key
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # This name is contractual: mgmt.s3InternalEndpoint in _helpers.tpl builds
  # http://<fullname>-seaweedfs.<ns>.svc.cluster.local:8333 from it, and the
  # uploader, Loki and the bucket hook all dial that.
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    # Deliberately NOT app: seaweedfs. That label is the ServiceMonitor's
    # selector, and if this Service carried it Prometheus would add a second
    # target here for a port named "metrics" that does not exist on it.
spec:
  # ClusterIP only. Everything external arrives through nginx-ingress on :443.
  # The master and filer admin UIs are intentionally not published at all:
  #   kubectl port-forward -n {{ .Release.Namespace }} svc/{{ $fullName }} 9333:9333   # master
  #   kubectl port-forward -n {{ .Release.Namespace }} svc/{{ $fullName }} 8888:8888   # filer
  type: ClusterIP
  selector:
    app: seaweedfs
    component: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { port: 8333, targetPort: s3, name: s3 }
    - { port: 9333, targetPort: master, name: master }
    - { port: 8888, targetPort: filer, name: filer }
---
# A separate metrics-only Service, so the ServiceMonitor can select on
# app: seaweedfs without also matching the S3 Service above.
#
# Binding note: `weed server -metricsPort=9324` listens on the pod IP, not on
# 127.0.0.1. `kubectl port-forward` to it therefore fails while Prometheus,
# which dials the Service IP and gets routed to the pod IP, scrapes fine —
# do not read a failed port-forward as broken metrics.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
    # Not used for discovery of a Service — Prometheus finds Services through
    # the ServiceMonitor's selector — but kept in step with the ServiceMonitor
    # so the pair cannot drift apart. Hardcoding it (the installer wrote
    # `release: kube-prometheus-stack` in five files) is what silently
    # unhooked Prometheus from our rules.
    release: {{ include "mgmt.prometheusReleaseLabel" . }}
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
    component: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { port: 9324, targetPort: metrics, name: metrics }
{{- if .Values.seaweedfs.ingress.enabled }}
{{- $s3ClientCerts := .Values.seaweedfs.ingress.clientCerts }}
{{- $s3ClientCASecret := printf "%s-s3-client-ca" (include "mgmt.fullname" .) }}
{{- /*
mTLS ON THE S3 UPLOAD PATH — TWO SWITCHES, IN THIS ORDER, ON PURPOSE.

  clientCerts.issue    mint the anchor and one client certificate per edge,
                       and let cert-sync carry them to the sites.
  clientCerts.require  put auth-tls-verify-client: on across this Ingress.

They are separate because turning verification on BEFORE the certificates have
landed breaks every upload with an error that names nothing useful. MEASURED
against nginx `ssl_verify_client on` and rclone 1.75.0: under TLS 1.3 the
handshake SUCCEEDS (the client certificate is sent after the server's Finished,
so nginx cannot refuse the connection) and nginx refuses the REQUEST instead —
HTTP 400 "No required SSL certificate was sent" with an HTML body, which rclone
tries to parse as an S3 error and reports as `error while deserializing xml
error response`. A certificate from the wrong CA gives the same 400; a CN
outside auth-tls-match-cn gives a 403 with the same XML noise. None of the
three mentions certificates or authentication, and all three land on the
uploader's pre-flight probe as `endpoint_failed` — which reads as a dead
endpoint.

So the correct rollout is: issue -> wait for cert-sync -> CONFIRM the Secret
exists on each edge -> flip require. A single flag would make steps 1 and 3 the
same instant, with cert-sync's six-hour period sitting in the middle of it.

The guards below are the render-time half of that; they cannot check the Secret
landed (no template can), only that something is set up to deliver it.
`scripts/verify-live.sh` checks the other half against a live cluster.
*/}}
{{- if $s3ClientCerts.require }}
  {{- if not $s3ClientCerts.issue }}
    {{- fail "seaweedfs.ingress.clientCerts.require=true with clientCerts.issue=false. The Ingress would demand a client certificate while nothing mints one and nothing puts the CA anchor Secret in this namespace, so nginx has no trust anchor to verify against and every edge upload fails. Measured, that failure is an HTTP 400 with an HTML body that rclone reports as an S3 XML parse error — it names neither certificates nor auth, and reaches the uploader as endpoint_failed. Set clientCerts.issue=true FIRST, wait for cert-sync to deliver s3-client-tls to every edge, confirm it is there (scripts/verify-live.sh checks exactly this), and only then set require=true." }}
  {{- end }}
{{- end }}
{{- if $s3ClientCerts.issue }}
  {{- /* Same shape as the Loki push guard in templates/observability.yaml: the
         second half of mTLS lives in another chart and is only reachable
         through cert-sync. The per-edge version of this check is in
         cert-sync.yaml, where the entries being judged are read. */ -}}
  {{- if not .Values.certSync.enabled }}
    {{- fail "seaweedfs.ingress.clientCerts.issue=true mints one S3 client certificate per edge, but certSync.enabled=false, so nothing ever delivers one. The certificates would sit on this cluster unused, no site could ever present one, and the moment clientCerts.require is flipped every upload would fail — measured, as an HTTP 400 whose HTML body rclone reports as an S3 XML parse error, naming neither certificates nor auth. Enable certSync, or set clientCerts.issue=false and rely on the SigV4 key pair alone." }}
  {{- end }}
{{- end }}
---
{{- /*
S3 published on :443.

This Ingress TERMINATES TLS; it does not use ssl-passthrough, and that is a
decision, not an omission:

  * The leg that needs encrypting is edge -> management, across the public
    internet. nginx -> SeaweedFS is a ClusterIP hop inside the node.
  * SeaweedFS has no TLS listener configured on 8333, so passthrough would
    hand it a TLS ClientHello it cannot answer.

It has to COEXIST with ingressNginx.sslPassthrough=true, which the k0smotron
child API and konnectivity require. With --enable-ssl-passthrough the
controller puts a SNI-routing TCP proxy in front of :443 and forwards every
non-passthrough host to its own internal HTTPS listener, where these
annotations still apply. Two things follow:

  * Clients MUST send SNI. The passthrough proxy routes on the TLS server
    name, so an edge that dials https://<mgmtNodeIP>/ instead of the hostname
    lands on the default backend and gets a 404 that looks like a routing bug.
  * backend-protocol is pinned to HTTP below so that enabling passthrough
    cluster-wide can never be misread as applying to this host.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # A single DICOM session is routinely tens of GB. nginx's 1m default would
    # 413 the multipart parts, which surfaces at the edge as an upload that
    # retries forever.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.seaweedfs.ingress.proxyBodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Stream the body straight through. With buffering on, nginx spools each
    # multipart part to its own disk first — doubling the write and filling
    # the controller pod's ephemeral storage on large sessions.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    {{- if $s3ClientCerts.require }}
    {{- /*
    THESE ANNOTATIONS WORK HERE BECAUSE THIS INGRESS TERMINATES TLS. nginx
    performs the handshake with the edge (see the note above: no
    ssl-passthrough on this host), so it is the party that can ask for a
    client certificate. Note what "verify" does and does not mean under TLS
    1.3: the handshake still completes when the client sends nothing, and
    nginx answers the first REQUEST with 400 instead. The check is real; the
    error is just an HTTP one. With ingressNginx.sslPassthrough=true the controller
    still routes this hostname to its own HTTPS listener, where ssl_verify_*
    applies as normal. On cloud the load balancer in front is LAYER 4 and does
    not terminate TLS either, so nginx sees the client handshake there too and
    this behaves identically — nothing here is topology-specific.

    ssl_verify_client is a SERVER-block directive, so it applies to the
    SeaweedFS hostname and nothing else. Grafana and the Loki push endpoint are
    separate server blocks on the same listener and are unaffected.

    WHAT THIS ADDS OVER THE SigV4 KEY PAIR, which already scopes each site to
    its own bucket: the key pair is a bearer secret — anything holding a copy
    can use it from anywhere. The certificate binds the upload to a private key
    that never leaves the site and that cert-manager rotates every 90 days, and
    it moves the first line of defence off the S3 gateway and onto the ingress,
    where an unauthenticated request never reaches SeaweedFS at all. The two are
    independent: neither replaces the other, and losing one still leaves the
    other in force.
    */}}
    # The CA half of the S3 client PKI, in this namespace. See the anchor
    # Certificate below for why this is not the CA Secret itself.
    nginx.ingress.kubernetes.io/auth-tls-secret: "{{ .Release.Namespace }}/{{ $s3ClientCASecret }}"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    # 2, not the ingress-nginx default of 1 — same reasoning as the Loki push
    # Ingress: selfSigned mode signs leaves straight off the root (depth 1),
    # intermediate mode (certManager.ca.mode) puts one CA in between (depth 2),
    # both modes ship, and a depth of 1 in intermediate mode fails the
    # handshake for every edge at once.
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    {{- if .Values.edges }}
    {{- /*
    Pin the accepted subjects to the sites we issued certificates for. Without
    it, ANY certificate the fleet CA has ever signed is accepted here — the
    Loki push client certificates and the SeaweedFS server certificate
    included, which would make the whole check decorative.

    STATED HONESTLY: this does not stop one edge presenting another edge's
    certificate. All sites upload to one hostname through one Ingress, so the
    regex has to admit every site. What stops cross-site access is the S3
    identity: SeaweedFS scopes each key pair to that site's own bucket
    (seaweedfs.perSiteBuckets). This bounds WHICH certificates are accepted at
    the door, and makes removing a site from `edges` and upgrading a
    revocation.

    Same regex construction as the Loki push Ingress, from the same list.
    nginx matches it against the whole subject DN, unanchored; our
    Certificates set commonName and nothing else, so the DN is exactly
    "CN=<edge>", and mgmt.validate has already refused any edge name that
    could act as a regex metacharacter.
    */}}
    nginx.ingress.kubernetes.io/auth-tls-match-cn: "CN=({{ range $i, $e := .Values.edges }}{{ if $i }}|{{ end }}{{ $e.name }}{{ end }})"
    {{- end }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ include "mgmt.seaweedfsHost" . }}
      secretName: {{ .Values.seaweedfs.ingress.tlsSecretName }}
  rules:
    - host: {{ include "mgmt.seaweedfsHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: s3
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.seaweedfs.ingress.tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
spec:
  secretName: {{ .Values.seaweedfs.ingress.tlsSecretName }}
  duration: 8760h        # 1y
  renewBefore: 720h      # 30d
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - {{ include "mgmt.seaweedfsHost" . }}
  {{- if eq .Values.topology "onprem" }}
  # An IP SAN only for onprem, where edges reach this host through a
  # hostAliases pin rather than DNS. It is a convenience for debugging by IP;
  # note that the ssl-passthrough proxy in front of :443 needs SNI regardless,
  # so an IP-addressed request will not actually route here. Public CAs do not
  # issue IP SANs at all, which is the other reason this is onprem-only.
  ipAddresses:
    - {{ .Values.domain.mgmtNodeIP | quote }}
  {{- end }}
  issuerRef:
    name: {{ .Values.certManager.issuer }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- if $s3ClientCerts.issue }}
---
{{- /*
THE TRUST ANCHOR THE S3 INGRESS VERIFIES AGAINST.

Everything the Loki anchor's note says applies verbatim, so only the part that
differs is repeated here: this is a SECOND anchor, deliberately, not a reuse of
mgmt-loki-client-ca.

WHY NOT ONE ANCHOR FOR BOTH PATHS. auth-tls-secret is what nginx checks the
chain against, so the anchor IS the revocation boundary. With one anchor, the
only way to stop trusting a client certificate is to re-issue the anchor — and
that invalidates every certificate under it, on BOTH paths at once. Revoking a
site's ability to upload imaging would take its log shipping down with it,
which is precisely the moment the fleet most needs to hear from that site. Two
anchors keep those two actions separate. They cost one extra Certificate object
each and are both signed by the same fleet CA, so there is still one PKI to
reason about.

REUSING THE SEAWEEDFS SERVER CERTIFICATE'S SECRET IS THE SAME TRAP IT IS ON THE
LOKI PATH: its ca.crt is whatever signed the SERVER cert, which is
certManager.issuer — an ACME chain in the Let's Encrypt configuration, which has
never signed an edge client certificate. This one is pinned to the internal CA
in both modes.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $s3ClientCASecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
spec:
  secretName: {{ $s3ClientCASecret }}
  # Not a hostname and not a client identity — it must not collide with an edge
  # name, or auth-tls-match-cn above would accept this certificate as a site.
  # Nothing presents it; only its ca.crt is read.
  commonName: s3-upload-client-ca-anchor
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ include "mgmt.caIssuerName" . }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- /*
ONE S3 CLIENT IDENTITY PER EDGE, from the same CA. cert-sync copies tls.crt +
tls.key into the site as `s3-client-tls` (certSync.secrets in the site values;
templates/cert-sync.yaml refuses to render if that entry is missing while these
certificates are being issued).

GATED ON clientCerts.issue, unlike the Loki per-edge certificates beside them,
and the difference is not an inconsistency. charts/edge mounts
loki-push-client-tls UNCONDITIONALLY, so gating that issuance would leave
cert-sync with no source and Vector unable to start at any site. The S3 mount is
gated on upload.s3.requireClientCert and the whole feature ships OFF, so here
the same gate costs nothing and keeps a fleet that has not opted in free of
per-edge objects nothing consumes.
*/ -}}
{{- range $edge := .Values.edges }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mgmt.s3ClientCertSecret" $edge.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mgmt.labels" $ | nindent 4 }}
    app: seaweedfs
    ais-edge.org/edge: {{ $edge.name }}
spec:
  secretName: {{ include "mgmt.s3ClientCertSecret" $edge.name }}
  # The edge name and nothing else, so the subject DN is exactly "CN=<edge>",
  # which is what auth-tls-match-cn matches on.
  commonName: {{ $edge.name | quote }}
  # 90 days, renewed at 30 — the same cadence as the Loki client certificate,
  # for the same reason: this is a certificate whose renewal is exercised end to
  # end by cert-sync, and a yearly cadence proves the distribution path once a
  # year, which is the same as not proving it. CertSyncStale covers the gap.
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    # Renewal must produce a NEW key, or a leaked key stays valid for the life
    # of the fleet.
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    # client auth only. This certificate authenticates a site to the upload
    # endpoint; it is never a server, and leaving server auth on would let a
    # copy of it terminate TLS for any name it happens to carry.
    - client auth
  issuerRef:
    name: {{ include "mgmt.caIssuerName" $ }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.seaweedfs.buckets }}
---
{{- /*
Bucket creation.

Replaces the tail of scripts/03: curl the MinIO client off the internet into
/usr/local/bin, background a `kubectl port-forward`, poll it, `mc mb`, then
kill the port-forward from a trap. That needed a workstation with internet
access, sudo on the management node, and a port-forward that stayed up for
the duration — and its exit code told you nothing, because `mc mb` was piped
to /dev/null.

In-cluster instead: the same S3 API, over the ClusterIP Service, with the
admin identity mounted from a Secret.

CREATE-ONLY. head-bucket first, create only on a miss, and there is no
pre-delete or post-delete hook anywhere in this chart. `helm uninstall` must
never be able to remove a bucket holding staged sessions.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-buckets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgmt.labels" . | nindent 4 }}
    app: seaweedfs
    component: bucket-init
  annotations:
    # post-*, not pre-*: the S3 gateway has to exist before it can be talked
    # to. The Deployment may still be starting when this runs, hence the wait
    # loop in the script.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    # before-hook-creation clears the previous Job object (Jobs have immutable
    # pod templates, so a re-run would otherwise fail with "field is
    # immutable"). hook-succeeded keeps a FAILED Job around for its logs.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "mgmt.labels" . | nindent 8 }}
        app: seaweedfs
        component: bucket-init
    spec:
      restartPolicy: Never
      {{- include "mgmt.schedulingRules" . | nindent 6 }}
      containers:
        - name: create-buckets
          # Pinned to the same AWS CLI the edge s3-uploader runs, so the two
          # ends of the ingest path speak an identical S3 dialect. There is no
          # values key for this image — see the chart README/report.
          image: amazon/aws-cli:2.31.19
          # The image's entrypoint is `aws`; override it to run a script.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # The Deployment is created in the same Helm operation as this
              # hook, so on a first install the gateway is usually still
              # pulling its image. Five minutes of patience beats a failed
              # install that only needed a retry.
              i=0
              until aws s3api list-buckets >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "FATAL: $AWS_ENDPOINT_URL never answered. Check: kubectl logs -n {{ .Release.Namespace }} -l app=seaweedfs" >&2
                  exit 1
                fi
                echo "waiting for the S3 gateway ($i/60)..."
                sleep 5
              done

              create_only() {
                if aws s3api head-bucket --bucket "$1" >/dev/null 2>&1; then
                  echo "bucket $1 already exists — left untouched"
                else
                  aws s3api create-bucket --bucket "$1"
                  echo "bucket $1 created"
                fi
              }

              # Every distinct staging bucket in use, derived from the same
              # helper the uploader and identities use, so the three can never
              # disagree about a site's bucket name.
              {{- range $b := splitList " " (include "mgmt.allIngestBuckets" .) }}
              {{- if $b }}
              create_only {{ $b | squote }}
              {{- end }}
              {{- end }}
              {{- range $key, $bucket := .Values.seaweedfs.buckets }}
              {{- if not (and $.Values.seaweedfs.perSiteBuckets (eq $key "ingest")) }}
              create_only {{ $bucket | squote }}
              {{- end }}
              {{- end }}
          env:
            - name: AWS_ENDPOINT_URL
              value: {{ include "mgmt.s3InternalEndpoint" . | quote }}
            # SeaweedFS ignores the region entirely; the AWS CLI refuses to
            # make any call without one being set.
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seaweedfs.adminSecretRef }}
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seaweedfs.adminSecretRef }}
                  key: secret-key
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits:   {memory: 256Mi, cpu: 500m}
{{- end }}
{{- end }}
