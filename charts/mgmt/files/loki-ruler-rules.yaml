# =============================================================================
# Loki ruler rules — log-derived alerts.
# =============================================================================
# These alerts evaluate LogQL queries on a schedule inside Loki and emit to
# the kube-prometheus-stack Alertmanager (configured in loki-values.yaml.tpl
# rulerConfig.alertmanager_url). They cover anything that depends on the
# pipeline events emitted by the s3-uploader, group, and assign pods on
# every edge child cluster.
#
# The mgmt cluster's Prometheus cannot scrape edge pods directly (the
# konnectivity tunnel is one-way), and pushing Prometheus remote-write back
# from the edge would require additional ingress + auth surface. Loki
# already receives every log line from every edge, so running the rules
# in Loki is the lower-coupling path. Plus the source-of-truth for these
# alerts is the structured JSON event itself, not a derived metric.
#
# Rule file format is identical to Prometheus rule files. Loki's ruler
# writes firing alerts to Alertmanager v2 with the labels and annotations
# below, so the existing email/Slack receivers keep working unchanged.
#
# Companion: alerts/critical-k8s.yaml + alerts/warning-k8s.yaml + alerts/
# info-k8s.yaml hold the K8s-metric-based alerts (worker NotReady, pod
# restarts, certificate expiry) that genuinely live in Prometheus.
# =============================================================================
groups:
  # =====================================================================
  # CRITICAL — page on-call. Pipeline is broken.
  # =====================================================================
  - name: ais-edge-pipeline-critical
    interval: 1m
    rules:
      - alert: XNATUploadFailingForAllSessions
        # Failures appearing while no completed uploads in the same
        # window — i.e. the pipeline has stopped delivering to S3.
        #
        # THIS RULE COULD NEVER FIRE UNTIL IT WAS REWRITTEN, AND IT IS THE ONLY
        # CRITICAL ALERT ON THE EDGE UPLOAD PATH. Two independent defects, both
        # of which fail in the direction of silence:
        #
        # 1. `count_over_time(...) == 0` CANNOT EXPRESS ABSENCE. When the
        #    selector matches nothing there is no series to compare, so the
        #    result is EMPTY — not a series carrying the value 0. `X and (Y == 0)`
        #    is therefore empty exactly when Y is absent, which is the very case
        #    the rule was written to catch. Measured against live Loki: the
        #    `== 0` half returns NO SERIES, and it still returns none over a
        #    22,343-line stream, so this is not an artefact of a quiet window.
        #
        # 2. `and ignoring (cluster)` DROPPED THE ONE LABEL THAT MATTERS. It
        #    matches every left series against every right series regardless of
        #    which site produced them, so one edge's failures paired with a
        #    DIFFERENT edge's completions. Measured with the two real clusters
        #    in this deployment: LHS {cluster=edge-dev}=68 and {cluster=mgmt}
        #    =22264 against an RHS holding mgmt only, `and ignoring (cluster)`
        #    returned BOTH series — edge-dev survived purely on mgmt's data.
        #    A healthy site would have paged for a broken one, and vice versa.
        #
        # `unless on (cluster)` fixes both at once, and is the idiom
        # SessionUploadStalled below already uses correctly: keep a cluster's
        # failures UNLESS that same cluster also completed an upload in the
        # window. Absence is expressed by the set operation rather than by
        # comparing a missing series to a number, and the join is pinned to
        # `cluster` so sites cannot cross-talk.
        expr: |
          (sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_failed" [15m])) > 0)
          unless on (cluster)
          (sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_completed" [15m])) > 0)
        for: 15m
        labels:
          severity: critical
          source: loki-ruler
        annotations:
          summary: "All upload attempts have failed for 15+ minutes on {{ $labels.cluster }}"
          description: "No completed uploads while failures keep coming. Likely network / SeaweedFS / credential break. Check `kubectl --kubeconfig kubeconfig-{{ $labels.cluster }} logs -n xnat-ingest -l component=s3-uploader`."

  # =====================================================================
  # WARNING — notify but don't page.
  # =====================================================================
  - name: ais-edge-pipeline-warning
    interval: 1m
    rules:
      - alert: S3UploaderRetryStorm
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_failed" [10m])) > 5
        for: 2m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: ">5 upload failures in 10 minutes on {{ $labels.cluster }}"
          description: "Edge s3-uploader is retrying. Likely transient network or credentials. Inspect pod logs for the actual error."

      - alert: SessionUploadStalled
        # An upload_started for a session without a corresponding
        # upload_completed in the same 15-min window.
        expr: |
          (sum by (cluster, session) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_started" [15m])) > 0)
          unless on (cluster, session)
          (sum by (cluster, session) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_completed" [15m])) > 0)
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: "Session {{ $labels.session }} on {{ $labels.cluster }} has been uploading for 15+ minutes"
          description: "mc mirror started but did not complete within the expected window. Could be a slow network, large session, or stuck retry."

      - alert: SessionStagedNotConfirmedInXNAT
        # THE ONLY ABSENCE ALERT IN THIS FILE, AND THE MOST IMPORTANT ONE.
        #
        # Everything else here is PRESENCE-based: it fires because something
        # happened. This fires because something DID NOT happen — a session left
        # the edge and reached staging, and was never confirmed to be in XNAT.
        #
        # That is the failure this system is actually exposed to. A silent no-op
        # upstream, an expired XNAT credential, a renamed project, a new modality
        # nobody mapped: in every one of those the uploader keeps reporting
        # success and the staged data simply accumulates. There is no error to
        # alert on, which is exactly why an absence alert is the only thing that
        # catches it.
        #
        # Observed for real: xnat-ingest's all_uploaded() inspects only
        # session-level resources and misses scan-level ones, so it skipped a
        # session while logging "all the resources already exist on XNAT" — about
        # an EMPTY XNAT. It ran that way for two days looking like success. This
        # rule would have fired on day one.
        #
        # THE CONFIRMATION SIGNAL IS DELIBERATELY THE RECLAIMER'S.
        # reclaim_confirmed is emitted only after independently re-querying XNAT
        # and matching every filename and checksum against the staged manifest.
        # It is the one event in the system that is proof of delivery rather than
        # a report of an attempt.
        #
        # `offset` IS WHAT MAKES THIS CORRECT, AND IT IS EASY TO GET WRONG.
        #
        # A plain [48h] range does NOT mean "staged more than 48h ago" — it
        # means "staged at any point in the last 48h", which is true the moment
        # a session is staged. Written that way, this alert fires after every
        # healthy upload, because reclaim_confirmed legitimately does not exist
        # yet: minAge is 1d, so confirmation cannot arrive for ~25h. Caught on
        # a live session that was 18h old and already safely in XNAT.
        #
        # `[24h] offset 48h` selects sessions the reclaimer SAW between 48h and
        # 72h ago — old enough that confirmation should have happened. The
        # confirmation lookback is [72h] so it spans staging through to now.
        #
        # BOTH HALVES ARE MANAGEMENT-SIDE, DELIBERATELY. The obvious "staged"
        # signal is the edge's own upload_completed, and it is the wrong one:
        # the edge cannot observe XNAT (it holds no credential and never
        # contacts it), and its logs reach Loki only while the push path is
        # healthy — so an outage of that path would SILENCE the very alert
        # meant to catch silent failure. The reclaimer runs on the management
        # plane, walks every staged session each run, and emits a per-session
        # event for each, which makes it a staging signal that cannot go quiet
        # for the same reason the delivery did.
        #
        # RAISE BOTH IF YOU RAISE minAge: the offset must stay comfortably above
        # minAge plus one reclaim schedule interval, or healthy sessions land
        # inside the window before they can possibly be confirmed.
        #
        # `event=~"reclaim_.*"` IN THE FIRST HALF IS NOT A CONVENIENCE, AND IT
        # MUST NOT BE NARROWED TO A LIST OF THE "INTERESTING" OUTCOMES.
        #
        # It is what lets a run that ABORTED still count as evidence that the
        # session is staged. Until 2026-08-06 a failed pre-flight logged one
        # reclaim_unavailable with session="" and exited, and `session != ""`
        # dropped it, so that run contributed nothing to this half.
        #
        # SCOPE THAT HONESTLY. The two aborts observed on 2026-08-05/06 (HTTP
        # 000 from XNAT) did NOT silence this alert: the range below is a count
        # over 24h and the ~22 healthy runs either side kept it supplied —
        # checked in Loki, the window never emptied. The exposure is a
        # pre-flight that stays broken across a whole 24h window, after which
        # every session staged in that window is invisible here until the
        # window slides past the outage: 48h after recovery, never without one.
        #
        # The reclaimer now fans reclaim_unavailable out per staged session for
        # exactly this expression to pick up (charts/mgmt/files/reclaim-staged.sh,
        # `unavailable`), so a reclaimer that can never confirm anything makes
        # this fire rather than making it quiet.
        #
        # reclaim_unavailable can never be mistaken for delivery: the second
        # half matches event="reclaim_confirmed" exactly, and only a positive,
        # file-by-file XNAT match emits that.
        #
        # This still reports 48h late by design. ReclaimerRunUnavailable below
        # is the same failure caught within the hour; both are wanted, because
        # a pre-flight that recovers on its own leaves this one to notice the
        # sessions that went unconfirmed while it was down.
        expr: |
          (sum by (cluster, session) (count_over_time(
            {namespace="xnat-upload", component="s3-reclaimer"}
            | json | event=~"reclaim_.*" | session != "" [24h] offset 48h)) > 0)
          unless on (cluster, session)
          (sum by (cluster, session) (count_over_time(
            {namespace="xnat-upload", component="s3-reclaimer"}
            | json | event="reclaim_confirmed" [72h])) > 0)
        for: 30m
        labels:
          severity: critical
          source: loki-ruler
          category: delivery-absence
        annotations:
          summary: "Session {{ $labels.session }} staged >48h ago and is NOT confirmed in XNAT"
          description: |
            {{ $labels.session }} from {{ $labels.cluster }} reached S3 staging more
            than 48 hours ago, and the reclaimer has never confirmed XNAT holds its
            files. Nothing will have errored. Check, in order:
              1. Is it still staged?
                 aws s3 ls s3://ingest-{{ $labels.cluster }}/staged/
              2. What does the uploader say?
                 kubectl -n xnat-upload logs deploy/mgmt-upload-{{ $labels.cluster }} | grep {{ $labels.session }}
                 "Skipping ... all the resources already exist on XNAT" against an
                 empty XNAT means the upstream all_uploaded() bug.
              3. Does XNAT actually hold it?
              4. What did the reclaimer decide? reclaim_kept with incomplete_in_xnat
                 means a partial upload. reclaim_unavailable means the reclaimer
                 could not decide at all — see ReclaimerRunUnavailable.

      - alert: ReclaimerRunUnavailable
        # THE RECLAIMER FAILING IS NOT A DATA-LOSS EVENT. IT IS A BLINDNESS
        # EVENT, WHICH IN THIS PIPELINE IS WORSE.
        #
        # An aborted reclaim run deletes nothing, so on the surface it is the
        # safe outcome. What it actually costs is the one independent check
        # that XNAT holds what was staged. While it is down nothing confirms
        # deliveries, staging grows, and the operator is told nothing —
        # observed twice on 2026-08-05/06 (18:17Z and 01:17Z), both an XNAT
        # auth probe returning HTTP 000, both entirely silent. THIS is the rule
        # those two aborts needed; the per-session fan-out feeding
        # SessionStagedNotConfirmedInXNAT above covers the longer outage that
        # has not happened yet.
        #
        # `session = ""` COUNTS RUNS, NOT SESSIONS. The reclaimer emits one
        # session-less reclaim_unavailable for the run and then one per staged
        # session (that fan-out is what keeps SessionStagedNotConfirmedInXNAT
        # above supplied). Without this filter a single aborted run against a
        # hundred staged sessions would read as a hundred failures.
        # (Strictly it counts run-level LINES: a run that hits
        # UNAVAILABLE_SESSION_CAP emits a session-less truncation line too, so
        # such a run contributes 2. Immaterial against `> 0` — do not "fix" it
        # by dropping the filter.)
        #
        # Grouped by `reason` — the machine-readable slug the script attaches,
        # e.g. xnat_probe_failed, filer_unreachable, bucket_unreachable,
        # missing_tool — so the notification names the broken dependency
        # instead of just saying the job failed.
        #
        # [3h] against an hourly CronJob: one aborted run is enough to fire,
        # and the alert clears about three hours after the reclaimer starts
        # completing again. A range at or below the schedule interval would
        # resolve and re-fire between runs and mail on every cycle.
        #
        # severity=warning, NOT critical, deliberately. Nothing is lost and the
        # observed failures were transient and self-healing; a twice-a-day
        # critical is how an alert gets filtered into a folder nobody reads,
        # which would put us back where we started. The critical for this
        # failure mode is SessionStagedNotConfirmedInXNAT, which now still
        # fires 48h later because of the per-session fan-out.
        expr: |
          sum by (cluster, reason) (count_over_time(
            {namespace="xnat-upload", component="s3-reclaimer"}
            | json | event="reclaim_unavailable" | session = "" [3h])) > 0
        for: 0s
        labels:
          severity: warning
          source: loki-ruler
          category: delivery-absence
        annotations:
          summary: "Reclaimer on {{ $labels.cluster }} aborted before deciding anything ({{ $labels.reason }})"
          description: |
            The S3 staging reclaimer failed its pre-flight and examined nothing.
            Nothing was deleted — but nothing was CONFIRMED either, so for as long
            as this is firing no session is being independently checked against
            XNAT and staging is not being reclaimed.
              1. What did it say? (the pod of a FAILED job is usually already
                 garbage-collected, so prefer Loki over kubectl logs)
                 kubectl -n xnat-upload logs -l component=s3-reclaimer --tail=50
              2. reason={{ $labels.reason }} names the failed dependency:
                 xnat_probe_failed / xnat_credentials_missing → XNAT or its Secret
                 filer_unreachable / filer_unhealthy          → SeaweedFS filer
                 bucket_unreachable / staging_list_failed     → S3 gateway or creds
                 minage_unparseable / reclaim_disabled        → dataPolicy values
                 missing_tool                                 → the job image
              3. Sessions staged while this was firing are still tracked:
                 the reclaimer logs reclaim_unavailable per session, so
                 SessionStagedNotConfirmedInXNAT will fire on them in ~48h if
                 they are never confirmed.

      - alert: XNATBacklogGrowing
        # Sessions arriving in S3 faster than they're consumed by
        # the mgmt-side xnat-ingest-upload pod (event=xnat_upload_completed).
        expr: |
          (sum(count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_completed" [30m]))
           -
           sum(count_over_time(
            {namespace="xnat-upload"}
            | json | event="xnat_upload_completed" [30m]))
          ) > 3
        for: 30m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: "XNAT upload backlog is growing"
          description: "Sessions are landing in SeaweedFS faster than they're being pushed to XNAT. xnat-ingest-upload may be slow or partially failing — check `kubectl logs -n xnat-upload -l app=xnat-ingest-upload`."

      - alert: DICOMRejectedUnmappedAET
        # SILENT DATA LOSS — the highest-value alert in this pipeline.
        #
        # The Orthanc deid hook looks the calling AE title up in
        # routing.json's AETMap. If it isn't there it logs
        #   "REJECT: no project mapped for CalledAET <AET>"
        # and RestApiDelete()s the instance (deidentify-and-forward.lua).
        # The sending modality still gets a DICOM-level C-STORE SUCCESS,
        # so the scanner believes the study was delivered while it is in
        # fact discarded and never reaches XNAT.
        #
        # Real-world triggers: a newly commissioned scanner, a console
        # re-imaged with a default AE title, or a typo in the AET — all
        # routine events at an imaging facility. Without this alert
        # nobody finds out until someone notices missing studies.
        #
        # Fires on a single occurrence (for: 0s): one rejected study is
        # already lost data, so there is no "spike" threshold to wait for.
        # Grouped by the offending AET so each mis-configured device is
        # its own notification.
        expr: |
          sum by (cluster, aet) (
            count_over_time(
              {namespace="xnat-ingest", app="orthanc"}
              |~ "REJECT: no project mapped for CalledAET"
              | regexp "CalledAET (?P<aet>[A-Za-z0-9._-]+)"
              [5m]
            )
          ) > 0
        for: 0s
        labels:
          severity: warning
          source: loki-ruler
          category: dicom-routing
        annotations:
          summary: "DICOM REJECTED — unmapped scanner AE title '{{ $labels.aet }}' on {{ $labels.cluster }}"
          description: |
            Orthanc rejected one or more studies sent with AE title
            '{{ $labels.aet }}', which is not present in routing.json's
            AETMap. The studies did NOT reach XNAT, and the sending
            modality received a C-STORE SUCCESS so it will not retry.

            The data is NOT lost — the originals were quarantined to
              <FacilityBackupDir>/__unmapped_aet__/{{ $labels.aet }}/<PatientID>/<StudyUID>/
            on the edge node (default host path
            /data/facility-backup/__unmapped_aet__/).

            Fix: add '{{ $labels.aet }}' to the AETMap in
            config/orthanc/routing.json (mapped to the correct XNAT
            project), re-run scripts/07c-deploy-edge-orthanc.sh, then
            re-send the quarantined files, e.g.
              dcmsend <edge-ip> 4242 -aec AISEDGE \
                /data/facility-backup/__unmapped_aet__/{{ $labels.aet }}/**/*.dcm

      - alert: DICOMValidationFailureSpike
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="assign"}
            |~ "(?i)invalid|validation.*fail" [1h])) > 10
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: ">10 invalid DICOM sessions on {{ $labels.cluster }} in last hour"
          description: "Sessions are landing in __invalid__/. Likely a scanner exporting DICOMs without AccessionNumber — check scanner config."

  # =====================================================================
  # INFO — observability + audit. Fires on every successful upload to XNAT
  # so operators / auditors can confirm the pipeline reached its terminal
  # step. Routed to email-primary via Alertmanager (see
  # alertmanager-config.yaml.tpl — route override on alertname).
  # =====================================================================
  - name: ais-edge-pipeline-info
    interval: 30s
    rules:
      - alert: XNATUploadSuccess
        # GUIDING: must stay a MANAGEMENT-side signal — the edge holds no
        # XNAT credential and never contacts XNAT, so it cannot know. Full
        # incident and the duplicate-mail root cause:
        # docs/alerting-architecture.md, "Troubleshooting: repeated XNAT
        # upload completed emails".
        #
        # CAUTION — RANGE MUST EXCEED THE UPLOADER'S ~62s LOOP PERIOD, or
        # duplicate mail returns. The matched string is re-emitted every
        # pass (a LEVEL, not an event — see docs/components/xnat-ingest.md,
        # "Known upstream defects"), so too short a range lets the series go
        # empty between passes and the alert flaps once per loop. 10m gives
        # ~10x headroom; scripts/ci/promtool.sh asserts it stays that way.
        # `group_by: session` (files/alertmanager-config.yaml) is necessary
        # but not sufficient on its own — it only collapses alerts firing at
        # the same time, not a resolve/re-fire cycle.
        #
        # Keying on a third-party log string is a real weakness — an
        # upstream rewording disables this silently.
        # SessionStagedNotConfirmedInXNAT below is the backstop for exactly
        # that failure: staged, and never confirmed.
        expr: |
          sum by (cluster, session) (
            count_over_time(
              {namespace="xnat-upload"}
              |~ "Successfully uploaded all files in"
              | regexp "Successfully uploaded all files in '(?P<session>[^']+)'"
              [10m]
            )
          ) > 0
        for: 0s
        labels:
          severity: info
          source: loki-ruler
          category: pipeline-success
        annotations:
          summary: "XNAT upload completed — {{ $labels.session }}"
          description: |
            Session {{ $labels.session }} landed in XNAT (pushed by
            xnat-ingest-upload on cluster {{ $labels.cluster }}).
            Verify in the pod logs:
              kubectl -n xnat-upload logs deploy/xnat-ingest-upload --tail=30

      - alert: XNATAuthFailure
        # 401 / 403 from XNAT API. Surfaces credential rot, account
        # lockout, or XNAT-side proxy misconfig (e.g. the https→http
        # downgrade we caught earlier). Warning rather than critical
        # because retries may still succeed within the loop window.
        # THE BARE NUMBERS NEED HTTP CONTEXT, AND PROGRESS BARS MUST BE
        # EXCLUDED. This used to be \b(401|403|unauthorized|forbidden)\b,
        # which fires on ANY log line containing 401 or 403 as a word — and
        # xnat-ingest writes tqdm progress bars into this namespace:
        #
        #   Processing staged sessions found in 's3://.../staged':
        #     0%|          | 0/1 [00:00<?, ?it/s]100%|####| 1/1 [00:01<00:00...
        #
        # Those frames are full of digits, so the alert fired on a healthy
        # upload run. Observed live: XNATAuthFailure notified while the
        # uploader was authenticating to XNAT perfectly well.
        #
        # A false auth alert is worse than none. It trains you to ignore the
        # one alert that means your fleet has stopped delivering, and it fires
        # precisely when things are working — during an upload.
        #
        # `!= "it/s"` drops tqdm lines before the regex runs (cheap, and no
        # legitimate auth error contains it). The regex then requires the
        # status code to sit next to HTTP context rather than float free.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-upload"}
            != "it/s"
            |~ "(?i)(unauthorized|forbidden|status[^0-9]{0,10}40[13]\\b|HTTP[^0-9]{0,10}40[13]\\b|\\b40[13][^0-9]{0,3}(unauthorized|forbidden))" [5m])) > 0
        for: 1m
        labels:
          severity: warning
          source: loki-ruler
          category: xnat-auth
        annotations:
          summary: "XNAT rejected authenticated calls from xnat-ingest-upload"
          description: |
            The xnat-ingest-upload pod hit a 401/403 from XNAT in the
            last 5 minutes. Check XNAT_URL/USER/PASS in the
            xnat-credentials Secret and that the XNAT admin account
            isn't locked.

      - alert: OrthancDeidLuaError
        # The Orthanc Lua deid hook logs Lua tracebacks when it can't
        # apply a Replace/Keep rule (often a malformed
        # deidentification-profile.json). Lua errors block the study
        # from being labelled ready, which silently stalls the pipeline.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", app="orthanc"}
            |~ "(?i)lua.*error|traceback|stack\\s+traceback" [10m])) > 0
        for: 1m
        labels:
          severity: warning
          source: loki-ruler
          category: deid
        annotations:
          summary: "Orthanc deid Lua hook errored on {{ $labels.cluster }}"
          description: |
            The deidentify-and-forward.lua hook produced a Lua error in
            the last 10 minutes. Inspect the Orthanc pod logs and check
            the deidentification-profile.json for syntax issues.

      - alert: S3UploaderRestartedRecently
        # The s3-uploader exits non-zero (and crashloops) when its
        # pre-flight bucket probe fails. A restart within 5m means the
        # object store was unreachable at pod start, or the edge S3 key
        # is wrong. Often transient at install time; a sustained spike
        # means real config drift.
        #
        # Matches BOTH event spellings on purpose. `alias_failed` was the
        # minio/mc-era name; the AWS CLI uploader emits `endpoint_failed`
        # ("alias" was an mc concept). Keeping both means this alert works
        # across the client migration and against any edge still running
        # the old image. Do not drop `alias_failed` until every site has
        # been migrated — a rule that silently stops matching is
        # indistinguishable from a healthy pipeline.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            |~ "(?i)refusing to start upload loop|alias_failed|endpoint_failed" [5m])) > 0
        for: 2m
        labels:
          severity: warning
          source: loki-ruler
          category: s3-auth
        annotations:
          summary: "s3-uploader on {{ $labels.cluster }} could not reach its S3 endpoint"
          description: |
            The s3-uploader pre-flight probe (head-bucket round-trip)
            failed in the last 5 minutes. Check the SeaweedFS Ingress is
            reachable, the edge S3 key matches the IAM identity for this
            cluster, and the ca-bundle Secret contains the ais-edge-ca
            cert (the AWS CLI reads it as a single file via
            AWS_CA_BUNDLE, not as a directory of PEMs).

      - alert: OrthancStorageGrowing
        # Orthanc accepts C-STOREs into local storage before deid + group-orthanc
        # pulls them out. If staging fills up faster than group-orthanc drains
        # it, the edge will OOM. >1k stored instances accumulated over
        # the last hour is a useful early-warning threshold; tune per
        # site volume.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", app="orthanc"}
            |~ "(?i)new stored instance" [1h])) > 1000
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
          category: orthanc-backlog
        annotations:
