# The pipeline tool is accessionflow (called xnat-ingest before 0.18.0).

# Documentation review: 2026-11-10. Undated measurements below are historical;
# their run dates and current reproducibility are not verified (2026-11-10).
# Dated incident counts are records of those runs, not live fleet health.
# Current annotations describe bounded log evidence and safe diagnostic steps.
# Expressions, pending periods, labels and group structure are unchanged.
# =============================================================================
# Loki ruler rules — log-derived alerts.
# =============================================================================
# These alerts evaluate LogQL queries on a schedule inside Loki and emit to
# the kube-prometheus-stack Alertmanager (configured in this chart's values.yaml and observability template;
# rulerConfig.alertmanager_url). They cover anything that depends on the
# pipeline events emitted by the s3-uploader, group, and assign pods on
# every edge child cluster.
#
# Historical rationale retained below; its current disposition follows.
# The mgmt cluster's Prometheus cannot scrape edge pods directly (the
# konnectivity tunnel is one-way), and pushing Prometheus remote-write back
# from the edge would require additional ingress + auth surface. Loki
# already receives every log line from every edge, so running the rules
# in Loki is the lower-coupling path. Plus the source-of-truth for these
# alerts is the structured JSON event itself, not a derived metric.
# Current review (2026-11-10):
# Konnectivity is worker initiated and carries API-server traffic in both directions. It
# is not ordinary routing for management Prometheus to scrape edge pods. Remote write
# requires a management receiver and its authentication, not an edge public ingress.
# Loki receives best-effort log delivery, not every line without loss.
# Vector sends collected logs on a best-effort basis. Memory buffers and source
# collection can lose lines. These log rules detect retained matching evidence, not the
# absence of all faults.
#
# Rule file format is identical to Prometheus rule files. Loki's ruler
# writes firing alerts to Alertmanager v2 with the labels and annotations
# below, so the existing email/Slack receivers keep working unchanged.
#
# Companion: files/prometheus-rules/critical.yaml, warning.yaml and
# info.yaml hold the K8s-metric-based alerts (worker NotReady, pod
# restarts, certificate expiry) that genuinely live in Prometheus.
# =============================================================================
groups:
  # =====================================================================
  # CRITICAL — page on-call. Pipeline is broken.
  # =====================================================================
  - name: ais-edge-pipeline-critical
    interval: 1m
    rules:
      - alert: XNATUploadRetryStorm
        expr: "sum by (cluster) (count_over_time(\n  {namespace=\"xnat-upload\", component=\"\
          upload\"} | json\n  | message =~ \"Traceback \\\\(most recent call last\\\\).*\"\
          \ or level = \"ERROR\"\n  !~ \"already exists on XNAT with different checksums\"\
          \n  [10m])) > 2\n"
        for: 10m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: '>2 management XNAT upload errors in 10 minutes on {{ $labels.cluster
            }}'
          description: The management uploader is repeatedly failing. Inspect component=upload
            logs in xnat-upload for the cause; different-checksums conflicts have their
            own per-session alert.

      - alert: XNATUploadFailingForAllSessions
        # Failures appearing while no completed uploads in the same
        # window — i.e. the pipeline has stopped delivering to S3.
        #
        # THIS RULE COULD NEVER FIRE UNTIL IT WAS REWRITTEN, AND IT IS THE ONLY
        # CRITICAL ALERT ON THE EDGE UPLOAD PATH. Two independent defects, both
        # of which fail in the direction of silence:
        #
        # 1. `count_over_time(...) == 0` CANNOT EXPRESS ABSENCE. When the
        #    selector matches nothing there is no series to compare, so the
        #    result is EMPTY — not a series carrying the value 0. `X and (Y == 0)`
        #    is therefore empty exactly when Y is absent, which is the very case
        #    the rule was written to catch. Measured against live Loki: the
        #    `== 0` half returns NO SERIES, and it still returns none over a
        #    22,343-line stream, so this is not an artefact of a quiet window.
        #
        # 2. `and ignoring (cluster)` DROPPED THE ONE LABEL THAT MATTERS. It
        #    matches every left series against every right series regardless of
        #    which site produced them, so one edge's failures paired with a
        #    DIFFERENT edge's completions. Measured with the two real clusters
        #    in this deployment: LHS {cluster=edge-dev}=68 and {cluster=mgmt}
        #    =22264 against an RHS holding mgmt only, `and ignoring (cluster)`
        #    returned BOTH series — edge-dev survived purely on mgmt's data.
        #    A healthy site would have paged for a broken one, and vice versa.
        #
        # `unless on (cluster)` fixes both at once, and is the idiom
        # SessionUploadStalled below already uses correctly: keep a cluster's
        # failures UNLESS that same cluster also completed an upload in the
        # window. Absence is expressed by the set operation rather than by
        # comparing a missing series to a number, and the join is pinned to
        # `cluster` so sites cannot cross-talk.
        expr: |
          (sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_failed" [15m])) > 0)
          unless on (cluster)
          (sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_completed" [15m])) > 0)
        for: 15m
        labels:
          severity: critical
          source: loki-ruler
        annotations:
          summary: "Upload failures without an observed success on {{ $labels.cluster }}"
          description: |
            The edge S3 uploader has failure events without a completion event for the
            same cluster in the 15-minute lookback; this persists for a further 15 minutes.
            It is a bounded log comparison, not a count of every attempted session.
            Use the affected edge's kubeconfig and inspect its actual S3 transfer errors:
              kubectl -n xnat-ingest logs -l component=s3-uploader --since=1h
            Check the configured endpoint, bucket, credentials, client certificate and
            network path. Missing or delayed logs can affect either side of this rule.
            Management XNAT upload errors have their own XNATUploadRetryStorm rule.
  # =====================================================================
  # WARNING — notify but don't page.
  # =====================================================================
  - name: ais-edge-pipeline-warning
    interval: 1m
    rules:
      - alert: S3UploaderRetryStorm
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_failed" [10m])) > 5
        for: 2m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: ">5 upload failures in 10 minutes on {{ $labels.cluster }}"
          description: "Edge s3-uploader is retrying. Likely transient network or credentials. Inspect pod logs for the actual error."

      - alert: SessionUploadStalled
        # An upload_started for a session without a corresponding
        # upload_completed in the same 15-min window.
        expr: |
          (sum by (cluster, session) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_started" [15m])) > 0)
          unless on (cluster, session)
          (sum by (cluster, session) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            | json | event="upload_completed" [15m])) > 0)
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: "Start without observed completion for {{ $labels.session }} on {{ $labels.cluster }}"
          description: |
            A start is present without the matching completion in the rule's 15-minute
            lookback. The condition must then persist for 5 minutes. It does not measure
            15 minutes of elapsed transfer time and can fire sooner than that.
            A large session, slow network, destination error, or missing completion log
            can cause this. Inspect the actual transfer stage and session timestamps.
              kubectl -n xnat-ingest logs -l component=s3-uploader --since=1h
            Use the kubeconfig for the cluster that emitted this event. A cleared alert
            only means its expression is no longer true; verify the destination files.

      - alert: SessionStagedNotConfirmedInXNAT
        # Historical rationale retained below; its current disposition follows.
        # THE ONLY ABSENCE ALERT IN THIS FILE, AND THE MOST IMPORTANT ONE.
        # Current review (2026-11-10):
        # This is one absence comparison among several, including upload failure/success
        # comparisons and DataPolicyReporterSilent. It compares bounded log windows; it
        # cannot establish that a session was never delivered.
        #
        # Historical rationale retained below; its current disposition follows.
        # Everything else here is PRESENCE-based: it fires because something
        # happened. This fires because something DID NOT happen — a session left
        # the edge and reached staging, and was never confirmed to be in XNAT.
        # Current review (2026-11-10):
        # Several rules now compare presence and absence. This rule uses reclaimer
        # observations and confirmations in bounded windows. Other absence rules have
        # different telemetry dependencies.
        #
        # Historical rationale retained below; its current disposition follows.
        # That is the failure this system is actually exposed to. A silent no-op
        # upstream, an expired XNAT credential, a renamed project, a new modality
        # nobody mapped: in every one of those the uploader keeps reporting
        # success and the staged data simply accumulates. There is no error to
        # alert on, which is exactly why an absence alert is the only thing that
        # catches it.
        # Current review (2026-11-10):
        # This historical diagnosis is not current 0.19.0 behavior. Authentication and
        # routing failures can log errors; complete-session checks compare file
        # evidence. An absence comparison remains useful for missing confirmation, but
        # is not the only detector.
        #
        # Historical diagnosis (later disproved): xnat-ingest's all_uploaded() inspects only
        # session-level resources and misses scan-level ones, so it skipped a
        # session while logging "all the resources already exist on XNAT" — about
        # an EMPTY XNAT. It ran that way for two days looking like success. This
        # rule would have fired on day one.
        #
        # THE CONFIRMATION SIGNAL IS DELIBERATELY THE RECLAIMER'S.
        # reclaim_confirmed is emitted only after independently re-querying XNAT
        # and matching every filename and checksum against the staged manifest.
        # It is the one event in the system that is proof of delivery rather than
        # a report of an attempt.
        #
        # `offset` IS WHAT MAKES THIS CORRECT, AND IT IS EASY TO GET WRONG.
        #
        # A plain [48h] range does NOT mean "staged more than 48h ago" — it
        # means "staged at any point in the last 48h", which is true the moment
        # a session is staged. Written that way, this alert fires after every
        # healthy upload, because reclaim_confirmed legitimately does not exist
        # yet: minAge is 1d, so confirmation cannot arrive for ~25h. Caught on
        # a live session that was 18h old and already safely in XNAT.
        #
        # `[24h] offset 48h` selects sessions the reclaimer SAW between 48h and
        # 72h ago — old enough that confirmation should have happened. The
        # confirmation lookback is [72h] so it spans staging through to now.
        #
        # Historical rationale retained below; its current disposition follows.
        # BOTH HALVES ARE MANAGEMENT-SIDE, DELIBERATELY. The obvious "staged"
        # signal is the edge's own upload_completed, and it is the wrong one:
        # the edge cannot observe XNAT (it holds no credential and never
        # contacts it), and its logs reach Loki only while the push path is
        # healthy — so an outage of that path would SILENCE the very alert
        # meant to catch silent failure. The reclaimer runs on the management
        # plane, walks every staged session each run, and emits a per-session
        # event for each, which makes it a staging signal that cannot go quiet
        # for the same reason the delivery did.
        # Current review (2026-11-10):
        # The current expression includes both management and edge namespaces.
        # It excludes proof=s3 from confirmation. Management reclaimer JSON
        # supplies the edge cluster identity, which Vector merges over its
        # default mgmt label. Matching therefore depends on those event fields.
        # Reclaimer or log outages can still remove required observations.
        #
        # RAISE BOTH IF YOU RAISE minAge: the offset must stay comfortably above
        # minAge plus one reclaim schedule interval, or healthy sessions land
        # inside the window before they can possibly be confirmed.
        #
        # `event=~"reclaim_.*"` IN THE FIRST HALF IS NOT A CONVENIENCE, AND IT
        # MUST NOT BE NARROWED TO A LIST OF THE "INTERESTING" OUTCOMES.
        #
        # It is what lets a run that ABORTED still count as evidence that the
        # session is staged. Until 2026-08-06 a failed pre-flight logged one
        # reclaim_unavailable with session="" and exited, and `session != ""`
        # dropped it, so that run contributed nothing to this half.
        #
        # SCOPE THAT HONESTLY. The two aborts observed on 2026-08-05/06 (HTTP
        # 000 from XNAT) did NOT silence this alert: the range below is a count
        # over 24h and the ~22 healthy runs either side kept it supplied —
        # checked in Loki, the window never emptied. The exposure is a
        # pre-flight that stays broken across a whole 24h window, after which
        # every session staged in that window is invisible here until the
        # window slides past the outage: 48h after recovery, never without one.
        #
        # Historical rationale retained below; its current disposition follows.
        # The reclaimer now fans reclaim_unavailable out per staged session for
        # exactly this expression to pick up (charts/mgmt/files/reclaim-staged.sh,
        # `unavailable`), so a reclaimer that can never confirm anything makes
        # this fire rather than making it quiet.
        # Current review (2026-11-10):
        # The unavailable fan-out is best effort and capped. If listing fails, the cap
        # is reached, or logs are missing, not every staged session is represented. The
        # rule cannot guarantee coverage for all sessions during a prolonged outage.
        #
        # reclaim_unavailable can never be mistaken for delivery: the second
        # half matches event="reclaim_confirmed" exactly, and only a positive,
        # file-by-file XNAT match emits that.
        #
        # Historical rationale retained below; its current disposition follows.
        # This still reports 48h late by design. ReclaimerRunUnavailable below
        # is the same failure caught within the hour; both are wanted, because
        # a pre-flight that recovers on its own leaves this one to notice the
        # sessions that went unconfirmed while it was down.
        # THE PROOF RUNS ONLY AFTER minAge. A session younger than
        # dataPolicy.derived.s3Staged.minAge is logged as reclaim_skipped (which
        # counts as "seen" in the first half) and XNAT is not asked, so the
        # confirmation arrives minAge plus one schedule interval after the first
        # sighting. The mgmt chart therefore refuses a minAge over 36h: with 48h
        # or more every healthy session would fire this.
        # BOTH NAMESPACES ON PURPOSE. The same reclaimer runs in two places: on
        # mgmt (xnat-upload) against the S3 staging prefix for tier-2, and on an
        # edge (xnat-ingest) against the terminal stage directory. Same script,
        # same events, same component label, so one rule covers both and the
        # cluster label says which site fired.
        # ONLY AN XNAT PROOF CONFIRMS. Under upload.mode=s3 the edge's reclaimer
        # proves its local copy against the BUCKET, not XNAT, and its lines
        # carry proof=s3. Its reclaim_confirmed means "the bucket holds it", so
        # it is kept out of the confirming half; a session the edge saw and
        # XNAT never confirmed is exactly this alert. A line without the field
        # (an older reclaimer) still confirms: a missing label reads as "".
        # Current review (2026-11-10):
        # ReclaimerRunUnavailable requires a 75-minute pending condition in addition to
        # its event-window logic. It does not guarantee detection within an hour.
        # Session confirmation also depends on successful enumeration and log delivery.
        expr: |
          (sum by (cluster, session) (count_over_time(
            {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
            | json | event=~"reclaim_.*" | session != "" [24h] offset 48h)) > 0)
          unless on (cluster, session)
          (sum by (cluster, session) (count_over_time(
            {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
            | json | event="reclaim_confirmed" | proof != "s3" [72h])) > 0)
        for: 30m
        labels:
          severity: critical
          source: loki-ruler
          category: delivery-absence
        annotations:
          summary: "No recent reclaim confirmation for {{ $labels.session }}"
          description: |
            The rule found a staged/reclaim observation in its 48-to-72-hour age window
            without a matching confirmation in its 72-hour comparison window. This is
            a bounded log comparison, not proof that the session was never confirmed.
            It depends on reclaimer activity, retained logs and matching session labels.

            1. Find the source directory or bucket from the selected pod configuration.
               Do not derive a bucket or deployment name from the cluster label alone.
            2. Inspect the uploader and the exact session:
                 kubectl -n xnat-upload logs -l component=upload --since=1h | grep -F -- "{{ $labels.session }}"
            3. Check XNAT itself for the expected resources and all their files.
            4. Inspect reclaim_kept, reclaim_confirmed and reclaim_unavailable events.
               incomplete_in_xnat means the proof failed; unavailable means the job
               could not establish proof. Review ReclaimerRunUnavailable as applicable.

            Historical context: old label-only all_uploaded checks could skip an empty
            resource. The pinned 0.19.0 store compares file sets/checksums and refreshes
            listings. Its success or skip line still does not certify header extraction
            or all downstream XNAT processing. Keep source evidence until verified.
      - alert: XNATResourceIncompleteAndStuck
        # Historical rationale retained below; its current disposition follows.
        # A resource EXISTS on XNAT and DISAGREES with staging in a way that
        # uploading cannot fix: XNAT holds files the staged session does not,
        # or holds a file whose content differs. An upload only ever adds, so
        # neither is repairable. Only an operator deleting the resource on XNAT
        # unblocks it.
        # Current review (2026-11-10):
        # A conflicting resource needs an authority decision after file-list and
        # checksum comparison. Deleting the resource is not the only possible resolution
        # and can destroy destination-only files. The annotation now requires preserving
        # both sides and consulting the data owner.
        # The automatic add-only upload cannot resolve every conflict. Operator review
        # can choose a corrected source, routing correction, or another recovery after
        # preserving both sides. Automatic repair of missing files remains supported.
        #
        # Historical rationale retained below; its current disposition follows.
        # THIS IS NARROWER THAN IT WAS, AND THE PIN IS WHY. Up to xnat-ingest
        # 0.15.0 the uploader also skipped a merely SHORT resource:
        # get_xnat_resource returned None whenever the resource existed, so the
        # caller logged "already uploaded" and the session reported success
        # while incomplete. From 0.15.3 (PR #170) a short resource is repaired
        # by uploading the shortfall and logs a warning, so it no longer
        # reaches this rule. What is left is the genuinely unrepairable case,
        # which is what the summary claims. KEEP THIS RULE AND THE PIN IN STEP.
        # Current review (2026-11-10):
        # The rule detects repeated conflicting-file reports, not a proof that repair is
        # impossible. The current annotation calls for evidence and an authority
        # decision. The pinned store can repair a resource that is merely missing source
        # files.
        #
        # Historical rationale retained below; its current disposition follows.
        # MEASURED 2026-09-09: a session read from the bucket mid-write landed
        # 16 of 95 files in one scan. Every later pass skipped it. 170 of 383
        # instances reached XNAT and each run logged "Successfully uploaded all
        # files". The cause of the mid-write read is fixed
        # (xnatUpload.waitPeriod), but ANY partial upload reaches this state:
        # an interrupted pod, a dropped connection, an XNAT hiccup.
        # Current review (2026-11-10):
        # That behavior belongs to the older implementation. The pinned 0.19.0 store
        # attempts shortfall repair. An interruption alone does not establish a
        # persistent differing-file conflict. Quiet-time staging reduces mid-write reads
        # but does not prove study completeness.
        #
        # WHY THIS IS NOT A FIRST-OBSERVATION ALERT, and the threshold is not
        # arbitrary. The same message appeared TRANSIENTLY when XNAT had
        # accepted files but not finished cataloguing them: get_xnat_checksums
        # runs BEFORE the catalog refresh, and that refresh only fires when the
        # count is exactly zero, so a partially-catalogued resource read as
        # short. MEASURED on the real incident: a genuinely stuck resource
        # emits this ~4.8 times a minute. Catalogue lag emits at most one line
        # per resource per pass and stops within a pass or two, so ~10-15
        # lines, which the floor of 20 still clears.
        #
        # From 0.15.3 a partially-catalogued resource presents as MISSING
        # files, which is now repaired rather than reported here, so that
        # transient should no longer reach this rule at all. The first-
        # observation guard is kept regardless. It is sized against a burst
        # whose cause we no longer believe is present, and that is the right
        # way round: the cost is a later alert, the cost of removing it is
        # paging on good data the next time an XNAT-side behaviour surprises us.
        #
        # THE WINDOW IS 60m BECAUSE OF THE GAPS, NOT THE RATE. Measured gaps
        # between occurrences: median 95s, 90th percentile 98s -- and one of
        # 2341s (39 MINUTES), because the uploader was busy pushing a 1.2GB
        # session elsewhere and did not reach the stuck one. A short window would
        # go false across that gap, reset the `for:` timer, and the alert would
        # never fire. Any window here must exceed the longest plausible gap,
        # which is set by how long one large upload occupies the loop.
        #
        # The cost is that it resolves ~60m after the fix rather than promptly.
        # That is the right trade for a warning-level reminder: a false silence
        # is far worse than a late all-clear. A LOW threshold with this long a
        # window would be the worst combination -- transient lag would sit above
        # it for a full hour and fire.
        #
        # Historical rationale retained below; its current disposition follows.
        # IT CANNOT FIRE MID-UPLOAD. Every get_xnat_resource call completes
        # before the first upload starts (upload_api.py resolves sequentially,
        # then fans out), passes never overlap (time.sleep is after the work),
        # and xnatUpload is pinned to replicas: 1 with strategy: Recreate.
        # Current review (2026-11-10):
        # Evaluation occurs independently of the uploader. Earlier conflict lines can
        # keep this rule true while a later upload is in progress. Serial passes and one
        # Recreate replica do not make a log-window alert incapable of firing mid-
        # transfer.
        #
        # THE SESSION LABEL IS WHAT MAKES THIS ONE ALERT PER SESSION rather than
        # one per cluster. alertmanager-config.yaml groups on
        # ["alertname", "cluster", "session"], so two stuck sessions notify
        # separately and a third does not re-notify for the first two.
        # THE COVERAGE HOLE RECORDED HERE IS NOW CLOSED, and the matcher that
        # caused it has been dropped. Kept as a note because the shape can come
        # back the next time someone tightens this rule.
        #
        # This rule used to require "Missing paths" as well as the phrase, so
        # only the missing-or-extra branch matched. 0.15.0 had a SECOND emitter
        # of the phrase -- "...different checksums. Please delete on XNAT to
        # overwrite" -- carrying no such line, so a differing-only ERROR reached
        # NO rule at all: XNATUploadRetryStorm EXCLUDES the phrase on the
        # assumption that this rule covers it, and XNATUploadFailingForAllSessions
        # is suppressed whenever uploads are otherwise succeeding.
        #
        # The matcher could not just be deleted, because on 0.15.0 the phrase
        # was ALSO emitted continuously for a HEALTHY resource: XNAT reports an
        # empty digest until a catalog refresh populates it, and 0.15.0 compared
        # the two checksum dicts whole, so it called a complete resource
        # mismatched. MEASURED on the test cluster: 1214 occurrences of the
        # phrase in 7 days, 0 of "Missing paths" -- every one of them that false
        # positive. Matching the phrase alone would have fired this alert on all
        # 1214, and the description below tells the operator to delete the
        # resource on XNAT, which on those is an instruction to delete good data.
        #
        # 0.15.3 fixes the FALSE POSITIVE at source: a file whose digest is
        # empty is compared by NAME only (compare_resource_with_xnat, and
        # stores/xnat/api/check_store_api.py guards the same way), so catalogue lag no
        # longer reads as a mismatch. That is what made dropping the matcher
        # safe, and it is the only part of the original claim that held.
        #
        # CORRECTION. An earlier version of this note said the "please delete on
        # XNAT to overwrite" emitter was GONE in 0.15.6 and that the matcher had
        # therefore become a no-op. BOTH WERE WRONG. The emitter is still there,
        # at stores/xnat/remotes.py:891-893 (0.20.0), and it carries
        # no "Missing paths" line.
        # The grep that produced the claim missed it because the phrase is split
        # across two adjacent string literals, which is the documented trap with
        # this codebase; join them before matching.
        #
        # So dropping the matcher is NOT cosmetic. It genuinely widens the rule,
        # which is what closes the hole: a differing-only error used to reach no
        # rule at all.
        #
        # AND IT CHANGES THE RATE. Both emitters sit under the same
        # `if not comparison.complete:`, so a DIFFERING-ONLY resource emits TWO
        # matching lines per pass -- one carrying "Missing paths: []" and one
        # not -- where before only the first matched. A missing-or-extra
        # resource still emits one, because the second is guarded by
        # `if comparison.differing`. Read the "twice the threshold by
        # construction" note below as the floor: for the differing-only case the
        # real rate is four times the threshold and it crosses in about half the
        # time. That errs toward alerting sooner on a real fault, so it is left
        # as is rather than retuned.
        #
        # THE THRESHOLD IS DERIVED FROM THE POLL INTERVAL, NOT FIXED, because
        # one error is emitted per stuck resource per poll, so the rate is set
        # by an interval configured in values.yaml.
        #
        # Historical rationale retained below; its current disposition follows.
        # A CYCLE IS loop PLUS THE WORK, not loop, because the uploader sleeps
        # the whole interval rather than the remainder. At the measured elapsed
        # of ~35s the substituted threshold is
        #     max(20, 1800 / (loop + 35))
        # the count expected over HALF the 60m window, which makes the real rate
        # exactly twice the threshold by construction. It is 20 at the shipped
        # loop of 60, crossing in about 32 minutes plus the 15m `for:`.
        # Current review (2026-11-10):
        # In pinned 0.19.0, the loop sleeps for the remainder of the configured interval
        # after work. The retained max(20, 1800 / (loop + 35)) threshold uses an older
        # conservative timing model. Its 35-second observation and derived crossing
        # times are historical, not a current timing guarantee. Expression changes are
        # outside this documentation sweep.
        #
        # Historical rationale retained below; its current disposition follows.
        # DERIVING FROM loop ALONE WOULD BREAK THE FAST END: the threshold would
        # grow as 1/loop while the real rate grows as 1/(loop+35), so any loop
        # below 37 would put the threshold above the achievable rate and the
        # alert could never fire. scripts/ci/render.sh uses this same model, so
        # the two files measure the same quantity, and it enforces the upper
        # bound at loop=137 where a single stuck resource drops below the floor.
        # Current review (2026-11-10):
        # This argument uses the older full-sleep timing model. Current 0.19.0 sleeps
        # for the interval remainder. The chart and CI retain the conservative formula;
        # their agreement verifies implementation consistency, not the accuracy of the
        # old measured cycle model.
        expr: |
          sum by (cluster, session) (count_over_time(
            {namespace="xnat-upload", component="upload"}
            | json | message =~ ".*already exists on XNAT with different checksums.*"
            | regexp `resource in .(?P<resource>[^:]+:[^:]+:[^:]+):`
            | label_format session="{{.resource}}" [60m])) > __UPLOAD_STUCK_ERRORS__
        for: 15m
        labels:
          severity: warning
          source: loki-ruler
          category: xnat-delivery
        annotations:
          summary: "Repeated XNAT file conflicts for {{ $labels.session }}"
          description: |
            The uploader repeatedly reports a resource whose file set or checksums
            conflict with the staged copy. XNAT may contain files absent from staging,
            or a same-named file may have different content. A resource that is only
            short is handled separately: accessionflow 0.19.0 attempts to upload the
            missing files and logs a repair attempt.

            1. Identify the exact project, experiment, scan and resource in the logs:
                 kubectl -n xnat-upload logs -l component=upload --since=1h | grep -F -- "{{ $labels.session }}"
               Inspect the nearby different-checksums error and later upload verdict.
            2. Compare both file listings and checksums. Keep the staged files and any
               additional destination files. Establish which version is authoritative
               with the data owner before changing or deleting an XNAT resource.
            3. Check the reclaimer's decision and the configured retention policy.
               Reclaim requires its own proof, but this alert alone cannot establish
               that all source data is intact or that another cleanup path did not run.
            4. The pinned 0.19.0 store clears cached XNAT listings on later passes.
               A restart is not required solely to refresh that cache. Do not delete a
               destination resource or restart a deployment just to clear this alert.

            Historical context: older 0.15.0-era uploads could keep stale listings for
            an entire process lifetime. A historical test recovered 383 files after a
            restart; another recorded recovery followed deletion at 07:17 and upload
            at 07:18:26 without a restart. The run dates and release attribution of
            those old measurements are not verified (2026-11-10). They do not establish
            that deletion is safe for a current conflict. Current cache behavior is
            verified directly in the pinned store_api.py implementation.
      - alert: ReclaimerRunUnavailable
        # THE RECLAIMER FAILING IS NOT A DATA-LOSS EVENT. IT IS A BLINDNESS
        # EVENT, WHICH IN THIS PIPELINE IS WORSE.
        #
        # Historical rationale retained below; its current disposition follows.
        # An aborted reclaim run deletes nothing, so on the surface it is the
        # safe outcome. What it actually costs is the one independent check
        # that XNAT holds what was staged. While it is down nothing confirms
        # deliveries, staging grows, and the operator is told nothing —
        # observed twice on 2026-08-05/06 (18:17Z and 01:17Z), both an XNAT
        # auth probe returning HTTP 000, both entirely silent. THIS is the rule
        # those two aborts needed; the per-session fan-out feeding
        # SessionStagedNotConfirmedInXNAT above covers the longer outage that
        # has not happened yet.
        # Current review (2026-11-10):
        # These are historical 2026-08-05/06 incidents. Current outage frequency and
        # later incidents were not verified (2026-11-10). The rule detects persistent
        # unavailable proof subject to its 75-minute pending period and telemetry
        # availability.
        #
        # `session = ""` COUNTS RUNS, NOT SESSIONS. The reclaimer emits one
        # session-less reclaim_unavailable for the run and then one per staged
        # session (that fan-out is what keeps SessionStagedNotConfirmedInXNAT
        # above supplied). Without this filter a single aborted run against a
        # hundred staged sessions would read as a hundred failures.
        # (Strictly it counts run-level LINES: a run that hits
        # UNAVAILABLE_SESSION_CAP emits a session-less truncation line too, so
        # such a run contributes 2. Immaterial against `> 0` — do not "fix" it
        # by dropping the filter.)
        #
        # Grouped by `reason` — the machine-readable slug the script attaches,
        # e.g. xnat_probe_failed, filer_unreachable, bucket_unreachable,
        # missing_tool — so the notification names the broken dependency
        # instead of just saying the job failed.
        #
        # [3h] against an hourly CronJob: one aborted run is enough to fire,
        # and the alert clears about three hours after the reclaimer starts
        # completing again. A range at or below the schedule interval would
        # resolve and re-fire between runs and mail on every cycle.
        #
        # Historical rationale retained below; its current disposition follows.
        # severity=warning, NOT critical, deliberately. Nothing is lost and the
        # observed failures were transient and self-healing; a twice-a-day
        # critical is how an alert gets filtered into a folder nobody reads,
        # which would put us back where we started. The critical for this
        # failure mode is SessionStagedNotConfirmedInXNAT, which now still
        # fires 48h later because of the per-session fan-out.
        # ONE ABORT IS NOT AN INCIDENT; A RECLAIMER THAT STAYS BROKEN IS.
        # Current review (2026-11-10):
        # The historical observed failures were transient, but this signal does not
        # prove that nothing was lost. Severity reflects notification policy. The longer
        # session rule depends on enumerated session events and cannot guarantee a
        # notification for every unavailable session.
        #
        # This fired 11 times in one Alertmanager lifetime and, with the root
        # route's send_resolved, produced 21 of roughly 30 total notifications —
        # 70% of all alert mail. Every firing was a TRUE abort, so the rule was
        # not wrong; it was scoped to a single transient miss of a job that runs
        # hourly and almost always succeeds on the next attempt. Measured cause
        # of the aborts: the management node's DNS to 8.8.8.8/8.8.4.4 drops
        # packets (654 CoreDNS upstream timeouts in 5 days), so `curl` cannot
        # resolve XNAT and reports HTTP 000.
        #
        # RAISING `for:` ALONE CANNOT FIX THIS, which is the counter-intuitive
        # part. The [3h] range already holds the series up for three hours after
        # a single abort, so any `for:` under 3h yields the identical 11
        # notifications, just later. The persistence test has to be in the
        # EXPRESSION.
        #
        # `unless` a run that reached the end: reclaim_finished is emitted only
        # by a run that walked staging to completion (reclaim-staged.sh, and an
        # aborted run never emits it), so it is exactly "the reclaimer recovered".
        # [70m] spans one hourly cycle plus margin, so a healthy fleet suppresses
        # continuously.
        #
        # `for: 75m` then requires the condition to survive a whole cycle: an
        # abort at :17 whose successor at :17+1h succeeds goes false after ~60m
        # and never reaches 75m, so it never mails. Two consecutive aborts stay
        # true and fire. That is the intended threshold — "could not confirm
        # anything for more than an hour", not "missed once".
        #
        # NOT COVERED HERE: a reclaimer that stops running altogether, or dies
        # without logging (deadline kill, OOM, crash, image pull), emits
        # neither event, so this stays silent. ReclaimerNotSucceeding
        # (files/prometheus-rules/reclaimer.yaml) covers it, per edge, from the
        # CronJob's last success. SessionStagedNotConfirmedInXNAT is NOT a
        # backstop for it: its staged half reads the reclaimer's own reclaim_.*
        # events, so it goes blind together with the reclaimer.
        #
        # GROUPED BY NAMESPACE AS WELL. Under upload.mode=s3 one cluster has
        # two reclaimers: the edge's (xnat-ingest, proof: the bucket) and the
        # management one (xnat-upload, proof: XNAT). One finishing must not
        # hide the other's aborts, so each is judged against its own runs.
        expr: |
          (sum by (cluster, namespace, reason) (count_over_time(
            {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
            | json | event="reclaim_unavailable" | session = "" [3h])) > 0)
          unless on (cluster, namespace)
          (sum by (cluster, namespace) (count_over_time(
            {namespace=~"xnat-upload|xnat-ingest", component="s3-reclaimer"}
            | json | event="reclaim_finished" [70m])) > 0)
        for: 75m
        labels:
          severity: warning
          source: loki-ruler
          category: delivery-absence
        annotations:
          summary: "Reclaimer proof unavailable on {{ $labels.cluster }}: {{ $labels.reason }}"
          description: |
            The reclaimer logged a run-level unavailable event without a recent finish
            that suppresses it. The condition must persist for 75 minutes. One transient
            failure followed by a timely successful run normally clears before firing.
            This reports unavailable proof, not a guarantee that every session was
            examined or that no other process deleted data.

            1. Read the reason and surrounding run events. A failed Job pod may have
               been removed; use retained Loki logs if kubectl logs are unavailable.
                 kubectl -n xnat-upload logs -l component=s3-reclaimer --tail=100
            2. Check the dependency named by the reason: XNAT access and credentials,
               the filer/bucket where applicable, required tools, or invalid policy.
               Select the configured cluster and namespace before running the command.
            3. Inspect staged sessions and their age. Unavailable fan-out is best effort
               and capped. SessionStagedNotConfirmedInXNAT does not cover every session
               when enumeration, reporting or the reclaimer itself stops.

            The alert has no deletion action. A silent crash or a job that never starts
            cannot emit this signal. Check CronJob status and the relevant Prometheus
            job-health alerts as well as the log-based rule.
      - alert: DICOMRejectedUnmappedAET
        # SILENT DATA LOSS — the highest-value alert in this pipeline.
        #
        # Historical rationale retained below; its current disposition follows.
        # The Orthanc deid hook looks the calling AE title up in
        # routing.json's AETMap. If it isn't there it logs
        #   "REJECT: no project mapped for CalledAET <AET>"
        # and RestApiDelete()s the instance (deidentify-and-forward.lua).
        # The sending modality still gets a DICOM-level C-STORE SUCCESS,
        # so the scanner believes the study was delivered while it is in
        # fact discarded and never reaches XNAT.
        # Current review (2026-11-10):
        # This describes the deprecated Lua routing path. Current ingest deployments use
        # Orthanc as receiver and accessionflow for de-identification. The callback can
        # quarantine a rejected instance, but backup failure and incomplete studies must
        # be checked separately. Transport acceptance is not proof of pipeline delivery.
        #
        # Real-world triggers: a newly commissioned scanner, a console
        # re-imaged with a default AE title, or a typo in the AET — all
        # routine events at an imaging facility. Without this alert
        # nobody finds out until someone notices missing studies.
        #
        # Historical rationale retained below; its current disposition follows.
        # Fires on a single occurrence (for: 0s): one rejected study is
        # already lost data, so there is no "spike" threshold to wait for.
        # Grouped by the offending AET so each mis-configured device is
        # its own notification.
        # Current review (2026-11-10):
        # A single matching rejection line is enough to fire. It refers to an instance
        # and does not by itself establish study completeness or data loss. Check the
        # source and quarantine copy before recovery.
        expr: |
          sum by (cluster, aet) (
            count_over_time(
              {namespace="xnat-ingest", app="orthanc"}
              |~ "REJECT: no project mapped for CalledAET"
              | regexp "CalledAET (?P<aet>[A-Za-z0-9._-]+)"
              [5m]
            )
          ) > 0
        for: 0s
        labels:
          severity: warning
          source: loki-ruler
          category: dicom-routing
        annotations:
          summary: "Legacy Lua routing rejected AE title '{{ $labels.aet }}' on {{ $labels.cluster }}"
          description: |
            This signal belongs to the deprecated Orthanc/Lua de-identification path.
            It reports rejected instances, not a verified count of complete studies.
            The old callback can accept the DICOM transport and then reject its routing.
            Check callback errors and the quarantine directory before assuming a copy
            was saved. A rejection log alone does not prove quarantine or XNAT state.

            Preserve available source files and identify the originating scanner and
            calling/called AE titles from the logs. Use the documented legacy recovery
            procedure only for an existing legacy deployment. New deployments perform
            de-identification in accessionflow (xnat-ingest), with Orthanc as receiver.
            Do not change an AE map or re-send data until the intended project routing
            and the destination contents have been checked.
      - alert: EdgeDiskLow
        # dataPolicy.originals.facilityBackup.minFreeDiskPercent MADE REAL.
        #
        # Until the data-policy engine existed, that key had no reader at all:
        # an operator could set it to any number and nothing measured disk on
        # an edge. This is the rule that turns it into a control.
        #
        # THE THRESHOLD IS A SENTINEL, not a literal. charts/mgmt/templates/
        # observability.yaml replaces __DP_MIN_FREE_DISK_PCT__ with the value
        # from dataPolicy, the same way the Alertmanager config is assembled.
        # It cannot be read from the log line instead: LogQL rejects a
        # comparison between two extracted fields
        # (`| free_pct < min_free_pct` -> "syntax error: unexpected
        # IDENTIFIER"), so one side must be a literal. The engine still echoes
        # min_free_pct into every line so an operator reading the log can see
        # what the reading was judged against.
        #
        # Historical rationale retained below; its current disposition follows.
        # LOKI, NOT PROMETHEUS, and that is not a preference. Management
        # Prometheus cannot scrape edge pods across the one-way konnectivity
        # tunnel; two rules were deleted for exactly that reason
        # (docs/TOUR.md §9.9). Edge logs DO reach Loki via Vector over mTLS.
        # Current review (2026-11-10):
        # Konnectivity does not provide ordinary Prometheus routing to edge pods. Its
        # connection is worker initiated, not a one-way data channel. Edge log delivery
        # is best effort over the configured mTLS path. A missing log or unavailable
        # ruler can still hide an event.
        #
        # Historical rationale retained below; its current disposition follows.
        # Warning, not critical: a full disk stops ingest but destroys nothing —
        # the edge keeps its local copy and retries. Grouped by stage so the
        # facility backup filling and the pipeline filling are separate mails.
        # Current review (2026-11-10):
        # A full disk can stop new writes, including backup writes. This alert has no
        # delete action, but it cannot guarantee that accepted data is intact. Different
        # stage directories can reside on the same underlying filesystem.
        expr: |
          sum by (cluster, stage) (count_over_time(
            {namespace="xnat-ingest", component="data-policy"}
            | json | event="stage_report"
            | free_pct < __DP_MIN_FREE_DISK_PCT__ [15m])) > 0
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
          category: edge-storage
        annotations:
          summary: "Edge {{ $labels.cluster }} is low on disk at {{ $labels.stage }}"
          description: |
            The reporter measured free space below the configured threshold at
            {{ $labels.stage }} on {{ $labels.cluster }}. The threshold comes from
            dataPolicy.originals.facilityBackup.minFreeDiskPercent.

            This alert itself deletes nothing. Retention jobs and stage unlink options
            operate independently. Low disk space can prevent new writes, including
            backup writes; this message cannot certify that every accepted file is safe.
              kubectl -n xnat-ingest logs -l app=data-policy --tail=50
            Use the affected edge's kubeconfig. Check the actual hostPath filesystem,
            free bytes and inodes. Different directory names can share the same disk.
            Grow capacity or apply a verified retention decision. Review dry-run output
            and destination proof before enabling cleanup. Do not remove original or
            invalid-session files merely to dismiss the alert.
      - alert: StageBacklogAgeing
        # dataPolicy.stageAgeAlertAfter selects this management-rendered threshold.
        # Each edge report is compared with the configured management value.
        #
        # PipelineSessionStuck is per session and fires only on one whose reclaim
        # condition keeps failing. A stage whose reclaim is `never` returns before
        # that check runs, so it can never raise stage_stuck -- and `never` is the
        # default for the deidentified tree. This is the question that needs no
        # reclaim condition at all: has the oldest thing here been here too long.
        # NOT for policy "forever" (originals kept by design, e.g. the facility
        # backup): old entries there are the point, so it could never clear. On
        # cai-lfs3 it fired daily from 2026-09-19 on 49-day-old originals.
        expr: |
          sum by (cluster, stage) (count_over_time(
            {namespace="xnat-ingest", component="data-policy"}
            | json | event="stage_report" | policy != "forever"
            | oldest_age_s > __DP_STAGE_AGE_ALERT_AFTER_S__ [15m])) > 0
        for: 15m
        labels:
          severity: warning
          source: loki-ruler
          category: edge-storage
        annotations:
          summary: '{{ $labels.stage }} on {{ $labels.cluster }} has entries older than the configured limit'
          description: |
            The reporter's oldest entry exceeds dataPolicy.stageAgeAlertAfter.
            This is a sampled age signal; it does not establish the reason a stage is
            retaining files or measure its current processing rate. Stages with a
            forever policy are excluded by the expression.

            The alert itself deletes nothing. A stopped downstream stage, a deliberately
            retained tree, or a reclaim condition that has not passed can produce it.
            Data-policy dry run suppresses that engine's deletions. CLI unlink options
            and separate reclaim jobs can still remove eligible files independently.
              kubectl -n xnat-ingest logs -l app=data-policy --tail=100 | grep -F stage_report
            Use the affected edge's kubeconfig. Compare stage_report with stage logs,
            pod status, policy settings and available disk space. Check EdgeDiskLow;
            old entries alone do not establish a deadline or justify deleting data.
      # >>> DataPolicyReporterSilent: templates/observability.yaml drops this
      # block when no configured edge runs a reporter. Keep both marker lines.
      - alert: DataPolicyReporterSilent
        # WATCHES THE WATCHERS, one per edge. EdgeDiskLow, StageBacklogAgeing
        # and QuarantinedDataUnresolved read only stage_report lines. When an
        # edge's reporter or its log shipping stops, all three go quiet for
        # that edge, which looks exactly like a healthy site.
        # KEYED ON THE CONFIGURED EDGES, not on what Loki has seen:
        # __EDGE_REPORTERS__ is one label_replace(vector(1)) per edge, so an
        # edge that never reported fires too; `unless` drops each edge that
        # did report in the window.
        # The cluster label IS the edge name (templates/_helpers.tpl), and
        # names are DNS labels, so they are safe inside these LogQL strings.
        # __DP_REPORT_SILENCE_S__: dataPolicy.reporterSilentAfter.
        # Cannot see its own evaluator: if this Loki is down, nothing fires.
        expr: |
          (
            __EDGE_REPORTERS__
          )
          unless on (cluster)
          sum by (cluster) (
            count_over_time(
              {namespace="xnat-ingest", component="data-policy", cluster=~"__EDGE_REPORTER_REGEX__"}
              | json | event="stage_report"
              [__DP_REPORT_SILENCE_S__s]
            )
          )
        for: 0s
        labels:
          severity: warning
          source: loki-ruler
          category: edge-storage
        annotations:
          summary: data-policy on {{ $labels.cluster }} has stopped reporting
          description: |
            No stage_report was observed for {{ $labels.cluster }} within the configured
            __DP_REPORT_SILENCE_MIN__-minute threshold. Missing reports undermine disk,
            stage-age and quarantine alerts that depend on them. Existing evidence can
            still persist briefly in another rule's lookback window.

            Check whether the reporter is running and whether Vector can deliver to Loki:
              kubectl -n xnat-ingest get pods -l app=data-policy
              kubectl -n xnat-ingest logs -l app=data-policy --tail=50
            Use the affected edge's kubeconfig. This alert itself neither deletes nor
            blocks data. It cannot detect its own unavailable Loki ruler or notification
            path. Verify reporter recovery by observing fresh stage_report events.
      # <<< DataPolicyReporterSilent
      - alert: PipelineSessionStuck
        # Historical rationale retained below; its current disposition follows.
        # dataPolicy.reporter.stuckAfter MADE REAL. A session whose reclaim
        # condition never comes true is kept for ever, correctly, and every pass
        # logs the same reclaim_kept line. That drip is indistinguishable from
        # normal operation, so a permanently stuck session looks exactly like a
        # healthy one uploaded a minute ago. This is the event that separates
        # them.
        # Current review (2026-11-10):
        # A session that repeatedly fails its reclaim condition remains retained by that
        # engine at those checks. The condition may later recover. Other cleanup paths
        # can operate independently, so the event cannot guarantee whole-pipeline data
        # safety.
        expr: |
          sum by (cluster, stage) (count_over_time(
            {namespace="xnat-ingest", component="data-policy"}
            | json | event="stage_stuck" [15m])) > 0
        for: 10m
        labels:
          severity: warning
          source: loki-ruler
          category: edge-pipeline
        annotations:
          summary: A session on {{ $labels.cluster }} is stuck at {{ $labels.stage }}
          description: |
            A reported session has failed its configured reclaim condition longer than
            dataPolicy.reporter.stuckAfter. The engine retained the copy at that check.
            This does not prove that every copy is intact, that no other cleanup path
            ran, or that the condition cannot recover without an operator.

            Inspect stage_stuck and reclaim_kept events for the session, reclaim word,
            age and reason. Check the downstream stage and the proof it should produce.
            A stopped stage, missing proof, or a policy that cannot apply to this
            configuration needs investigation before any cleanup decision.
              kubectl -n xnat-ingest logs -l app=data-policy --tail=100 | grep -F stage_stuck
            Use the affected edge's kubeconfig and compare destination files directly.
            The alert clears as its log evidence ages out; verify recovery separately.
      - alert: QuarantinedDataUnresolved
        # dataPolicy.originals.quarantine.alertAfter MADE REAL — the second key
        # that had no reader before the engine existed.
        #
        # Historical rationale retained below; its current disposition follows.
        # DICOMRejectedUnmappedAET fires the moment a study is rejected. This is
        # the different, slower question: is rejected data STILL SITTING THERE
        # unhandled? Clearing quarantine needs a human (map the AET, re-send),
        # so the risk is not the rejection, it is the rejection nobody actioned.
        # Studies here reached no project and are in no backup but this one.
        # Current review (2026-11-10):
        # Retained quarantine needs reconciliation with any later successful delivery
        # and available source copies. The alert does not establish current XNAT
        # contents or backup coverage. New deployments should use ingest routing, not
        # configure the deprecated Lua engine.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="data-policy"}
            | json | event="stage_report"
            | stage="originals.quarantine"
            | oldest_age_s > __DP_QUARANTINE_ALERT_AFTER_S__ [15m])) > 0
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
          category: dicom-routing
        annotations:
          summary: "Quarantined studies on {{ $labels.cluster }} older than the configured limit"
          description: |
            The reporter found entries in quarantine older than
             dataPolicy.originals.quarantine.alertAfter. This is retained legacy
            routing evidence. It does not establish whether the files reached XNAT
            through a later attempt or whether another source copy exists.

            Check the original rejection, the actual retained files and the destination
            before recovery or deletion. The old DICOMRejectedUnmappedAET alert can
            identify an offending AE title if those logs remain available. Existing
            legacy deployments must verify project routing before a controlled re-send.
            New deployments use accessionflow for de-identification, not the deprecated
            Orthanc/Lua engine. An operator must reconcile retained quarantine with any
            successful later delivery; clearing an alert does not itself perform that
            reconciliation or establish that all instances of a study are present.
      - alert: InvalidSessionAssigned
        # GUIDING: one assign failure needs review, even below the spike threshold.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", app="xnat-ingest", component="assign", level="ERROR"}
            | json | __error__=""
            | json stage_message="message" | __error__=""
            | stage_message =~ "(?s)^Could not resolve the labels of .*"
            [10m])) > 0
        for: 1m
        labels:
          severity: warning
          source: loki-ruler
          category: edge-pipeline
        annotations:
          summary: "Assign reported missing routing IDs on {{ $labels.cluster }}"
          description: |
            Assign reported missing project, subject, or session IDs. Check the assign
            logs and assigned/__invalid__ under storage.pipeline.hostPath. Keep these
            files for recovery; do not delete them to clear the alert. They can be the
            only retained copy even when facility backup is enabled, because its DICOM
            callback can fail or the source can arrive by another path.
            Use the affected edge's kubeconfig:
              kubectl -n xnat-ingest logs -l app=xnat-ingest,component=assign --since=15m
            Follow the recovery procedure in docs/components/accessionflow.md and check
            routing IDs before replay. The alert clears when the log leaves its
            10-minute window. That does not prove that the session has recovered.
      - alert: DICOMValidationFailureSpike
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="assign"}
            |~ "(?i)invalid|validation.*fail" [1h])) > 10
        for: 5m
        labels:
          severity: warning
          source: loki-ruler
        annotations:
          summary: "More than 10 matching validation log lines on {{ $labels.cluster }}"
          description: |
            The retained expression counts lines matching invalid or validation.*fail
            in its one-hour window. It does not count distinct sessions and does not
            prove that every matching line denotes a newly invalid DICOM session.
            Inspect the assign logs and the assigned/__invalid__ tree. Verify missing
            routing fields and scanner input before changing configuration. The pinned
            missing-ID error matches this filter through __invalid__ in its saved path;
            the separate already-saved-as-invalid warning also matches. Use
            InvalidSessionAssigned for the specific 0.19.0 missing-ID error prefix.

  # =====================================================================
  # INFO — observability + audit. Fires on every successful upload to XNAT
  # so operators / auditors can confirm the pipeline reached its terminal
  # step. Routed to email-primary via Alertmanager (see
  # files/alertmanager-config.yaml ; route override on alertname).
  # =====================================================================
  - name: ais-edge-pipeline-info
    interval: 30s
    rules:
      - alert: XNATUploadSuccess
        # GUIDING: must stay a MANAGEMENT-side signal — the edge holds no
        # XNAT credential and never contacts XNAT, so it cannot know. Full
        # incident and the duplicate-mail root cause:
        # docs/alerting-architecture.md, "Troubleshooting: repeated XNAT
        # upload completed emails".
        #
        # Historical rationale retained below; its current disposition follows.
        # CAUTION — RANGE MUST EXCEED THE UPLOADER'S ~62s LOOP PERIOD, or
        # duplicate mail returned on older releases. The old string was re-emitted every
        # pass (a LEVEL, not an event; see docs/components/accessionflow.md,
        # "Known upstream defects"), so too short a range lets the series go
        # empty between passes and the alert flaps once per loop. 10m gives
        # ~10x headroom; scripts/ci/promtool.sh asserts it stays that way.
        # Since 0.19.0, a complete-session skip bypasses this success line
        # (0.20.0: stores/xnat/api/store_api.py:274 skips, :682 succeeds).
        # The retained range and repair exclusion are existing alert policy.
        # `group_by: session` (files/alertmanager-config.yaml) is necessary
        # but not sufficient on its own — it only collapses alerts firing at
        # the same time, not a resolve/re-fire cycle.
        # Current review (2026-11-10):
        # Historical pre-0.19.0 success lines could recur on complete-session skips and
        # create notification flapping. Current complete-session skips bypass the
        # success line. The 10-minute range remains alert policy and is checked by CI;
        # the old approximately 62-second period is not a current runtime guarantee.
        #
        # Historical rationale retained below; its current disposition follows.
        # Keying on a third-party log string is a real weakness — an
        # upstream rewording disables this silently.
        # SessionStagedNotConfirmedInXNAT below is the backstop for exactly
        # that failure: staged, and never confirmed.
        # Current review (2026-11-10):
        # The confirmation rule provides a separate bounded-window signal only while its
        # reclaimer observations and labels remain available. It is not a universal
        # backstop for renamed success lines or missing telemetry.
        #
        # A REPAIR IS NOT AN UPLOAD. accessionflow logs the same success line
        # after re-sending files XNAT had lost, so `unless` drops any session
        # with a "Repaired" line in the last 20m; XNATRepairAttempted
        # reports those. 20m = this rule's 10m window + up to 10m between the
        # two lines of one pass (verdict and metadata calls; 5-8s measured on
        # 2026-09-28). Edge: a new pass for the same session inside those
        # 20m is not mailed.
        expr: |
          (
            sum by (cluster, session) (
              count_over_time(
                {namespace="xnat-upload"}
                |~ "Successfully uploaded all files in"
                | regexp "Successfully uploaded all files in '(?P<session>[^']+)'"
                [10m]
              )
            ) > 0
          )
          unless on (cluster, session)
          sum by (cluster, session) (
            count_over_time(
              {namespace="xnat-upload"}
              |~ "Repaired [0-9]+ incomplete resource"
              | regexp `incomplete resource\(s\) on XNAT in '(?P<session>[^']+)'`
              [20m]
            )
          )
        for: 0s
        labels:
          severity: info
          source: loki-ruler
          category: pipeline-success
        annotations:
          summary: "XNAT file upload reported complete: {{ $labels.session }}"
          description: |
            The uploader on {{ $labels.cluster }} reported a successful file verdict
            for session {{ $labels.session }}. Inspect the affected pod:
              kubectl -n xnat-upload logs -l component=upload --since=1h | grep -F -- "{{{ $labels.session }}}"
            This does not certify header extraction, metadata population, downstream
            processing or durability of an independent backup. Check those separately.
            The rule suppresses recent repair attempts for its configured window.
      - alert: XNATRepairAttempted
        # XNAT HELD THE SESSION WITH FILES MISSING, AND THE UPLOADER TRIED TO
        # RE-SEND THEM. accessionflow logs "Repaired" only when a resource
        # already existed on XNAT with files missing (stores/xnat/api/store_api.py,
        # repaired_on_xnat); a first upload never does. Seen 2026-09-23 and
        # 2026-09-28: XNAT restarted, listed 0 of N files for sessions it held,
        # and the uploader re-sent them for cai-lfs3 (3 sessions, 10 resources
        # on 2026-09-28).
        # AN ATTEMPT: stores/xnat/api/store_api.py:603-611 in 0.20.0 logs
        # this line before the verdict, even when the re-send failed.
        # A separate Completed repair line and xnat_repair_completed event
        # follow only a successful verdict (lines 672-680). This rule still
        # matches the attempt. Inspect later errors and destination evidence.
        # $value is the number of scan resources (max, not sum: a retried
        # repair must not count twice).
        # CAUTION: matches accessionflow 0.20.0 repair wording; a reword
        # silences it.
        expr: |
          max by (cluster, session) (
            max_over_time(
              {namespace="xnat-upload"}
              |~ "Repaired [0-9]+ incomplete resource"
              | regexp `Repaired (?P<resources>[0-9]+) incomplete resource\(s\) on XNAT in '(?P<session>[^']+)'`
              | unwrap resources
              | __error__=""
              [10m]
            )
          ) > 0
        for: 0s
        labels:
          severity: warning
          source: loki-ruler
          category: xnat-integrity
        annotations:
          summary: XNAT was missing files for {{ $labels.session }}; the uploader tried to re-send them
          description: |
            The uploader found missing files in an existing XNAT resource and attempted
            a re-send. The reported resource count uses the rule's maximum, not a sum of
            unique repairs. This notification does not establish that the repair worked.
              kubectl -n xnat-upload logs -l component=upload --since=1h | grep -F -- "{{ $labels.session }}"

            In accessionflow 0.19.0, the Repaired line precedes the final verdict. Look
            for Completed repair or xnat_repair_completed and inspect later errors and
            the actual destination listing. File completion does not certify metadata
            header extraction. XNATUploadSuccess excludes a session with recent repair
            evidence for 20 minutes, including a new pass within that interval.

            Missing files can reflect a changed source, archive/catalog inconsistency,
            or data removed at the destination. Do not infer the cause from this line.
            Check XNAT storage and event history. Automatic re-send requires available
            staged files; after their retirement, restore from a verified retained
            source through an approved recovery process. The absence of this alert is
            not evidence that older, no-longer-staged sessions are complete.
      - alert: XNATAuthFailure
        # Historical rationale retained below; its current disposition follows.
        # 401 / 403 from XNAT API. Surfaces credential rot, account
        # lockout, or XNAT-side proxy misconfig (e.g. the https→http
        # downgrade we caught earlier). Warning rather than critical
        # because retries may still succeed within the loop window.
        # THE BARE NUMBERS NEED HTTP CONTEXT, AND PROGRESS BARS MUST BE
        # EXCLUDED. This used to be \b(401|403|unauthorized|forbidden)\b,
        # which fires on ANY log line containing 401 or 403 as a word — and
        # accessionflow writes tqdm progress bars into this namespace:
        # Current review (2026-11-10):
        # TQDM_DISABLE=1 is set in stage and uploader environments since commit 5cd15fe
        # (2026-10-28). Progress bars are disabled in the shipped configuration. Claude
        # reported zero such uploader lines in a three-hour check on 2026-11-10; that
        # live result was not independently rerun here. Keep the filter as defense if
        # the environment setting is removed.
        #
        #   Processing staged sessions found in 's3://.../staged':
        #     0%|          | 0/1 [00:00<?, ?it/s]100%|####| 1/1 [00:01<00:00...
        #
        # Those frames are full of digits, so the alert fired on a healthy
        # upload run. Observed live: XNATAuthFailure notified while the
        # uploader was authenticating to XNAT perfectly well.
        #
        # A false auth alert is worse than none. It trains you to ignore the
        # one alert that means your fleet has stopped delivering, and it fires
        # precisely when things are working — during an upload.
        #
        # `!= "it/s"` drops tqdm lines before the regex runs (cheap, and no
        # legitimate auth error contains it). The regex then requires the
        # status code to sit next to HTTP context rather than float free.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-upload"}
            != "it/s"
            |~ "(?i)(unauthorized|forbidden|status[^0-9]{0,10}40[13]\\b|HTTP[^0-9]{0,10}40[13]\\b|\\b40[13][^0-9]{0,3}(unauthorized|forbidden))" [15m])) > 3
        # `> 3` OVER [15m], NOT `> 0` OVER [5m], AND THE THRESHOLD IS THE POINT.
        #
        # Historical rationale retained below; its current disposition follows.
        # The uploader holds one long-lived XNAT connection and re-authenticates
        # BY ITSELF the moment a call comes back 401 — it logs "Detected XNAT
        # authentication failure (expired session). Re-establishing…" in the same
        # second and is uploading again on the next ~62s pass. The old `[5m] > 0`
        # with `for: 1m` therefore paged on a fault that had already fixed itself
        # before the mail was composed, and because the root route sent resolved
        # notifications it cost two mails each time.
        # Current review (2026-11-10):
        # The pinned 0.19.0 loop refreshes connection/listing state on later passes.
        # Historical cookie-expiry incidents and the old approximately 62-second loop
        # measurement are not a current recovery guarantee. Environment-injected
        # credentials do not refresh merely because a Secret changes.
        #
        # Measured over five days: exactly two 401s, both single events, both
        # self-healed. XNAT's own cookie declares a 900s session timeout, so an
        # idle uploader crossing it is ROUTINE, not an incident. One of the two
        # followed four consecutive 503s — XNAT was down ~4 minutes and the
        # pre-outage session id was simply no longer known afterwards.
        #
        # Historical rationale retained below; its current disposition follows.
        # The condition worth waking someone for is a credential that STAYS
        # rejected: a rotated password, a locked account, a revoked role. That
        # fails on every loop pass, so ~1/minute, so >3 inside 15 minutes. A lone
        # expiry can never reach 4. `for:` is left at 0s deliberately — the
        # threshold is already the persistence test, and adding `for:` on top of
        # a 15m range would only delay a genuine outage.
        # Current review (2026-11-10):
        # More than three matching log lines is the configured threshold, not proof of
        # persistent bad credentials. Multiple workers, retries and repeated messages
        # can contribute. Inspect the actual request context and successful
        # authenticated operations.
        #
        # KNOWN GAP, stated rather than silently accepted: this rule cannot see
        # 5xx. The 4 x 503 that preceded the 08-09 event are invisible to it,
        # because 503 is not 40[13]. An "XNAT is not answering" rule is a
        # separate signal and is not folded in here, where it would blur what
        # "auth failure" means.
        for: 0s
        labels:
          severity: warning
          source: loki-ruler
          category: xnat-auth
        annotations:
          summary: "XNAT kept rejecting authenticated calls from the uploader on {{ $labels.cluster }}"
          description: |
            More than three matching authentication-rejection log lines occurred in
            15 minutes. The filter targets HTTP 401/403 context. It does not count
            unique failed requests or prove that routine expiry is impossible; multiple
            workers, retries or repeated lines can contribute.

            1. Inspect the affected uploader and adjacent network/server errors:
                 kubectl -n xnat-upload logs -l component=upload --since=1h
               This rule does not detect HTTP 5xx or prove XNAT is otherwise healthy.
            2. Check account status, role and the configured credentials Secret without
               printing the password. For the tier-1 direct path, the Secret is selected
               by upload.direct.existingSecret; management has its own configured Secret.
            3. accessionflow 0.19.0 refreshes connections/listings on later loop passes.
               Credentials supplied through environment variables still require a pod
               replacement after a verified Secret change. Identify the deployment from
               pod labels before an authorized rollout; do not guess it from cluster.
            4. Check source retention and reclaim decisions. Failed proof should prevent
               that reclaim path, but this alert cannot certify that no data was lost.

            Historical cookie-expiry incidents self-healed on older loop behavior. The
            old approximately 62-second measurement is not a current recovery deadline.
            Use current timestamps and a successful authenticated operation to confirm
            recovery, rather than a quiet alert window.
      - alert: OrthancDeidLuaError
        # Historical rationale retained below; its current disposition follows.
        # The Orthanc Lua deid hook logs Lua tracebacks when it can't
        # apply a Replace/Keep rule (often a malformed
        # deidentification-profile.json). Lua errors block the study
        # from being labelled ready, which silently stalls the pipeline.
        # Current review (2026-11-10):
        # Orthanc Lua errors can arise in receiver callbacks, including startup and
        # facility-backup handling. Only the deprecated Lua engine applies the legacy
        # de-identification profile. For current ingest deployments, accessionflow
        # performs de-identification and its stage has a separate error rule.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", app="orthanc"}
            |~ "(?i)lua.*error|traceback|stack\\s+traceback" [10m])) > 0
        for: 1m
        labels:
          severity: warning
          source: loki-ruler
          category: deid
        annotations:
          summary: "Orthanc receiver Lua callback error on {{ $labels.cluster }}"
          description: |
            An Orthanc Lua error appeared in the last ten minutes. Inspect the full
            receiver traceback and callback context, including routing configuration,
            salt loading and facility-backup writes. With the current ingest engine,
            Orthanc receives DICOM; accessionflow performs de-identification.
            Only the deprecated Lua engine uses the legacy de-identification profile.
            A callback error can prevent a backup or forwarding step. Check actual
            files and receiver status before assuming a study was preserved.
      - alert: IngestStageError
        # Historical rationale retained below; its current disposition follows.
        # Vector promotes JSON log severity to the level stream label, then
        # removes that field from the body. Match that label, not the word
        # ERROR in a filename or message. Plain tracebacks are JSON-wrapped by
        # Vector with level=unknown, so inspect their decoded message too.
        # The assign missing-ID diagnostic belongs to DICOMValidationFailureSpike.
        # Its per-pass summary adds no cause; each other concrete error still fires.
        # Current review (2026-11-10):
        # The 0.19.0 assign missing-ID diagnostic is covered by InvalidSessionAssigned.
        # DICOMValidationFailureSpike retains an older broad text match and is not a
        # complete detector for that diagnostic. Other concrete stage errors remain
        # relevant.
        expr: |
          sum by (cluster, component) (count_over_time(
            {namespace="xnat-ingest", app="xnat-ingest", component=~"group|group-fs|assign|package"}
            | json | __error__=""
            | json stage_message="message" | __error__=""
            | level=~"(?i)ERROR|CRITICAL" or stage_message=~"(?s)^Traceback \\(most recent call last\\):.*"
            | stage_message !~ "(?s)^(Could not resolve the labels of .*|Label completed with [0-9]+ errors)$"
            [10m])) > 0
        # One event remains in the window long enough to meet this hold.
        for: 1m
        labels:
          severity: warning
          source: loki-ruler
          category: edge-pipeline
        annotations:
          summary: "accessionflow {{ $labels.component }} logged an error on {{ $labels.cluster }}"
          description: |
            The {{ $labels.component }} stage logged ERROR, CRITICAL, or a Python
            traceback within the last 10 minutes. Inspect the stage logs on this
            edge and check which sessions did not complete:
              kubectl -n xnat-ingest logs -l app=xnat-ingest,component={{ $labels.component }} --since=15m
            This reports a logged error. The alert clears when its evidence leaves
            the time window; that does not prove recovery or data loss. A process
            killed without a log, an image pull failure, or missing telemetry can
            remain silent here. Check pod status and previous container logs too.

      - alert: DeidentifyStageError
        # Historical rationale retained below; its current disposition follows.
        # Counterpart to OrthancDeidLuaError for the accessionflow engine. Whichever
        # engine a site runs, a failure to de-identify has to be visible; without
        # this, switching to ingest.deidentify silences OrthancDeidLuaError and puts
        # nothing in its place, leaving the one thing you cannot afford to miss
        # unwatched.
        # Current review (2026-11-10):
        # This is the current accessionflow de-identification error signal. Orthanc/Lua
        # de-identification is deprecated; its retained error rule covers existing
        # legacy deployments and receiver callbacks. New deployments use the ingest
        # engine.
        #
        # Historical rationale retained below; its current disposition follows.
        # Structured ERROR/CRITICAL is a stream label after Vector processing;
        # it need not leave the word "error:" in the body. Keep the existing
        # text fallback because the stage also logs tracebacks as plain text.
        # tqdm writes progress bars to the same stream
        # ("Processing staged sessions ... 100%|####|"), so the pattern is anchored
        # on error words and never on a bare percentage.
        # Current review (2026-11-10):
        # Progress bars are disabled by TQDM_DISABLE=1 in the current stage environment,
        # set since 2026-10-28. Historically they shared the stream. Keep the anchored
        # error-word match as defense if the setting is removed; a bare percentage is
        # not an error signal.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="deidentify", level=~"(?i)ERROR|CRITICAL"}
            [10m])) > 0
          or
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="deidentify"}
            |~ "(?i)traceback|error:|exception|no deidentification recipe file" [10m])) > 0
        for: 1m
        labels:
          severity: warning
          source: loki-ruler
          category: deid
        annotations:
          summary: accessionflow deidentify errored on {{ $labels.cluster }}
          description: |
            The accessionflow deidentify stage logged an error in the last ten minutes.
            Check the pod logs and the selected inline ingest.deidentify.specs or the
            external ingest.deidentify.specConfigMap. Confirm the recipe covers the
            received format and that required files and credentials are available.
            The time window can expire before the cause is fixed. This alert establishes
            neither data loss nor recovery and cannot detect a process killed without
            a log. Check pod status and previous-container output as well.
      - alert: S3UploaderRestartedRecently
        # The s3-uploader exits non-zero (and crashloops) when its
        # pre-flight bucket probe fails. A restart within 5m means the
        # object store was unreachable at pod start, or the edge S3 key
        # is wrong. Often transient at install time; a sustained spike
        # means real config drift.
        #
        # Two more exits since PR 57, both from charts/edge/files/s3-uploader.sh:
        # `dependency_missing` (a tool the loop needs is not in the image; its
        # message carries "refusing to start upload loop" as well) and
        # `lock_failed` (the writer lock cannot be opened or taken, and not for
        # a timeout). MEASURED 2026-10-14: an image without flock skipped
        # every copy as lock contention for five hours and nothing restarted;
        # now the loop stops, and this names it.
        #
        # Matches BOTH event spellings on purpose. `alias_failed` was the
        # minio/mc-era name; the AWS CLI uploader emits `endpoint_failed`
        # ("alias" was an mc concept). Keeping both means this alert works
        # across the client migration and against any edge still running
        # the old image. Do not drop `alias_failed` until every site has
        # been migrated — a rule that silently stops matching is
        # indistinguishable from a healthy pipeline.
        expr: |
          sum by (cluster) (count_over_time(
            {namespace="xnat-ingest", component="s3-uploader"}
            |~ "(?i)refusing to start upload loop|alias_failed|endpoint_failed|dependency_missing|lock_failed" [5m])) > 0
        for: 2m
        labels:
          severity: warning
          source: loki-ruler
          category: s3-auth
        annotations:
          summary: "s3-uploader on {{ $labels.cluster }} stopped: its endpoint, its image or its lock"
          description: |
            The s3-uploader stopped in the last 5 minutes. Its log says which:
            endpoint_failed (the pre-flight bucket probe failed: check the
            SeaweedFS Ingress is reachable, the edge S3 key matches the IAM
            identity for this cluster, and the ca-bundle Secret contains the
            ais-edge-ca cert, which rclone reads as a single file via
            RCLONE_CA_CERT), dependency_missing (a tool the loop needs is not
            in upload.s3.shell.image; the line names it) or lock_failed (the
            upload-tree writer lock could not be opened or taken, and not for
            a timeout; check the pipeline volume and /data/.locks).

      - alert: RecopyLoop
        # Historical rationale retained below; its current disposition follows.
        # The edge's staged-reclaimer (PROOF=s3) asks the uploader to copy a
        # session again when a local file is not in the bucket as it is on
        # disk. One copy is a repair. A session copied again and again is the
        # two clocks crossing: the mgmt reclaimer removes the bucket copy
        # before the edge has proven its own against it, the edge requests,
        # the uploader copies, mgmt removes again. Nothing is lost while it
        # loops (both copies are kept until proven), but the edge never
        # retires its copy and the bucket is written over and over.
        # Fix: raise dataPolicy.derived.s3Staged.minAge on the management
        # side well above the edge's stagedReclaimer.minAge plus its run
        # interval, and keep it at most 36h (charts/edge/values.yaml,
        # s3Staged: "the two clocks").
        # Current review (2026-11-10):
        # Repeated recopy can be caused by management reclaim overtaking edge proof, but
        # the event alone does not prove that cause or that every copy is safe. Compare
        # requested file names, manifests, bucket contents and actual reclaim timings
        # before changing retention.
        #
        # Historical rationale retained below; its current disposition follows.
        # COMPLETED copies (recopy_done), not claimed requests. An uploader
        # that cannot copy claims the same request on every pass: MEASURED
        # 2026-10-14, 21 sessions fired this for five hours with nothing
        # copied at all. That failure is SessionUploadStalled's and
        # S3UploaderRestartedRecently's; this one names the crossing only.
        # Current review (2026-11-10):
        # This rule counts completed recopy events. Crossing reclaim windows are one
        # possible cause, not the only one. Failed attempts without recopy_done remain
        # outside this count and require uploader/error inspection.
        expr: |
          sum by (cluster, session) (count_over_time({component="s3-uploader"} | json | event="recopy_done" [24h])) > 3
        for: 10m
        labels:
          severity: warning
          source: loki-ruler
          category: pipeline-health
        annotations:
          summary: "Session {{ $labels.session }} on {{ $labels.cluster }} was copied again more than 3 times in 24h"
          description: |
            More than three completed recopy_done events were observed for this session
            in 24 hours. Inspect the corresponding recopy_requested reasons and file
            names; the count is not a unique-file count or proof of a single cause.

            One possible cause is management reclaiming an S3 copy before the edge has
            proved and retired its local copy. Compare management
             dataPolicy.derived.s3Staged.minAge with the edge stagedReclaimer.minAge
            plus its schedule interval. The management window needs sufficient margin.
            Use the documented upper bound and validate the actual run timings.

            Other changes or incomplete copies can also request recopy. Inspect the
            uploader, bucket listing and local files before changing retention. The
            edge reclaimer keeps files when proof fails, but this signal alone cannot
            certify that XNAT holds the session or that no data was lost elsewhere.
            Loki: {cluster="{{ $labels.cluster }}",component="s3-reclaimer"} |= "recopy_requested"
            Confirm successful copies and the later proof/retirement, not just requests.
