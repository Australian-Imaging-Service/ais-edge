# =============================================================================
# promtool unit tests: edge worker nodes (edge-nodes.yaml)
# =============================================================================
# __EDGE_NODE_INVENTORY__ is filled by scripts/ci/promtool.sh with two edges,
# edge-a and edge-b, as templates/observability.yaml fills it per configured edge.
# Each alert is proven to fire on its condition and to stay quiet otherwise.
# Generated expected annotations come from the rule text itself.
# =============================================================================
rule_files:
- ../edge-nodes.yaml
evaluation_interval: 30s
tests:
- interval: 30s
  name: EdgeWorkerDisconnected fires when an edge node stops being Ready
  input_series:
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-a",condition="Ready",status="true",node="edge-a-w1"}
    values: 1+0x10 0+0x30
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-a",condition="Ready",status="false",node="edge-a-w1"}
    values: 0+0x10 1+0x30
  alert_rule_test:
  - eval_time: 2m
    alertname: EdgeWorkerDisconnected
    exp_alerts: []
  - eval_time: 12m
    alertname: EdgeWorkerDisconnected
    exp_alerts:
    - exp_labels:
        severity: critical
        job: edge-node-state
        cluster: edge-a
        condition: Ready
        status: 'true'
        node: edge-a-w1
      exp_annotations:
        summary: 'Edge edge-a: node edge-a-w1 NotReady for 5+ minutes'
        description: "The child API of edge edge-a reports node edge-a-w1 as not\nReady (False, or Unknown when its kubelet stopped reporting) for 5 minutes. The\nedge may be down, off the network, or short\
          \ of disk or memory. Its DICOM\nreceiver and its uploads can stop. Check the node in the edge's cluster:\n  kubectl --kubeconfig <edge kubeconfig> describe node edge-a-w1\nand the network path\
          \ from the edge to the management node. This alert does not\nestablish which files were received or uploaded.\n"
- interval: 30s
  name: EdgeWorkerDisconnected fires when an edge node is Unknown
  input_series:
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-b",condition="Ready",status="true",node="edge-b-w1"}
    values: 1+0x4 0+0x36
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-b",condition="Ready",status="unknown",node="edge-b-w1"}
    values: 0+0x4 1+0x36
  alert_rule_test:
  - eval_time: 12m
    alertname: EdgeWorkerDisconnected
    exp_alerts:
    - exp_labels:
        severity: critical
        job: edge-node-state
        cluster: edge-b
        condition: Ready
        status: 'true'
        node: edge-b-w1
      exp_annotations:
        summary: 'Edge edge-b: node edge-b-w1 NotReady for 5+ minutes'
        description: "The child API of edge edge-b reports node edge-b-w1 as not\nReady (False, or Unknown when its kubelet stopped reporting) for 5 minutes. The\nedge may be down, off the network, or short\
          \ of disk or memory. Its DICOM\nreceiver and its uploads can stop. Check the node in the edge's cluster:\n  kubectl --kubeconfig <edge kubeconfig> describe node edge-b-w1\nand the network path\
          \ from the edge to the management node. This alert does not\nestablish which files were received or uploaded.\n"
- interval: 30s
  name: EdgeWorkerDisconnected stays quiet for a management node
  input_series:
  - series: kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true",node="stream-2-ab-dev"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 15m
    alertname: EdgeWorkerDisconnected
    exp_alerts: []
- interval: 30s
  name: EdgeNodeStatusMissing fires for the configured edge with no node series, not for the healthy one
  input_series:
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-a",condition="Ready",status="true",node="edge-a-w1"}
    values: 1+0x40
  alert_rule_test:
  - eval_time: 5m
    alertname: EdgeNodeStatusMissing
    exp_alerts: []
  - eval_time: 11m
    alertname: EdgeNodeStatusMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        cluster: edge-b
      exp_annotations:
        summary: 'Edge edge-b: no node state for 10+ minutes'
        description: "Prometheus has no Ready state for any node of edge edge-b, so\nEdgeWorkerDisconnected cannot fire for this edge. Either its collector does not\nrun or is not scraped, or the child\
          \ cluster has no node (the worker never\njoined, or it was removed). On the management cluster:\n  kubectl get pods -A -l app.kubernetes.io/component=edge-node-state,ais-edge.org/edge=edge-b\n\
          \  kubectl -n <that namespace> describe pod <that pod>\n  kubectl -n <that namespace> logs <that pod> -c find-api\nThe init container find-api says when it finds no control-plane Service, or more\n\
          than one. A pod that waits for its volume means <edge>-kubeconfig is missing.\n"
- interval: 30s
  name: EdgeNodeStatusMissing fires when an edge's series go stale (collector down)
  input_series:
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-a",condition="Ready",status="true",node="edge-a-w1"}
    values: 1+0x4 stale
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-b",condition="Ready",status="true",node="edge-b-w1"}
    values: 1+0x40
  alert_rule_test:
  - eval_time: 11m
    alertname: EdgeNodeStatusMissing
    exp_alerts: []
  - eval_time: 14m
    alertname: EdgeNodeStatusMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        cluster: edge-a
      exp_annotations:
        summary: 'Edge edge-a: no node state for 10+ minutes'
        description: "Prometheus has no Ready state for any node of edge edge-a, so\nEdgeWorkerDisconnected cannot fire for this edge. Either its collector does not\nrun or is not scraped, or the child\
          \ cluster has no node (the worker never\njoined, or it was removed). On the management cluster:\n  kubectl get pods -A -l app.kubernetes.io/component=edge-node-state,ais-edge.org/edge=edge-a\n\
          \  kubectl -n <that namespace> describe pod <that pod>\n  kubectl -n <that namespace> logs <that pod> -c find-api\nThe init container find-api says when it finds no control-plane Service, or more\n\
          than one. A pod that waits for its volume means <edge>-kubeconfig is missing.\n"
- interval: 30s
  name: EdgeNodeStatusMissing stays quiet while every edge reports
  input_series:
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-a",condition="Ready",status="true",node="edge-a-w1"}
    values: 1+0x40
  - series: kube_node_status_condition{job="edge-node-state",cluster="edge-b",condition="Ready",status="true",node="edge-b-w1"}
    values: 0+0x40
  alert_rule_test:
  - eval_time: 15m
    alertname: EdgeNodeStatusMissing
    exp_alerts: []
- interval: 30s
  name: EdgeNodeStatusStale fires for watch errors with no successful watch, not when watches recover
  input_series:
  - series: kube_state_metrics_watch_total{job="edge-node-state",cluster="edge-a",resource="*v1.Node",result="error"}
    values: 0+1x40
  - series: kube_state_metrics_watch_total{job="edge-node-state",cluster="edge-a",resource="*v1.Node",result="success"}
    values: 1+0x40
  - series: kube_state_metrics_watch_total{job="edge-node-state",cluster="edge-b",resource="*v1.Node",result="error"}
    values: 0+1x40
  - series: kube_state_metrics_watch_total{job="edge-node-state",cluster="edge-b",resource="*v1.Node",result="success"}
    values: 1+0x10 2+0x10 3+0x20
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeNodeStatusStale
    exp_alerts: []
  - eval_time: 12m
    alertname: EdgeNodeStatusStale
    exp_alerts:
    - exp_labels:
        severity: warning
        cluster: edge-a
      exp_annotations:
        summary: 'Edge edge-a: node state is old, the child API does not answer'
        description: "The collector for edge edge-a cannot watch the child API, and it had\nno successful watch for 10 minutes. It still shows the last node state it saw,\nso EdgeWorkerDisconnected cannot\
          \ fire for this edge until it reconnects. Check\nthe edge's control plane and the collector on the management cluster:\n  kubectl get pods -A -l app=k0smotron,cluster=edge-a\n  kubectl get pods\
          \ -A -l app.kubernetes.io/component=edge-node-state,ais-edge.org/edge=edge-a\n"
- interval: 30s
  name: EdgeNodeStatusStale stays quiet for one error followed by a successful watch
  input_series:
  - series: kube_state_metrics_watch_total{job="edge-node-state",cluster="edge-a",resource="*v1.Node",result="error"}
    values: 0 1+0x40
  - series: kube_state_metrics_watch_total{job="edge-node-state",cluster="edge-a",resource="*v1.Node",result="success"}
    values: 1 1 2+0x39
  alert_rule_test:
  - eval_time: 3m
    alertname: EdgeNodeStatusStale
    exp_alerts: []
  - eval_time: 8m
    alertname: EdgeNodeStatusStale
    exp_alerts: []
  - eval_time: 15m
    alertname: EdgeNodeStatusStale
    exp_alerts: []
