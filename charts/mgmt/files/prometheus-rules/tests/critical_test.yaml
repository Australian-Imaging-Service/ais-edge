# =============================================================================
# promtool unit tests — critical rules
# =============================================================================
# These three page someone. A rule that pages nobody because its selector
# stopped matching is the worst outcome in this repo, so each is proven to
# fire on the condition it claims to detect AND to stay quiet otherwise.
#
# SeaweedFSDown in particular: it used to select
# `deployment="seaweedfs",namespace="seaweedfs"`, which is what the imperative
# installer created. The chart creates <release>-seaweedfs in the release
# namespace, so the exact matcher would have stopped matching the moment this
# was installed from the chart — silently. The regex-match test below is what
# stops that regressing.
# =============================================================================
rule_files:
  - ../critical.yaml

evaluation_interval: 30s

tests:
  # ---------------------------------------------------------------------
  - interval: 30s
    name: ManagementClusterDown fires when the apiserver scrape fails
    input_series:
      - series: 'up{job="apiserver",instance="10.0.0.1:6443"}'
        values: "1+0x10 0+0x30"      # up for 5m, then down
    alert_rule_test:
      - eval_time: 2m
        alertname: ManagementClusterDown
        exp_alerts: []
      # down at 5m, `for: 5m`, so not yet
      - eval_time: 8m
        alertname: ManagementClusterDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ManagementClusterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: apiserver
              instance: "10.0.0.1:6443"
            exp_annotations:
              summary: "Management API server unreachable"
              description: "The discovered kube-apiserver scrape target has reported up=0 for at least\nfive minutes. Check target errors, network access, TLS and authentication,\nas well as API-server health. This signal does not prove the entire control\nplane is down. A vanished target or unavailable Prometheus cannot produce\nthe same up=0 signal; inspect discovery and evaluator health separately.\n"

  # ---------------------------------------------------------------------
  # The regression test for the rename. BOTH names must fire.
  - interval: 30s
    name: SeaweedFSDown fires for the chart's <release>-seaweedfs name
    input_series:
      - series: 'kube_deployment_status_replicas_ready{namespace="ais",deployment="mgmt-seaweedfs"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: SeaweedFSDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: ais
              deployment: mgmt-seaweedfs
            exp_annotations:
              summary: "SeaweedFS deployment has zero ready replicas for 2+ minutes"
              description: "The matching deployment reports zero ready replicas. It may be unhealthy\nor deliberately scaled down. Check desired replicas, pod events and logs\nin ais. The selector matches deployment names containing\nseaweedfs; verify the actual workload before assuming a specific failure.\n  kubectl -n ais get deployments,pods\n  kubectl -n ais logs -l app=seaweedfs --tail=-1 --since=__RECLAIMER_ALERT_AFTER_S__s\nEdge transfers may fail or retry while the service is unavailable.\n"

  - interval: 30s
    name: SeaweedFSDown still fires for the pre-chart flat name
    input_series:
      - series: 'kube_deployment_status_replicas_ready{namespace="seaweedfs",deployment="seaweedfs"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: SeaweedFSDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: seaweedfs
              deployment: seaweedfs
            exp_annotations:
              summary: "SeaweedFS deployment has zero ready replicas for 2+ minutes"
              description: "The matching deployment reports zero ready replicas. It may be unhealthy\nor deliberately scaled down. Check desired replicas, pod events and logs\nin seaweedfs. The selector matches deployment names containing\nseaweedfs; verify the actual workload before assuming a specific failure.\n  kubectl -n seaweedfs get deployments,pods\n  kubectl -n seaweedfs logs -l app=seaweedfs --tail=-1 --since=__RECLAIMER_ALERT_AFTER_S__s\nEdge transfers may fail or retry while the service is unavailable.\n"

  - interval: 30s
    name: SeaweedFSDown stays quiet while replicas are ready
    input_series:
      - series: 'kube_deployment_status_replicas_ready{namespace="ais",deployment="mgmt-seaweedfs"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: SeaweedFSDown
        exp_alerts: []

  # ---------------------------------------------------------------------
  - interval: 30s
    name: ManagementNodeNotReady fires when a management node stops being Ready
    input_series:
      - series: 'kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true",node="stream-2-ab-dev"}'
        values: "1+0x10 0+0x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: ManagementNodeNotReady
        exp_alerts: []
      - eval_time: 12m
        alertname: ManagementNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              job: kube-state-metrics
              condition: Ready
              status: "true"
              node: stream-2-ab-dev
            exp_annotations:
              summary: "Management node stream-2-ab-dev NotReady for 5+ minutes"
              description: "The management node stream-2-ab-dev is not Ready (False, or Unknown when its\nkubelet stopped reporting). SeaweedFS, the uploaders and the edge control planes\non it may be down. Check the node conditions, the kubelet and the disk:\n  kubectl describe node stream-2-ab-dev\nOn a one-node management cluster Prometheus runs on this node, so a node that is\nfully down cannot raise this alert. A node that is gone has no series either.\n"

  # ---------------------------------------------------------------------
  # The old rule had no job selector, so it would fire for ANY node series.
  # An edge node (from the per-edge collector) is EdgeWorkerDisconnected's.
  - interval: 30s
    name: ManagementNodeNotReady stays quiet for an edge node
    input_series:
      - series: 'kube_node_status_condition{job="edge-node-state",cluster="edge-a",condition="Ready",status="true",node="k0s-edge-worker-dev"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: ManagementNodeNotReady
        exp_alerts: []
