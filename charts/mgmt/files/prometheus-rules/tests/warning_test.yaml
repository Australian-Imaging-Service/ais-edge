# =============================================================================
# promtool unit tests — warning rules
# =============================================================================
#   promtool test rules charts/mgmt/files/prometheus-rules/tests/*_test.yaml
#
# WHY THESE EXIST. SeaweedFSDiskFull shipped selecting
# `kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".*seaweedfs.*"}`
# for a hostPath volume. The hostPath plugin has no MetricsProvider, so that
# series does not exist and never will — verified against the live Prometheus,
# where `count(kubelet_volume_stats_used_bytes)` returns nothing. The alert was
# green from the day it was written, and green is exactly what a working alert
# looks like. Four of ~21 rules were in that state.
#
# An alert that cannot fire is worse than no alert, because it reads as
# coverage. Every rule therefore needs a test that PROVES it fires on the
# condition it claims to detect, and stays quiet otherwise. These run in
# seconds with no cluster.
#
# Sample values are taken from the real cluster so the tests describe the
# system we actually have:
#   SeaweedFS_volumeServer_resource{name="/data",type="all"}  211247489024
#   SeaweedFS_volumeServer_resource{name="/data",type="used"}  92370411520
# =============================================================================
rule_files:
  - ../warning.yaml

evaluation_interval: 30s

tests:
  # ---------------------------------------------------------------------
  - interval: 30s
    name: SeaweedFSDiskFull fires above 80% and not below
    input_series:
      # 211 GB total, constant.
      - series: 'SeaweedFS_volumeServer_resource{name="/data",type="all",job="seaweedfs"}'
        values: "211247489024+0x40"
      # Climbs from 43% (the live value) to 90%.
      - series: 'SeaweedFS_volumeServer_resource{name="/data",type="used",job="seaweedfs"}'
        values: "92370411520+3168712335x40"
    alert_rule_test:
      # 43% — nothing.
      - eval_time: 1m
        alertname: SeaweedFSDiskFull
        exp_alerts: []
      # ~66% — still under the threshold.
      - eval_time: 8m
        alertname: SeaweedFSDiskFull
        exp_alerts: []
      # Past 80% AND past the 5m `for:` — must fire.
      - eval_time: 20m
        alertname: SeaweedFSDiskFull
        exp_alerts:
          # No `type` label here: `ignoring(type)` drops it, which is the
          # right outcome — the alert is about the disk, not about the
          # "used" series specifically.
          - exp_labels:
              severity: warning
              name: "/data"
              job: seaweedfs
            exp_annotations:
              summary: "SeaweedFS disk >80% full on /data"
              description: |
                The staging store is over 80% full. Staged sessions are patient
                data that has not necessarily reached XNAT yet, so DO NOT clear
                them blindly — check dataPolicy.derived.s3Staged and the
                s3-reclaimer logs first, then grow the disk.

  # ---------------------------------------------------------------------
  # The regression test for the actual bug: with the OLD metric name present
  # and the new one absent, the rule must produce nothing. If someone
  # "helpfully" restores the kubelet series, this test says so.
  - interval: 30s
    name: SeaweedFSDiskFull ignores kubelet volume stats (the metric that does not exist here)
    input_series:
      - series: 'kubelet_volume_stats_used_bytes{persistentvolumeclaim="mgmt-seaweedfs"}'
        values: "200000000000+0x40"
      - series: 'kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="mgmt-seaweedfs"}'
        values: "211247489024+0x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: SeaweedFSDiskFull
        exp_alerts: []

  # ---------------------------------------------------------------------
  # KubeStateMetricsDown: the CronJob alerts' blind spot. absent() over an
  # expression (not a bare selector) carries no labels, hence no job here.
  # Healthy: up 1 throughout, quiet.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="10.244.0.20:8080"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStateMetricsDown
        exp_alerts: []

  # Discovered but failing (up 0): fires once 15m have passed.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics", instance="10.244.0.20:8080"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeStateMetricsDown
        exp_alerts: []
      - eval_time: 20m
        alertname: KubeStateMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'kube-state-metrics is not being scraped'
              description: |
                No successful scrape of kube-state-metrics for 15 minutes. Until it is
                back, CertSyncStale, CertSyncNeverSucceeded and ReclaimerNotSucceeding
                cannot fire, because they read its CronJob series.
                  kubectl get pods -A -l app.kubernetes.io/name=kube-state-metrics

  # Gone entirely (no up series at all, e.g. the pod is Pending): fires too.
  - interval: 1m
    input_series:
      - series: 'up{job="apiserver", instance="10.0.0.1:6443"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: KubeStateMetricsDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'kube-state-metrics is not being scraped'
              description: |
                No successful scrape of kube-state-metrics for 15 minutes. Until it is
                back, CertSyncStale, CertSyncNeverSucceeded and ReclaimerNotSucceeding
                cannot fire, because they read its CronJob series.
                  kubectl get pods -A -l app.kubernetes.io/name=kube-state-metrics

  # ---------------------------------------------------------------------
  # CertificateExpiringSoon: late renewal only. promtool's clock starts at 0,
  # so each series holds absolute timestamps in seconds from t=0.
  # The prod case of 2026-09-30: a 90-day certificate with 40 days left and
  # renewal due in 10 days. The old "< 60 days" rule fired on it daily.
  - interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="cai-lfs3-loki-client"}'
        values: '3456000x180'
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="cai-lfs3-loki-client"}'
        values: '864000x180'
    alert_rule_test:
      - eval_time: 3h
        alertname: CertificateExpiringSoon
        exp_alerts: []

  # Renewal due at t=0 and never done: quiet for the first day (a retry is
  # normal), fires once it is a day overdue plus the 1h `for`. A certificate
  # renewed on time (renewal moved on) next to it stays quiet.
  - interval: 5m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="late-cert"}'
        values: '2592000x400'
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="late-cert"}'
        values: '0x400'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="renewed-cert"}'
        values: '2592000x400'
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="renewed-cert"}'
        values: '0x60 5184000x340'
    alert_rule_test:
      - eval_time: 12h
        alertname: CertificateExpiringSoon
        exp_alerts: []
      - eval_time: 26h
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cert-manager
              exported_namespace: ais-mgmt
              name: late-cert
            exp_annotations:
              summary: 'Certificate ais-mgmt/late-cert is overdue for renewal'
              description: |
                cert-manager was due to renew this certificate over a day ago and has not, or it
                expires within 14 days. Healthy certificates never fire this: cert-manager renews at
                notAfter minus renewBefore (30 days before expiry for a 90-day certificate).
                  kubectl -n ais-mgmt describe certificate late-cert
                  kubectl -n ais-mgmt get certificaterequests,orders,challenges
                  kubectl -n cert-manager logs deploy/cert-manager --since=24h | grep late-cert

  # Under 14 days from expiry fires whatever the renewal time says (a
  # renewBefore set too short to leave time to act).
  - interval: 5m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="short-renewbefore"}'
        values: '864000x40'
      - series: 'certmanager_certificate_renewal_timestamp_seconds{namespace="cert-manager", exported_namespace="ais-mgmt", name="short-renewbefore"}'
        values: '777600x40'
    alert_rule_test:
      - eval_time: 90m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cert-manager
              exported_namespace: ais-mgmt
              name: short-renewbefore
            exp_annotations:
              summary: 'Certificate ais-mgmt/short-renewbefore is overdue for renewal'
              description: |
                cert-manager was due to renew this certificate over a day ago and has not, or it
                expires within 14 days. Healthy certificates never fire this: cert-manager renews at
                notAfter minus renewBefore (30 days before expiry for a 90-day certificate).
                  kubectl -n ais-mgmt describe certificate short-renewbefore
                  kubectl -n ais-mgmt get certificaterequests,orders,challenges
                  kubectl -n cert-manager logs deploy/cert-manager --since=24h | grep short-renewbefore
