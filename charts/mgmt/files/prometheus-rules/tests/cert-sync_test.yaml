# =============================================================================
# promtool unit tests — cert-sync rules
# =============================================================================
#   promtool test rules charts/mgmt/files/prometheus-rules/tests/*_test.yaml
#
# These prove the LOGIC of the rules: given these series, do they fire when
# they should and stay quiet when they should not. They cannot prove the
# series exist in our cluster — that is what scripts/check-alert-inputs.sh is
# for, and the input situation for kube_cronjob_* is written down in full at
# the top of ../cert-sync.yaml.
#
# Three things are pinned here on purpose:
#
#   * THE CRONJOB NAME SHAPE. The rules select cronjob=~".+-cert-sync-.+",
#     which is the name templates/cert-sync.yaml renders
#     (<release>-cert-sync-<edge>). The tests use real-looking names,
#     mgmt-cert-sync-edge-dev, -edge-two and -edge-syd, and a decoy
#     (mgmt-reclaim-edge-dev) that must NOT match — otherwise the reclaimer
#     CronJob next door would inherit a cert-sync alert.
#
#   * THE "NEVER SUCCEEDED" CASE. kube_cronjob_status_last_successful_time
#     simply does not exist for a CronJob that has never had a successful run,
#     so a threshold rule over it is blind to exactly the site where sync has
#     never once worked. CertSyncNeverSucceeded covers that, and this test is
#     what stops someone "simplifying" it away.
#
#   * WHEN ITS CLOCK STARTS. At the first SCHEDULED run, or 24h after
#     creation if nothing was ever scheduled. Never at creation: a new edge
#     can wait ~6h for its first run, and the old kube_cronjob_info form
#     paged critical at 2h. The new-edge case below keeps that fixed.
#
# promtool's clock starts at unix 0, so a series whose value is 0 means "last
# succeeded at t=0" and `time() - 0` is simply the eval_time in seconds.
# 86400 is therefore crossed at eval_time 24h.
#
# The same holds for the other timestamps. kube_cronjob_created 0 is a
# CronJob created at t=0. A last_schedule_time of 19380 is a run scheduled
# at 5h23m (5*3600 + 23*60).
#
# Every cert-sync case feeds kube_cronjob_info too, as kube-state-metrics
# always does. That is what lets the old expression be replayed against
# these cases.
# =============================================================================
rule_files:
  - ../cert-sync.yaml

evaluation_interval: 30s

tests:
  # ---------------------------------------------------------------------
  - interval: 5m
    name: CertSyncStale fires per edge after 24h, and only for the stale edge
    input_series:
      # edge-dev last succeeded at t=0 and never again.
      - series: 'kube_cronjob_status_last_successful_time{namespace="observability",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "0+0x400"
      # edge-two keeps succeeding: its last-success timestamp tracks the
      # clock, one 5m step behind.
      - series: 'kube_cronjob_status_last_successful_time{namespace="observability",cronjob="mgmt-cert-sync-edge-two"}'
        values: "0+300x400"
    alert_rule_test:
      # 12h — under the window for both.
      - eval_time: 12h
        alertname: CertSyncStale
        exp_alerts: []
      # 24h exactly is not yet > 86400, and the 30m `for:` has not elapsed.
      - eval_time: 24h
        alertname: CertSyncStale
        exp_alerts: []
      # 25h: edge-dev is 25h stale and has been over the threshold for an
      # hour. edge-two is 5m stale and must stay quiet — the per-edge label is
      # the whole point of one CronJob per site.
      - eval_time: 25h
        alertname: CertSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: observability
              cronjob: mgmt-cert-sync-edge-dev
            exp_annotations:
              summary: "cert-sync has not succeeded for mgmt-cert-sync-edge-dev in over 24h"
              description: |
                The CronJob observability/mgmt-cert-sync-edge-dev has not
                recorded a successful run for more than 24 hours, so that edge is
                holding whatever certificate and credential material it was last
                given. Nothing breaks until those expire, which is why this is
                worth acting on now rather than at the expiry date.

                Why it is not syncing:
                  kubectl -n observability logs job/<latest job of mgmt-cert-sync-edge-dev>
                or in Loki:
                  {component="cert-sync"} | json | event=~"sync_skipped|sync_failed"

  # ---------------------------------------------------------------------
  - interval: 5m
    name: CertSyncStale does not select other CronJobs in the release
    input_series:
      # The s3 reclaimer, stale for days. It has its own failure modes and
      # must not arrive labelled as a certificate problem.
      - series: 'kube_cronjob_status_last_successful_time{namespace="xnat-upload",cronjob="mgmt-reclaim-edge-dev"}'
        values: "0+0x400"
    alert_rule_test:
      - eval_time: 30h
        alertname: CertSyncStale
        exp_alerts: []

  # ---------------------------------------------------------------------
  - interval: 5m
    name: CertSyncNeverSucceeded fires when there is no last-success series at all
    input_series:
      # Two cert-sync CronJobs exist. Only edge-two has ever succeeded.
      - series: 'kube_cronjob_info{namespace="observability",cronjob="mgmt-cert-sync-edge-dev",schedule="23 */6 * * *"}'
        values: "1+0x400"
      - series: 'kube_cronjob_info{namespace="observability",cronjob="mgmt-cert-sync-edge-two",schedule="23 */6 * * *"}'
        values: "1+0x400"
      - series: 'kube_cronjob_status_last_successful_time{namespace="observability",cronjob="mgmt-cert-sync-edge-two"}'
        values: "0+300x400"
      # Both created at t=0 and both first run at 2h25m (step 29). Only
      # edge-dev's run fails. edge-two's success from t=0 is its install.sh
      # seed, which never sets last_schedule_time.
      - series: 'kube_cronjob_created{namespace="observability",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "0+0x400"
      - series: 'kube_cronjob_created{namespace="observability",cronjob="mgmt-cert-sync-edge-two"}'
        values: "0+0x400"
      - series: 'kube_cronjob_status_last_schedule_time{namespace="observability",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "_x29 8700+0x371"
      - series: 'kube_cronjob_status_last_schedule_time{namespace="observability",cronjob="mgmt-cert-sync-edge-two"}'
        values: "_x29 8700+0x371"
      # CAUTION: keep both in ONE namespace. It is what makes
      # `unless on (namespace)` fail here: edge-two's success would hide
      # edge-dev.
    alert_rule_test:
      # Nothing scheduled yet, so there is no clock running.
      - eval_time: 1h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      # 35m after edge-dev's failed first run.
      - eval_time: 3h
        alertname: CertSyncNeverSucceeded
        exp_alerts:
          # max by (namespace, cronjob) keeps only those two labels.
          # `schedule` from kube_cronjob_info is no longer on the alert.
          - exp_labels:
              severity: critical
              namespace: observability
              cronjob: mgmt-cert-sync-edge-dev
            exp_annotations:
              summary: "cert-sync has never completed a run for mgmt-cert-sync-edge-dev"
              description: |
                observability/mgmt-cert-sync-edge-dev has had a scheduled
                run, or has existed for over 24h without one, and has no
                successful run on record. That edge has never received a synced
                copy of the management Secrets, so anything depending on rotation
                there is running on whatever was pushed at build time by hand.
                Check RBAC on the edge namespace and whether the child API server
                is reachable from the management cluster.

  # ---------------------------------------------------------------------
  - interval: 5m
    name: CertSyncNeverSucceeded stays quiet once a run has succeeded
    input_series:
      - series: 'kube_cronjob_info{namespace="observability",cronjob="mgmt-cert-sync-edge-dev",schedule="23 */6 * * *"}'
        values: "1+0x400"
      - series: 'kube_cronjob_status_last_successful_time{namespace="observability",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "0+300x400"
      # Scheduled all along, and over 24h old by the end. Both halves of the
      # expression are live, so only the success keeps it quiet.
      - series: 'kube_cronjob_created{namespace="observability",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "0+0x400"
      - series: 'kube_cronjob_status_last_schedule_time{namespace="observability",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "0+300x400"
    alert_rule_test:
      - eval_time: 5h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      - eval_time: 25h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []

  # ---------------------------------------------------------------------
  # (1) THE BUG THIS FILE NOW PINS. A healthy new edge, created at t=0.
  # Its first "23 */6 * * *" slot is 5h23m away and that run succeeds.
  # The old rule paged critical at 2h. This must stay quiet throughout.
  - interval: 1m
    name: CertSyncNeverSucceeded stays quiet on a new edge waiting for its first run
    input_series:
      - series: 'kube_cronjob_info{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd",schedule="23 */6 * * *"}'
        values: "1+0x420"
      - series: 'kube_cronjob_created{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "0+0x420"
      # Scheduled at 5h23m (step 323).
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "_x323 19380+0x97"
      # Succeeded 11s in, as prod's runs do. Visible from 5h24m.
      - series: 'kube_cronjob_status_last_successful_time{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "_x324 19391+0x96"
    alert_rule_test:
      - eval_time: 2h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      - eval_time: 3h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      - eval_time: 5h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      # 30m after the run. It succeeded, so the clock was cleared.
      - eval_time: 5h53m
        alertname: CertSyncNeverSucceeded
        exp_alerts: []

  # ---------------------------------------------------------------------
  # (2) The first scheduled run fails and nothing ever succeeds.
  - interval: 1m
    name: CertSyncNeverSucceeded fires 30m after a failed first scheduled run
    input_series:
      - series: 'kube_cronjob_info{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd",schedule="23 */6 * * *"}'
        values: "1+0x420"
      - series: 'kube_cronjob_created{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "0+0x420"
      # Scheduled at 5h23m. No last_successful_time series, ever.
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "_x323 19380+0x97"
    alert_rule_test:
      - eval_time: 5h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      # 29m after the run: pending, not firing.
      - eval_time: 5h52m
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      - eval_time: 5h53m
        alertname: CertSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: ais-mgmt
              cronjob: mgmt-cert-sync-edge-syd
            exp_annotations:
              summary: "cert-sync has never completed a run for mgmt-cert-sync-edge-syd"
              description: |
                ais-mgmt/mgmt-cert-sync-edge-syd has had a scheduled
                run, or has existed for over 24h without one, and has no
                successful run on record. That edge has never received a synced
                copy of the management Secrets, so anything depending on rotation
                there is running on whatever was pushed at build time by hand.
                Check RBAC on the edge namespace and whether the child API server
                is reachable from the management cluster.

  # ---------------------------------------------------------------------
  # (3) Never scheduled at all, e.g. the controller missed every slot.
  # The `or` half of the expression is the only thing that sees this.
  - interval: 5m
    name: CertSyncNeverSucceeded fires on a CronJob never scheduled in 24h
    input_series:
      - series: 'kube_cronjob_info{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd",schedule="23 */6 * * *"}'
        values: "1+0x400"
      - series: 'kube_cronjob_created{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "0+0x400"
    alert_rule_test:
      - eval_time: 23h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      # 24h exactly is not yet > 86400, and then `for:` needs 30m.
      - eval_time: 24h30m
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      - eval_time: 25h
        alertname: CertSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: ais-mgmt
              cronjob: mgmt-cert-sync-edge-syd
            exp_annotations:
              summary: "cert-sync has never completed a run for mgmt-cert-sync-edge-syd"
              description: |
                ais-mgmt/mgmt-cert-sync-edge-syd has had a scheduled
                run, or has existed for over 24h without one, and has no
                successful run on record. That edge has never received a synced
                copy of the management Secrets, so anything depending on rotation
                there is running on whatever was pushed at build time by hand.
                Check RBAC on the edge namespace and whether the child API server
                is reachable from the management cluster.

  # ---------------------------------------------------------------------
  # (4) Firing after a failed first run, then the next run succeeds.
  - interval: 1m
    name: CertSyncNeverSucceeded resolves on the first success
    input_series:
      - series: 'kube_cronjob_info{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd",schedule="23 */6 * * *"}'
        values: "1+0x720"
      - series: 'kube_cronjob_created{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "0+0x720"
      # Runs at 5h23m (fails) and 11h23m (step 683, succeeds).
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "_x323 19380+0x359 40980+0x37"
      # The 11h23m run's success, visible from 11h24m.
      - series: 'kube_cronjob_status_last_successful_time{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-syd"}'
        values: "_x684 40991+0x36"
    alert_rule_test:
      # Firing since 5h53m.
      - eval_time: 11h
        alertname: CertSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: ais-mgmt
              cronjob: mgmt-cert-sync-edge-syd
            exp_annotations:
              summary: "cert-sync has never completed a run for mgmt-cert-sync-edge-syd"
              description: |
                ais-mgmt/mgmt-cert-sync-edge-syd has had a scheduled
                run, or has existed for over 24h without one, and has no
                successful run on record. That edge has never received a synced
                copy of the management Secrets, so anything depending on rotation
                there is running on whatever was pushed at build time by hand.
                Check RBAC on the edge namespace and whether the child API server
                is reachable from the management cluster.
      # Cleared at the first evaluation that sees the success.
      - eval_time: 11h24m
        alertname: CertSyncNeverSucceeded
        exp_alerts: []
      - eval_time: 12h
        alertname: CertSyncNeverSucceeded
        exp_alerts: []

  # ---------------------------------------------------------------------
  # (5) Scoping. The reclaimer next door is scheduled from 1h, never
  # succeeds, and is over 24h old by the end, so both halves would see it
  # without the name regex. A failing cert-sync CronJob runs alongside so
  # the case cannot pass for want of any alert at all.
  - interval: 5m
    name: CertSyncNeverSucceeded does not select other CronJobs in the release
    input_series:
      - series: 'kube_cronjob_info{namespace="xnat-upload",cronjob="mgmt-reclaim-edge-dev",schedule="17 * * * *"}'
        values: "1+0x400"
      - series: 'kube_cronjob_created{namespace="xnat-upload",cronjob="mgmt-reclaim-edge-dev"}'
        values: "0+0x400"
      - series: 'kube_cronjob_status_last_schedule_time{namespace="xnat-upload",cronjob="mgmt-reclaim-edge-dev"}'
        values: "_x12 3600+0x388"
      - series: 'kube_cronjob_info{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-dev",schedule="23 */6 * * *"}'
        values: "1+0x400"
      - series: 'kube_cronjob_created{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "0+0x400"
      - series: 'kube_cronjob_status_last_schedule_time{namespace="ais-mgmt",cronjob="mgmt-cert-sync-edge-dev"}'
        values: "_x12 3600+0x388"
    alert_rule_test:
      # Scheduled, under 24h: only the last_schedule_time half is live.
      - eval_time: 2h
        alertname: CertSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: ais-mgmt
              cronjob: mgmt-cert-sync-edge-dev
            exp_annotations:
              summary: "cert-sync has never completed a run for mgmt-cert-sync-edge-dev"
              description: |
                ais-mgmt/mgmt-cert-sync-edge-dev has had a scheduled
                run, or has existed for over 24h without one, and has no
                successful run on record. That edge has never received a synced
                copy of the management Secrets, so anything depending on rotation
                there is running on whatever was pushed at build time by hand.
                Check RBAC on the edge namespace and whether the child API server
                is reachable from the management cluster.
      # Over 24h: the kube_cronjob_created half is live too.
      - eval_time: 30h
        alertname: CertSyncNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: ais-mgmt
              cronjob: mgmt-cert-sync-edge-dev
            exp_annotations:
              summary: "cert-sync has never completed a run for mgmt-cert-sync-edge-dev"
              description: |
                ais-mgmt/mgmt-cert-sync-edge-dev has had a scheduled
                run, or has existed for over 24h without one, and has no
                successful run on record. That edge has never received a synced
                copy of the management Secrets, so anything depending on rotation
                there is running on whatever was pushed at build time by hand.
                Check RBAC on the edge namespace and whether the child API server
                is reachable from the management cluster.
