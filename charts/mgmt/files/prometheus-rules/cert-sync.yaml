# Documentation review 2026-11-10: historical measurements below describe
# their recorded runs. Undated run evidence is not verified (2026-11-10).
# Current conditions are defined by the expressions and their input availability.
# =============================================================================
# cert-sync alerts — "this edge has not had its Secrets refreshed recently"
# =============================================================================
# WHY THIS FILE EXISTS AT ALL. cert-manager renews certificates on the
# management cluster; the edge holds a copy. The cert-sync CronJob is what
# re-pushes it. A sync job that silently stops is therefore the same failure
# as having no sync job: the edge keeps working right up until the certificate
# it is still holding expires, and then log shipping or the configured mTLS
# upload path can fail. Rotation or revocation can also require action before
# expiry; inspect the source and destination certificate state.
#
# WHY kube_cronjob_status_last_successful_time AND NOT THE LOGS.
# templates/cert-sync.yaml renders ONE CronJob per edge, named
# <release>-cert-sync-<edge>. kube-state-metrics labels these series with the
# CronJob name, so staleness is per-site without parsing anything, and it is
# unit-testable with promtool. The job's own JSON events (sync_updated /
# sync_unchanged / sync_skipped / sync_failed, component "cert-sync") are the
# explanation an operator reads AFTER the alert; they are not the trigger.
#
# THE EXIT-CODE COUPLING THAT MAKES THIS WORK. cert-sync.sh exits non-zero
# when it did not complete a sync, INCLUDING when the edge was merely
# unreachable. If it exited 0 after skipping, last_successful_time would stay
# fresh and this alert would stay green through an outage of any length.
#
# HISTORICAL INPUT AVAILABILITY, recorded before chart deployment.
# Run date for the initial absence observation is not verified (2026-11-10).
# The dated 2026-09-30 measurement below supersedes that old absence claim.
# Input availability must still be checked on the current installation.
# Earlier diagnostic rationale follows because the SeaweedFSDiskFull defect
# was exactly a rule selecting a series that does not exist:
#   * kube-state-metrics on the live management cluster is started with
#     --resources=...,cronjobs,...,jobs,... and its ClusterRole grants
#     list/watch on batch/cronjobs and batch/jobs. Both verified.
#   * kube_cronjob_* is NOT in its /metrics output today. Also verified — and
#     so are kube_job_*, kube_hpa_*, kube_poddisruptionbudget_* and
#     kube_certificatesigningrequest_*, which are precisely the resource types
#     that have zero objects in this cluster. There are no CronJobs in it yet.
#   * What follows from that — that the family appears once a CronJob exists —
#     is an inference, not a measurement: no CronJob was created on the live
#     cluster to prove it. scripts/check-alert-inputs.sh will report this
#     metric as missing until the chart is installed. Re-run it after the
#     first install and treat a still-missing input as a real finding.
#   * Measured 2026-09-30 on the ais-edge-dev management cluster: every input
#     below has a series for mgmt-cert-sync-cai-lfs3. That is
#     kube_cronjob_created, kube_cronjob_status_last_schedule_time and
#     kube_cronjob_status_last_successful_time, each labelled
#     namespace + cronjob.
# =============================================================================
groups:
  - name: ais-edge-cert-sync
    interval: 30s
    rules:
      # The default schedule is every 6h, so 24h is four consecutive missed or
      # failed runs. It is deliberately not tighter: certificate renewal has
      # weeks of slack (cert-manager renews at two-thirds of the lifetime), so
      # the thing worth paging about is a sync that has stopped, not one run
      # that lost a race with a reboot.
      #
      # templates/cert-sync.yaml refuses to render a schedule coarser than
      # daily, so this window cannot be made unreachable from the values side.
      - alert: CertSyncStale
        expr: |
          (time() - kube_cronjob_status_last_successful_time{cronjob=~".+-cert-sync-.+"}) > 86400
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "cert-sync has not succeeded for {{ $labels.cronjob }} in over 24h"
          description: |
            The CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has no recorded
            success for over 24 hours, and the condition has persisted for 30 minutes.
            An edge may retain older certificates or credentials. A source rotation,
            revocation or changed trust requirement can break access before expiry.
            Check current source/destination versions rather than waiting for expiry.

            Inspect the latest Job and its pods, then read retained logs if the pod is gone:
              kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}
              kubectl -n {{ $labels.namespace }} get jobs,pods
            Loki: {component="cert-sync"} | json | event=~"sync_skipped|sync_failed"
            The CronJob result does not prove every consuming process has reloaded its
            Secret. Check live mounted certificates and any environment-based clients.
      # A CronJob that has NEVER succeeded produces no
      # last_successful_time series at all, so the rule above cannot see it.
      # That is the exact shape of "the alert was green from the day it was
      # written": mTLS switched on and distribution never once working.
      - alert: CertSyncNeverSucceeded
        # The clock starts at the first SCHEDULED run, not at creation.
        # A healthy new edge can wait ~6h for its first "23 */6 * * *" run.
        # The old kube_cronjob_info form paged critical at 2h, before that
        # run, unless a manual seed had already succeeded.
        #
        # The `or` half: 24h old and never scheduled at all. The chart
        # refuses schedules coarser than daily, so a first run is always
        # due inside 24h.
        #
        # install.sh's manual <cronjob>-init seed can set
        # last_successful_time but never sets last_schedule_time. A seed
        # success clears this; a seed failure waits for the first scheduled
        # run.
        #
        # max by (namespace, cronjob) gives both halves one label set and
        # folds duplicate series from a kube-state-metrics rollover.
        #
        # CAUTION: the value is a timestamp or an age, by branch. Keep it
        # out of the annotations.
        expr: |
          (
            max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-cert-sync-.+"})
            or
            (time() - max by (namespace, cronjob) (kube_cronjob_created{cronjob=~".+-cert-sync-.+"}) > 86400)
          )
          unless on (namespace, cronjob) kube_cronjob_status_last_successful_time
        # CAUTION: keep above the Job's activeDeadlineSeconds (900s in
        # templates/cert-sync.yaml). A healthy first run ends inside that.
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "cert-sync has never completed a run for {{ $labels.cronjob }}"
          description: |
            {{ $labels.namespace }}/{{ $labels.cronjob }} has had a scheduled run, or
            has existed over 24 hours without one, and has no recorded successful run.
            The condition has persisted for 30 minutes. Some individual Secrets may
            have copied before a failed run; this does not prove no delivery occurred.
            Check management-to-child API reachability, source Secrets, edge RBAC and
            per-Secret sync events. Compare actual source and destination versions.
            Manually created or older Secrets can allow partial operation while this
            alert fires; they do not establish that automatic rotation works.
