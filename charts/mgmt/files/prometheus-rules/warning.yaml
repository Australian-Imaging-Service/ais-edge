# =============================================================================
# Warning alerts (Prometheus / kube-state-metrics) — notify, don't page.
#
# Pipeline-event warning alerts (SessionUploadStalled, S3UploaderRetryStorm,
# DICOMValidationFailureSpike) live in loki-ruler-rules.yaml — those are
# derived from JSON events in Loki, not from any Prometheus metric.
# =============================================================================
groups:
  - name: ais-edge-warning
    interval: 30s
    rules:
      # Uses SeaweedFS's OWN exported disk gauge, not kubelet PVC stats.
      #
      # This rule previously selected
      #   kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".*seaweedfs.*"}
      # which does not exist and never will: SeaweedFS's /data is a hostPath,
      # and the hostPath volume plugin has no MetricsProvider, so kubelet
      # publishes no volume stats for it. Verified on the live Prometheus —
      # `count(kubelet_volume_stats_used_bytes)` returns no series at all. The
      # alert had been green its entire life for want of an input.
      #
      # SeaweedFS exports the real thing on :9324, already scraped by the
      # ServiceMonitor (measured on the live cluster):
      #   SeaweedFS_volumeServer_resource{name="/data",type="all"}  211247489024
      #   SeaweedFS_volumeServer_resource{name="/data",type="used"}  92370411520
      #   SeaweedFS_volumeServer_resource{name="/data",type="free"} 118877077504
      # This is also the better source regardless of storage type: it is what
      # the process writing the data believes about its own disk.
      - alert: SeaweedFSDiskFull
        # `ignoring(type)` is load-bearing. The two sides differ on the
        # `type` label ("used" vs "all"), and PromQL binary operators match
        # on the FULL label set, so a bare `/` matches nothing and the rule
        # silently returns no data — the same failure mode this rule was
        # already in. Caught by the unit test in tests/warning_test.yaml.
        expr: |
          (
            SeaweedFS_volumeServer_resource{type="used"}
            / ignoring(type)
            SeaweedFS_volumeServer_resource{type="all"}
          ) > 0.80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "SeaweedFS disk >80% full on {{ $labels.name }}"
          description: |
            The staging store is over 80% full. Staged sessions are patient
            data that has not necessarily reached XNAT yet, so DO NOT clear
            them blindly — check dataPolicy.derived.s3Staged and the
            s3-reclaimer logs first, then grow the disk.

      # Fires only when cert-manager is LATE: a day past the certificate's
      # own renewal time (status.renewalTime = notAfter - renewBefore), or
      # under 14 days from expiry whatever renewBefore says.
      # WHY NOT "< 60 days left": cert-manager renews 90-day certificates 30
      # days before expiry, so every healthy one spent days 30 to 60 of its
      # life "expiring soon", and the warning route re-mailed it daily. On
      # prod both 90-day certificates fired from 2026-09-19 while healthy,
      # renewal scheduled for 2026-10-10.
      # exported_namespace is the Certificate's namespace; namespace is
      # cert-manager's own, the scrape target.
      - alert: CertificateExpiringSoon
        expr: |
          (time() - certmanager_certificate_renewal_timestamp_seconds > 86400)
          or
          (certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is overdue for renewal"
          description: |
            cert-manager was due to renew this certificate over a day ago and has not, or it
            expires within 14 days. Healthy certificates never fire this: cert-manager renews at
            notAfter minus renewBefore (30 days before expiry for a 90-day certificate).
              kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}
              kubectl -n {{ $labels.exported_namespace }} get certificaterequests,orders,challenges
              kubectl -n cert-manager logs deploy/cert-manager --since=24h | grep {{ $labels.name }}

      # Every CronJob alert here reads kube-state-metrics: CertSyncStale,
      # CertSyncNeverSucceeded and ReclaimerNotSucceeding. With its series
      # gone they have nothing to evaluate and stay quiet, which reads as
      # healthy. defaultRules is off on this chart, so no upstream TargetDown
      # or KubeStateMetrics* rule covers it.
      # `== 1` inside absent(): a target that is discovered but failing (up 0)
      # counts as down too, not only one that has vanished.
      - alert: KubeStateMetricsDown
        expr: |
          absent(up{job="kube-state-metrics"} == 1)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "kube-state-metrics is not being scraped"
          description: |
            No successful scrape of kube-state-metrics for 15 minutes. Until it is
            back, CertSyncStale, CertSyncNeverSucceeded and ReclaimerNotSucceeding
            cannot fire, because they read its CronJob series.
              kubectl get pods -A -l app.kubernetes.io/name=kube-state-metrics

