# Documentation review 2026-11-10: historical measurements below describe
# their recorded runs. Undated run evidence is not verified (2026-11-10).
# Current conditions are defined by the expressions and their input availability.
# =============================================================================
# Critical alerts (Prometheus / kube-state-metrics) — pages on-call.
#
# Pipeline-event critical alerts (XNATUploadFailingForAllSessions, etc.) live
# in loki-ruler-rules.yaml, evaluated by Loki's ruler over the JSON event
# stream. The alerts in this file all derive from K8s/cert-manager metrics
# scraped directly by mgmt Prometheus.
# =============================================================================
groups:
  - name: ais-edge-critical
    interval: 30s
    rules:
      - alert: ManagementClusterDown
        expr: up{job="apiserver"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Management API server unreachable"
          description: |
            The discovered kube-apiserver scrape target has reported up=0 for at least
            five minutes. Check target errors, network access, TLS and authentication,
            as well as API-server health. This signal does not prove the entire control
            plane is down. A vanished target or unavailable Prometheus cannot produce
            the same up=0 signal; inspect discovery and evaluator health separately.

      - alert: SeaweedFSDown
        # Matched by REGEX, not by an exact name.
        #
        # The imperative installer created Deployment/seaweedfs in namespace
        # seaweedfs. The chart creates <release>-seaweedfs in the release
        # namespace, so an exact `deployment="seaweedfs"` matcher stops
        # matching the moment this is installed from the chart — the alert
        # would never fire again and nothing would say so. This file is
        # loaded with .Files.Get (it carries {{ $labels }} that Helm must not
        # touch), so it cannot be templated with the release name; a regex is
        # the way to make one rule cover both layouts.
        expr: |
          kube_deployment_status_replicas_ready{deployment=~".*seaweedfs.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "SeaweedFS deployment has zero ready replicas for 2+ minutes"
          description: |
            The matching deployment reports zero ready replicas. It may be unhealthy
            or deliberately scaled down. Check desired replicas, pod events and logs
            in {{ $labels.namespace }}. The selector matches deployment names containing
            seaweedfs; verify the actual workload before assuming a specific failure.
              kubectl -n {{ $labels.namespace }} get deployments,pods
              kubectl -n {{ $labels.namespace }} logs -l app=seaweedfs --tail=100
            Edge transfers may fail or retry while the service is unavailable.

      - alert: EdgeWorkerDisconnected
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Observed node {{ $labels.node }} NotReady for 5+ minutes"
          description: |
            Management kube-state-metrics observes management-cluster nodes, not the
            remote child workers. This historical alert name does not add edge coverage.
            Inspect node conditions, kubelet, disk pressure and network status. A missing
            node series can remain silent here. Pipeline stages may be disrupted, but
            this alert does not establish which files were received or uploaded.
