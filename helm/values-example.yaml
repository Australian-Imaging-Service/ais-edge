# Copy this file outside the repository and edit the non-secret site settings:
#   cp helm/values-example.yaml ~/.config/ais-edge/my-site.yaml

orthanc:
  # DICOM Application Entity Title configured on scanners.
  aet: ORTHANC

samba:
  # Connect to \\<vm-ip>\edge and place complete study directories in incoming/.
  shareName: edge

xnatIngest:
  # DICOM keywords used to form PROJECT.SUBJECT.SESSION directories.
  dicomTagMapping:
    project: StudyDescription
    subject: PatientName
    sessionLabel: PatientID
    sessionUid: StudyInstanceUID
    scanDesc: SeriesDescription

  # Both local input paths are enabled by default.
  orthancIngest:
    enabled: true

  fsIngest:
    enabled: true
    inputGlob: "/data/incoming/**/*"

  # Upload starts automatically. Set replicas to 0 to hold assigned sessions
  # for manual review instead.
  upload:
    enabled: true
    replicas: 1
