# Pass to setup.sh: bash helm/setup.sh helm/values-example.yaml
# Or directly:      helm install edge helm/edge -f helm/values-example.yaml

# ── Required ──────────────────────────────────────────────────────────────────

# Kubernetes namespace to deploy into
namespace: ais-edge

# Directory on the VM host that will hold all pipeline data
storage:
  hostPath: /data/ais-edge
  capacity: 1500Gi

# ── Orthanc ───────────────────────────────────────────────────────────────────

orthanc:
  # AET must match what scanners are configured to send to
  aet: USYD-TBPET

  authenticationEnabled: false

  # External ports on the VM
  nodePorts:
    dicom: 31014   # scanner sends DICOM here
    http:  30842   # Orthanc web UI and REST API

  # Set to true to only allow connections from scanners listed in modalities below.
  # checkCallingAet: true

  # Register known scanners. Required if checkCallingAet is true. (default is false)
  # modalities:
  #   scanner-name:
  #     aet: SCANNER_AET
  #     host: 192.168.1.10
  #     port: 4242

# ── Samba ─────────────────────────────────────────────────────────────────────

samba:
  # SMB share name, connect via \\<vm-ip>\<shareName>
  shareName: edge

# ── DICOM tag mapping ─────────────────────────────────────────────────────────
# Maps DICOM tags to XNAT fields. Change only if your scanners use different tags.

xnatIngest:
  dicomTagMapping:
    project: PatientComments
    subject: PatientID
    sessionLabel: AccessionNumber
    sessionUid: StudyInstanceUID
    scanDesc: SeriesDescription

  # Pipeline A: Orthanc -> /data/grouped-orthanc -> /data/assigned
  orthancIngest:
    interval: 60          # TESTING — restore to 300 for production

  # Pipeline B: Windows RAW-DATA-EXPORT -> /data/grouped-fs -> /data/assigned
  fsIngest:
    enabled: false   # TESTING — re-enable once one-file manual test passes
    interval: 60          # TESTING — restore to 300 for production
    inputGlob: "/data/usyd-export/TMP/RAW-DATA-EXPORT/**/*"
    # NFS PV/PVC defined in helm/usyd-data-export.yaml (apply once with kubectl).
    # Mounted read-only in the ingest-fs and upload pods.
    exportClaim: usyd-data-export
    exportMountPath: /data/usyd-export
    waitPeriod: 60        # TESTING — restore to 1800 for production
    copyMode: symlink_or_copy
    datatypes: "medimage/dicom-series;medimage/vnd.siemens.syngo-mi.vr20b.count-rate;medimage/vnd.siemens.syngo-mi.vr20b.list-mode;medimage/vnd.siemens.syngo-mi.vr20b.normalisation;medimage/vnd.siemens.syngo-mi.vr20b.sinogram;medimage/vnd.siemens.syngo-mi.vr20b.dynamic-sinogram-series;medimage/vnd.siemens.syngo-mi.vr20b.parameterisation;medimage/vnd.siemens.syngo-mi.vr20b.ct-spl;medimage/vnd.siemens.syngo-mi.vr20b.physio"

  upload:
    loop: 60              # TESTING — restore to 300 for production
    waitPeriod: 60

# ── Storage class ─────────────────────────────────────────────────────────────
# Set create: false if "hostpath-pipeline" already exists on the cluster

storageClass:
  create: true