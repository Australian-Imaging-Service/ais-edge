{{- if .Values.xnatIngest.fsIngest.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: ingest-fs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  containers:
  - name: ingest-fs
    image: {{ .Values.xnatIngest.image }}
    imagePullPolicy: {{ .Values.xnatIngest.imagePullPolicy }}
    env:
    # Source glob for files dropped on the filesystem (e.g. the Windows export share)
    - name: INPUT_GLOB
      value: {{ .Values.xnatIngest.fsIngest.inputGlob | quote }}
    # Semicolon-separated list, expanded to repeated --datatype args in fs-pipeline.sh
    - name: DATATYPES
      value: {{ .Values.xnatIngest.fsIngest.datatypes | quote }}
    # Skip files modified within this window — protects against partial transfers
    - name: WAIT_PERIOD
      value: {{ .Values.xnatIngest.fsIngest.waitPeriod | quote }}
    # ID field mapping for assign (plain DICOM field names)
    - name: PROJECT_FIELD
      value: {{ .Values.xnatIngest.dicomTagMapping.project | quote }}
    - name: SUBJECT_FIELD
      value: {{ .Values.xnatIngest.dicomTagMapping.subject | quote }}
    - name: SESSION_FIELD
      value: {{ .Values.xnatIngest.dicomTagMapping.sessionLabel | quote }}
    - name: SCAN_FIELD
      value: {{ .Values.xnatIngest.dicomTagMapping.scanDesc | quote }}
    - name: COPY_MODE
      value: {{ .Values.xnatIngest.fsIngest.copyMode | quote }}
    - name: PIPELINE_INTERVAL_SECONDS
      value: {{ .Values.xnatIngest.fsIngest.interval | quote }}
    - name: XINGEST_LOGGERS
      value: {{ .Values.xnatIngest.fsIngest.loggers | quote }}
    {{- include "edge.xnatIngestCommonEnv" . | nindent 4 }}
    envFrom:
    - configMapRef:
        name: proxy-config
    command: ["bash", "/scripts/fs-pipeline.sh"]
    volumeMounts:
    - name: storage
      mountPath: /data
    - name: scripts
      mountPath: /scripts
    {{- if .Values.xnatIngest.fsIngest.exportClaim }}
    - name: export
      mountPath: {{ .Values.xnatIngest.fsIngest.exportMountPath }}
      readOnly: true
    {{- end }}
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: {{ include "edge.pvcName" . }}
  - name: scripts
    configMap:
      name: fs-pipeline-script
      defaultMode: 0755
  {{- if .Values.xnatIngest.fsIngest.exportClaim }}
  - name: export
    persistentVolumeClaim:
      claimName: {{ .Values.xnatIngest.fsIngest.exportClaim }}
      readOnly: true
  {{- end }}
{{- end }}
