apiVersion: v1
kind: Pod
metadata:
  name: sort
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  containers:
  - name: sort
    image: {{ .Values.xnatIngest.image }}
    imagePullPolicy: {{ .Values.xnatIngest.imagePullPolicy }}
    env:
    - name: XINGEST_DATATYPES
      value: {{ .Values.xnatIngest.sort.datatypes | quote }}
    - name: XINGEST_COPY_MODE
      value: {{ .Values.xnatIngest.sort.copyMode | quote }}
    - name: XINGEST_LOGGERS
      value: {{ .Values.xnatIngest.sort.loggers | quote }}
    - name: XINGEST_DELETE
      value: {{ .Values.xnatIngest.delete | quote }}
    - name: SORT_SETTLE_SECONDS
      value: {{ .Values.xnatIngest.sort.settleSeconds | default 1800 | quote }}
    - name: SORT_POLL_SECONDS
      value: {{ .Values.xnatIngest.sort.pollSeconds | default 300 | quote }}
    {{- include "edge.xnatIngestCommonEnv" . | nindent 4 }}
    {{- include "edge.dicomTagEnv" . | nindent 4 }}
    envFrom:
    - configMapRef:
        name: proxy-config  # injects any proxy settings (currently empty)
    command: ["bash", "/scripts/sort.sh"]
    volumeMounts:
    - name: storage
      mountPath: /data
    - name: scripts
      mountPath: /scripts
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: {{ include "edge.pvcName" . }}
  - name: scripts
    configMap:
      name: sort-script
      defaultMode: 0755
