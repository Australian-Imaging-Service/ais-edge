apiVersion: v1
kind: Pod
metadata:
  name: sort-orthanc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  containers:
  - name: sort
    image: {{ .Values.xnatIngest.image }}
    imagePullPolicy: {{ .Values.xnatIngest.imagePullPolicy }}
    env:
    - name: SORT_POD_NAME
      value: "orthanc"
    - name: SORT_WATCH_DIR
      value: /data/orthanc-storage
    - name: SORT_COLLATE_RESOURCES
      value: "medimage/dicom-series siblings"
    - name: ORTHANC_USER
      valueFrom:
        secretKeyRef:
          name: orthanc-credentials
          key: orthanc-user
    - name: ORTHANC_PASSWORD
      valueFrom:
        secretKeyRef:
          name: orthanc-credentials
          key: orthanc-password
    - name: XINGEST_ORTHANC
      value: "http://orthanc:{{ .Values.orthanc.httpPort }} $(ORTHANC_USER) $(ORTHANC_PASSWORD) /data/orthanc-storage"
    - name: XINGEST_DATATYPES
      value: {{ .Values.xnatIngest.sort.datatypes | quote }}
    - name: XINGEST_COPY_MODE
      value: {{ .Values.xnatIngest.sort.copyMode | quote }}
    - name: XINGEST_LOGGERS
      value: {{ .Values.xnatIngest.sort.loggers | quote }}
    - name: SORT_SETTLE_SECONDS
      value: {{ .Values.xnatIngest.sort.settleSeconds | default 1800 | quote }}
    - name: SORT_POLL_SECONDS
      value: {{ .Values.xnatIngest.sort.pollSeconds | default 300 | quote }}
    {{- include "edge.xnatIngestCommonEnv" . | nindent 4 }}
    {{- include "edge.dicomTagEnv" . | nindent 4 }}
    envFrom:
    - configMapRef:
        name: proxy-config
    command: ["bash", "/scripts/sort.sh"]
    volumeMounts:
    - name: storage
      mountPath: /data
    - name: scripts
      mountPath: /scripts
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: {{ include "edge.pvcName" . }}
  - name: scripts
    configMap:
      name: sort-script
      defaultMode: 0755
