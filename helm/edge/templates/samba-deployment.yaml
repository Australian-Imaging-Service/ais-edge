apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      containers:
      - name: samba
        image: {{ .Values.samba.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: NAME
          value: {{ .Values.samba.shareName | quote }}
        - name: USER
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: username
        - name: PASS
          valueFrom:
            secretKeyRef:
              name: samba-credentials
              key: password
        securityContext:
          capabilities:
            add:
              - NET_BIND_SERVICE  # required to bind to privileged port 445
        ports:
        - containerPort: 445
          hostPort: 445  # binds directly to port 445 on the VM makes share reachable at <node-ip>:445
          protocol: TCP
        volumeMounts:
        - name: storage
          mountPath: /storage  # dockurr/samba serves files from /storage
        resources:
          {{- toYaml .Values.samba.resources | nindent 10 }}
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: {{ include "edge.pvcName" . }}
