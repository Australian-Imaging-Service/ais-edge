{{- if .Values.xnatIngest.orthancIngest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-orthanc-group
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ingest-orthanc-group
  template:
    metadata:
      labels:
        app: ingest-orthanc-group
    spec:
      containers:
      - name: group-orthanc
        image: {{ .Values.xnatIngest.image }}
        imagePullPolicy: {{ .Values.xnatIngest.imagePullPolicy }}
        env:
        - name: ORTHANC_URL
          value: "http://orthanc:{{ .Values.orthanc.httpPort }}"
        - name: ORTHANC_STORE_DIR
          value: /data/orthanc-storage
        - name: ORTHANC_USER
          valueFrom:
            secretKeyRef:
              name: orthanc-credentials
              key: orthanc-user
        - name: ORTHANC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orthanc-credentials
              key: orthanc-password
        - name: XINGEST_LOGGERS
          value: {{ .Values.xnatIngest.orthancIngest.groupLoggers | quote }}
        {{- include "edge.xnatIngestCommonEnv" . | nindent 8 }}
        command:
        - /bin/sh
        - -c
        - |
          exec xnat-ingest group-orthanc \
            "$ORTHANC_URL" \
            "$ORTHANC_STORE_DIR" \
            /data/grouped \
            "$ORTHANC_USER" \
            "$ORTHANC_PASSWORD" \
            --processed-label {{ .Values.xnatIngest.orthancIngest.processedLabel | quote }} \
            --copy-mode {{ .Values.xnatIngest.orthancIngest.copyMode | quote }} \
            --loop {{ .Values.xnatIngest.orthancIngest.interval | quote }}
        volumeMounts:
        {{- include "edge.xnatIngestVolumeMount" . | nindent 8 }}
      {{- include "edge.xnatIngestVolumes" . | nindent 6 }}
{{- end }}
