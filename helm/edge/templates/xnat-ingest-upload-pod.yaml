apiVersion: v1
kind: Pod
metadata:
  name: upload
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  containers:
  - name: upload
    image: {{ .Values.xnatIngest.image }}
    imagePullPolicy: {{ .Values.xnatIngest.imagePullPolicy }}
    env:
    - name: XINGEST_ALWAYSINCLUDE
      value: {{ .Values.xnatIngest.upload.alwaysInclude | quote }}
    - name: XINGEST_VERIFY_SSL
      value: {{ .Values.xnatIngest.upload.verifySsl | quote }}
    - name: XINGEST_USE_CURL_JSESSION
      value: {{ .Values.xnatIngest.upload.useCurlJsession | quote }}
    - name: XINGEST_REQUIRE_MANIFEST
      value: {{ .Values.xnatIngest.upload.requireManifest | quote }}
    - name: XINGEST_LOOP
      value: {{ .Values.xnatIngest.upload.loop | quote }}
    - name: XINGEST_TEMPDIR
      value: {{ .Values.xnatIngest.upload.tempdir | quote }}
    - name: XINGEST_LOGGERS
      value: {{ .Values.xnatIngest.upload.loggers | quote }}
    - name: XINGEST_WAIT_PERIOD
      value: {{ .Values.xnatIngest.upload.waitPeriod | default 300 | quote }}
    {{- include "edge.xnatIngestCommonEnv" . | nindent 4 }}
    # XNAT credentials, injected from secret
    # Create with: kubectl create secret generic xnat-credentials --from-literal=server=... --from-literal=username=... --from-literal=password=...
    - name: XINGEST_SERVER
      valueFrom:
        secretKeyRef:
          name: xnat-credentials
          key: server
    - name: XINGEST_USER
      valueFrom:
        secretKeyRef:
          name: xnat-credentials
          key: username
    - name: XINGEST_PASSWORD
      valueFrom:
        secretKeyRef:
          name: xnat-credentials
          key: password
    envFrom:
    - configMapRef:
        name: proxy-config  # injects any proxy settings (currently empty)
    command: ["bash", "/scripts/upload.sh"]
    volumeMounts:
    - name: storage
      mountPath: /data
    - name: scripts
      mountPath: /scripts
    {{- if and .Values.xnatIngest.fsIngest.enabled .Values.xnatIngest.fsIngest.exportClaim }}
    - name: export
      mountPath: {{ .Values.xnatIngest.fsIngest.exportMountPath }}
      readOnly: true
    {{- end }}
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: {{ include "edge.pvcName" . }}
  - name: scripts
    configMap:
      name: upload-script
      defaultMode: 0755
  {{- if and .Values.xnatIngest.fsIngest.enabled .Values.xnatIngest.fsIngest.exportClaim }}
  - name: export
    persistentVolumeClaim:
      claimName: {{ .Values.xnatIngest.fsIngest.exportClaim }}
      readOnly: true
  {{- end }}
