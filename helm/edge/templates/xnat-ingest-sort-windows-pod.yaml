{{- if .Values.xnatIngest.sortWindows.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: sort-windows
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  containers:
  - name: sort-windows
    image: {{ .Values.xnatIngest.image }}
    imagePullPolicy: {{ .Values.xnatIngest.imagePullPolicy }}
    env:
    - name: SORT_POD_NAME
      value: "windows"
    - name: SORT_WATCH_DIR
      value: {{ .Values.xnatIngest.sortWindows.watchDir | quote }}
    - name: XINGEST_AVOID_CLASHES
      value: {{ .Values.xnatIngest.sortWindows.avoidClashes | default "1" | quote }}
    - name: XINGEST_WAIT_PERIOD
      value: {{ .Values.xnatIngest.sortWindows.waitPeriod | default "1800" | quote }}
    - name: XINGEST_DATATYPES
      value: {{ .Values.xnatIngest.sortWindows.datatypes | quote }}
    - name: XINGEST_COPY_MODE
      value: {{ .Values.xnatIngest.sortWindows.copyMode | quote }}
    - name: XINGEST_LOGGERS
      value: {{ .Values.xnatIngest.sortWindows.loggers | quote }}
    - name: SORT_SETTLE_SECONDS
      value: {{ .Values.xnatIngest.sortWindows.settleSeconds | default 1800 | quote }}
    - name: SORT_POLL_SECONDS
      value: {{ .Values.xnatIngest.sortWindows.pollSeconds | default 300 | quote }}
    {{- include "edge.xnatIngestCommonEnv" . | nindent 4 }}
    {{- include "edge.dicomTagEnv" . | nindent 4 }}
    envFrom:
    - configMapRef:
        name: proxy-config
    command: ["bash", "/scripts/sort.sh"]
    volumeMounts:
    - name: storage
      mountPath: /data
    - name: scripts
      mountPath: /scripts
    {{- if .Values.xnatIngest.sortWindows.exportClaim }}
    - name: export
      mountPath: {{ .Values.xnatIngest.sortWindows.exportMountPath }}
      readOnly: true
    {{- end }}
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: {{ include "edge.pvcName" . }}
  - name: scripts
    configMap:
      name: sort-script
      defaultMode: 0755
  {{- if .Values.xnatIngest.sortWindows.exportClaim }}
  - name: export
    persistentVolumeClaim:
      claimName: {{ .Values.xnatIngest.sortWindows.exportClaim }}
      readOnly: true
  {{- end }}
{{- end }}
