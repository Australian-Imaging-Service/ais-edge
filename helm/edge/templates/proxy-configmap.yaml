# Proxy env vars injected into the xnat-ingest and s3sync pods via envFrom.
# Populated from the `proxy:` map in values; empty map = no proxy env set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
data:
  {{- with .Values.proxy }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
